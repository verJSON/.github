name: Set up verJSON Node
description: >-
  Composite Node setup for verJSON CI on the self-hosted runner pool: installs
  Node (so no job relies on ambient Node), authenticates the @verjson GitHub
  Packages registry, and idempotently rewrites ssh->https git URLs so private
  @verjson git dependencies resolve over HTTPS with a token — without persisting
  the secret to the shared runner gitconfig. Retires the hand-rolled per-repo
  credential dance (Verjson/verjson-cli-cloud#59).

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node.
    required: false
    default: '24'
  cache:
    description: >-
      Upload a job-scoped npm cache when cache-dependency-path matches a
      lockfile. Persistent self-hosted runners default this off.
    required: false
    default: 'false'
  cache-dependency-path:
    description: Lockfile path or glob used to key the npm download cache.
    required: false
    default: package-lock.json
  scope:
    description: >-
      npm scope for the GitHub Packages registry. Set to an empty string to skip
      registry auth entirely (public-only installs).
    required: false
    default: '@verjson'
  registry-url:
    description: Registry URL for the scope.
    required: false
    default: 'https://npm.pkg.github.com'
  node-auth-token:
    description: >-
      Token with read:packages, used by npm to read @verjson private packages.
      Re-exported as NODE_AUTH_TOKEN for the job's later npm steps. Required
      unless scope is empty.
    required: false
    default: ''
  git-token:
    description: >-
      Token with repo scope for cloning private @verjson git dependencies over
      HTTPS (e.g. OIDC_REPO_TOKEN). Empty string leaves git credential wiring
      untouched.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Prepare job-scoped npm cache
      if: inputs.cache == 'true'
      shell: bash
      run: echo "npm_config_cache=$RUNNER_TEMP/verjson-npm-cache" >> "$GITHUB_ENV"

    - name: Install Node and authenticate the @verjson registry
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}
        # setup-node caches npm's download cache, never node_modules or build
        # output. An absent lockfile disables caching instead of failing jobs
        # in repositories that do not use npm lockfiles.
        cache: ${{ inputs.cache == 'true' && hashFiles(inputs.cache-dependency-path) != '' && 'npm' || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        package-manager-cache: false
        # Only configure the registry when a scope is set. Passing registry-url
        # with an empty scope makes setup-node write `registry=<url>` as npm's
        # *default* registry (every package resolves against GitHub Packages, so
        # public installs 404) instead of skipping auth — so gate it on scope.
        registry-url: ${{ inputs.scope != '' && inputs.registry-url || '' }}
        scope: ${{ inputs.scope }}

    - name: Configure git + npm credentials (persistent-runner safe)
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}
        VERJSON_GIT_TOKEN: ${{ inputs.git-token }}
      run: bash "${GITHUB_ACTION_PATH}/configure-git.sh"
