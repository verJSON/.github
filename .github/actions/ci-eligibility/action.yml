name: CI eligibility
description: >-
  Decide whether org CI should run for this PR head or be deferred. Outputs
  should-run=false when the head carries a pending `renovate/stability-days`
  status — the release-age gate the merge gate also defers on — so CI runs once
  against the final base after Renovate rebases, instead of burning the suite on
  a PR that cannot merge and re-burning it on the rebase (Verjson/.github#133).
  Fails OPEN (should-run=true) on any uncertainty about the STATUS — an API
  error, a missing status — and never defers a workflow_dispatch or push.
  Consumers gate their heavy jobs on the output via `needs:` +
  `if: needs.<job>.outputs.should-run == 'true'`.

  One exception, and it is adopter-visible: on the event paths that query the
  status API, `head-sha` must be a 40-hex object name, and anything else fails
  the action CLOSED rather than open (Verjson/.github#1464). That value is
  interpolated into a `commits/<sha>/status` path segment, so an unconstrained
  one addresses whatever it spells. A caller passing a branch name or an
  abbreviated SHA here used to reach the API and now hard-fails.

inputs:
  head-sha:
    description: >-
      The PR head commit SHA whose statuses are checked. MUST be a full 40-hex
      object name (lowercase); a branch name or abbreviated SHA is refused
      before the status request, because this value reaches a
      `commits/<sha>/status` path segment.
    required: true
  github-token:
    description: A token with read access to the repository's commit statuses.
    required: true

outputs:
  should-run:
    description: "'true' to run CI; 'false' to defer (renovate/stability-days pending)."
    value: ${{ steps.check.outputs.should-run }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        # A workflow_dispatch is an explicit human "run it now" — never defer it,
        # mirroring the merge gate's dispatch-forces-review escape hatch (#133).
        if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
          echo "should-run=true" >> "$GITHUB_OUTPUT"
          echo "::notice::workflow_dispatch — running CI (eligibility check bypassed)."
          exit 0
        fi
        # A trusted push is already the post-merge/direct-ref validation target
        # and must never be suppressed by a stale status attached to that
        # commit. Keep every other event on the existing status path.
        if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
          echo "should-run=true" >> "$GITHUB_OUTPUT"
          echo "::notice::push — running CI (stability-days check bypassed)."
          exit 0
        fi
        # Defer only when the release-age gate is ACTIVELY pending. Any
        # uncertainty (API error, missing status) fails OPEN → run CI, so a real
        # PR is never silently skipped. Same signal the gate uses to `defer`.
        #
        # COUPLED to the deferral report a held pull request actually sees:
        # node-ci's `deferred-ci` job names `renovate/stability-days is
        # pending` as THE cause. That is accurate only while this is the sole
        # condition that sets should-run=false. Adding a second defer reason
        # here turns that message into a lie, so generalize it in the same
        # change — it is the only explanation a deferred head ever gets.
        # The head SHA reaches a `commits/<sha>` PATH segment on the next line, so constrain
        # it HERE. node-ci-protected takes this value from a caller input, and the nearest
        # other assert on it is in `acquire-secretless-dependencies`, which declares
        # `needs: eligibility` and therefore runs strictly later. That job DOES revalidate
        # ADMITTED_HEAD_SHA independently, and `build-test` is `if: always()`, so a failed
        # eligibility job is not by itself what stands between a bad input and a run. Read
        # this guard narrowly: it protects THIS request, which nothing earlier does. The
        # three copies of this script are byte-identical by contract, so the guard is in all
        # of them (Verjson/.github#1464).
        [[ "$HEAD_SHA" =~ ^[0123456789abcdef]{40}$ ]] \
          || { echo "::error::head-sha is not a 40-hex object name"; exit 1; }
        pending=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
          --jq '[.statuses[]? | select(.context == "renovate/stability-days" and .state == "pending")] | length' 2>/dev/null || echo 0)
        if [ "${pending:-0}" -gt 0 ]; then
          echo "should-run=false" >> "$GITHUB_OUTPUT"
          echo "::notice::renovate/stability-days is pending on ${HEAD_SHA} — deferring org CI until the age gate clears and Renovate rebases (#133)."
        else
          echo "should-run=true" >> "$GITHUB_OUTPUT"
        fi
