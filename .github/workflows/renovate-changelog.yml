name: Renovate changelog attribution

on:
  workflow_call:
    inputs:
      release_environment:
        description: Main-only environment containing the release App private key
        required: true
        type: string
      contract_ref:
        description: Immutable Verjson/.github commit containing this workflow
        required: true
        type: string
      release_app_client_id:
        description: Client ID for the repository-scoped Contents-write App
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  reject-public-pull-request-caller:
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || github.event_name == 'merge_group' || github.event_name == 'pull_request_target') && github.event.repository.private != true }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Reject public pull request callers
        run: |
          echo "::error::This reusable workflow does not accept public pull request callers"
          exit 1
  app-key-policy:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && github.event_name != 'pull_request_review_comment' && github.event_name != 'merge_group' && github.event_name != 'pull_request_target' || github.event.repository.private == true) }}
    uses: ./.github/workflows/app-key-environment.yml
    permissions:
      actions: read
      contents: read
    with:
      role: release
      environment: ${{ inputs.release_environment }}

  attribute:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && github.event_name != 'pull_request_review_comment' && github.event_name != 'merge_group' && github.event_name != 'pull_request_target' || github.event.repository.private == true) }}
    environment: ${{ inputs.release_environment }}
    needs: app-key-policy
    runs-on: ${{ fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require an immutable contract revision
        env:
          CONTRACT_REF: ${{ inputs.contract_ref }}
          EXECUTING_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CONTRACT_REF" =~ ^[0123456789abcdef]{40}$ ]] || {
            echo "::error::contract_ref must be a full lower-case commit SHA"
            exit 1
          }
          [[ "$CONTRACT_REF" == "$EXECUTING_WORKFLOW_SHA" ]] || {
            echo "::error::contract_ref must match the reusable workflow commit"
            exit 1
          }

      - name: Check out only the trusted contract revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ job.workflow_sha }}
          path: .renovate-changelog-contract-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          persist-credentials: false

      - name: Validate the live Renovate PR and plan attribution
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.ref }}
          CONTRACT_PATH: .renovate-changelog-contract-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          PLAN_PATH: ${{ runner.temp }}/renovate-changelog-plan-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -euo pipefail
          python3 -I "$CONTRACT_PATH/scripts/renovate-changelog.py" plan \
            --repository "$TARGET_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --expected-head "$EXPECTED_HEAD" \
            --expected-base "$EXPECTED_BASE" \
            --output "$PLAN_PATH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate GitHub App client ID
        id: generated_app_client_id_renovate-changelog_attribute_1
        if: "steps.plan.outputs.required == 'true'"
        shell: bash
        env:
          APP_CLIENT_ID: "${{ inputs.release_app_client_id }}"
          LC_ALL: C
        run: |
          # Generated from scripts/app_client_id_contract.py.
          set -euo pipefail
          if [[ ! "$APP_CLIENT_ID" =~ ^Iv[ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.]{8,126}$ ]]; then
            printf '%s\n' '::error::GitHub App client ID is not accepted by the configured App policy' >&2
            exit 1
          fi
      - name: Mint current-repository Contents-write token
        if: steps.plan.outputs.required == 'true'
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.release_app_client_id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Add the fragment through the Git Data API
        if: steps.plan.outputs.required == 'true'
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          CONTRACT_PATH: .renovate-changelog-contract-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          PLAN_PATH: ${{ runner.temp }}/renovate-changelog-plan-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -euo pipefail
          python3 -I "$CONTRACT_PATH/scripts/renovate-changelog.py" apply \
            --plan "$PLAN_PATH"

      - name: Remove the isolated trusted contract checkout
        if: always()
        env:
          CONTRACT_PATH: .renovate-changelog-contract-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          [[ "$CONTRACT_PATH" =~ ^\.renovate-changelog-contract-[0123456789]+-[0123456789]+-[ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-]+$ ]]
          checkout_root="$GITHUB_WORKSPACE/${CONTRACT_PATH:?}"
          [[ "$checkout_root" == "$GITHUB_WORKSPACE"/.renovate-changelog-contract-* ]]
          rm -rf -- "${checkout_root:?}"
