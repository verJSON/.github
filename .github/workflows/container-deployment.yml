name: protected runner deployment

on:
  workflow_call:
    inputs:
      manifest-identity:
        required: true
        type: string
      fleet-selector:
        required: true
        type: string
      action:
        required: true
        type: string
      rollback-receipt:
        required: false
        type: string
        default: ''
      config-path:
        required: true
        type: string
      contract-ref:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: runner-deployment-${{ github.repository }}-${{ inputs.fleet-selector }}
  cancel-in-progress: false

jobs:
  verify-default-branch:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the repository default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ENTRY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ -n "$DEFAULT_BRANCH" ]]
          [[ "$ENTRY_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo "::error::deployment can run only from the repository default branch"
            exit 1
          }

  dry-run:
    if: inputs.dry-run
    needs: verify-default-branch
    environment: production
    runs-on: ${{ github.repository_owner != 'Verjson' && 'ubuntu-24.04' || fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify caller binds this immutable contract
        env:
          CONTRACT_REF: ${{ inputs.contract-ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          contract = os.environ["CONTRACT_REF"]
          repository = os.environ["GITHUB_REPOSITORY"]
          workflow_ref = os.environ["WORKFLOW_REF"]
          prefix = f"{repository}/"
          if not workflow_ref.startswith(prefix) or "@" not in workflow_ref:
              raise SystemExit("caller workflow identity is malformed")
          workflow_path, _ = workflow_ref[len(prefix):].rsplit("@", 1)
          if not re.fullmatch(r"\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml", workflow_path):
              raise SystemExit("caller workflow path is outside .github/workflows")
          text = (Path(os.environ["GITHUB_WORKSPACE"]) / workflow_path).read_text(encoding="utf-8")
          uses = re.findall(
              r"(?m)^\s*uses:\s*Verjson/\.github/\.github/workflows/container-deployment\.yml@([0-9a-f]{40})\s*$",
              text,
          )
          refs = re.findall(r"(?m)^\s*contract-ref:\s*([0-9a-f]{40})\s*$", text)
          if uses != [contract] or refs != [contract]:
              raise SystemExit("caller workflow does not bind one matching deployment contract")
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          registry-url: https://npm.pkg.github.com
      - name: Acquire immutable deployment CLI
        env:
          CONTRACT_REF: ${{ inputs.contract-ref }}
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          [[ "$CONTRACT_REF" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/Verjson/.github/tarball/$CONTRACT_REF" > "$RUNNER_TEMP/deployment-contract.tar.gz"
          mkdir "$RUNNER_TEMP/deployment-contract"
          tar -xzf "$RUNNER_TEMP/deployment-contract.tar.gz" \
            --strip-components=1 -C "$RUNNER_TEMP/deployment-contract"
          python3 "$RUNNER_TEMP/deployment-contract/scripts/validate-container-deployment-cli-lock.py" \
            "$RUNNER_TEMP/deployment-contract/contracts/container-deployment-cli/package-lock.json"
          NODE_AUTH_TOKEN="$GH_TOKEN" npm ci --ignore-scripts --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/deployment-contract/contracts/container-deployment-cli"
          cli_bin="$RUNNER_TEMP/deployment-contract/contracts/container-deployment-cli/node_modules/.bin"
          test -x "$cli_bin/verjson-cloud"
          {
            printf 'VERJSON_DEPLOYMENT_CLI=%s\n' "$cli_bin/verjson-cloud"
            printf 'VERJSON_DEPLOYMENT_CLI_ROOT=%s\n' \
              "$RUNNER_TEMP/deployment-contract/contracts/container-deployment-cli"
            printf 'VERJSON_DEPLOYMENT_CONTRACT_REF=%s\n' "$CONTRACT_REF"
          } >> "$GITHUB_ENV"
      - name: Produce exact mutation-free host plan
        env:
          ACTION: ${{ inputs.action }}
          CONFIG_PATH: ${{ inputs.config-path }}
          CONTRACT_REF: ${{ inputs.contract-ref }}
          FLEET_SELECTOR: ${{ inputs.fleet-selector }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_IDENTITY: ${{ inputs.manifest-identity }}
          ROLLBACK_RECEIPT: ${{ inputs.rollback-receipt }}
          RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_DOCTL_CONFIG: ${{ secrets.RUNNER_HOST_EVIDENCE_DOCTL_CONFIG }}
          RUNNER_HOST_EVIDENCE_KNOWN_HOSTS: ${{ secrets.RUNNER_HOST_EVIDENCE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$CONTRACT_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_IDENTITY" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 scripts/container_deployment_controller.py collect-evidence \
            --preview \
            --config "$CONFIG_PATH" --manifest-identity "$MANIFEST_IDENTITY" \
            --fleet "$FLEET_SELECTOR" --rollback-receipt "$ROLLBACK_RECEIPT" \
            --output deployment-evidence.json
          args=(plan --preview --config "$CONFIG_PATH" --evidence deployment-evidence.json \
            --fleet "$FLEET_SELECTOR" --action "$ACTION" --contract-ref "$CONTRACT_REF" \
            --output deployment-plan.json)
          python3 scripts/container_deployment_controller.py "${args[@]}"
          jq -e '.rolloutMode == "sequential" and (.steps[0].phase == "canary")' deployment-plan.json
      - name: Retain exact redacted mutation-free plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-deployment-${{ github.run_id }}-${{ github.run_attempt }}-dry-run-plan
          path: deployment-plan.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove deployment acquisition state
        if: ${{ always() }}
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          for target in \
            "$RUNNER_TEMP/deployment-contract.tar.gz" \
            "$RUNNER_TEMP/deployment-contract" \
            "$NPM_CONFIG_CACHE"; do
            case "$target" in
              "$RUNNER_TEMP"/*) rm -rf -- "$target" ;;
              *) echo "cleanup target escaped runner temp" >&2; exit 1 ;;
            esac
          done

  deploy:
    if: ${{ !inputs.dry-run }}
    needs: verify-default-branch
    environment: production
    runs-on: ${{ github.repository_owner != 'Verjson' && 'ubuntu-24.04' || fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify caller binds this immutable contract
        env:
          CONTRACT_REF: ${{ inputs.contract-ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          contract = os.environ["CONTRACT_REF"]
          repository = os.environ["GITHUB_REPOSITORY"]
          workflow_ref = os.environ["WORKFLOW_REF"]
          prefix = f"{repository}/"
          if not workflow_ref.startswith(prefix) or "@" not in workflow_ref:
              raise SystemExit("caller workflow identity is malformed")
          workflow_path, _ = workflow_ref[len(prefix):].rsplit("@", 1)
          if not re.fullmatch(r"\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml", workflow_path):
              raise SystemExit("caller workflow path is outside .github/workflows")
          text = (Path(os.environ["GITHUB_WORKSPACE"]) / workflow_path).read_text(encoding="utf-8")
          uses = re.findall(
              r"(?m)^\s*uses:\s*Verjson/\.github/\.github/workflows/container-deployment\.yml@([0-9a-f]{40})\s*$",
              text,
          )
          refs = re.findall(r"(?m)^\s*contract-ref:\s*([0-9a-f]{40})\s*$", text)
          if uses != [contract] or refs != [contract]:
              raise SystemExit("caller workflow does not bind one matching deployment contract")
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          registry-url: https://npm.pkg.github.com
      - name: Acquire immutable deployment CLI
        env:
          CONTRACT_REF: ${{ inputs.contract-ref }}
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          [[ "$CONTRACT_REF" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/Verjson/.github/tarball/$CONTRACT_REF" > "$RUNNER_TEMP/deployment-contract.tar.gz"
          mkdir "$RUNNER_TEMP/deployment-contract"
          tar -xzf "$RUNNER_TEMP/deployment-contract.tar.gz" \
            --strip-components=1 -C "$RUNNER_TEMP/deployment-contract"
          python3 "$RUNNER_TEMP/deployment-contract/scripts/validate-container-deployment-cli-lock.py" \
            "$RUNNER_TEMP/deployment-contract/contracts/container-deployment-cli/package-lock.json"
          NODE_AUTH_TOKEN="$GH_TOKEN" npm ci --ignore-scripts --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/deployment-contract/contracts/container-deployment-cli"
          cli_bin="$RUNNER_TEMP/deployment-contract/contracts/container-deployment-cli/node_modules/.bin"
          test -x "$cli_bin/verjson-cloud"
          {
            printf 'VERJSON_DEPLOYMENT_CLI=%s\n' "$cli_bin/verjson-cloud"
            printf 'VERJSON_DEPLOYMENT_CLI_ROOT=%s\n' \
              "$RUNNER_TEMP/deployment-contract/contracts/container-deployment-cli"
            printf 'VERJSON_DEPLOYMENT_CONTRACT_REF=%s\n' "$CONTRACT_REF"
          } >> "$GITHUB_ENV"
      - name: Collect normalized manifest, fleet, and approval evidence
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          CONTRACT_REF: ${{ inputs.contract-ref }}
          FLEET_SELECTOR: ${{ inputs.fleet-selector }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_IDENTITY: ${{ inputs.manifest-identity }}
          ROLLBACK_RECEIPT: ${{ inputs.rollback-receipt }}
          RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_DOCTL_CONFIG: ${{ secrets.RUNNER_HOST_EVIDENCE_DOCTL_CONFIG }}
          RUNNER_HOST_EVIDENCE_KNOWN_HOSTS: ${{ secrets.RUNNER_HOST_EVIDENCE_KNOWN_HOSTS }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          GITHUB_HEAD_TREE="$(git rev-parse 'HEAD^{tree}')"
          export GITHUB_HEAD_TREE
          python3 - <<'PY'
          import hashlib, io, json, os, re, subprocess, sys, zipfile
          from datetime import datetime, timezone
          sys.path.insert(0, "scripts")
          from container_deployment_controller import validate_environment_policy
          from container_deployment_review_producer import environment_policy_digest, verify_bundle, verify_gate_authority

          def api(path, *, accept=None):
              command = ["gh", "api", path]
              if accept:
                  command += ["-H", f"Accept: {accept}"]
              result = subprocess.run(command, check=True, capture_output=True)
              return result.stdout

          repo = os.environ["GITHUB_REPOSITORY"]
          deployment_sha = os.environ["GITHUB_SHA"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          repository = json.loads(api(f"repos/{repo}"))
          with open(os.environ["CONFIG_PATH"], encoding="utf-8") as stream:
              reviewed_config = json.load(stream)
          reviewed_authority = reviewed_config.get("reviewAuthority")
          contract_ref = os.environ["CONTRACT_REF"]
          if not isinstance(reviewed_authority, dict) or set(reviewed_authority) != {"code", "security", "ai"}:
              raise SystemExit("reviewed deployment review authority is missing")
          expected_ref = f"refs/heads/{repository['default_branch']}"
          if os.environ["GITHUB_REF"] != expected_ref:
              raise SystemExit("deployment must execute from the authoritative default-branch ref")
          pulls = json.loads(api(f"repos/{repo}/commits/{deployment_sha}/pulls"))
          pulls = [item for item in pulls if item.get("merged_at") and item["base"]["ref"] == repository["default_branch"]]
          if len(pulls) != 1:
              raise SystemExit("published head must resolve to exactly one pull request")
          pull = pulls[0]
          sha = pull["head"]["sha"]
          commit = json.loads(api(f"repos/{repo}/git/commits/{sha}"))
          tree = commit["tree"]["sha"]
          deployed_commit = json.loads(api(f"repos/{repo}/git/commits/{deployment_sha}"))
          deployed_tree = deployed_commit["tree"]["sha"]
          if deployed_tree != os.environ["GITHUB_HEAD_TREE"]:
              raise SystemExit("GitHub tree differs checked-out exact tree")
          if deployed_tree != tree:
              raise SystemExit("deployed default-branch tree differs reviewed pull-request tree")
          patch = api(
              f"repos/{repo}/pulls/{pull['number']}",
              accept="application/vnd.github.v3.diff",
          )
          patch_digest = "sha256:" + hashlib.sha256(patch).hexdigest()
          checks = json.loads(api(f"repos/{repo}/commits/{deployment_sha}/check-runs?per_page=100"))["check_runs"]
          expected = {
              kind: reviewed_authority[kind].get("appId") for kind in ("code", "security", "ai")
          }
          expected_workflows = {
              kind: reviewed_authority[kind].get("workflowPath") for kind in ("code", "security", "ai")
          }
          expected_checks = {
              kind: reviewed_authority[kind].get("checkName") for kind in ("code", "security", "ai")
          }
          ai_source_app = reviewed_authority["ai"].get("sourceAppId")
          ai_source_check = reviewed_authority["ai"].get("sourceCheckName")
          if not isinstance(ai_source_app, int) or ai_source_app < 1 or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_. -]{0,99}", str(ai_source_check)) is None:
              raise SystemExit("reviewed AI source authority is malformed")
          expected_installations = {
              kind: reviewed_authority[kind].get("installationId") for kind in ("code", "security", "ai")
          }
          if any(not isinstance(value, int) or value < 1 for value in expected.values()):
              raise SystemExit("reviewed review App ID is malformed")
          if any(not isinstance(value, int) or value < 1 for value in expected_installations.values()):
              raise SystemExit("reviewed publisher installation ID is malformed")
          if any(re.fullmatch(r"\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml", value) is None for value in expected_workflows.values()):
              raise SystemExit("trusted review workflow path is malformed")
          if any(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_. -]{0,99}", value) is None for value in expected_checks.values()):
              raise SystemExit("trusted review check name is malformed")
          if len(set(expected.values())) != 3:
              raise SystemExit("review App IDs must be distinct")
          gates = []
          now = datetime.now(timezone.utc)
          for kind, app_id in expected.items():
              publisher_environment = f"runner-deploy-{kind}-review-publisher"
              publisher_policy = json.loads(api(f"repos/{repo}/environments/{publisher_environment}"))
              validate_environment_policy(publisher_policy)
              publisher_policy_digest = environment_policy_digest(publisher_policy)
              named = [c for c in checks if c["name"] == expected_checks[kind] and c["app"]["id"] == app_id]
              if len(named) != 1:
                  raise SystemExit(f"{kind} review must have exactly one trusted check")
              check = named[0]
              integration_expected = {
                  "checkName": expected_checks[kind], "appId": app_id, "installationId": expected_installations[kind],
                  "repositoryId": repository["id"], "repository": repo, "pullRequest": pull["number"],
                  "headCommit": deployment_sha, "headTree": deployed_tree, "reviewedHead": sha, "reviewedTree": tree,
                  "patchDigest": patch_digest, "kind": kind, "callerRepositoryId": repository["id"],
                  "publisherEnvironment": publisher_environment, "environmentPolicyDigest": publisher_policy_digest,
                  "contractRef": contract_ref, "producerWorkflowRef": f"Verjson/.github/.github/workflows/container-deployment-review-producer.yml@{contract_ref}",
                  "workflowPath": expected_workflows[kind], "sourceCheckName": ai_source_check, "sourceAppId": ai_source_app,
              }
              try:
                  verify_gate_authority(kind, check, integration_expected, lambda path: api(path))
              except ValueError as error:
                  raise SystemExit(f"{kind} complete review authority differs") from error
              if check["status"] != "completed" or check["conclusion"] != "success":
                  raise SystemExit(f"{kind} review is not terminal green")
              completed = datetime.fromisoformat(check["completed_at"].replace("Z", "+00:00"))
              age = (now - completed).total_seconds()
              if age < 0 or age > 86400:
                  raise SystemExit(f"{kind} review is stale")
              try:
                  claim = json.loads(check["output"]["summary"])
              except (KeyError, TypeError, json.JSONDecodeError) as error:
                  raise SystemExit(f"{kind} trusted check has no review claim") from error
              required = {
                  "repositoryId": repository["id"], "repository": repo,
                  "pullRequest": pull["number"], "headCommit": deployment_sha,
                  "headTree": deployed_tree, "reviewedHead": sha, "reviewedTree": tree,
                  "patchDigest": patch_digest, "kind": kind, "callerRepositoryId": repository["id"],
                  "publisherEnvironment": publisher_environment, "environmentPolicyDigest": publisher_policy_digest,
              }
              if any(claim.get(key) != value for key, value in required.items()):
                  raise SystemExit(f"{kind} trusted check claim differs exact source")
              if claim.get("publisherInstallationId") != expected_installations[kind]:
                  raise SystemExit(f"{kind} publisher installation differs reviewed authority")
              expected_producer_ref = f"Verjson/.github/.github/workflows/container-deployment-review-producer.yml@{contract_ref}"
              if claim.get("producerCommit") != contract_ref or claim.get("producerWorkflowRef") != expected_producer_ref:
                  raise SystemExit(f"{kind} producer contract authority differs")
              producer_commit = json.loads(api(f"repos/Verjson/.github/git/commits/{claim.get('producerCommit')}"))
              if claim.get("producerTree") != producer_commit["tree"]["sha"]:
                  raise SystemExit(f"{kind} producer commit/tree authority differs")
              workflow = json.loads(api(f"repos/{repo}/actions/runs/{claim['workflowRunId']}"))
              if (
                  workflow["head_sha"] != deployment_sha
                  or workflow["path"] != expected_workflows[kind]
                  or workflow["status"] != "completed"
                  or workflow["conclusion"] != "success"
                  or workflow["run_attempt"] != claim["workflowRunAttempt"]
                  or workflow["event"] != "workflow_dispatch"
              ):
                  raise SystemExit(f"{kind} review workflow authority differs")
              artifacts = json.loads(api(f"repos/{repo}/actions/runs/{claim['workflowRunId']}/artifacts"))["artifacts"]
              artifact = next((a for a in artifacts if a["id"] == claim["artifactId"]), None)
              if not artifact or artifact.get("expired") or artifact.get("digest") != claim["artifactDigest"]:
                  raise SystemExit(f"{kind} review artifact authority differs")
              archive = api(f"repos/{repo}/actions/artifacts/{artifact['id']}/zip")
              if "sha256:" + hashlib.sha256(archive).hexdigest() != artifact["digest"]:
                  raise SystemExit(f"{kind} downloaded artifact digest differs")
              try:
                  with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                      members = [item for item in bundle.infolist() if not item.is_dir()]
                      if len(members) != 1 or members[0].filename != "review-receipt.json" or members[0].file_size > 65536:
                          raise SystemExit(f"{kind} artifact has ambiguous review evidence")
                      receipt_bytes = bundle.read(members[0])
                  receipt = json.loads(receipt_bytes)
              except (zipfile.BadZipFile, KeyError, json.JSONDecodeError) as error:
                  raise SystemExit(f"{kind} review artifact is malformed") from error
              receipt_digest = "sha256:" + hashlib.sha256(
                  json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
              ).hexdigest()
              canonical_receipt = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode() + b"\n"
              if receipt_bytes != canonical_receipt:
                  raise SystemExit(f"{kind} review receipt bytes are not canonical")
              try:
                  if verify_bundle(archive, artifact["digest"], claim) != receipt:
                      raise ValueError("review bundle parser differs")
              except ValueError as error:
                  raise SystemExit(f"{kind} review bundle protocol differs") from error
              receipt_required = {
                  "schemaVersion": 2, "kind": kind, "repositoryId": repository["id"],
                  "repository": repo, "pullRequest": pull["number"], "headCommit": deployment_sha,
                  "headTree": deployed_tree, "reviewedHead": sha, "reviewedTree": tree,
                  "patchDigest": patch_digest, "callerRepositoryId": repository["id"],
                  "publisherEnvironment": publisher_environment, "environmentPolicyDigest": publisher_policy_digest,
                  "workflowRunId": workflow["id"], "workflowRunAttempt": workflow["run_attempt"],
              }
              if set(receipt) != set(receipt_required) | {"principalId", "reviewId", "sourceCheckRunId", "producerCommit", "producerTree", "producerWorkflowRef"}:
                  raise SystemExit(f"{kind} review receipt schema differs")
              if any(receipt.get(key) != value for key, value in receipt_required.items()):
                  raise SystemExit(f"{kind} review receipt differs exact authority")
              if receipt.get("producerCommit") != claim.get("producerCommit") or receipt.get("producerTree") != claim.get("producerTree") or receipt.get("producerWorkflowRef") != expected_producer_ref:
                  raise SystemExit(f"{kind} producer authority differs artifact")
              if claim.get("receiptDigest") != receipt_digest:
                  raise SystemExit(f"{kind} review receipt digest differs trusted check")
              if kind in ("code", "security"):
                  reviews = json.loads(api(f"repos/{repo}/pulls/{pull['number']}/reviews?per_page=100"))
                  review = next((item for item in reviews if item["id"] == receipt["reviewId"]), None)
                  if not review or review["state"] != "APPROVED" or review["commit_id"] != receipt["reviewedHead"] or review["user"]["id"] != receipt["principalId"]:
                      raise SystemExit(f"{kind} reviewer identity is not an exact-head GitHub approval")
                  principal_id = review["user"]["id"]
              else:
                  source = json.loads(api(f"repos/{repo}/check-runs/{receipt['sourceCheckRunId']}"))
                  if receipt["reviewId"] is not None or source["app"]["id"] != receipt["principalId"] or source["app"]["id"] != ai_source_app or source["name"] != ai_source_check or source["head_sha"] != receipt["reviewedHead"] or source["status"] != "completed" or source["conclusion"] != "success":
                      raise SystemExit("AI review source is not exact-head terminal green")
                  principal_id = receipt["principalId"]
              gates.append({
                  "kind": kind, "principalId": principal_id,
                  "appId": app_id, "issuer": check["app"]["slug"],
                  "checkRunId": check["id"], "workflowRunId": claim["workflowRunId"],
                  "workflowRunAttempt": claim["workflowRunAttempt"],
                  "workflowPath": workflow["path"], "workflowRef": f"{repo}/{workflow['path']}@{claim['producerCommit']}",
                  "artifactId": artifact["id"], "artifactDigest": artifact["digest"],
                  "evidenceDigest": receipt_digest,
                  "repositoryId": repository["id"], **required,
                  "conclusion": "success", "completedAt": check["completed_at"],
              })
          actor = os.environ["GITHUB_ACTOR"]
          triggering_actor = os.environ["TRIGGERING_ACTOR"]
          actor_data = json.loads(api(f"users/{actor}"))
          triggering_data = json.loads(api(f"users/{triggering_actor}"))
          principals = [gate["principalId"] for gate in gates]
          if len(set(principals)) != 3 or actor_data["id"] in principals or triggering_data["id"] in principals:
              raise SystemExit("review principals are not independent")
          environment = json.loads(api(f"repos/{repo}/environments/production"))
          validate_environment_policy(environment)
          authorization = {
              "source": "github-api", "repositoryId": repository["id"],
              "repository": repo, "pullRequest": pull["number"],
              "defaultBranch": repository["default_branch"],
              "ref": expected_ref, "deployedCommit": deployment_sha, "deployedTree": deployed_tree,
              "environment": "production",
              "deploymentBranchPolicy": {"protectedBranches": True, "customBranchPolicies": False},
              "requiredReviewers": [], "preventSelfReview": False,
              "canAdminsBypass": environment["can_admins_bypass"],
              "dispatcher": actor, "dispatcherId": actor_data["id"],
              "triggeringActor": triggering_actor, "triggeringActorId": triggering_data["id"],
              "environmentBypassed": False, "bypassBasis": "branch-policy-only",
              "workflowRunId": run_id, "workflowRunAttempt": run_attempt,
              "reviewedHead": sha, "reviewedTree": tree, "patchDigest": patch_digest,
              "reviewGates": gates,
          }
          with open("github-authorization.json", "x", encoding="utf-8") as stream:
              json.dump(authorization, stream, sort_keys=True, separators=(",", ":"))
          PY
          python3 scripts/container_deployment_controller.py collect-evidence \
            --config "$CONFIG_PATH" --manifest-identity "$MANIFEST_IDENTITY" \
            --fleet "$FLEET_SELECTOR" --rollback-receipt "$ROLLBACK_RECEIPT" \
            --authorization github-authorization.json \
            --output deployment-evidence.json
          python3 scripts/container_deployment_preflight.py --evidence deployment-evidence.json
      - name: Admit immutable sequential plan
        env:
          ACTION: ${{ inputs.action }}
          CONFIG_PATH: ${{ inputs.config-path }}
          CONTRACT_REF: ${{ inputs.contract-ref }}
          FLEET_SELECTOR: ${{ inputs.fleet-selector }}
        run: |
          set -euo pipefail
          args=(plan --config "$CONFIG_PATH" --evidence deployment-evidence.json \
            --fleet "$FLEET_SELECTOR" --action "$ACTION" --contract-ref "$CONTRACT_REF" \
            --output deployment-plan.json)
          python3 scripts/container_deployment_controller.py "${args[@]}"
          mkdir -p deployment-receipts
              python3 scripts/container_deployment_controller.py admit \
                --plan deployment-plan.json --config "$CONFIG_PATH" \
                --evidence deployment-evidence.json --receipt-dir deployment-receipts \
                --fleet "$FLEET_SELECTOR" --action "$ACTION" \
                --contract-ref "$CONTRACT_REF"
          python3 scripts/container_deployment_controller.py reconcile \
            --plan deployment-plan.json --config "$CONFIG_PATH" \
            --evidence deployment-evidence.json --receipt-dir deployment-receipts
      - name: Retain admitted or reconciled authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-deployment-${{ github.run_id }}-${{ github.run_attempt }}-admitted
          path: deployment-receipts/
          if-no-files-found: error
          retention-days: 90
      - name: Mint runner control-plane token
        id: runner-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_RUNNER_REGISTRATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_RUNNER_REGISTRATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-self-hosted-runners: write
      - name: Verify runner App installation identity
        env:
          ACTUAL_INSTALLATION_ID: ${{ steps.runner-app-token.outputs.installation-id }}
          EXPECTED_INSTALLATION_ID: ${{ vars.GH_RUNNER_REGISTRATION_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          test "$ACTUAL_INSTALLATION_ID" = "$EXPECTED_INSTALLATION_ID"
      - name: Advance one bounded runner transition
        id: advance_1
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          GH_RUNNER_CONTROL_TOKEN: ${{ steps.runner-app-token.outputs.token }}
          DIGITALOCEAN_RUNNER_FLEET_TOKEN: ${{ secrets.DIGITALOCEAN_RUNNER_FLEET_TOKEN }}
          RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_DOCTL_CONFIG: ${{ secrets.RUNNER_HOST_EVIDENCE_DOCTL_CONFIG }}
          RUNNER_HOST_EVIDENCE_KNOWN_HOSTS: ${{ secrets.RUNNER_HOST_EVIDENCE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 scripts/container_deployment_controller.py execute \
            --plan deployment-plan.json --config "$CONFIG_PATH" \
            --evidence deployment-evidence.json --receipt-dir deployment-receipts
      - name: Retain append-only progress after transition 1
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-deployment-${{ github.run_id }}-${{ github.run_attempt }}-progress-1
          path: deployment-receipts/
          if-no-files-found: error
          retention-days: 90
      - name: Refresh live fleet evidence after transition 1
        if: ${{ steps.advance_1.outcome == 'success' }}
        id: refresh_1
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          FLEET_SELECTOR: ${{ inputs.fleet-selector }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_IDENTITY: ${{ inputs.manifest-identity }}
          ROLLBACK_RECEIPT: ${{ inputs.rollback-receipt }}
          RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_DOCTL_CONFIG: ${{ secrets.RUNNER_HOST_EVIDENCE_DOCTL_CONFIG }}
          RUNNER_HOST_EVIDENCE_KNOWN_HOSTS: ${{ secrets.RUNNER_HOST_EVIDENCE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 scripts/container_deployment_controller.py collect-evidence \
            --config "$CONFIG_PATH" --manifest-identity "$MANIFEST_IDENTITY" \
            --fleet "$FLEET_SELECTOR" --rollback-receipt "$ROLLBACK_RECEIPT" \
            --authorization github-authorization.json \
            --output deployment-evidence.json
          python3 scripts/container_deployment_preflight.py --evidence deployment-evidence.json
      - name: Revalidate refreshed live release before transition 2
        if: ${{ steps.refresh_1.outcome == 'success' }}
        id: revalidate_1
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          set -euo pipefail
          python3 scripts/container_deployment_controller.py validate-refresh \
            --plan deployment-plan.json --config "$CONFIG_PATH" \
            --evidence deployment-evidence.json --receipt-dir deployment-receipts
      - name: Advance second bounded runner transition
        if: ${{ steps.revalidate_1.outcome == 'success' }}
        id: advance_2
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          GH_RUNNER_CONTROL_TOKEN: ${{ steps.runner-app-token.outputs.token }}
          DIGITALOCEAN_RUNNER_FLEET_TOKEN: ${{ secrets.DIGITALOCEAN_RUNNER_FLEET_TOKEN }}
          RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_DOCTL_CONFIG: ${{ secrets.RUNNER_HOST_EVIDENCE_DOCTL_CONFIG }}
          RUNNER_HOST_EVIDENCE_KNOWN_HOSTS: ${{ secrets.RUNNER_HOST_EVIDENCE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 scripts/container_deployment_controller.py execute \
            --plan deployment-plan.json --config "$CONFIG_PATH" \
            --evidence deployment-evidence.json --receipt-dir deployment-receipts
      - name: Retain append-only progress after transition 2
        if: ${{ always() && steps.refresh_1.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-deployment-${{ github.run_id }}-${{ github.run_attempt }}-progress-2
          path: deployment-receipts/
          if-no-files-found: error
          retention-days: 90
      - name: Refresh live fleet evidence after transition 2
        if: ${{ steps.advance_2.outcome == 'success' }}
        id: refresh_2
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          FLEET_SELECTOR: ${{ inputs.fleet-selector }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_IDENTITY: ${{ inputs.manifest-identity }}
          ROLLBACK_RECEIPT: ${{ inputs.rollback-receipt }}
          RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_DOCTL_CONFIG: ${{ secrets.RUNNER_HOST_EVIDENCE_DOCTL_CONFIG }}
          RUNNER_HOST_EVIDENCE_KNOWN_HOSTS: ${{ secrets.RUNNER_HOST_EVIDENCE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 scripts/container_deployment_controller.py collect-evidence \
            --config "$CONFIG_PATH" --manifest-identity "$MANIFEST_IDENTITY" \
            --fleet "$FLEET_SELECTOR" --rollback-receipt "$ROLLBACK_RECEIPT" \
            --authorization github-authorization.json \
            --output deployment-evidence.json
          python3 scripts/container_deployment_preflight.py --evidence deployment-evidence.json
      - name: Revalidate refreshed live release before transition 3
        if: ${{ steps.refresh_2.outcome == 'success' }}
        id: revalidate_2
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          set -euo pipefail
          python3 scripts/container_deployment_controller.py validate-refresh \
            --plan deployment-plan.json --config "$CONFIG_PATH" \
            --evidence deployment-evidence.json --receipt-dir deployment-receipts
      - name: Advance third bounded runner transition
        if: ${{ steps.revalidate_2.outcome == 'success' }}
        id: advance_3
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          GH_RUNNER_CONTROL_TOKEN: ${{ steps.runner-app-token.outputs.token }}
          DIGITALOCEAN_RUNNER_FLEET_TOKEN: ${{ secrets.DIGITALOCEAN_RUNNER_FLEET_TOKEN }}
          RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_APP_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY: ${{ secrets.RUNNER_HOST_EVIDENCE_SSH_PRIVATE_KEY }}
          RUNNER_HOST_EVIDENCE_DOCTL_CONFIG: ${{ secrets.RUNNER_HOST_EVIDENCE_DOCTL_CONFIG }}
          RUNNER_HOST_EVIDENCE_KNOWN_HOSTS: ${{ secrets.RUNNER_HOST_EVIDENCE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 scripts/container_deployment_controller.py execute \
            --plan deployment-plan.json --config "$CONFIG_PATH" \
            --evidence deployment-evidence.json --receipt-dir deployment-receipts
      - name: Retain append-only progress after transition 3
        if: ${{ always() && steps.refresh_2.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-deployment-${{ github.run_id }}-${{ github.run_attempt }}-progress-3
          path: deployment-receipts/
          if-no-files-found: error
          retention-days: 90
      - name: Remove deployment acquisition state
        if: ${{ always() }}
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          for target in \
            "$RUNNER_TEMP/deployment-contract.tar.gz" \
            "$RUNNER_TEMP/deployment-contract" \
            "$NPM_CONFIG_CACHE"; do
            case "$target" in
              "$RUNNER_TEMP"/*) rm -rf -- "$target" ;;
              *) echo "cleanup target escaped runner temp" >&2; exit 1 ;;
            esac
          done
