name: Organization ruleset conformance

on:
  schedule:
    - cron: "53 9 * * *"

permissions:
  contents: read

concurrency:
  group: org-ruleset-conformance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ${{ fromJSON(vars.CI_LANE_PRIVILEGED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: .org-ruleset-conformance-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    timeout-minutes: 10
    steps:
      - name: Check out the ruleset conformance audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .org-ruleset-conformance-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          persist-credentials: false
      - name: Verify release authorization across ~DEFAULT_BRANCH rulesets
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: python3 -I scripts/org-ruleset-conformance.py
      # Runs even when the release-authorization audit above failed, so that
      # finding cannot mask a package type-surface ruleset finding.
      - name: Verify package type-surface rulesets
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: python3 -I scripts/package-type-surface-ruleset.py audit
      # ADR 0210 rollout step 4: an applied sensitive-path required-reviewer ruleset
      # that is deleted, edited, or duplicated, or an undeclared one, fails here
      # instead of waiting for someone to run `check` by hand. `check` only reads.
      # It runs even when an earlier audit failed, so that finding cannot mask it.
      - name: Verify sensitive-path required-reviewer rulesets
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: python3 -I scripts/required-reviewer-ruleset.py check
      - name: Remove the isolated ruleset-conformance checkout
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf ".org-ruleset-conformance-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"

  # The authorization-arm audit is the only control that can see an adopter
  # unable to satisfy the required workflow, and until #1404 nothing ran it. It
  # shares this schedule but keeps its own job so a finding here is attributable
  # and cannot mask the release-authorization result above. It reports; no pull
  # request gates on it.
  #
  # Its verdict is the adjudicated finding state, not the raw audit exit (#1409).
  # A finding recorded in config/audit-expected-findings.json is quiet, an
  # unrecorded one is loud, and anything the comparison cannot classify fails
  # closed under ADR 0024. Changing what is quiet is a reviewed diff to that
  # file, not an edit to this workflow.
  arm-audit:
    runs-on: ${{ fromJSON(vars.CI_LANE_PRIVILEGED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: .org-ruleset-conformance-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    timeout-minutes: 10
    steps:
      - name: Check out the authorization arm audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .org-ruleset-conformance-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          persist-credentials: false
      - name: Provision audit Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install the hash-pinned audit dependencies
        run: |
          python3 -I -m pip install \
            --disable-pip-version-check \
            --no-input \
            --quiet \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement scripts/actions-ci-python.requirements.txt
      - name: Audit the AI authorization arm against its reviewed contract
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: python3 -I scripts/audit-finding-state.py --audit ai-review-arm --expectations config/audit-expected-findings.json --expect-status 0 --expect-status 1 -- python3 -I scripts/ai-review-required-workflow-audit.py
      - name: Remove the isolated arm-audit checkout
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf ".org-ruleset-conformance-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"

  # The two protected required-workflow rulesets are the only record of the revision
  # they run: their rotation tools keep no committed copy, because that copy went
  # stale after every rotation (#1824). This job fails while either ruleset runs
  # anything but the reviewed required workflow on protected main, including a
  # protected-lane pin below the security floor, so a pending rotation is reported
  # instead of being discovered at the next one. Each audit runs even when the other
  # fails. It reports; no pull request gates on it.
  required-workflow-audit:
    runs-on: ${{ fromJSON(vars.CI_LANE_PRIVILEGED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: .org-ruleset-conformance-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    timeout-minutes: 10
    steps:
      - name: Check out the required-workflow rotation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .org-ruleset-conformance-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          persist-credentials: false
      - name: Provision audit Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install the hash-pinned audit dependencies
        run: |
          python3 -I -m pip install \
            --disable-pip-version-check \
            --no-input \
            --quiet \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement scripts/actions-ci-python.requirements.txt
      - name: Audit the CLI projects required-workflow revision
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: python3 -I scripts/cli-projects-package-surface-ruleset.py audit
      - name: Audit the authn required-workflow revision
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: python3 -I scripts/authn-type-surface-ruleset.py audit
      - name: Remove the isolated required-workflow audit checkout
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf ".org-ruleset-conformance-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
