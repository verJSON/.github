            echo "base-digest=$base_digest"
            echo "bundle-digest=$attestation_id"
            echo "referrer-manifest-digest=$referrer_digest"
          } >> "$GITHUB_OUTPUT"
      - id: base
        if: matrix.baseVariant != ''
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          BASE_VARIANT: ${{ matrix.baseVariant }}
        run: |
          base_repository="$(jq -r --arg variant "$BASE_VARIANT" '.images[] | select(.variant == $variant) | .repository' "$CONFIG_PATH")"
          base_digest="$(docker buildx imagetools inspect "$base_repository:${{ needs.prepare.outputs.candidate }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$base_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "image=$base_repository@$base_digest" >> "$GITHUB_OUTPUT"
          echo "digest=$base_digest" >> "$GITHUB_OUTPUT"
      - id: build
        if: matrix.baseVariant != '' && steps.retry.outputs.reused != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          build-args: VERJSON_BASE_IMAGE=${{ steps.base.outputs.image }}
          push: true
          tags: |
            ${{ matrix.repository }}:${{ needs.prepare.outputs.candidate }}
          provenance: mode=max
          sbom: true
          build-contexts: verjson_node_modules=${{ runner.temp }}/container-node-modules-context
      - name: Wait for pushed manifest registry visibility
        if: matrix.baseVariant != '' && steps.retry.outputs.reused != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::build returned an invalid image digest"; exit 1; }
          reference="$REPOSITORY@$DIGEST"
          for attempt in 1 2 3 4 5 6; do
            if observed="$(timeout --kill-after=2s 5s docker buildx imagetools inspect "$reference" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')" \
              && [ "$observed" = "$DIGEST" ]; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::pushed image digest did not become registry-visible before provenance attestation"
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
      - id: provenance
        name: Sign controlled BuildKit provenance with Cosign
        if: matrix.baseVariant != '' && steps.retry.outputs.reused != 'true'
        env:
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          BASE_REPOSITORY: ${{ steps.base.outputs.image }}
          CONFIG_PATH: ${{ inputs.config-path }}
          CONTRACT_REF: ${{ inputs.contract-ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ matrix.repository }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          token="$RUNNER_TEMP/container-cosign-oidc-token"
          buildkit="$RUNNER_TEMP/container-buildkit-provenance.json"
          reviewed="$RUNNER_TEMP/container-reviewed-platforms.json"
          BASE_REPOSITORY="${BASE_REPOSITORY%@*}"
          docker buildx imagetools inspect "$REPOSITORY@$DIGEST" --format '{{json .Provenance}}' > "$buildkit"
          jq -ce --arg variant "$VARIANT" '.images[] | select(.variant == $variant) | .platforms' "$CONFIG_PATH" > "$reviewed"
          oci="$RUNNER_TEMP/container_oci_index.py"
          raw="$RUNNER_TEMP/container-image-index.json"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_oci_index.py" -o "$oci"
          docker buildx imagetools inspect "$REPOSITORY@$DIGEST" --raw > "$raw"
          python3 "$oci" index --index "$raw" --reviewed-platforms "$reviewed" >/dev/null
          python3 "$RUNNER_TEMP/container_cosign_provenance.py" request-oidc-token \
            --request-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --output "$token"
          receipt="$(python3 "$RUNNER_TEMP/container_cosign_provenance.py" attest-image \
            --identity-token "$token" --buildkit-provenance "$buildkit" \
            --reviewed-platforms "$reviewed" --image-repository "$REPOSITORY" \
            --image-digest "$DIGEST" --base-repository "$BASE_REPOSITORY" \
            --base-digest "$BASE_DIGEST" --bundle "$RUNNER_TEMP/provenance.sigstore.json" \
            --referrer-manifest "$RUNNER_TEMP/provenance-referrer.json")"
          echo "bundle-digest=$(jq -er .bundleDigest <<<"$receipt")" >> "$GITHUB_OUTPUT"
          echo "referrer-manifest-digest=$(jq -er .referrerManifestDigest <<<"$receipt")" >> "$GITHUB_OUTPUT"
      - name: Remove Cosign OIDC token
        if: always()
        run: rm -f "$RUNNER_TEMP/container-cosign-oidc-token"
      - if: matrix.baseVariant != '' && steps.retry.outputs.reused != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          BUNDLE_DIGEST: ${{ steps.provenance.outputs.bundle-digest }}
          REFERRER_MANIFEST_DIGEST: ${{ steps.provenance.outputs.referrer-manifest-digest }}
          BASE_VARIANT: ${{ matrix.baseVariant }}
          IMAGE_VARIANT: ${{ matrix.variant }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          [[ "$BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Cosign provenance bundle digest is missing"; exit 1; }
          [[ "$REFERRER_MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Cosign provenance referrer digest is missing"; exit 1; }
          commit_tag="$REPOSITORY:sha-$GITHUB_SHA"
          error_file="$(mktemp)"
          if existing="$(docker buildx imagetools inspect "$commit_tag" --format '{{json .Manifest.Digest}}' 2>"$error_file" | tr -d '"')"; then
            [ "$existing" = "$DIGEST" ] || { echo "::error::commit identity already records a different digest"; exit 1; }
          elif grep -Eqi 'manifest unknown|not found' "$error_file"; then
            docker buildx imagetools create -t "$commit_tag" "$REPOSITORY@$DIGEST"
            recorded="$(docker buildx imagetools inspect "$commit_tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            [ "$recorded" = "$DIGEST" ] || { echo "::error::commit identity reconciliation diverged"; exit 1; }
          else
            cat "$error_file" >&2
            echo "::error::could not prove commit identity state" >&2
            exit 1
          fi
          jq -n --arg variant "$IMAGE_VARIANT" --arg repository "$REPOSITORY" \
            --arg digest "$DIGEST" --arg baseVariant "$BASE_VARIANT" --arg baseDigest "$BASE_DIGEST" \
            --arg bundleDigest "$BUNDLE_DIGEST" --arg referrerManifestDigest "$REFERRER_MANIFEST_DIGEST" \
            '{variant:$variant,repository:$repository,indexDigest:$digest,base:{variant:$baseVariant,digest:$baseDigest},
              provenance:{bundleDigest:$bundleDigest,referrerManifestDigest:$referrerManifestDigest}}' > image.json
      - name: Record verified reused derived image digest
        if: matrix.baseVariant != '' && steps.retry.outputs.reused == 'true'
        env:
          BUNDLE_DIGEST: ${{ steps.retry.outputs.bundle-digest }}
          REFERRER_MANIFEST_DIGEST: ${{ steps.retry.outputs.referrer-manifest-digest }}
          BASE_DIGEST: ${{ steps.retry.outputs.base-digest }}
          BASE_VARIANT: ${{ matrix.baseVariant }}
          DIGEST: ${{ steps.retry.outputs.digest }}
          IMAGE_VARIANT: ${{ matrix.variant }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          [[ "$BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$REFERRER_MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          jq -n --arg variant "$IMAGE_VARIANT" --arg repository "$REPOSITORY" \
            --arg digest "$DIGEST" --arg baseVariant "$BASE_VARIANT" --arg baseDigest "$BASE_DIGEST" \
            --arg bundleDigest "$BUNDLE_DIGEST" --arg referrerManifestDigest "$REFERRER_MANIFEST_DIGEST" \
            '{variant:$variant,repository:$repository,indexDigest:$digest,base:{variant:$baseVariant,digest:$baseDigest},
              provenance:{bundleDigest:$bundleDigest,referrerManifestDigest:$referrerManifestDigest}}' > image.json
      - if: matrix.baseVariant != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: image.json
          retention-days: 90

  attest-sbom:
    if: >-
      always()
      && ((github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.event.repository.default_branch == 'main')
      || (github.event_name == 'workflow_dispatch'
      && github.repository == 'Verjson/.github'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
      && needs.prepare.result == 'success'
      && needs.publish-base.result == 'success'
      && needs.publish-derived.result == 'success'
    needs: [prepare, publish-base, publish-derived]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.sbom-matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - name: Download pinned Cosign provenance implementation
        env:
          CONTRACT_REF: ${{ inputs.contract-ref }}
          PROVENANCE_SHA256: ${{ inputs.provenance-sha256 }}
          RETRY_SHA256: ${{ inputs.retry-sha256 }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/container_cosign_provenance.py"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_cosign_provenance.py" -o "$helper"
          printf '%s  %s\n' "$PROVENANCE_SHA256" "$helper" | sha256sum --check --strict
          retry="$RUNNER_TEMP/container_candidate_retry.py"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_candidate_retry.py" -o "$retry"
          printf '%s  %s\n' "$RETRY_SHA256" "$retry" | sha256sum --check --strict
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.imageArtifact }}
          path: candidate-image
      - id: sbom-subject
        name: Bind parent-index evidence and extract the exact platform SPDX document
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          CONFIG_PATH: ${{ inputs.config-path }}
          CONTRACT_REF: ${{ inputs.contract-ref }}
          IMAGE_VARIANT: ${{ matrix.imageVariant }}
          OS: ${{ matrix.os }}
          PLATFORM_VARIANT: ${{ matrix.platformVariant }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          index_digest="$(jq -er .indexDigest candidate-image/image.json)"
          helper="$RUNNER_TEMP/container_oci_index.py"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_oci_index.py" -o "$helper"
          raw_index="$RUNNER_TEMP/parent-index.json"
          reviewed_platforms="$RUNNER_TEMP/reviewed-platforms.json"
          inventory="$RUNNER_TEMP/oci-inventory.json"
          docker buildx imagetools inspect "$REPOSITORY@$index_digest" --raw > "$raw_index"
          jq -ce --arg variant "$IMAGE_VARIANT" '.images[] | select(.variant == $variant) | .platforms' \
            "$CONFIG_PATH" > "$reviewed_platforms"
          python3 "$helper" index --index "$raw_index" --reviewed-platforms "$reviewed_platforms" > "$inventory"
          binding="$(jq -ce --arg os "$OS" --arg architecture "$ARCHITECTURE" --arg variant "$PLATFORM_VARIANT" \
            '[.evidence[] | select(.os == $os and .architecture == $architecture and (.variant // "") == $variant)]
             | if length == 1 then .[0] else error("platform evidence is missing or ambiguous") end' "$inventory")"
          platform_digest="$(jq -er .subjectDigest <<<"$binding")"
          evidence_digest="$(jq -er .digest <<<"$binding")"
          [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$evidence_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          evidence_manifest="$RUNNER_TEMP/evidence-manifest.json"
          docker buildx imagetools inspect "$REPOSITORY@$evidence_digest" --raw > "$evidence_manifest"
          python3 "$helper" spdx-evidence --manifest "$evidence_manifest" >/dev/null
          platform_key="$OS/$ARCHITECTURE${PLATFORM_VARIANT:+/$PLATFORM_VARIANT}"
          docker buildx imagetools inspect "$REPOSITORY@$index_digest" --format '{{json .SBOM}}' \
            > "$RUNNER_TEMP/sbom-index.json"
          python3 "$helper" spdx-document --sbom-index "$RUNNER_TEMP/sbom-index.json" \
            --platform "$platform_key" --inventory "$inventory" > sbom.spdx.json
          echo "digest=$platform_digest" >> "$GITHUB_OUTPUT"
      - id: sbom-attestation
        name: Sign the platform SBOM and preserve its original bundle
        env:
          DIGEST: ${{ steps.sbom-subject.outputs.digest }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          token="$RUNNER_TEMP/container-sbom-oidc-token"
          bundle="$RUNNER_TEMP/sbom.sigstore.json"
          referrer="$RUNNER_TEMP/sbom-referrer.json"
          python3 "$RUNNER_TEMP/container_cosign_provenance.py" request-oidc-token \
            --request-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --output "$token"
          receipt="$(python3 "$RUNNER_TEMP/container_cosign_provenance.py" sign-sbom \
            --identity-token "$token" --sbom sbom.spdx.json --bundle "$bundle" \
            --referrer-manifest "$referrer" --image-repository "$REPOSITORY" \
            --image-digest "$DIGEST")"
          {
            echo "bundle-digest=$(jq -er .bundleDigest <<<"$receipt")"
            echo "referrer-manifest-digest=$(jq -er .referrerManifestDigest <<<"$receipt")"
            echo "spdx-digest=$(jq -er .spdxDigest <<<"$receipt")"
          } >> "$GITHUB_OUTPUT"
          rm -f "$token"
      - name: Record signed platform SBOM identity
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          BUNDLE_DIGEST: ${{ steps.sbom-attestation.outputs.bundle-digest }}
          DIGEST: ${{ steps.sbom-subject.outputs.digest }}
          IMAGE_VARIANT: ${{ matrix.imageVariant }}
          OS: ${{ matrix.os }}
          PLATFORM_VARIANT: ${{ matrix.platformVariant }}
          REFERRER_MANIFEST_DIGEST: ${{ steps.sbom-attestation.outputs.referrer-manifest-digest }}
          SPDX_DIGEST: ${{ steps.sbom-attestation.outputs.spdx-digest }}
        run: |
          set -euo pipefail
          [[ "$BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Cosign SBOM bundle digest is missing"; exit 1; }
          [[ "$REFERRER_MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Cosign SBOM referrer digest is missing"; exit 1; }
          [[ "$SPDX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::SPDX document digest is missing"; exit 1; }
          jq -n --arg imageVariant "$IMAGE_VARIANT" --arg os "$OS" --arg architecture "$ARCHITECTURE" \
            --arg platformVariant "$PLATFORM_VARIANT" --arg digest "$DIGEST" --arg bundleDigest "$BUNDLE_DIGEST" \
            --arg referrerManifestDigest "$REFERRER_MANIFEST_DIGEST" --arg spdxDigest "$SPDX_DIGEST" \
            '{imageVariant:$imageVariant,os:$os,architecture:$architecture,digest:$digest,
              bundleDigest:$bundleDigest,referrerManifestDigest:$referrerManifestDigest,spdxDigest:$spdxDigest}
             + if $platformVariant == "" then {} else {variant:$platformVariant} end' > sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.sbomArtifact }}
          path: sbom.json
          if-no-files-found: error
          retention-days: 90

  mirror-gar:
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main') ||
       (github.event_name == 'workflow_dispatch' && github.repository == 'Verjson/.github' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
      needs.prepare.result == 'success' &&
      needs.publish-base.result == 'success' &&
      needs.publish-derived.result == 'success' &&
      needs.attest-sbom.result == 'success' &&
      needs.prepare.outputs.has-gar == 'true'
    needs: [prepare, publish-base, publish-derived, attest-sbom]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.mirror-matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: candidate-image
      - id: gar-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ matrix.gar.workloadIdentityProvider }}
          service_account: ${{ matrix.gar.serviceAccount }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ matrix.gar.registryHost }}
          username: oauth2accesstoken
          password: ${{ steps.gar-auth.outputs.access_token }}
      - name: Mirror and verify the complete OCI candidate
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          CONFIG_PATH: ${{ inputs.config-path }}
          CONTRACT_REF: ${{ inputs.contract-ref }}
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_SHA256: ${{ inputs.provenance-sha256 }}
          RETRY_SHA256: ${{ inputs.retry-sha256 }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/container_registry_destinations.py"
          provenance_helper="$RUNNER_TEMP/container_cosign_provenance.py"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_registry_destinations.py" -o "$helper"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_oci_index.py" -o "$RUNNER_TEMP/container_oci_index.py"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_cosign_provenance.py" -o "$provenance_helper"
          printf '%s  %s\n' "$PROVENANCE_SHA256" "$provenance_helper" | sha256sum --check --strict
          retry="$RUNNER_TEMP/container_candidate_retry.py"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_candidate_retry.py" -o "$retry"
          printf '%s  %s\n' "$RETRY_SHA256" "$retry" | sha256sum --check --strict
          run_metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          [ "$(jq -er '.run_attempt | tostring' <<<"$run_metadata")" = "$GITHUB_RUN_ATTEMPT" ] || { echo "::error::candidate run attempt changed"; exit 1; }
          candidate_published_at="$(jq -er '.run_started_at' <<<"$run_metadata")"
          digest="$(jq -er '.indexDigest | select(test("^sha256:[0-9a-f]{64}$"))' candidate-image/image.json)"
          python3 "$helper" \
            --config "$CONFIG_PATH" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --mirror-provider gar \
            --variant "$VARIANT" \
            --tag "$CANDIDATE" \
            --digest "$digest" \
            --authfile "$HOME/.docker/config.json" \
            --published-at "$candidate_published_at" > registry-receipt.json
          source_repository="$(jq -er '.repository' candidate-image/image.json)"
          gar_repository="$(jq -er '.repository' registry-receipt.json)"
          bundle_digest="$(jq -er '.provenance.bundleDigest | select(test("^sha256:[0-9a-f]{64}$"))' candidate-image/image.json)"
          referrer_digest="$(jq -er '.provenance.referrerManifestDigest | select(test("^sha256:[0-9a-f]{64}$"))' candidate-image/image.json)"
          buildkit="$RUNNER_TEMP/container-gar-buildkit-provenance.json"
          reviewed="$RUNNER_TEMP/container-gar-reviewed-platforms.json"
          docker buildx imagetools inspect "$source_repository@$digest" --format '{{json .Provenance}}' > "$buildkit"
          jq -ce --arg variant "$VARIANT" '.images[] | select(.variant == $variant) | .platforms' "$CONFIG_PATH" > "$reviewed"
          token="$RUNNER_TEMP/container-gar-cosign-oidc-token"
          trap 'rm -f "$token"' EXIT
          python3 "$provenance_helper" request-oidc-token \
            --request-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --output "$token"
          base_args=()
          base_variant="$(jq -r '.base.variant // empty' candidate-image/image.json)"
          if [ -n "$base_variant" ]; then
            base_repository="$(jq -er --arg variant "$base_variant" '.images[] | select(.variant == $variant) | .repository' "$CONFIG_PATH")"
            base_digest="$(jq -er '.base.digest | select(test("^sha256:[0-9a-f]{64}$"))' candidate-image/image.json)"
            base_args=(--base-repository "$base_repository" --base-digest "$base_digest")
          fi
          python3 "$provenance_helper" verify-image \
            --identity-token "$token" --buildkit-provenance "$buildkit" \
            --reviewed-platforms "$reviewed" --image-repository "$source_repository" \
            --registry-repository "$gar_repository" --image-digest "$digest" \
            --expected-bundle-digest "$bundle_digest" \
            --expected-referrer-digest "$referrer_digest" \
            --expected-source-repository "$GITHUB_REPOSITORY" \
            --expected-source-repository-id "$GITHUB_REPOSITORY_ID" \
            --expected-source-ref "$GITHUB_REF" --expected-source-commit "$GITHUB_SHA" \
            --expected-caller-workflow-ref "$CALLER_WORKFLOW_REF" \
            --expected-caller-workflow-sha "$CALLER_WORKFLOW_SHA" \
            --expected-publisher-workflow-ref "Verjson/.github/.github/workflows/container-candidate-publish.yml@$CONTRACT_REF" \
            --expected-contract-sha "$CONTRACT_REF" "${base_args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-registry-${{ matrix.variant }}-gar
          path: registry-receipt.json
          if-no-files-found: error
          retention-days: 90

  candidate-manifest:
    if: >-
      always()
      && ((github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.event.repository.default_branch == 'main')
      || (github.event_name == 'workflow_dispatch'
      && github.repository == 'Verjson/.github'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
      && needs.prepare.result == 'success'
      && needs.publish-base.result == 'success'
      && needs.publish-derived.result == 'success'
      && needs.attest-sbom.result == 'success'
      && (needs.mirror-gar.result == 'success' || needs.mirror-gar.result == 'skipped')
    needs: [prepare, publish-base, publish-derived, attest-sbom, mirror-gar]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download pinned Cosign provenance implementation
        env:
          CONTRACT_REF: ${{ inputs.contract-ref }}
          PROVENANCE_SHA256: ${{ inputs.provenance-sha256 }}
          RETRY_SHA256: ${{ inputs.retry-sha256 }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/container_cosign_provenance.py"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_cosign_provenance.py" -o "$helper"
          printf '%s  %s\n' "$PROVENANCE_SHA256" "$helper" | sha256sum --check --strict
          retry="$RUNNER_TEMP/container_candidate_retry.py"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_candidate_retry.py" -o "$retry"
          printf '%s  %s\n' "$RETRY_SHA256" "$retry" | sha256sum --check --strict
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-image-*
          path: candidate-images
          merge-multiple: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-sbom-*
          path: candidate-sboms
          merge-multiple: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.prepare.outputs.has-gar == 'true'
        with:
          pattern: candidate-registry-*-gar
          path: candidate-registry
          merge-multiple: false
      - name: Assemble complete candidate manifest
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          CONFIG_PATH: ${{ inputs.config-path }}
          CONTRACT_REF: ${{ inputs.contract-ref }}
          GH_TOKEN: ${{ github.token }}
          HAS_GAR: ${{ needs.prepare.outputs.has-gar }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/container_oci_index.py"
          destination_helper="$RUNNER_TEMP/container_registry_destinations.py"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_oci_index.py" -o "$helper"
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/$CONTRACT_REF/scripts/container_registry_destinations.py" -o "$destination_helper"
          run_metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          [ "$(jq -er '.run_attempt | tostring' <<<"$run_metadata")" = "$GITHUB_RUN_ATTEMPT" ] || { echo "::error::candidate run attempt changed"; exit 1; }
          candidate_published_at="$(jq -er '.run_started_at' <<<"$run_metadata")"
          shopt -s nullglob
          image_artifacts=(candidate-images/*/image.json)
          sbom_artifacts=(candidate-sboms/*/sbom.json)
          registry_artifacts=(candidate-registry/*/registry-receipt.json)
          [ ! -f candidate-images/image.json ] || image_artifacts+=(candidate-images/image.json)
          [ ! -f candidate-sboms/sbom.json ] || sbom_artifacts+=(candidate-sboms/sbom.json)
          [ ! -f candidate-registry/registry-receipt.json ] || registry_artifacts+=(candidate-registry/registry-receipt.json)
          [ "${#image_artifacts[@]}" -gt 0 ] || { echo "::error::candidate image artifacts are missing"; exit 1; }
          [ "${#sbom_artifacts[@]}" -gt 0 ] || { echo "::error::candidate SBOM artifacts are missing"; exit 1; }
          if [ "$HAS_GAR" = true ]; then
            [ "${#registry_artifacts[@]}" -gt 0 ] || { echo "::error::GAR receipt artifacts are missing"; exit 1; }
          fi
          for image in "${image_artifacts[@]}"; do
            repository="$(jq -r '.repository' "$image")"
            variant="$(jq -r '.variant' "$image")"
            index_digest="$(jq -r '.indexDigest' "$image")"
            expected_destinations="$(python3 "$destination_helper" --config "$CONFIG_PATH" --owner "$GITHUB_REPOSITORY_OWNER" --variant "$variant" --digest "$index_digest" --published-at "$candidate_published_at")"
            ghcr_receipt="$(python3 "$destination_helper" --config "$CONFIG_PATH" --owner "$GITHUB_REPOSITORY_OWNER" --verify-provider ghcr --variant "$variant" --tag "$CANDIDATE" --digest "$index_digest" --authfile "$HOME/.docker/config.json" --published-at "$candidate_published_at")"
            if [ "$HAS_GAR" = true ]; then
              gar_receipt="$(jq -cs --arg variant "$variant" '[.[] | select(.variant == $variant)] | if length == 1 then (.[0] | del(.variant)) else error("expected one verified GAR receipt for image variant") end' "${registry_artifacts[@]}")"
              receipts="$(jq -cn --argjson ghcr "$ghcr_receipt" --argjson gar "$gar_receipt" '[$ghcr,$gar]')"
            else
              receipts="[$ghcr_receipt]"
            fi
            destinations="$(jq -cne --argjson expected "$expected_destinations" --argjson receipts "$receipts" '
              if ($expected | length) != ($receipts | length) then error("registry receipt count differs from reviewed destinations")
              else [ $expected[] as $destination
                | [$receipts[] | select(.provider == $destination.provider)] as $matches
                | if ($matches | length) != 1 then error("missing or duplicate registry receipt")
                  elif ([$destination.provider,$destination.repository,$destination.digest,$destination.candidateExpiresAt] == [$matches[0].provider,$matches[0].repository,$matches[0].digest,$matches[0].candidateExpiresAt]) then $matches[0]
                  else error("registry receipt differs from reviewed destination or candidate digest") end
              ] end')"
            raw="$(docker buildx imagetools inspect "$repository@$index_digest" --raw)"
            reviewed="$(jq -c --arg variant "$variant" '.images[] | select(.variant == $variant)' "$CONFIG_PATH")"
            raw_index="$RUNNER_TEMP/parent-index-$variant.json"
            reviewed_platforms="$RUNNER_TEMP/reviewed-platforms-$variant.json"
            inventory="$RUNNER_TEMP/oci-inventory-$variant.json"
            printf '%s\n' "$raw" > "$raw_index"
            jq -c '.platforms' <<<"$reviewed" > "$reviewed_platforms"
            python3 "$helper" index --index "$raw_index" --reviewed-platforms "$reviewed_platforms" > "$inventory"
            platforms="$(jq -c .platforms "$inventory")"
            base="$(jq -c '.base // null' "$image")"
            provenance_bundle_digest="$(jq -er '.provenance.bundleDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$image")"
            provenance_referrer_digest="$(jq -er '.provenance.referrerManifestDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$image")"
            sbom_attestations="$(jq -sc --arg variant "$variant" \
              '[.[] | select(.imageVariant == $variant) | del(.imageVariant)] | sort_by(.os,.architecture,(.variant // ""))' \
              "${sbom_artifacts[@]}")"
            jq -n --arg variant "$variant" --arg repository "$repository" --arg index "$index_digest" \
              --arg commit "sha-$GITHUB_SHA" --arg candidate "$CANDIDATE" --arg workflow "Verjson/.github/.github/workflows/container-candidate-publish.yml@$CONTRACT_REF" \
              --arg bundleDigest "$provenance_bundle_digest" --arg referrerManifestDigest "$provenance_referrer_digest" \
              --argjson platforms "$platforms" --argjson reviewed "$reviewed" \
              --argjson base "$base" --argjson sbomAttestations "$sbom_attestations" --argjson destinations "$destinations" '
                {variant:$variant,repository:$repository,indexDigest:$index,
                 identities:{commit:$commit,candidate:$candidate},
                 platforms:$platforms,
                 provenance:{predicateType:$reviewed.provenance.predicateType,builderIdentity:$workflow,subjectDigest:$index,
                   bundleDigest:$bundleDigest,referrerManifestDigest:$referrerManifestDigest},
                 sbom:{predicateType:"https://spdx.dev/Document/v2.3",attestations:$sbomAttestations},
                 destinations:$destinations}
                + (if $base then {base:$base} else {} end)' \
              > "image-$variant.json"
          done
          jq -s --arg candidate "$CANDIDATE" --arg commit "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" --arg workflow "Verjson/.github/.github/workflows/container-candidate-publish.yml@$CONTRACT_REF" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg publishedAt "$candidate_published_at" \
            '{schemaVersion:3,kind:"container-candidate",candidateVersion:$candidate,
              promotionEligible:false,
              source:{repository:$repository,commit:$commit,ref:$ref,workflow:$workflow,runId:$run,runAttempt:$attempt,candidatePublishedAt:$publishedAt},images:.}' \
            image-*.json > candidate-manifest.json
          python3 scripts/container_release_manifest.py --manifest candidate-manifest.json --config "$CONFIG_PATH"
      - name: Mint OIDC token and sign candidate manifest with Cosign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="$RUNNER_TEMP/container-manifest-oidc-token"
          python3 "$RUNNER_TEMP/container_cosign_provenance.py" request-oidc-token \
            --request-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --output "$token"
          python3 "$RUNNER_TEMP/container_cosign_provenance.py" sign-manifest \
            --identity-token "$token" --manifest candidate-manifest.json \
            --bundle candidate-manifest.sigstore.json
          rm -f "$token"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-candidate-${{ needs.prepare.outputs.candidate }}
          path: |
            candidate-manifest.json
            candidate-manifest.sigstore.json
          if-no-files-found: error
          retention-days: 90
