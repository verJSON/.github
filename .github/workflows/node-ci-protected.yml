          DB_ENV: ${{ inputs.db-env }}
          DB_CONTAINER_PORT: ${{ inputs.db-port }}
          DB_HEALTH_CMD: ${{ inputs.db-health-cmd }}
        run: |
          set -euo pipefail
          DB_HOST_MODE="${DB_HOST_MODE:-auto}"
          # Defaults mirror the workflow_call `default:` above so the extracted
          # run: block behaves identically when exercised directly (test harness).
          DB_CONTAINER_PORT="${DB_CONTAINER_PORT:-5432}"
          DB_HEALTH_CMD="${DB_HEALTH_CMD:-pg_isready}"
          # Name the container per JOB, not per run: run_id/run_attempt are shared
          # by every job of a run, so a name built from them alone collides as soon
          # as two DB-backed jobs are in flight on one persistent self-hosted host
          # (#116). Two concurrent jobs are normally served by two distinct runner
          # processes — a runner executes one job at a time — so RUNNER_NAME /
          # RUNNER_WORKSPACE separate them even when the run and job ids match
          # (including two legs of a caller's matrix, which reach this reusable as
          # separate jobs). Nothing load-bearing rides on that premise: the name is
          # for humans reading `docker ps`, while every operation below uses the
          # container ID. If the premise ever fails, `docker run --name` refuses the
          # second job — which fails loudly and, having no ID, cannot tear down the
          # first job's live container. (`sha256sum` is GNU coreutils: fine for the
          # Linux self-hosted pool this workflow targets.)
          container_scope="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB:-}-${RUNNER_NAME:-}-${RUNNER_WORKSPACE:-}"
          CONTAINER_NAME="ci-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(
            printf '%s' "$container_scope" | sha256sum | cut -c1-12)"
          docker_env=()
          db_env_lines=()
          if [[ "$DB_ENV" == *$'\r'* ]]; then
            echo "db-env: carriage returns are not permitted" >&2
            exit 1
          fi
          while IFS= read -r line; do
            # `db-env` is dotenv-shaped, so blank lines and `#` comments are a
            # natural thing to write in the caller's block scalar. Skip them at
            # any indentation; every surviving line must be KEY=VALUE, which is
            # enforced where the lines are exported below.
            case "${line#"${line%%[![:space:]]*}"}" in
              ''|'#'*) continue ;;
            esac
            case "$line" in
              *=*) ;;
              *)
                echo "db-env: '$line' is not a KEY=VALUE pair. Every db-env line" \
                     "must be KEY=VALUE; blank lines and #-comments are ignored." >&2
                exit 1 ;;
            esac
            key="${line%%=*}"
            if [[ ! "$key" =~ ^[ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_][ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_]*$ ]]; then
              echo "db-env: '$key' is not a valid environment variable name" >&2
              exit 1
            fi
            key_upper="${key^^}"
            case "$key_upper" in
              BASH_ENV|BASH_XTRACEFD|ENV|PS4|SHELLOPTS|BASHOPTS|PATH|\
              NODE_OPTIONS|NODE_PATH|NODE_EXTRA_CA_CERTS|\
              PYTHONPATH|PYTHONHOME|PYTHONSTARTUP|PYTHONUSERBASE|\
              PERL5OPT|PERL5LIB|RUBYOPT|RUBYLIB|JAVA_TOOL_OPTIONS|\
              JDK_JAVA_OPTIONS|_JAVA_OPTIONS|LD_*|DYLD_*|GITHUB_*|RUNNER_*|\
              ACTIONS_*|GH_*|DOCKER_*|\
              GIT_ASKPASS|SSH_ASKPASS|GIT_CONFIG_*|GIT_SSL_CAINFO|\
              GIT_SSL_CAPATH|NPM_CONFIG_*|\
              HTTP_PROXY|HTTPS_PROXY|FTP_PROXY|ALL_PROXY|NO_PROXY|http_proxy|https_proxy|ftp_proxy|\
              all_proxy|no_proxy|SSL_CERT_FILE|SSL_CERT_DIR|CURL_CA_BUNDLE|\
              REQUESTS_CA_BUNDLE|GCONV_PATH)
                echo "db-env: '$key' cannot override runner execution or workflow state" >&2
                exit 1 ;;
            esac
            db_env_lines+=("$line")
            case "$line" in
              POSTGRES_*) docker_env+=(-e "$line") ;;
            esac
          done <<< "$DB_ENV"
          # Sweep leaked containers from earlier jobs. While the bind was a fixed
          # 5432 a leak announced itself by breaking the next job's start; an
          # OS-assigned port makes a leak invisible, so it would pile up on a
          # persistent self-hosted host. The `verjson-ci` label scopes the sweep to
          # containers this workflow started; the age bound is computed HERE
          # because docker offers no usable one: `until` is a prune-only filter
          # (`docker ps --filter until=…` is a hard "invalid filter" error, not an
          # empty list), and `docker container prune` reaps only STOPPED
          # containers while a leaked one is typically still running.
          #
          # Only containers older than 6h are reaped. A job cannot outlive
          # GitHub caps `timeout-minutes` at 360 even when a caller supplies a
          # larger value, and this container is created after the job starts, so
          # a labelled container older than 6h cannot belong to a job that is
          # still running — while anything younger may be a concurrent job's live
          # database, which this must never remove (#116).
          # Best-effort, but never silent: a listing or a removal that fails warns
          # instead of quietly sweeping nothing.
          sweep_cutoff=$(( $(date +%s) - 6 * 60 * 60 ))
          if ! stale_listing="$(docker ps -a --filter label=verjson-ci=1 \
              --format '{{.ID}} {{.CreatedAt}}' 2>&1)"; then
            echo "warning: could not list CI database containers to sweep:" \
                 "$stale_listing" >&2
            stale_listing=""
          fi
          # `{{.CreatedAt}}` is `YYYY-MM-DD HH:MM:SS ±ZZZZ TZ`; the first three
          # fields are what `date -d` needs (the trailing zone NAME is ambiguous).
          while read -r stale_id stale_date stale_time stale_zone _; do
            [ -n "$stale_id" ] || continue
            stale_epoch="$(date -d "$stale_date $stale_time $stale_zone" +%s 2>/dev/null || true)"
            case "$stale_epoch" in
              ''|*[!0123456789]*)
                echo "warning: not sweeping $stale_id: cannot read its creation" \
                     "time from '$stale_date $stale_time $stale_zone'" >&2
                continue ;;
            esac
            [ "$stale_epoch" -lt "$sweep_cutoff" ] || continue
            echo "removing leaked CI database container $stale_id" \
                 "(created $stale_date $stale_time)"
            docker rm -f "$stale_id" >/dev/null 2>&1 \
              || echo "warning: could not remove leaked container $stale_id" >&2
          done <<< "$stale_listing"
          # Loopback-only, OS-assigned host port: a fixed 5432:5432 bind is taken
          # by the first DB-backed job on the host, so the second one could not
          # start (#116). Binding 127.0.0.1 also keeps the caller's DB image off
          # the pool network (ADR 0021).
          #
          # The ID docker assigns is the handle for everything that follows: it is
          # unique by construction, so no operation here (and no teardown) can ever
          # reach another job's container. Published as the step output before the
          # first thing that can fail, so `if: always()` teardown removes exactly
          # this container; a `docker run` that fails without printing an ID leaves
          # nothing to remove, and the label sweep above catches any such orphan.
          run_rc=0
          CONTAINER_ID="$(docker run -d --name "$CONTAINER_NAME" \
            --label verjson-ci=1 -p "127.0.0.1::${DB_CONTAINER_PORT}" \
            ${docker_env[@]+"${docker_env[@]}"} "$DB_IMAGE")" || run_rc=$?
          [ -z "$CONTAINER_ID" ] || echo "container-id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          if [ "$run_rc" -ne 0 ]; then
            echo "failed to start the database container (name $CONTAINER_NAME)" >&2
            exit "$run_rc"
          fi
          # The host port is only known once the daemon has assigned it, so read
          # it back — it is what the caller's `${DB_PORT}` placeholder becomes
          # below, and without it their DATABASE_URL points at a port nothing is
          # listening on. Captured whole, then split in-shell: `docker port` prints one line per
          # mapping, and piping it into `head` would leave docker writing to a
          # closed pipe — a SIGPIPE that `pipefail` turns into a failed step. The
          # port is taken from after the LAST colon, so a HOST:PORT of any shape
          # parses.
          port_map="$(docker port "$CONTAINER_ID" "${DB_CONTAINER_PORT}/tcp")"
          DB_PORT="${port_map%%$'\n'*}"
          DB_PORT="${DB_PORT##*:}"
          case "$DB_PORT" in
            ''|*[!0123456789]*)
              # An image that exits immediately dies here, before the health loop
              # below can dump anything — so dump the container's logs on this
              # branch too, or the operator sees only "could not read the port".
              echo "could not read the mapped host port from '$port_map'" >&2
              docker logs "$CONTAINER_ID" >&2 || true
              exit 1 ;;
          esac
          MAPPED_DB_PORT="$DB_PORT"
          # DB_HEALTH_CMD is caller-supplied data (default: pg_isready, this
          # workflow's existing check — byte-identical for every caller that
          # does not set db-health-cmd). Read into an array (whitespace-split,
          # same as unquoted word-splitting) rather than expanded unquoted:
          # unquoted expansion also undergoes pathname/glob expansion, so a
          # command containing `*`/`?`/`[...]` that happened to match a file in
          # the runner's working directory would silently gain extra argv the
          # caller never wrote. An array built by `read` performs no such
          # expansion. Either way the tokens reach `docker exec` as literal
          # argv, never through a shell or `eval`, so they cannot escape to the
          # runner regardless of content (#986).
          IFS=' ' read -r -ra DB_HEALTH_CMD_ARGV <<< "$DB_HEALTH_CMD"
          for attempt in $(seq 1 30); do
            if docker exec "$CONTAINER_ID" "${DB_HEALTH_CMD_ARGV[@]}" >/dev/null 2>&1; then
              echo "database is ready"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "database image '$DB_IMAGE' failed health check '$DB_HEALTH_CMD' after 30 attempts" >&2
              docker logs "$CONTAINER_ID" >&2 || true
              exit 1
            fi
            sleep 2
          done
          probe_database_endpoint() {
            # shellcheck disable=SC2016 # Positional parameters expand in the child bash.
            timeout 2 bash -c 'exec 3<>"/dev/tcp/$1/$2"' _ "$1" "$2" 2>/dev/null
          }
          container_endpoint() {
            local candidate octet octet1 octet2 octet3 octet4 extra
            candidate="$(docker inspect --format \
              '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
              "$CONTAINER_ID")"
            case "$candidate" in
              ''|*[!0123456789.]*)
                echo "could not read a valid database container bridge IPv4 from '$candidate'" >&2
                exit 1 ;;
            esac
            IFS=. read -r octet1 octet2 octet3 octet4 extra <<< "$candidate"
            for octet in "$octet1" "$octet2" "$octet3" "$octet4"; do
              case "$octet" in
                ''|*[!0123456789]*|0[0123456789]*)
                  echo "could not read a valid database container bridge IPv4 from '$candidate'" >&2
                  exit 1 ;;
              esac
              [ "$octet" -le 255 ] || {
                echo "could not read a valid database container bridge IPv4 from '$candidate'" >&2
                exit 1
              }
            done
            [ -z "$extra" ] || {
              echo "could not read a valid database container bridge IPv4 from '$candidate'" >&2
              exit 1
            }
            DB_HOST="$candidate"
            DB_PORT="$DB_CONTAINER_PORT"
          }
          case "$DB_HOST_MODE" in
            auto)
              DB_HOST=127.0.0.1
              DB_PORT="$MAPPED_DB_PORT"
              if ! probe_database_endpoint "$DB_HOST" "$DB_PORT"; then
                container_endpoint
              fi ;;
            loopback)
              DB_HOST=127.0.0.1
              DB_PORT="$MAPPED_DB_PORT" ;;
            container) container_endpoint ;;
            *)
              echo "db-host: '$DB_HOST_MODE' is invalid; use auto, loopback, or container" >&2
              exit 1 ;;
          esac
          if ! probe_database_endpoint "$DB_HOST" "$DB_PORT"; then
            echo "database endpoint $DB_HOST:$DB_PORT is not reachable from the runner" >&2
            exit 1
          fi
          echo "host=$DB_HOST" >> "$GITHUB_OUTPUT"
          echo "port=$DB_PORT" >> "$GITHUB_OUTPUT"
          # The caller marks the endpoint with literal `${DB_HOST}` and
          # `${DB_PORT}` placeholders — braces required. Those exact token
          # replacements ARE the contract — there is
          # no scheme detection, no host parsing and no guessing which colon is a
          # port, so the step can neither splice a port into a value it misreads
          # (an earlier URL rewrite turned `API_URL=https://internal.svc/v1` into
          # `https://internal.svc:49187/v1`) nor reject one whose shape it fails
          # to recognise (`--port=3000` used to fail the whole job).
          for line in ${db_env_lines[@]+"${db_env_lines[@]}"}; do
            key="${line%%=*}"
            value="${line#*=}"
            # $GITHUB_ENV is last-wins and the db-env lines are appended after the
            # step's own exports, so a caller's DB_PORT line would silently replace
            # the real mapped port for every later step. Drop it, loudly.
            if [ "$key" = "DB_PORT" ] || [ "$key" = "DB_HOST" ]; then
              echo "db-env $key: ignored — $key is set by this step to the" \
                   "selected reachable database endpoint" >&2
              continue
            fi
            # A hardcoded 5432 is REJECTED, never quietly rewritten. The port is
            # OS-assigned now, so a literal 5432 aims the caller's suite at
            # whatever else listens on the host's 5432 — on a persistent
            # self-hosted runner that can be a real database a migration would
            # truncate — and deciding which 5432 "meant the database" is exactly
            # the guessing this placeholder contract exists to remove. Checked on
            # what the CALLER wrote, before substitution.
            #
            # Matched only in port position: `:5432` at end or before a
            # non-alphanumeric (so `:54321` and `:5432a` are untouched), a libpq
            # `port=5432` as a whole keyword and not followed by another digit,
            # and a bare 5432 as the value of a *_PORT key.
            #
            # The `port=` keyword needs a boundary on BOTH sides. The trailing
            # one keeps `--port=54321` and `--report=1` untouched; the leading
            # one (value start, or a non-alphanumeric before it) keeps values
            # where "port" is merely spelled inside a longer word — `--report=`,
            # `--export=` — from being read as a port. A dash IS a boundary, so
            # `--port=5432` and `--inspect-port=5432` are still rejected:
            # treating `-` as part of the word would also have to accept
            # `?port=5432`, a real libpq port in a postgres URI query string,
            # and silently aiming the suite at another database is the failure
            # this rejection exists to prevent.
            hardcoded=""
            case "$value" in
              *:5432|*:5432[!0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz]*) hardcoded="a literal :5432 port" ;;
              *[!0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz]port=5432|port=5432|*[!0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz]port=5432[!0123456789]*|port=5432[!0123456789]*)
                hardcoded="a literal port=5432" ;;
            esac
            case "$key" in
              PGPORT|PORT|*_PORT)
                if [ "$value" = "5432" ]; then hardcoded="the literal port 5432"; fi ;;
            esac
            if [ -n "$hardcoded" ]; then
              echo "db-env $key: '$value' hardcodes $hardcoded. This step publishes" \
                   "the database on an OS-assigned host port so two DB-backed jobs" \
                   "can share a runner, so 5432 is someone else's database. Write" \
                   "\${DB_PORT} where the port belongs (e.g." \
                   "DATABASE_URL=postgres://app:pw@127.0.0.1:\${DB_PORT}/app) and it" \
                   "is substituted with the real port." >&2
              exit 1
            fi
            # `${DB_PORT}` is the only placeholder spelling. A brace-less
            # `$DB_PORT` is REJECTED, not substituted: it has no closing
            # boundary, so `$DB_PORTX` would quietly become `49187X` while
            # `${DB_PORT}X` is exact. One spelling that cannot be got subtly
            # wrong is worth more than a second convenience spelling that can.
            # Checked before substitution — `${DB_PORT}` does not contain the
            # literal `$DB_PORT` (the brace sits between), so only the
            # brace-less form reaches here.
            # `$DB_PORT` and `$DB_HOST` are intentionally literal in these patterns.
            # shellcheck disable=SC2016
            case "$value" in
              *'$DB_PORT'*)
                echo "db-env $key: '$value' uses the brace-less \$DB_PORT, which is" \
                     "not a placeholder — it has no end boundary, so \$DB_PORTX would" \
                     "expand to the port with a stray suffix. Write \${DB_PORT}" \
                     "instead (e.g." \
                     "DATABASE_URL=postgres://app:pw@127.0.0.1:\${DB_PORT}/app)." >&2
                exit 1 ;;
            esac
            # shellcheck disable=SC2016
            case "$value" in
              *'$DB_HOST'*)
                echo "db-env $key: '$value' uses the brace-less \$DB_HOST, which is" \
                     "not a placeholder. Write \${DB_HOST} instead (e.g." \
                     "DATABASE_URL=postgres://app:pw@\${DB_HOST}:\${DB_PORT}/app)." >&2
                exit 1 ;;
            esac
            raw_value="$value"
            value="${value//\$\{DB_HOST\}/$DB_HOST}"
            value="${value//\$\{DB_PORT\}/$DB_PORT}"
            # Pass-through must not be SILENT for the one shape that resolves to
            # a database port by itself: a postgres URL with no port defaults to
            # libpq's 5432, so it reaches whatever else listens on the host. The
            # value is still exported byte-identical — no rewrite, no failed job,
            # the caller may well mean an external database — but the step says
            # which key looks like it meant THIS one and never named it. This is
            # the only place a scheme is looked at, and it only prints advice.
            # shellcheck disable=SC2016 # Match the caller's literal placeholder.
            case "$raw_value" in
              *'${DB_PORT}'*) ;;
              *)
              case "$value" in
                *postgres://*|*postgresql://*)
                  echo "note: db-env $key carries no \${DB_PORT} placeholder, so it is" \
                       "not configured with the selected database port and may NOT point" \
                       "at the database this step started ($DB_HOST:$DB_PORT)." >&2 ;;
              esac
              ;;
            esac
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          # Written last so these win the last-wins $GITHUB_ENV merge outright.
          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
          echo "DB_PORT=$DB_PORT" >> "$GITHUB_ENV"

      - name: Start cache service
        id: cache-service
        if: needs.eligibility.outputs.should-run != 'false' && inputs.cache-image != ''
        env:
          CACHE_IMAGE: ${{ inputs.cache-image }}
          CACHE_ENV: ${{ inputs.cache-env }}
          CACHE_HEALTH_CMD: ${{ inputs.cache-health-cmd }}
          DB_SERVICE_ENABLED: ${{ inputs.db-image != '' }}
        run: |
          set -euo pipefail
          # Mirrors the workflow_call `default:` above so the extracted run:
          # block behaves identically when exercised directly (test harness).
          CACHE_HEALTH_CMD="${CACHE_HEALTH_CMD:-redis-cli ping}"
          DB_SERVICE_ENABLED="${DB_SERVICE_ENABLED:-false}"
          container_scope="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB:-}-${RUNNER_NAME:-}-${RUNNER_WORKSPACE:-}"
          CONTAINER_NAME="ci-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(
            printf '%s' "$container_scope" | sha256sum | cut -c1-12)"
          docker_env=()
          cache_env_lines=()
          if [[ "$CACHE_ENV" == *$'\r'* ]]; then
            echo "cache-env: carriage returns are not permitted" >&2
            exit 1
          fi
          while IFS= read -r line; do
            case "${line#"${line%%[![:space:]]*}"}" in
              ''|'#'*) continue ;;
            esac
            case "$line" in
              *=*) ;;
              *) echo "cache-env: '$line' is not a KEY=VALUE pair" >&2; exit 1 ;;
            esac
            key="${line%%=*}"
            if [[ ! "$key" =~ ^[ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_][ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_]*$ ]]; then
              echo "cache-env: '$key' is not a valid environment variable name" >&2
              exit 1
            fi
            key_upper="${key^^}"
            case "$key_upper" in
              DB_HOST|DB_PORT)
                if [ "$DB_SERVICE_ENABLED" = true ]; then
                  echo "cache-env: '$key' is reserved while the database service is enabled" >&2
                  exit 1
                fi ;;
              BASH_ENV|BASH_XTRACEFD|ENV|PS4|SHELLOPTS|BASHOPTS|PATH|\
              NODE_OPTIONS|NODE_PATH|NODE_EXTRA_CA_CERTS|\
              PYTHONPATH|PYTHONHOME|PYTHONSTARTUP|PYTHONUSERBASE|\
              PERL5OPT|PERL5LIB|RUBYOPT|RUBYLIB|JAVA_TOOL_OPTIONS|\
              JDK_JAVA_OPTIONS|_JAVA_OPTIONS|LD_*|DYLD_*|GITHUB_*|RUNNER_*|\
              ACTIONS_*|GH_*|DOCKER_*|\
              GIT_ASKPASS|SSH_ASKPASS|GIT_CONFIG_*|GIT_SSL_CAINFO|\
              GIT_SSL_CAPATH|NPM_CONFIG_*|\
              HTTP_PROXY|HTTPS_PROXY|FTP_PROXY|ALL_PROXY|NO_PROXY|http_proxy|https_proxy|ftp_proxy|\
              all_proxy|no_proxy|SSL_CERT_FILE|SSL_CERT_DIR|CURL_CA_BUNDLE|\
              REQUESTS_CA_BUNDLE|GCONV_PATH)
                echo "cache-env: '$key' cannot override runner execution or workflow state" >&2
                exit 1 ;;
            esac
            cache_env_lines+=("$line")
            docker_env+=(-e "$line")
          done <<< "$CACHE_ENV"
          sweep_cutoff=$(( $(date +%s) - 6 * 60 * 60 ))
          if ! stale_listing="$(docker ps -a --filter label=verjson-ci-cache=1 \
              --format '{{.ID}} {{.CreatedAt}}' 2>&1)"; then
            echo "warning: could not list CI cache containers to sweep: $stale_listing" >&2
            stale_listing=""
          fi
          while read -r stale_id stale_date stale_time stale_zone _; do
            [ -n "$stale_id" ] || continue
            stale_epoch="$(date -d "$stale_date $stale_time $stale_zone" +%s 2>/dev/null || true)"
            case "$stale_epoch" in
              ''|*[!0123456789]*)
                echo "warning: not sweeping $stale_id: unreadable creation time" >&2
                continue ;;
            esac
            [ "$stale_epoch" -lt "$sweep_cutoff" ] || continue
            docker rm -f "$stale_id" >/dev/null 2>&1 \
              || echo "warning: could not remove leaked cache container $stale_id" >&2
          done <<< "$stale_listing"
          run_rc=0
          CONTAINER_ID="$(docker run -d --name "$CONTAINER_NAME" \
            --label verjson-ci-cache=1 -p 127.0.0.1::6379 \
            ${docker_env[@]+"${docker_env[@]}"} "$CACHE_IMAGE")" || run_rc=$?
          [ -z "$CONTAINER_ID" ] || echo "container-id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          [ "$run_rc" -eq 0 ] || exit "$run_rc"
          port_map="$(docker port "$CONTAINER_ID" 6379/tcp)"
          CACHE_PORT="${port_map%%$'\n'*}"
          CACHE_PORT="${CACHE_PORT##*:}"
          case "$CACHE_PORT" in
            ''|*[!0123456789]*)
              echo "could not read the mapped cache port from '$port_map'" >&2
              docker logs "$CONTAINER_ID" >&2 || true
              exit 1 ;;
          esac
          echo "port=$CACHE_PORT" >> "$GITHUB_OUTPUT"
          for line in ${cache_env_lines[@]+"${cache_env_lines[@]}"}; do
            key="${line%%=*}"
            value="${line#*=}"
            if [ "$key" = CACHE_PORT ]; then
              echo "cache-env CACHE_PORT: ignored; the workflow exports Docker's mapped port" >&2
              continue
            fi
            value="${value//\$\{CACHE_PORT\}/$CACHE_PORT}"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          echo "CACHE_PORT=$CACHE_PORT" >> "$GITHUB_ENV"
          ready=false
          # CACHE_HEALTH_CMD is read into an array (whitespace-split) rather
          # than expanded unquoted: unquoted expansion also undergoes
          # pathname/glob expansion, so a command containing `*`/`?`/`[...]`
          # that happened to match a file in the runner's working directory
          # would silently gain extra argv the caller never wrote. Either way
          # the tokens reach `docker exec` as literal argv, never through a
          # shell or `eval`, so they cannot escape to the runner regardless of
          # content (#986).
          IFS=' ' read -r -ra CACHE_HEALTH_CMD_ARGV <<< "$CACHE_HEALTH_CMD"
          for _attempt in {1..30}; do
            # The default `redis-cli ping` keeps today's exact check byte-for-byte
            # (exit status AND a literal PONG reply — some failure paths still
            # exit 0 while printing an error, which is why the default alone
            # isn't just an exit-code check). A caller-supplied cache-health-cmd
            # is treated like any other engine's health command: success is
            # exit code 0.
            if [ "$CACHE_HEALTH_CMD" = "redis-cli ping" ]; then
              if docker exec "$CONTAINER_ID" redis-cli ping 2>/dev/null | grep -qx PONG; then
                ready=true
                break
              fi
            else
              if docker exec "$CONTAINER_ID" "${CACHE_HEALTH_CMD_ARGV[@]}" >/dev/null 2>&1; then
                ready=true
                break
              fi
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$CONTAINER_ID" >&2 || true
            echo "cache image '$CACHE_IMAGE' failed health check '$CACHE_HEALTH_CMD' after 30 attempts" >&2
            exit 1
          fi
      - run: npm ci
        if: needs.eligibility.outputs.should-run != 'false' && !(inputs.secretless-pr || inputs.secretless-trusted-ref)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - name: Provision trusted compatibility sandbox
        if: needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && runner.environment == 'github-hosted'
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
          AZURE_CREDENTIALS: ''
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS:-}" != "Linux" ]; then
            echo '::error::trusted compatibility sandbox requires a Linux GitHub-hosted runner' >&2
            exit 1
          fi
          sandbox_acquirer_source() {
            /usr/bin/cat <<'PY'
          import errno
          import hashlib
          import os
          import posixpath
          import pwd
          import re
          import shutil
          import signal
          import stat
          import subprocess
          import sys

          ACQUISITION_PHASES = (
              "package-acquisition-key",
              "package-acquisition-apt-update",
              "package-acquisition-plan",
              "package-acquisition-install",
              "package-acquisition-status",
              "package-acquisition-metadata",
              "package-acquisition-download",
              "package-acquisition-archive",
              "package-acquisition-member",
              "package-acquisition-staging",
          )
          ACQUISITION_DIAGNOSTICS = {
              phase: (
                  "::error::trusted compatibility sandbox filesystem boundary unsafe "
                  f"phase={phase}\n"
              ).encode("ascii")
              for phase in ACQUISITION_PHASES
          }
          UNKNOWN_DIAGNOSTIC = (
              b"::error::trusted compatibility sandbox filesystem boundary unsafe "
              b"phase=unknown\n"
          )
          CURRENT_PHASE = ACQUISITION_PHASES[0]
          SESSION_ROOT = "/var/lib/verjson-compatibility-apt"
          STAGE_ROOT = "/run/verjson-compatibility-sandbox"
          PROFILE_PATH = f"{STAGE_ROOT}/bwrap-userns-restrict"
          PACKAGE_MEMBER = "usr/share/apparmor/extra-profiles/bwrap-userns-restrict"
          SAFE_KEY = "/etc/apt/trusted.gpg.d/ubuntu-keyring-2018-archive.gpg"
          SAFE_ENV = {
              "PATH": "/usr/sbin:/usr/bin:/sbin:/bin",
              "HOME": "/nonexistent",
              "DEBIAN_FRONTEND": "noninteractive",
              "LC_ALL": "C",
              "APT_CONFIG": "/dev/null",
          }
          OWNED_ROOTS = {}


          class AcquisitionError(RuntimeError):
              pass


          def record_owned_root(path):
              metadata = os.lstat(path)
              validate_directory(path)
              OWNED_ROOTS[path] = (metadata.st_dev, metadata.st_ino)


          def cleanup_owned_root(path):
              identity = OWNED_ROOTS.get(path)
              if identity is None:
                  return
              try:
                  metadata = os.lstat(path)
              except FileNotFoundError:
                  OWNED_ROOTS.pop(path, None)
                  return
              if (
                  not stat.S_ISDIR(metadata.st_mode)
                  or metadata.st_uid != 0
                  or metadata.st_gid != 0
                  or metadata.st_mode & 0o022
                  or (metadata.st_dev, metadata.st_ino) != identity
              ):
                  raise AcquisitionError
              shutil.rmtree(path)
              try:
                  os.lstat(path)
              except FileNotFoundError:
                  OWNED_ROOTS.pop(path, None)
              else:
                  raise AcquisitionError


          def interrupted(_signum, _frame):
              raise AcquisitionError


          def require_absent(path):
              try:
                  os.lstat(path)
              except FileNotFoundError:
                  return
              raise AcquisitionError


          def capability_present(descriptor):
              try:
                  os.getxattr(descriptor, "security.capability")
              except OSError as error:
                  absent = {errno.ENODATA}
                  if hasattr(errno, "ENOATTR"):
                      absent.add(errno.ENOATTR)
                  if error.errno in absent:
                      return False
                  raise AcquisitionError from None
              return True


          def validate_directory(path, *, uid=0, gid=0, mask=0o022):
              metadata = os.lstat(path)
              if (
                  not stat.S_ISDIR(metadata.st_mode)
                  or metadata.st_uid != uid
                  or metadata.st_gid != gid
                  or metadata.st_mode & mask
                  or metadata.st_mode & (stat.S_ISUID | stat.S_ISGID)
              ):
                  raise AcquisitionError
              return metadata


          def open_regular(path, *, executable, maximum):
              flags = os.O_RDONLY | os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags)
              try:
                  before = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(before.st_mode)
                      or before.st_uid != 0
                      or before.st_gid != 0
                      or before.st_nlink != 1
                      or before.st_mode & 0o022
                      or before.st_mode & (stat.S_ISUID | stat.S_ISGID)
                      or executable != bool(before.st_mode & 0o111)
                      or capability_present(descriptor)
                      or before.st_size <= 0
                      or before.st_size > maximum
                  ):
                      raise AcquisitionError
                  content = bytearray()
                  while len(content) <= maximum:
                      chunk = os.read(descriptor, min(1024 * 1024, maximum + 1 - len(content)))
                      if not chunk:
                          break
                      content.extend(chunk)
                  after = os.fstat(descriptor)
                  identity = (
                      before.st_dev,
                      before.st_ino,
                      before.st_mode,
                      before.st_uid,
                      before.st_gid,
                      before.st_nlink,
                      before.st_size,
                      before.st_mtime_ns,
                      before.st_ctime_ns,
                  )
                  if identity != (
                      after.st_dev,
                      after.st_ino,
                      after.st_mode,
                      after.st_uid,
                      after.st_gid,
                      after.st_nlink,
                      after.st_size,
                      after.st_mtime_ns,
                      after.st_ctime_ns,
                  ) or len(content) != before.st_size:
                      raise AcquisitionError
                  return bytes(content), identity
              finally:
                  os.close(descriptor)


          def validate_regular_path(path, *, executable, maximum, allow_empty=False):
              flags = os.O_RDONLY | os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags)
              try:
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != 0
                      or metadata.st_gid != 0
                      or metadata.st_nlink != 1
                      or metadata.st_mode & 0o022
                      or metadata.st_mode & (stat.S_ISUID | stat.S_ISGID)
                      or executable != bool(metadata.st_mode & 0o111)
                      or capability_present(descriptor)
                      or (not allow_empty and metadata.st_size <= 0)
                      or metadata.st_size > maximum
                  ):
                      raise AcquisitionError
                  return (
                      metadata.st_dev, metadata.st_ino, metadata.st_mode,
                      metadata.st_uid, metadata.st_gid, metadata.st_nlink,
                      metadata.st_size, metadata.st_mtime_ns, metadata.st_ctime_ns,
                  )
              finally:
                  os.close(descriptor)


          def run(args, *, capture=False, timeout=180):
              return subprocess.run(
                  tuple(args),
                  check=False,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE if capture else subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  cwd="/",
                  env=SAFE_ENV,
                  timeout=timeout,
                  close_fds=True,
                  start_new_session=True,
              )


          def exact_output(args, maximum=65536):
              result = run(args, capture=True)
              if result.returncode != 0 or len(result.stdout) > maximum:
                  raise AcquisitionError
              return result.stdout


          def write_root_file(path, content, mode):
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags, mode)
              try:
                  view = memoryview(content)
                  while view:
                      written = os.write(descriptor, view)
                      if written <= 0:
                          raise AcquisitionError
                      view = view[written:]
                  os.fsync(descriptor)
                  os.fchown(descriptor, 0, 0)
                  os.fchmod(descriptor, mode)
                  metadata = os.fstat(descriptor)
                  if (
                      metadata.st_uid != 0
                      or metadata.st_gid != 0
                      or metadata.st_nlink != 1
                      or metadata.st_mode & 0o022
                      or metadata.st_mode & (stat.S_ISUID | stat.S_ISGID)
                      or capability_present(descriptor)
                  ):
                      raise AcquisitionError
              finally:
                  os.close(descriptor)


          def apt_options(cache_root, lists_root, source_parts):
              return (
                  "-o", f"Dir::Etc::sourcelist=/dev/null",
                  "-o", f"Dir::Etc::sourceparts={source_parts}",
                  "-o", "Dir::Etc::main=/dev/null",
                  "-o", f"Dir::Etc::parts={SESSION_ROOT}/empty-config",
                  "-o", f"Dir::Etc::trusted=/dev/null",
                  "-o", f"Dir::Etc::trustedparts={SESSION_ROOT}/empty-trusted",
                  "-o", "Dir::Etc::netrc=/dev/null",
                  "-o", f"Dir::Etc::netrcparts={SESSION_ROOT}/empty-auth",
                  "-o", "Dir::Etc::preferences=/dev/null",
                  "-o", f"Dir::Etc::preferencesparts={SESSION_ROOT}/empty-preferences",
                  "-o", f"Dir::State::lists={lists_root}",
                  "-o", "Dir::State::status=/var/lib/dpkg/status",
                  "-o", f"Dir::Cache={cache_root}",
                  "-o", f"Dir::Cache::archives={cache_root}/archives",
                  "-o", "APT::Architecture=amd64",
                  "-o", "APT::Get::AllowUnauthenticated=false",
                  "-o", "Acquire::AllowInsecureRepositories=false",
                  "-o", "Acquire::AllowDowngradeToInsecureRepositories=false",
                  "-o", "Acquire::AllowWeakRepositories=false",
                  "-o", "Acquire::Check-Valid-Until=true",
                  "-o", "Acquire::Check-Date=true",
                  "-o", "Acquire::https::Verify-Peer=true",
                  "-o", "Acquire::https::Verify-Host=true",
              )


          def create_apt_partial(path, apt_uid):
              os.mkdir(path, 0o700)
              os.chown(path, apt_uid, 0)
              validate_directory(path, uid=apt_uid, gid=0, mask=0o077)


          def validate_profile(profile_bytes):
              profile = profile_bytes.decode("utf-8", "strict")
              lines = profile.splitlines()
              if "abi <abi/4.0>," not in {line.strip() for line in lines}:
                  raise AcquisitionError
              if re.search(r"flags=\([^)]*\bunconfined\b", profile) is not None:
                  raise AcquisitionError

              def block(pattern):
                  starts = [
                      index for index, line in enumerate(lines)
                      if re.fullmatch(pattern, line.strip())
                  ]
                  if len(starts) != 1:
                      raise AcquisitionError
                  for end in range(starts[0] + 1, len(lines)):
                      if lines[end].strip() == "}":
                          return [
                              rule for line in lines[starts[0] + 1:end]
                              if (rule := line.split("#", 1)[0].strip())
                          ]
                  raise AcquisitionError

              parent = block(r"profile bwrap /usr/bin/bwrap flags=\([^)]*\) \{")
              child = block(r"profile unpriv_bwrap flags=\([^)]*\) \{")
              if "allow px /** -> bwrap//&unpriv_bwrap," not in parent:
                  raise AcquisitionError
              if "allow pix /** -> &unpriv_bwrap," not in child:
                  raise AcquisitionError
              capabilities = [
                  rule for rule in child
                  if re.search(r"(?:^|\s)capability(?:\s|,|$)", rule)
              ]
              if capabilities != ["audit deny capability,"]:
                  raise AcquisitionError


          def parse_packages(list_paths, apt_helper, package, version):
              matches = []
              for path in list_paths:
                  process = subprocess.Popen(
                      (apt_helper, "cat-file", path),
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      cwd="/",
                      env=SAFE_ENV,
                      close_fds=True,
                      start_new_session=True,
                  )
                  fields = {}
                  total = 0
                  try:
                      for line in process.stdout:
                          total += len(line)
                          if total > 512 * 1024 * 1024 or len(line) > 65536:
                              raise AcquisitionError
                          if line in (b"\n", b"\r\n"):
                              if (
                                  fields.get(b"Package") == package.encode()
                                  and fields.get(b"Version") == version.encode()
                                  and fields.get(b"Architecture") == b"all"
                              ):
                                  required = (b"Size", b"SHA256", b"Filename")
                                  if any(name not in fields for name in required):
                                      raise AcquisitionError
                                  matches.append(tuple(fields[name] for name in required))
                              fields = {}
                              continue
                          if line[:1] in (b" ", b"\t"):
                              continue
                          name, separator, value = line.rstrip(b"\r\n").partition(b": ")
                          if separator and name in (
                              b"Package", b"Version", b"Architecture",
                              b"Size", b"SHA256", b"Filename",
                          ):
                              if name in fields:
                                  raise AcquisitionError
                              fields[name] = value
                  except BaseException:
                      process.kill()
                      process.wait(timeout=10)
                      raise
                  finally:
                      process.stdout.close()
                  if process.wait(timeout=60) != 0:
                      raise AcquisitionError
              if not matches or len(set(matches)) != 1:
                  raise AcquisitionError
              size_raw, digest_raw, filename_raw = matches[0]
              if (
                  re.fullmatch(rb"[1-9][0-9]{0,8}", size_raw) is None
                  or re.fullmatch(rb"[0-9a-f]{64}", digest_raw) is None
                  or not filename_raw.startswith(b"pool/")
                  or b".." in filename_raw.split(b"/")
              ):
                  raise AcquisitionError
              size = int(size_raw)
              if size > 32 * 1024 * 1024:
                  raise AcquisitionError
              try:
                  filename = filename_raw.decode("ascii", "strict")
              except UnicodeDecodeError:
                  raise AcquisitionError from None
              if (
                  filename.startswith("/")
                  or "\\" in filename
                  or "%" in filename
                  or "//" in filename
                  or posixpath.normpath(filename) != filename
                  or re.fullmatch(
                      r"pool/(?:[A-Za-z0-9][A-Za-z0-9+.-]*/)+"
                      r"[A-Za-z0-9][A-Za-z0-9+._~-]*_all\.deb",
                      filename,
                  ) is None
              ):
                  raise AcquisitionError
              archive_name = posixpath.basename(filename)
              return size, digest_raw.decode("ascii"), filename, archive_name


          def tar_command(archive_path, arguments, *, maximum):
              producer = subprocess.Popen(
                  ("/usr/bin/dpkg-deb", "--fsys-tarfile", archive_path),
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  cwd="/",
                  env=SAFE_ENV,
                  close_fds=True,
                  start_new_session=True,
              )
              try:
                  consumer = subprocess.run(
                      ("/usr/bin/tar", *arguments, "--file=-"),
                      check=False,
                      stdin=producer.stdout,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      cwd="/",
                      env=SAFE_ENV,
                      timeout=60,
                      close_fds=True,
                      start_new_session=True,
                  )
              except BaseException:
                  producer.kill()
                  producer.wait(timeout=10)
                  raise
              finally:
                  producer.stdout.close()
              producer_status = producer.wait(timeout=60)
              if (
                  producer_status != 0
                  or consumer.returncode != 0
                  or len(consumer.stdout) > maximum
              ):
                  raise AcquisitionError
              return consumer.stdout


          def validate_install_plan(plan):
              try:
                  plan_lines = plan.decode("utf-8", "strict").splitlines()
              except UnicodeDecodeError:
                  raise AcquisitionError from None
              if (
                  any(line.startswith(("Remv ", "Purg ")) for line in plan_lines)
                  or sum(line.startswith("Inst ") for line in plan_lines) > 32
              ):
                  raise AcquisitionError


          def require_success(result):
              if result.returncode != 0:
                  raise AcquisitionError


          def select_archive(archive_entries, expected_archive_name):
              archives = [
                  entry for entry in archive_entries
                  if entry.name == expected_archive_name
              ]
              locks = [entry for entry in archive_entries if entry.name == "lock"]
              unexpected = [
                  entry.name for entry in archive_entries
                  if entry.name not in ("lock", "partial", expected_archive_name)
              ]
              if len(archives) != 1 or len(locks) > 1 or unexpected:
                  raise AcquisitionError
              return archives[0], locks


          def extract_profile(archive_path):
              target = f"./{PACKAGE_MEMBER}"
              listing = tar_command(archive_path, ("--list",), maximum=1024 * 1024)
              names = listing.decode("utf-8", "strict").splitlines()
              aliases = []
              for name in names:
                  if name.startswith("/") or posixpath.normpath(name).startswith("../"):
                      raise AcquisitionError
                  if posixpath.normpath(name) == PACKAGE_MEMBER:
                      aliases.append(name)
              if aliases != [target]:
                  raise AcquisitionError
              verbose = tar_command(
                  archive_path,
                  ("--list", "--verbose", "--numeric-owner", "--xattrs"),
                  maximum=4 * 1024 * 1024,
              )
              member_lines = [
                  line for line in verbose.splitlines()
                  if line.endswith(b" " + target.encode())
              ]
              if len(member_lines) != 1:
                  raise AcquisitionError
              header = member_lines[0].split(None, 3)
              if (
                  len(header) != 4
                  or header[0] != b"-rw-r--r--"
                  or header[1] != b"0/0"
                  or re.fullmatch(rb"[1-9][0-9]{0,6}", header[2]) is None
              ):
                  raise AcquisitionError
              declared_profile_size = int(header[2])
              profile_bytes = tar_command(
                  archive_path,
                  ("--extract", "--to-stdout", "--no-wildcards", target),
                  maximum=1024 * 1024,
              )
              if not profile_bytes or len(profile_bytes) != declared_profile_size:
                  raise AcquisitionError
              validate_profile(profile_bytes)
              return profile_bytes


          def stage_profile(profile_bytes, archive_identity):
              temporary = f"{STAGE_ROOT}/.bwrap-userns-restrict.new"
              write_root_file(temporary, profile_bytes, 0o400)
              os.rename(temporary, PROFILE_PATH)
              stage_descriptor = os.open(
                  STAGE_ROOT,
                  os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC | os.O_NOFOLLOW,
              )
              try:
                  os.fsync(stage_descriptor)
              finally:
                  os.close(stage_descriptor)
              os.chmod(STAGE_ROOT, 0o500)
              validate_directory(STAGE_ROOT)
              staged_bytes, staged_identity = open_regular(
                  PROFILE_PATH,
                  executable=False,
                  maximum=1024 * 1024,
              )
              if (
                  staged_bytes != profile_bytes
                  or staged_identity[5] != 1
                  or staged_identity[:2] == archive_identity[:2]
                  or os.listdir(STAGE_ROOT) != ["bwrap-userns-restrict"]
              ):
                  raise AcquisitionError


          def acquire():
              global CURRENT_PHASE
              CURRENT_PHASE = ACQUISITION_PHASES[0]
              if os.geteuid() != 0 or sys.version_info < (3, 9):
                  raise AcquisitionError
              for directory in (
                  "/", "/etc", "/etc/apt", "/etc/apt/trusted.gpg.d",
                  "/usr", "/usr/bin", "/usr/lib", "/usr/lib/apt",
                  "/var", "/var/lib", "/var/lib/dpkg", "/run",
              ):
                  validate_directory(directory)
              for executable in (
                  "/usr/bin/apt-get", "/usr/bin/dpkg", "/usr/bin/dpkg-deb",
                  "/usr/bin/dpkg-query", "/usr/bin/tar", "/usr/lib/apt/apt-helper",
              ):
                  open_regular(executable, executable=True, maximum=64 * 1024 * 1024)
              key_bytes, _key_identity = open_regular(
                  SAFE_KEY,
                  executable=False,
                  maximum=1024 * 1024,
              )
              if len(key_bytes) < 1024:
                  raise AcquisitionError
              status_bytes, status_identity = open_regular(
                  "/var/lib/dpkg/status",
                  executable=False,
                  maximum=64 * 1024 * 1024,
              )
              if len(status_bytes) < 1024:
                  raise AcquisitionError
              ownership = exact_output(("/usr/bin/dpkg-query", "-S", SAFE_KEY))
              if ownership != f"ubuntu-keyring: {SAFE_KEY}\n".encode("ascii"):
                  raise AcquisitionError
              architecture = exact_output(("/usr/bin/dpkg", "--print-architecture"))
              if architecture != b"amd64\n":
                  raise AcquisitionError
              require_absent(SESSION_ROOT)
              require_absent(STAGE_ROOT)
              os.mkdir(SESSION_ROOT, 0o755)
              record_owned_root(SESSION_ROOT)
              os.mkdir(STAGE_ROOT, 0o700)
              record_owned_root(STAGE_ROOT)
              source_parts = f"{SESSION_ROOT}/sources.list.d"
              empty_trusted = f"{SESSION_ROOT}/empty-trusted"
              empty_config = f"{SESSION_ROOT}/empty-config"
              empty_auth = f"{SESSION_ROOT}/empty-auth"
              empty_preferences = f"{SESSION_ROOT}/empty-preferences"
              lists_root = f"{SESSION_ROOT}/lists"
              install_cache = f"{SESSION_ROOT}/install-cache"
              download_cache = f"{SESSION_ROOT}/download-cache"
              for path in (
                  source_parts, empty_trusted, empty_config, empty_auth,
                  empty_preferences, lists_root,
                  install_cache, download_cache,
              ):
                  os.mkdir(path, 0o755)
              apt_uid = pwd.getpwnam("_apt").pw_uid
              if apt_uid in (0, os.getuid()):
                  raise AcquisitionError
              create_apt_partial(f"{lists_root}/partial", apt_uid)
              for cache in (install_cache, download_cache):
                  archives = f"{cache}/archives"
                  os.mkdir(archives, 0o755)
                  create_apt_partial(f"{archives}/partial", apt_uid)
              source = (
                  "Types: deb\n"
                  "URIs: https://archive.ubuntu.com/ubuntu\n"
                  "Suites: noble noble-updates\n"
                  "Components: main universe\n"
                  "Architectures: amd64\n"
                  f"Signed-By: {SAFE_KEY}\n\n"
                  "Types: deb\n"
                  "URIs: https://security.ubuntu.com/ubuntu\n"
                  "Suites: noble-security\n"
                  "Components: main universe\n"
                  "Architectures: amd64\n"
                  f"Signed-By: {SAFE_KEY}\n"
              ).encode("ascii")
              source_path = f"{source_parts}/ubuntu.sources"
              write_root_file(source_path, source, 0o400)
              for directory in (
                  SESSION_ROOT, STAGE_ROOT, source_parts, empty_trusted, empty_config,
                  empty_auth, empty_preferences,
                  lists_root, install_cache, f"{install_cache}/archives",
                  download_cache, f"{download_cache}/archives",
              ):
                  validate_directory(directory)

              CURRENT_PHASE = "package-acquisition-apt-update"
              update_options = apt_options(install_cache, lists_root, source_parts)
              require_success(run(
                  ("/usr/bin/apt-get", *update_options, "update"),
                  timeout=300,
              ))
              validate_directory(f"{lists_root}/partial", uid=apt_uid, gid=0, mask=0o077)
              CURRENT_PHASE = "package-acquisition-plan"
              if status_identity != open_regular(
                  "/var/lib/dpkg/status",
                  executable=False,
                  maximum=64 * 1024 * 1024,
              )[1]:
                  raise AcquisitionError
              install_args = (
                  "/usr/bin/apt-get", *update_options,
                  "--no-install-recommends", "--no-remove", "--yes",
                  "install", "apparmor", "apparmor-profiles", "bubblewrap",
              )
              plan = exact_output((
                  "/usr/bin/apt-get", *update_options,
                  "--simulate", "--no-install-recommends", "--no-remove",
                  "install", "apparmor", "apparmor-profiles", "bubblewrap",
              ), maximum=1024 * 1024)
              validate_install_plan(plan)
              CURRENT_PHASE = "package-acquisition-install"
