                  except (KeyError, tarfile.TarError, json.JSONDecodeError) as error:
                      raise SystemExit(f"compatibility artifact package manifest is invalid: {error}")
                  if (not isinstance(package_manifest, dict)
                          or package_manifest.get("name") != lane["package"]
                          or package_manifest.get("version") != lane["version"]):
                      raise SystemExit("compatibility artifact does not match resolved package provenance")
