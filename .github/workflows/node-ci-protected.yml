              exit 1
            }
            mkdir -p "$(dirname "$auxiliary_target")"
            cp -a "$auxiliary_source" "$auxiliary_target"
          fi
          {
            for name in GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN \
              AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN \
              GOOGLE_APPLICATION_CREDENTIALS AZURE_CREDENTIALS \
              ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL; do
