          BUILD_ARTIFACT_RUNTIME_INPUT_SECRETLESS_REBUILD_PACKAGES: ${{ toJSON(inputs.secretless-rebuild-packages) }}
          BUILD_ARTIFACT_RUNTIME_INPUT_SECRETLESS_SKIP_INSTALL_SCRIPTS: ${{ toJSON(inputs.secretless-skip-install-scripts) }}
