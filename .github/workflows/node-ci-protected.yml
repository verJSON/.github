          COMPATIBILITY_RANGES="$COMPATIBILITY_RANGES" \
          EXPECTED_COMPATIBILITY_PROVENANCE_SHA256="$EXPECTED_COMPATIBILITY_PROVENANCE_SHA256" \
          NESTED_PATHS_FILE="$NESTED_PATHS_FILE" \
          SECRETLESS_CACHE_DIR="$SECRETLESS_CACHE_DIR" PACKAGE_MANAGER="$PACKAGE_MANAGER" python3 -I - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import shutil
          import tarfile
          from pathlib import Path
          from urllib.parse import urlparse

          cache = Path(os.environ["SECRETLESS_CACHE_DIR"])
          package_manager = os.environ.get("PACKAGE_MANAGER", "npm")
          expected_content = {}
          if package_manager == "npm":
              lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
              resolutions = [(package.get("resolved", ""), package.get("integrity"))
                             for package in lock.get("packages", {}).values()]
          else:
              import yaml
              lock = yaml.safe_load(Path("pnpm-lock.yaml").read_text(encoding="utf-8"))
              resolutions = [(package.get("resolution", {}).get("tarball", ""),
                              package.get("resolution", {}).get("integrity"))
                             for package in lock.get("packages", {}).values()]
          # Nested locks were verified against their own approvals during
          # acquisition, so their blobs belong to the same exact transfer set.
          nested_paths_file = Path(os.environ.get("NESTED_PATHS_FILE", ""))
          if package_manager == "npm" and nested_paths_file.is_file():
              for nested_path in nested_paths_file.read_text(encoding="utf-8").splitlines():
                  if not nested_path:
                      continue
                  nested_lock = json.loads(
                      (Path(nested_path) / "package-lock.json").read_text(encoding="utf-8"))
                  resolutions.extend(
                      (package.get("resolved", ""), package.get("integrity"))
                      for package in nested_lock.get("packages", {}).values())
