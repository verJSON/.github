        run: |
          set -euo pipefail
          [[ "$JOB_WORKFLOW_SHA" =~ ^[0123456789abcdef]{40}$ ]]
          [[ -f "$RUNNER_TEMP/ci_build_artifacts.py" && ! -L "$RUNNER_TEMP/ci_build_artifacts.py" ]]
          curl -fsSL "https://raw.githubusercontent.com/Verjson/.github/${JOB_WORKFLOW_SHA}/.github/actions/node-ci-script-plan/script_plan.py" -o "$RUNNER_TEMP/script_plan.py"
