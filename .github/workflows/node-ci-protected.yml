          if [ "$PACKAGE_MANAGER" = npm ]; then
            if [ "$RESTORE_PERSISTED_PUBLIC_CACHE" = true ] && [ -d "$PERSISTED_PUBLIC_CACHE_DIR" ]; then
              python3 -I - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import stat
          from pathlib import Path
          from urllib.parse import urlsplit

          persisted = Path(os.environ["PERSISTED_PUBLIC_CACHE_DIR"])
          destination = Path(os.environ["SECRETLESS_CACHE_DIR"])
          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          packages = lock.get("packages")
          if lock.get("lockfileVersion") not in (2, 3) or not isinstance(packages, dict):
