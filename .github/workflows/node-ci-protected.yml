              try:
                  metadata = package_parent.lstat()
              except FileNotFoundError:
                  raise SystemExit("installed compatibility package parent is absent")
              if (stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode)
