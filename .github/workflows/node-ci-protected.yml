                  or metadata.st_gid != 0
                  or metadata.st_mode & 0o022
                  or metadata.st_mode & (stat.S_ISUID | stat.S_ISGID)
                  or capability_present
              ):
                  raise VerificationError("unsafe regular file metadata")
              if executable and not metadata.st_mode & 0o111:
                  raise VerificationError("unsafe executable mode")
              if not executable and metadata.st_mode & 0o111:
                  raise VerificationError("unsafe data file mode")


          def validate_directory(metadata):
              if (
                  not stat.S_ISDIR(metadata.st_mode)
                  or metadata.st_uid != 0
                  or metadata.st_gid != 0
                  or metadata.st_mode & 0o022
                  or metadata.st_mode & (stat.S_ISUID | stat.S_ISGID)
              ):
                  raise VerificationError("unsafe directory metadata")


          def has_security_capability(file_descriptor):
              try:
                  os.getxattr(file_descriptor, "security.capability")
              except OSError as error:
                  absent = {errno.ENODATA}
                  if hasattr(errno, "ENOATTR"):
                      absent.add(errno.ENOATTR)
                  if error.errno in absent:
                      return False
                  raise VerificationError("unreadable security capability") from None
              return True


          def fingerprint(metadata):
              return (
                  metadata.st_dev,
                  metadata.st_ino,
                  metadata.st_mode,
                  metadata.st_uid,
                  metadata.st_gid,
                  metadata.st_size,
                  metadata.st_mtime_ns,
                  metadata.st_ctime_ns,
              )


          def open_verified_file(path, *, executable):
              flags = os.O_RDONLY | os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              try:
                  descriptor = os.open(path, flags)
                  before = os.fstat(descriptor)
                  validate_metadata(
                      before,
                      executable=executable,
                      capability_present=has_security_capability(descriptor),
                  )
                  chunks = []
                  while True:
                      chunk = os.read(descriptor, 1024 * 1024)
                      if not chunk:
                          break
                      chunks.append(chunk)
                  after = os.fstat(descriptor)
              except (OSError, VerificationError):
                  if "descriptor" in locals():
                      os.close(descriptor)
                  raise VerificationError("unsafe verified file") from None
              if fingerprint(before) != fingerprint(after):
                  os.close(descriptor)
                  raise VerificationError("verified file changed while read")
              return descriptor, b"".join(chunks), fingerprint(after)


          def read_verified_file(path, *, executable):
              descriptor, content, metadata_fingerprint = open_verified_file(
                  path,
                  executable=executable,
              )
              os.close(descriptor)
              return content, metadata_fingerprint


          def profile_block(profile_lines, header_pattern):
              starts = [
                  index
                  for index, line in enumerate(profile_lines)
                  if re.fullmatch(header_pattern, line.strip())
              ]
              if len(starts) != 1:
                  raise VerificationError("profile block missing or repeated")
              start = starts[0]
              for end in range(start + 1, len(profile_lines)):
                  if profile_lines[end].strip() == "}":
                      return [
                          rule
                          for line in profile_lines[start + 1:end]
                          if (rule := line.split("#", 1)[0].strip())
                      ]
              raise VerificationError("profile block unterminated")


          def validate_profile_text(profile):
              lines = profile.splitlines()
              if "abi <abi/4.0>," not in {line.strip() for line in lines}:
                  raise VerificationError("AppArmor ABI missing")
              if re.search(r"flags=\([^)]*\bunconfined\b", profile) is not None:
                  raise VerificationError("unconfined profile forbidden")
              parent = profile_block(
                  lines,
                  r"profile bwrap /usr/bin/bwrap flags=\([^)]*\) \{",
              )
              child = profile_block(
                  lines,
                  r"profile unpriv_bwrap flags=\([^)]*\) \{",
              )
              if "allow px /** -> bwrap//&unpriv_bwrap," not in parent:
                  raise VerificationError("parent transition missing")
              if "allow pix /** -> &unpriv_bwrap," not in child:
                  raise VerificationError("recursive child transition missing")
              capability_rules = [
                  line
                  for line in child
                  if re.search(r"(?:^|\s)capability(?:\s|,|$)", line)
              ]
              if capability_rules != ["audit deny capability,"]:
                  raise VerificationError("child capability denial missing")


          def checked_directory(path):
              try:
                  metadata = os.lstat(path)
              except OSError:
                  raise VerificationError("required directory unavailable") from None
              validate_directory(metadata)
              return fingerprint(metadata)


          def reject_walk_error(_error):
              raise VerificationError("unsafe tunables traversal")


          def verify_include_tree(include_root, phase):
              receipts = []
              try:
                  for root, directories, files in os.walk(
                      include_root,
                      topdown=True,
                      onerror=reject_walk_error,
                      followlinks=False,
                  ):
                      directories.sort()
                      files.sort()
                      root_metadata = os.lstat(root)
                      validate_directory(root_metadata)
                      receipts.append((root, fingerprint(root_metadata)))
                      for name in directories:
                          path = os.path.join(root, name)
                          metadata = os.lstat(path)
                          validate_directory(metadata)
                          receipts.append((path, fingerprint(metadata)))
                      for name in files:
                          path = os.path.join(root, name)
                          content, metadata_fingerprint = read_verified_file(
                              path,
                              executable=False,
                          )
                          receipts.append((
                              path,
                              metadata_fingerprint,
                              hashlib.sha256(content).hexdigest(),
                          ))
              except (OSError, VerificationError):
                  raise VerificationError(phase) from None
              return receipts


          def verify_system(profile_path, *, bind_parser=False):
              receipts = []
              try:
                  for directory in (
                      "/",
                      "/usr",
                      "/usr/bin",
                      "/usr/sbin",
                      "/run",
                      "/run/verjson-compatibility-sandbox",
                      "/etc",
                      "/etc/apparmor.d",
                      "/etc/apparmor.d/local",
                      "/etc/apparmor.d/abi",
                      "/etc/apparmor.d/tunables",
                  ):
                      receipts.append((directory, checked_directory(directory)))
              except (OSError, VerificationError):
                  raise VerificationError("ancestor-directories") from None

              try:
                  sbin_metadata = os.lstat("/sbin")
                  sbin_target = os.readlink("/sbin")
                  if (
                      not stat.S_ISLNK(sbin_metadata.st_mode)
                      or sbin_metadata.st_uid != 0
                      or sbin_metadata.st_gid != 0
                      or sbin_target not in ("usr/sbin", "/usr/sbin")
                  ):
                      raise VerificationError("unsafe usrmerge parser path")
                  receipts.append(("/sbin", fingerprint(sbin_metadata), sbin_target))
              except (OSError, VerificationError):
                  raise VerificationError("usrmerge-parser-link") from None

              try:
                  for override in (
                      "/etc/apparmor.d/local/bwrap-userns-restrict",
                      "/etc/apparmor.d/local/unpriv_bwrap",
                  ):
                      try:
                          os.lstat(override)
                      except FileNotFoundError:
                          receipts.append((override, "absent"))
                      except OSError:
                          raise VerificationError("unsafe local override state") from None
                      else:
                          raise VerificationError("local override forbidden")
              except (OSError, VerificationError):
                  raise VerificationError("local-overrides") from None

              receipts.extend(verify_include_tree("/etc/apparmor.d/abi", "abi-tree"))
              receipts.extend(verify_include_tree("/etc/apparmor.d/tunables", "tunables-tree"))

              try:
                  bwrap, bwrap_fingerprint = read_verified_file(
                      "/usr/bin/bwrap",
                      executable=True,
                  )
              except (OSError, VerificationError):
                  raise VerificationError("bwrap-binary") from None
              try:
                  parser_descriptor, parser, parser_fingerprint = open_verified_file(
                      "/sbin/apparmor_parser",
                      executable=True,
                  )
              except (OSError, VerificationError):
                  raise VerificationError("parser-binary") from None
              try:
                  profile_descriptor, profile_bytes, profile_fingerprint = open_verified_file(
                      profile_path,
                      executable=False,
                  )
              except (OSError, VerificationError):
                  raise VerificationError("package-profile") from None
              try:
                  profile = profile_bytes.decode("utf-8")
                  validate_profile_text(profile)
              except (UnicodeError, VerificationError):
                  raise VerificationError("profile-semantics") from None
              try:
                  receipts.extend((
                      ("/usr/bin/bwrap", bwrap_fingerprint, hashlib.sha256(bwrap).hexdigest()),
                      ("/sbin/apparmor_parser", parser_fingerprint, hashlib.sha256(parser).hexdigest()),
                      (profile_path, profile_fingerprint, hashlib.sha256(profile_bytes).hexdigest()),
                  ))
                  receipt = hashlib.sha256(repr(receipts).encode("utf-8")).hexdigest()
              except (OSError, VerificationError):
                  raise VerificationError("receipt-recomputation") from None
              if bind_parser:
                  return receipt, parser_descriptor, profile_descriptor
              os.close(parser_descriptor)
              os.close(profile_descriptor)
              return receipt


          mode = sys.argv[1] if len(sys.argv) == 3 else ""
          if mode not in ("verify", "load") \
                  or sys.argv[2] != "/run/verjson-compatibility-sandbox/bwrap-userns-restrict":
              raise SystemExit("::error::trusted compatibility sandbox verifier invocation is unsafe")


          def run_verifier():
              if mode == "verify":
                  receipt = verify_system(sys.argv[2])
                  path = "/usr/bin/bwrap"
                  try:
                      version = subprocess.run(
                          [path, "--version"],
                          check=False,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.DEVNULL,
                          text=True,
                          timeout=5,
                          env={"PATH": "/usr/sbin:/usr/bin:/sbin:/bin"},
                      )
                  except (OSError, subprocess.SubprocessError):
                      raise VerificationError("bwrap-binary") from None
                  match = re.fullmatch(r"bubblewrap (\d+)\.(\d+)\.(\d+)\n?", version.stdout)
                  if version.returncode != 0 or match is None:
                      raise VerificationError("bwrap-binary")
                  if tuple(map(int, match.groups())) < (0, 9, 0):
                      raise VerificationError("bwrap-binary")
                  print(receipt)
                  return

              expected_receipt = os.environ.get("EXPECTED_SANDBOX_RECEIPT", "")
              if re.fullmatch(r"[0-9a-f]{64}", expected_receipt) is None:
                  raise VerificationError("receipt-recomputation")
              receipt, parser_descriptor, profile_descriptor = verify_system(
                  sys.argv[2],
                  bind_parser=True,
              )
              if receipt != expected_receipt or os.execve not in os.supports_fd:
                  raise VerificationError("receipt-recomputation")
              try:
                  os.set_inheritable(parser_descriptor, True)
                  os.set_inheritable(profile_descriptor, True)
                  os.execve(
                      parser_descriptor,
                      (
                          "apparmor_parser",
                          "--replace",
                          f"/proc/self/fd/{profile_descriptor}",
                      ),
                      {"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "HOME": "/nonexistent"},
                  )
              except OSError:
                  raise VerificationError("profile-load") from None


          try:
              run_verifier()
          except BaseException as error:
              if mode == "load":
                  raise SystemExit(boundary_status(error)) from None
              raise SystemExit(boundary_diagnostic(error)) from None
          PY
          }
          emit_verifier_diagnostic() {
            case "$1" in
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=ancestor-directories'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=usrmerge-parser-link'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=local-overrides'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=abi-tree'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=tunables-tree'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=bwrap-binary'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=parser-binary'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=package-profile'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=profile-semantics'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=receipt-recomputation'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=profile-load'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=unknown'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=package-profile-cleanup')
                printf '%s\n' "$1" >&2
                ;;
              *)
                echo '::error::trusted compatibility sandbox filesystem boundary unsafe phase=unknown' >&2
                ;;
            esac
          }
          sandbox_supervisor_source() {
            /usr/bin/cat <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          import sys

          phases = (
              "ancestor-directories",
              "usrmerge-parser-link",
              "local-overrides",
              "abi-tree",
              "tunables-tree",
              "bwrap-binary",
              "parser-binary",
              "package-profile",
              "profile-semantics",
              "receipt-recomputation",
              "profile-load",
              "unknown",
              "package-profile-cleanup",
          )
          diagnostics = {
              70 + index: (
                  "::error::trusted compatibility sandbox filesystem boundary unsafe "
                  f"phase={phase}\n"
              ).encode("ascii")
              for index, phase in enumerate(phases)
          }
          diagnostic_status = {value: status for status, value in diagnostics.items()}
          unknown = diagnostics[81]

          try:
              profile_path, expected_digest = sys.argv[1:]
              if (
                  sys.version_info < (3, 9)
                  or os.geteuid() != 0
                  or profile_path
                  != "/run/verjson-compatibility-sandbox/bwrap-userns-restrict"
                  or re.fullmatch(r"[0-9a-f]{64}", expected_digest) is None
              ):
                  raise ValueError
              verifier_source = sys.stdin.buffer.read(1048577)
              if (
                  len(verifier_source) > 1048576
                  or hashlib.sha256(verifier_source).hexdigest() != expected_digest
              ):
                  raise ValueError
              verifier_text = verifier_source.decode("utf-8", "strict")
              completed = subprocess.run(
                  (
                      "/usr/bin/python3",
                      "-I",
                      "-c",
                      verifier_text,
                      "verify",
                      profile_path,
                  ),
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  env={
                      "PATH": "/usr/sbin:/usr/bin:/sbin:/bin",
                      "HOME": "/nonexistent",
                  },
                  cwd="/",
                  timeout=60,
                  check=False,
                  close_fds=True,
                  start_new_session=True,
              )
              output = completed.stdout
              status = completed.returncode
              if status == 0 and re.fullmatch(rb"[0-9a-f]{64}\n", output):
                  sanitized = output
              elif status == 1 and output in diagnostic_status:
                  sanitized = output
                  status = diagnostic_status[output]
              else:
                  sanitized = unknown
                  status = 81
          except BaseException:
              sanitized = unknown
              status = 81

          try:
              sys.stdout.buffer.write(sanitized)
              sys.stdout.buffer.flush()
          except BaseException:
              raise SystemExit(81)
          raise SystemExit(status)
          PY
          }
          verify_sandbox_files() (
            supervisor_source=''
            supervisor_output=''
            supervisor_status=0
            supervisor_source="$(sandbox_supervisor_source)" || {
              emit_verifier_diagnostic ''
              return 1
            }
            supervisor_output="$(
              { sandbox_verifier_source 2>&1 |
                /usr/bin/sudo --non-interactive /usr/bin/env -i \
                  PATH=/usr/sbin:/usr/bin:/sbin:/bin \
                HOME=/nonexistent \
                /usr/bin/python3 -I -c "$supervisor_source" \
                "$profile_path" \
                '1b44cb275c09e93c472c178cac0bd2173268d7daee6646c48ca606f2d8a40549'; } \
                2>/dev/null
            )" || supervisor_status=$?
            case "$supervisor_status" in
              0)
                if [[ "$supervisor_output" =~ ^[0-9a-f]{64}$ ]]; then
                  printf '%s\n' "$supervisor_output"
                  return 0
                fi
                ;;
              70) supervisor_phase='ancestor-directories' ;;
              71) supervisor_phase='usrmerge-parser-link' ;;
              72) supervisor_phase='local-overrides' ;;
              73) supervisor_phase='abi-tree' ;;
              74) supervisor_phase='tunables-tree' ;;
              75) supervisor_phase='bwrap-binary' ;;
              76) supervisor_phase='parser-binary' ;;
              77) supervisor_phase='package-profile' ;;
              78) supervisor_phase='profile-semantics' ;;
              79) supervisor_phase='receipt-recomputation' ;;
              80) supervisor_phase='profile-load' ;;
              81) supervisor_phase='unknown' ;;
              82) supervisor_phase='package-profile-cleanup' ;;
              *) supervisor_phase='unknown' ;;
            esac
            if [ "$supervisor_status" -ge 70 ] 2>/dev/null \
              && [ "$supervisor_status" -le 82 ] 2>/dev/null \
              && [ "$supervisor_output" = "::error::trusted compatibility sandbox filesystem boundary unsafe phase=$supervisor_phase" ]; then
              emit_verifier_diagnostic "$supervisor_output"
            else
              emit_verifier_diagnostic ''
            fi
            return 1
          )
          initial_sandbox_receipt="$(verify_sandbox_files)" || exit 1

          probe_bubblewrap() {
            /usr/bin/env -i \
              PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              HOME=/nonexistent \
              /usr/bin/bwrap \
              --unshare-user \
              --unshare-pid \
              --unshare-ipc \
              --unshare-uts \
              --unshare-cgroup-try \
              --disable-userns \
              --die-with-parent \
              --new-session \
              --cap-drop ALL \
              --ro-bind / / \
              --dev /dev \
              --proc /proc \
              --tmpfs /dev/shm \
              -- /usr/bin/true >/dev/null 2>&1
          }
          if ! probe_bubblewrap; then
            current_sandbox_receipt="$(verify_sandbox_files)" || exit 1
            if [ "$current_sandbox_receipt" != "$initial_sandbox_receipt" ]; then
              echo "::error::trusted compatibility sandbox filesystem boundary unsafe phase=receipt-recomputation" >&2
              exit 1
            fi
            loader_status=0
            sandbox_verifier_source | /usr/bin/sudo --non-interactive /usr/bin/env -i \
              PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              HOME=/nonexistent \
              EXPECTED_SANDBOX_RECEIPT="$initial_sandbox_receipt" \
              /usr/bin/python3 -I - load "$profile_path" >/dev/null 2>&1 || loader_status=$?
            if [ "$loader_status" -ne 0 ]; then
              case "$loader_status" in
                70) loader_phase='ancestor-directories' ;;
                71) loader_phase='usrmerge-parser-link' ;;
                72) loader_phase='local-overrides' ;;
                73) loader_phase='abi-tree' ;;
                74) loader_phase='tunables-tree' ;;
                75) loader_phase='bwrap-binary' ;;
                76) loader_phase='parser-binary' ;;
                77) loader_phase='package-profile' ;;
                78) loader_phase='profile-semantics' ;;
                79) loader_phase='receipt-recomputation' ;;
                1|80) loader_phase='profile-load' ;;
                81) loader_phase='unknown' ;;
                82) loader_phase='package-profile-cleanup' ;;
                *) loader_phase='unknown' ;;
              esac
              echo "::error::trusted compatibility sandbox filesystem boundary unsafe phase=$loader_phase"
              exit 1
            fi
          fi
          if ! probe_bubblewrap; then
            echo "::error::trusted unprivileged bubblewrap namespace probe failed"
            exit 1
          fi

      - name: Revalidate protected pull-request identity
        if: needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && (inputs.secretless-ci-script-plan != '' || inputs.secretless-nested-manifests != '')
        env:
          ADMITTED_EVENT: ${{ inputs.event-name }}
          ADMITTED_HEAD_REPOSITORY: ${{ inputs.head-repository }}
          ADMITTED_HEAD_SHA: ${{ inputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [ "$ADMITTED_EVENT" = pull_request ]
          [ -n "$ADMITTED_HEAD_REPOSITORY" ]
          [[ "$ADMITTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_record="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '[.event,.head_sha,(.pull_requests|length),(.pull_requests[0].number//"")]|@tsv')"
          IFS=$'\t' read -r run_event run_head binding_count pr_number <<<"$run_record"
          [ "$run_event" = "$ADMITTED_EVENT" ]
          [ "$run_head" = "$ADMITTED_HEAD_SHA" ]
          [ "$binding_count" = 1 ]
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          pr_record="$(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq '[.state,.head.repo.full_name,.head.sha]|@tsv')"
          IFS=$'\t' read -r pr_state pr_head_repository pr_head_sha <<<"$pr_record"
          [ "$pr_state" = open ]
          [ "$pr_head_repository" = "$ADMITTED_HEAD_REPOSITORY" ]
          [ "$pr_head_sha" = "$ADMITTED_HEAD_SHA" ]
      - name: Run exact credentialless consumer script plan
        if: needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && (inputs.secretless-ci-script-plan != '' || inputs.secretless-nested-manifests != '')
        env:
          CI_SCRIPT_PLAN: ${{ inputs.secretless-ci-script-plan }}
          CANDIDATE_CACHE_ROOT: ${{ runner.temp }}/verjson-candidate-caches-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          VERJSON_CHANGELOG_CONTRACT_REF: ${{ steps.warm-changelog-contract.outputs.contract_ref }}
          VERJSON_CHANGELOG_CONTRACT_SHA256: ${{ steps.warm-changelog-contract.outputs.contract_sha256 }}
          NESTED_MANIFESTS: ${{ inputs.secretless-nested-manifests }}
        run: |
          unset -v GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN GOOGLE_APPLICATION_CREDENTIALS AZURE_CREDENTIALS ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          candidate_cache_supervisor_pid=''
          # shellcheck disable=SC2329 # invoked indirectly by the INT/TERM traps below.
          forward_candidate_signal() {
            signal="$1"
            trap - INT TERM
            [ -z "$candidate_cache_supervisor_pid" ] || kill -s "$signal" "$candidate_cache_supervisor_pid" 2>/dev/null || true
            [ -z "$candidate_cache_supervisor_pid" ] || wait "$candidate_cache_supervisor_pid" 2>/dev/null || true
            exit "$2"
          }
          trap 'forward_candidate_signal INT 130' INT
          trap 'forward_candidate_signal TERM 143' TERM
          python3 - <<'PY' &
          import hashlib
          import json
          import os
          import re
          import shutil
          import signal
          import stat
          import subprocess
          import sys
          import time
          from pathlib import Path

          script_pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9:._-]*")
          env_pattern = re.compile(r"[A-Za-z_][A-Za-z0-9_]*")
          protected_env = {
              "GH_TOKEN", "GITHUB_TOKEN", "NODE_AUTH_TOKEN", "NPM_TOKEN",
              "NPM_CONFIG_CACHE", "NPM_CONFIG_GLOBALCONFIG", "NPM_CONFIG_USERCONFIG",
              "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN",
              "GOOGLE_APPLICATION_CREDENTIALS", "AZURE_CREDENTIALS",
              "ACTIONS_ID_TOKEN_REQUEST_TOKEN", "ACTIONS_ID_TOKEN_REQUEST_URL",
          }
          def normalize_plan(plan, directory, label, manifest_label):
              if not isinstance(plan, list) or not plan or len(plan) > 32:
                  sys.exit(f"{label} accepts 1-32 unique exact npm script entries")
              entries = []
              for entry in plan:
                  if isinstance(entry, str):
                      script = entry
                      unset_env = []
                  elif isinstance(entry, dict) and set(entry) == {"script", "unsetEnv"}:
                      script = entry["script"]
                      unset_env = entry["unsetEnv"]
                  else:
                      sys.exit(f"{label} entries must be script names or exact script/unsetEnv objects")
                  if not isinstance(script, str) or script_pattern.fullmatch(script) is None:
                      sys.exit(f"{label} contains an invalid script name")
                  if (not isinstance(unset_env, list) or len(unset_env) > 16
                          or len(unset_env) != len(set(unset_env))
                          or any(not isinstance(name, str) or env_pattern.fullmatch(name) is None
                                 or name in protected_env for name in unset_env)):
                      sys.exit(f"{label} unsetEnv accepts up to 16 unique non-credential environment names")
                  entries.append((directory, script, unset_env))
              scripts_in_plan = [script for _, script, _ in entries]
              if len(scripts_in_plan) != len(set(scripts_in_plan)):
                  sys.exit(f"{label} accepts unique script names")
              # Script existence is proved against the manifest that will run the
              # script, so a nested plan can never reach a root-only script.
              package = json.loads((directory / "package.json").read_text(encoding="utf-8"))
              scripts = package.get("scripts")
              if not isinstance(scripts, dict):
                  sys.exit(f"{manifest_label} has no scripts object")
              missing = [name for name in scripts_in_plan if name not in scripts]
              if missing:
                  sys.exit(f"planned npm scripts absent from {manifest_label}: " + ", ".join(missing))
              return entries

          checkout_root = Path.cwd().resolve()
          normalized = []
          plan_source = os.environ.get("CI_SCRIPT_PLAN", "").strip()
          if plan_source:
              try:
                  plan = json.loads(plan_source)
              except json.JSONDecodeError as error:
                  sys.exit(f"secretless-ci-script-plan must be valid JSON: {error}")
              normalized.extend(normalize_plan(
                  plan, checkout_root, "secretless-ci-script-plan", "package.json"))
          nested_source = os.environ.get("NESTED_MANIFESTS", "").strip()
          if nested_source:
              try:
                  nested_manifests = json.loads(nested_source)
              except json.JSONDecodeError as error:
                  sys.exit(f"secretless-nested-manifests must be valid JSON: {error}")
              if not isinstance(nested_manifests, list) or not 1 <= len(nested_manifests) <= 8:
                  sys.exit("secretless-nested-manifests accepts 1-8 nested manifest objects")
              segment_pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]{0,63}")
              for nested in nested_manifests:
                  if (not isinstance(nested, dict)
                          or set(nested) != {"path", "approvedPackages", "scriptPlan"}):
                      sys.exit("each nested manifest requires exactly path, approvedPackages, and scriptPlan")
                  nested_path = nested["path"]
                  if (not isinstance(nested_path, str) or not nested_path
                          or any(segment_pattern.fullmatch(segment) is None
                                 for segment in nested_path.split("/"))):
                      sys.exit("each nested manifest path must be a relative checkout directory")
                  # The checkout is PR-authored here, so containment is proved
                  # again before this job reads anything below the declared path.
                  nested_directory = Path(nested_path).resolve()
                  if not nested_directory.is_dir() or checkout_root not in nested_directory.parents:
                      sys.exit(f"{nested_path} must resolve to a directory inside the checkout")
                  nested_plan = nested["scriptPlan"]
                  if not isinstance(nested_plan, list) or len(nested_plan) > 8:
                      sys.exit(f"{nested_path} scriptPlan accepts at most 8 entries")
                  if nested_plan:
                      normalized.extend(normalize_plan(
                          nested_plan, nested_directory, f"{nested_path} scriptPlan",
                          f"{nested_path}/package.json"))
          max_cache_files = 4096
          max_cache_bytes = 268435456
          runner_temp_input = Path(os.environ["RUNNER_TEMP"])
          if (
              not runner_temp_input.is_absolute()
              or runner_temp_input.is_symlink()
              or not runner_temp_input.is_dir()
              or runner_temp_input.resolve() != runner_temp_input
          ):
              sys.exit("RUNNER_TEMP is not a canonical directory")
          runner_temp = runner_temp_input
          changelog_ref = os.environ.get("VERJSON_CHANGELOG_CONTRACT_REF", "")
          changelog_sha256 = os.environ.get("VERJSON_CHANGELOG_CONTRACT_SHA256", "")
          if (
              re.fullmatch(r"[0-9a-f]{40}", changelog_ref) is None
              or re.fullmatch(r"[0-9a-f]{64}", changelog_sha256) is None
          ):
              sys.exit("pinned changelog contract identity is malformed")
          changelog_cache_root = Path(os.environ.get("VERJSON_CHANGELOG_TOOL_CACHE", ""))
          if (
              not changelog_cache_root.is_absolute()
              or changelog_cache_root.is_symlink()
              or not changelog_cache_root.is_dir()
              or changelog_cache_root.resolve() != changelog_cache_root
              or changelog_cache_root.parent != runner_temp
          ):
              sys.exit("verified changelog cache is not a canonical RUNNER_TEMP child")
          changelog_cache_root_metadata = changelog_cache_root.stat(follow_symlinks=False)
          if (
              not stat.S_ISDIR(changelog_cache_root_metadata.st_mode)
              or changelog_cache_root_metadata.st_uid != os.getuid()
              or changelog_cache_root_metadata.st_mode & 0o022
          ):
              sys.exit("verified changelog cache root has unsafe ownership or mode")
          changelog_cache_entries = list(os.scandir(changelog_cache_root))
          if len(changelog_cache_entries) != 1 or changelog_cache_entries[0].name != changelog_ref:
              sys.exit("verified changelog cache contains unexpected entries")
          changelog_cache_dir = changelog_cache_root / changelog_ref
          changelog_cache_dir_metadata = changelog_cache_dir.stat(follow_symlinks=False)
          if (
              not stat.S_ISDIR(changelog_cache_dir_metadata.st_mode)
              or changelog_cache_dir_metadata.st_uid != os.getuid()
              or changelog_cache_dir_metadata.st_mode & 0o022
          ):
              sys.exit("verified changelog cache entry has unsafe ownership or mode")
          changelog_cache_files = list(os.scandir(changelog_cache_dir))
          if len(changelog_cache_files) != 1 or changelog_cache_files[0].name != "changelog.py":
              sys.exit("verified changelog cache entry is incomplete")
          changelog_contract_path = changelog_cache_dir / "changelog.py"
          changelog_contract_metadata = changelog_contract_path.stat(follow_symlinks=False)
          if (
              not stat.S_ISREG(changelog_contract_metadata.st_mode)
              or changelog_contract_metadata.st_uid != os.getuid()
              or changelog_contract_metadata.st_nlink != 1
              or changelog_contract_metadata.st_mode & 0o222
              or changelog_contract_metadata.st_size > 16777216
          ):
              sys.exit("verified changelog contract file has unsafe ownership or mode")
          try:
              changelog_contract_fd = os.open(
                  changelog_contract_path,
                  os.O_RDONLY | os.O_NOFOLLOW | getattr(os, "O_CLOEXEC", 0),
              )
          except OSError:
              sys.exit("verified changelog contract changed during validation")
          opened_contract_metadata = os.fstat(changelog_contract_fd)
          if (
              opened_contract_metadata.st_dev != changelog_contract_metadata.st_dev
              or opened_contract_metadata.st_ino != changelog_contract_metadata.st_ino
              or opened_contract_metadata.st_uid != changelog_contract_metadata.st_uid
              or opened_contract_metadata.st_size != changelog_contract_metadata.st_size
          ):
              os.close(changelog_contract_fd)
              sys.exit("verified changelog contract changed during validation")
          changelog_digest = hashlib.sha256()
          with os.fdopen(changelog_contract_fd, "rb") as changelog_stream:
              for chunk in iter(lambda: changelog_stream.read(1024 * 1024), b""):
                  changelog_digest.update(chunk)
          if changelog_digest.hexdigest() != changelog_sha256:
              sys.exit("verified changelog contract does not match its pinned SHA-256")
          changelog_cache_root_identity = (
              changelog_cache_root_metadata.st_dev,
              changelog_cache_root_metadata.st_ino,
              changelog_cache_root_metadata.st_uid,
              stat.S_IMODE(changelog_cache_root_metadata.st_mode),
          )
          baseline_value = os.environ.get("npm_config_cache", "").strip()
          baseline = None
          if baseline_value:
              candidate_baseline = Path(os.path.abspath(baseline_value))
              if candidate_baseline.exists() or candidate_baseline.is_symlink():
                baseline = candidate_baseline
                if not baseline.is_absolute() or baseline.is_symlink() or not baseline.is_dir():
                  sys.exit("verified runtime cache is not an absolute regular directory")
                if baseline.resolve() != baseline:
                  sys.exit("verified runtime cache path contains a symlink")
                try:
                  baseline.resolve().relative_to(runner_temp)
                except ValueError:
                  sys.exit("verified runtime cache escapes RUNNER_TEMP")

          bubblewrap = Path("/usr/bin/bwrap")
          try:
              bubblewrap_metadata = bubblewrap.stat(follow_symlinks=False)
          except OSError:
              sys.exit("verified bubblewrap namespace boundary is unavailable")
          if (
              not stat.S_ISREG(bubblewrap_metadata.st_mode)
              or bubblewrap_metadata.st_uid != 0
              or bubblewrap_metadata.st_mode & 0o022
          ):
              sys.exit("bubblewrap namespace boundary has unsafe ownership or mode")
          bubblewrap_version = subprocess.run(
              [str(bubblewrap), "--version"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          version_match = re.fullmatch(r"bubblewrap (\d+)\.(\d+)\.(\d+)\n?", bubblewrap_version)
          if version_match is None or tuple(map(int, version_match.groups())) < (0, 9, 0):
              sys.exit("bubblewrap namespace boundary is below version 0.9.0")

          def inventory(root):
              files = []
              total_bytes = 0
              pending = [root]
              while pending:
                  directory = pending.pop()
                  for entry in os.scandir(directory):
                      entry_path = Path(entry.path)
                      mode = entry.stat(follow_symlinks=False).st_mode
                      if stat.S_ISLNK(mode):
                          sys.exit("verified runtime cache contains a symlink")
                      if stat.S_ISDIR(mode):
                          pending.append(entry_path)
                          continue
                      if not stat.S_ISREG(mode):
                          sys.exit("verified runtime cache contains a special file")
                      try:
                          relative = entry_path.relative_to(root).as_posix()
                      except ValueError:
                          sys.exit("verified runtime cache entry escapes its root")
                      try:
                          descriptor = os.open(entry_path, os.O_RDONLY | os.O_NOFOLLOW)
                      except OSError:
                          sys.exit("verified runtime cache file changed during validation")
                      descriptor_stat = os.fstat(descriptor)
                      if not stat.S_ISREG(descriptor_stat.st_mode):
                          os.close(descriptor)
                          sys.exit("verified runtime cache file changed type during validation")
                      size = descriptor_stat.st_size
                      total_bytes += size
                      if len(files) + 1 > max_cache_files or total_bytes > max_cache_bytes:
                          sys.exit("verified runtime cache exceeds its file or byte bound")
                      digest = hashlib.sha256()
                      with os.fdopen(descriptor, "rb") as stream:
                          for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                              digest.update(chunk)
                      files.append((relative, size, digest.hexdigest()))
              return tuple(sorted(files))

          baseline_inventory = inventory(baseline) if baseline is not None else ()
          cache_root = Path(os.environ["CANDIDATE_CACHE_ROOT"])
          if (
              not cache_root.is_absolute()
              or Path(os.path.abspath(cache_root)) != cache_root
              or cache_root.parent.resolve() != runner_temp
          ):
              sys.exit("candidate cache root escapes RUNNER_TEMP")
          if cache_root.exists() or cache_root.is_symlink():
              sys.exit("candidate cache root exists before script execution")
          workspace_lexical = Path(os.environ.get("PWD", ""))
          workspace = Path.cwd().resolve()
          if (
            not workspace_lexical.is_absolute()
            or workspace_lexical != workspace
            or workspace_lexical.resolve() != workspace_lexical
            or workspace_lexical.is_symlink()
            or not workspace.is_dir()
          ):
            sys.exit("candidate workspace is not a canonical directory")
          if workspace == runner_temp or workspace in runner_temp.parents or runner_temp in workspace.parents:
              sys.exit("candidate workspace and RUNNER_TEMP overlap")
          if (baseline is not None and baseline.parent != runner_temp) or cache_root.parent != runner_temp:
              sys.exit("candidate cache roots are not exact RUNNER_TEMP children")
          if baseline is not None and (baseline == cache_root or baseline in cache_root.parents or cache_root in baseline.parents):
              sys.exit("candidate cache baseline and isolation root overlap")
          if any(os.environ.get(name) for name in ("DB_HOST", "DB_PORT", "CACHE_PORT")):
              sys.exit("protected candidate scripts do not permit shared service networking")

          trusted_tool_root_input = Path(os.environ.get("RUNNER_TOOL_CACHE", ""))
          if (
              not trusted_tool_root_input.is_absolute()
              or trusted_tool_root_input.is_symlink()
              or not trusted_tool_root_input.is_dir()
              or trusted_tool_root_input.resolve() != trusted_tool_root_input
          ):
              sys.exit("trusted setup-node tool root unavailable or noncanonical")
          trusted_tool_root = trusted_tool_root_input
          hosted_tool_cache_root = Path("/opt/hostedtoolcache")
          # uid 0 is root; uid 1001 is the "runner" account GitHub-hosted
          # images provision and run Actions steps as.
          hosted_tool_cache_uids = (0, 1001)

          def paths_overlap(left, right):
            return left == right or left in right.parents or right in left.parents

          if paths_overlap(changelog_cache_root, cache_root) or (
              baseline is not None and paths_overlap(changelog_cache_root, baseline)
          ):
              sys.exit("verified changelog cache overlaps a candidate cache")

          def validate_trusted_ancestry(
            root,
            target,
            allowed_uids,
            label,
            include_target=True,
            require_unwritable=True,
          ):
            try:
              relative = target.relative_to(root)
            except ValueError:
              sys.exit(f"{label} escapes its trusted root")
            components = (root,)
            current = root
            for part in relative.parts:
              current = current / part
              components += (current,)
            if not include_target:
              components = components[:-1]
            for component in components:
              try:
                metadata = component.stat(follow_symlinks=False)
              except OSError:
                sys.exit(f"{label} ancestry is unreadable")
              if component != target or not include_target:
                if not stat.S_ISDIR(metadata.st_mode):
                  sys.exit(f"{label} ancestry is not canonical directories")
              if metadata.st_uid not in allowed_uids or (
                require_unwritable and metadata.st_mode & 0o022
              ):
                sys.exit(f"{label} ancestry has unsafe ownership mode")

          candidate_controlled_roots = tuple(
              root for root in (workspace, runner_temp, baseline, cache_root, changelog_cache_root)
              if root is not None
          )
          if any(paths_overlap(trusted_tool_root, path) for path in candidate_controlled_roots):
              sys.exit("trusted setup-node tool root overlaps candidate-controlled paths")
          trusted_root_metadata = trusted_tool_root.stat(follow_symlinks=False)
          allow_hosted_tool_cache_root = (
            trusted_tool_root == hosted_tool_cache_root
            and stat.S_IMODE(trusted_root_metadata.st_mode) == 0o777
            and trusted_root_metadata.st_uid in hosted_tool_cache_uids
            and trusted_root_metadata.st_gid == 0
          )
          if (
            not stat.S_ISDIR(trusted_root_metadata.st_mode)
            or trusted_root_metadata.st_uid not in (
              hosted_tool_cache_uids if allow_hosted_tool_cache_root else (0,)
            )
            or (
              trusted_root_metadata.st_mode & 0o022
              and not allow_hosted_tool_cache_root
            )
          ):
            sys.exit("trusted setup-node tool root has unsafe ownership mode")
          trusted_tool_uids = hosted_tool_cache_uids if allow_hosted_tool_cache_root else (0,)
          # GitHub-hosted images provision every entry under /opt/hostedtoolcache
          # (directories, files, and symlinks alike) as uid 1001 mode 0777 -- the
          # same convention as the root, measured on ubuntu-latest for #1599 -- so
          # an unwritable requirement on any descendant can never pass there. The
          # trust anchor for that tree is the owner allowlist plus the fact that
          # nothing PR-controlled runs before this check (npm ci uses
          # --ignore-scripts): the write bit is unexploited capability, not
          # evidence of tampering. Every other tool root stays strict.
          trusted_tool_tree_requires_unwritable = not allow_hosted_tool_cache_root

          trusted_search_directories = []
          for entry in os.environ.get("PATH", "").split(os.pathsep):
            if not entry:
              continue
            lexical_directory = Path(entry)
            if not lexical_directory.is_absolute():
              continue
            try:
              lexical_directory.relative_to(trusted_tool_root)
            except ValueError:
              continue
            resolved_directory = lexical_directory.resolve()
            try:
              resolved_directory.relative_to(trusted_tool_root)
            except ValueError:
              sys.exit("setup-node PATH entry escapes trusted tool root")
            validate_trusted_ancestry(
              trusted_tool_root,
              lexical_directory,
              trusted_tool_uids,
              "setup-node lexical PATH",
              require_unwritable=trusted_tool_tree_requires_unwritable,
            )
            validate_trusted_ancestry(
              trusted_tool_root,
              resolved_directory,
              trusted_tool_uids,
              "setup-node resolved PATH",
              require_unwritable=trusted_tool_tree_requires_unwritable,
            )
            if resolved_directory not in trusted_search_directories:
              trusted_search_directories.append(resolved_directory)

          tool_executables = {}
          for tool_name in ("npm", "node", "pwsh"):
            candidates = []
            if tool_name == "pwsh":
              system_candidate = Path("/usr/bin/pwsh")
              if system_candidate.exists():
                resolved_system_candidate = system_candidate.resolve()
                microsoft_root = Path("/opt/microsoft/powershell")
                if (
                  not resolved_system_candidate.is_relative_to(microsoft_root)
                  or resolved_system_candidate.name != "pwsh"
                  or not re.fullmatch(r"[0-9]+(?:[.][0-9]+)*", resolved_system_candidate.parent.name)
                ):
                  sys.exit("trusted pwsh executable escapes Microsoft runtime contract")
                validate_trusted_ancestry(
                  Path("/usr"), system_candidate, (0,), "pwsh lexical path", include_target=False
                )
                validate_trusted_ancestry(
                  # GitHub-hosted runner images ship /opt root-owned but world-writable
                  # (mode 777, matching /opt/hostedtoolcache's convention), so an
                  # unwritable-ancestry requirement can never pass there. Root ownership
                  # alone still holds: nothing PR-controlled runs outside this sandbox
                  # before this check (npm ci uses --ignore-scripts), so the write bit is
                  # unexploited capability, not evidence of tampering.
                  Path("/opt"),
                  resolved_system_candidate.parent,
                  (0,),
                  "pwsh resolved runtime",
                  require_unwritable=False,
                )
                system_metadata = resolved_system_candidate.stat(follow_symlinks=False)
                if not stat.S_ISREG(system_metadata.st_mode) or system_metadata.st_uid != 0:
                  sys.exit("trusted pwsh executable has unsafe ownership mode")
                candidates.append(resolved_system_candidate)
            for directory in trusted_search_directories:
              lexical_candidate = directory / tool_name
              if not lexical_candidate.exists():
                continue
              resolved_candidate = lexical_candidate.resolve()
              validate_trusted_ancestry(
                trusted_tool_root,
                lexical_candidate,
                trusted_tool_uids,
                f"trusted {tool_name} lexical path",
                include_target=False,
                require_unwritable=trusted_tool_tree_requires_unwritable,
              )
              try:
                resolved_candidate.relative_to(trusted_tool_root)
              except ValueError:
                sys.exit(f"trusted {tool_name} executable escapes setup-node tool root")
              validate_trusted_ancestry(
                trusted_tool_root,
                resolved_candidate,
                trusted_tool_uids,
                f"trusted {tool_name} resolved path",
                require_unwritable=trusted_tool_tree_requires_unwritable,
              )
              if resolved_candidate.is_file() and os.access(resolved_candidate, os.X_OK):
                candidates.append(resolved_candidate)
            candidates = list(dict.fromkeys(candidates))
            if not candidates:
              if tool_name in ("npm", "node"):
                sys.exit(f"trusted {tool_name} executable is unavailable")
              continue
            if len(candidates) != 1:
              sys.exit(f"trusted {tool_name} executable is ambiguous")
            tool_executable = candidates[0]
            executable_metadata = tool_executable.stat(follow_symlinks=False)
            # The Microsoft-shipped pwsh binary under GitHub-hosted /opt is root-owned
            # but world-writable (mode 777, matching /opt/hostedtoolcache's convention),
            # so the write-bit requirement below can never pass against a real,
            # untampered system pwsh there. Root ownership alone still holds for that
            # one location: nothing PR-controlled runs outside this sandbox before this
            # check (npm ci uses --ignore-scripts), so the write bit is unexploited
            # capability, not evidence of tampering. npm/node under an admitted hosted
            # tool cache carry the same image convention (see
            # trusted_tool_tree_requires_unwritable); every other root stays strict.
            executable_in_hosted_tool_cache = tool_executable.is_relative_to(hosted_tool_cache_root)
            executable_requires_unwritable = not (
              (tool_name == "pwsh" and tool_executable.is_relative_to("/opt/microsoft/powershell"))
              or (executable_in_hosted_tool_cache and not trusted_tool_tree_requires_unwritable)
            )
            executable_uids = trusted_tool_uids if executable_in_hosted_tool_cache else (0,)
            if executable_metadata.st_uid not in executable_uids or (
              executable_requires_unwritable and executable_metadata.st_mode & 0o022
            ):
              sys.exit(f"trusted {tool_name} executable has unsafe ownership mode")
            tool_executables[tool_name] = tool_executable
          npm_executable = tool_executables["npm"]
          tool_prefix_candidates = {
            (executable.parent if executable.is_relative_to("/opt/microsoft/powershell") else executable.parent.parent)
            for executable in tool_executables.values()
            if not executable.is_relative_to("/usr")
          }
          tool_prefixes = []
          tool_prefix_identities = {}

          def validate_trusted_tool_tree(root, allowed_uids=(0,), require_unwritable=True):
            for directory, directory_names, file_names in os.walk(root, followlinks=False):
              directory_path = Path(directory)
              directory_metadata = directory_path.stat(follow_symlinks=False)
              if (
                not stat.S_ISDIR(directory_metadata.st_mode)
                or directory_metadata.st_uid not in allowed_uids
                or (require_unwritable and directory_metadata.st_mode & 0o022)
              ):
                sys.exit("trusted tool tree directory has unsafe ownership mode")
              for name in (*directory_names, *file_names):
                entry = directory_path / name
                entry_metadata = entry.stat(follow_symlinks=False)
                if entry_metadata.st_uid not in allowed_uids:
                  sys.exit("trusted tool tree entry has unapproved ownership")
                if stat.S_ISLNK(entry_metadata.st_mode):
                  resolved_entry = entry.resolve()
                  if resolved_entry.is_relative_to(root):
                    continue
                  if not resolved_entry.exists():
                    # The Microsoft-shipped pwsh tree ships legacy OpenSSL 1.0
                    # compatibility shims that name host library paths distros
                    # dropped long ago (e.g. Ubuntu 24.04 carries no OpenSSL 1.0);
                    # a dangling symlink cannot be read or executed by anything
                    # that mounts this tree, so it carries no trust to verify.
                    continue
                  # The Microsoft-shipped pwsh tree symlinks its bundled OpenSSL 1.0
                  # compatibility shims to the real system libraries under /usr on
                  # distros that still carry them; re-validate the escape target
                  # against /usr's own strict, unconditional trust instead of
                  # blanket-rejecting every symlink that leaves the tool prefix.
                  if resolved_entry.is_relative_to("/usr"):
                    validate_trusted_ancestry(
                      Path("/usr"),
                      resolved_entry,
                      (0,),
                      "trusted tool tree external symlink target",
                    )
                    continue
                  sys.exit("trusted tool tree symlink escapes mounted prefix")
                if require_unwritable and entry_metadata.st_mode & 0o022:
                  sys.exit("trusted tool tree entry has unsafe writable mode")
                if not (stat.S_ISDIR(entry_metadata.st_mode) or stat.S_ISREG(entry_metadata.st_mode)):
                  sys.exit("trusted tool tree contains special file")

          for tool_prefix in sorted(tool_prefix_candidates, key=lambda path: (len(path.parts), str(path))):
            if (
                tool_prefix == Path("/")
                or any(paths_overlap(tool_prefix, path) for path in candidate_controlled_roots)
            ):
              sys.exit("trusted tool prefix overlaps candidate-controlled paths")
            if tool_prefix.is_relative_to(trusted_tool_root):
              validate_trusted_ancestry(
                trusted_tool_root,
                tool_prefix,
                trusted_tool_uids,
                "trusted tool prefix",
                require_unwritable=trusted_tool_tree_requires_unwritable,
              )
            prefix_metadata = tool_prefix.stat(follow_symlinks=False)
            if not stat.S_ISDIR(prefix_metadata.st_mode):
              sys.exit("trusted tool prefix is not a directory")
            # See the pwsh discovery comment above: the Microsoft-shipped runtime tree
            # under GitHub-hosted /opt is root-owned but world-writable throughout, and
            # the admitted hosted tool cache is world-writable throughout by the same
            # image convention; only those prefixes relax the write-bit requirement.
            prefix_in_hosted_tool_cache = tool_prefix.is_relative_to(hosted_tool_cache_root)
            validate_trusted_tool_tree(
              tool_prefix,
              allowed_uids=trusted_tool_uids if prefix_in_hosted_tool_cache else (0,),
              require_unwritable=not (
                tool_prefix.is_relative_to("/opt/microsoft/powershell")
                or (prefix_in_hosted_tool_cache and not trusted_tool_tree_requires_unwritable)
              ),
            )
            tool_prefix_identities[tool_prefix] = (
              prefix_metadata.st_dev,
              prefix_metadata.st_ino,
              prefix_metadata.st_uid,
              stat.S_IMODE(prefix_metadata.st_mode),
            )
