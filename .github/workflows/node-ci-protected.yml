      - id: classify-diff
        name: Select the script plan for this diff
        # Trusted workflow code only: the changed-file list comes from the GitHub
        # compare API at the event's base and head, never from the checkout or the
        # pull request, and file names are data (JSON lines), never interpolated
        # into a command or a log line. The token exists in this step alone and
        # cannot reach the sandbox. Every doubt leaves `non-app` false, which keeps
        # the caller's full plan. ADR 0238.
        if: needs.eligibility.outputs.should-run != 'false' && inputs.secretless-pr && github.event_name == 'pull_request' && inputs.secretless-ci-non-app-script-plan != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NON_APP_PATHS: ${{ inputs.secretless-ci-non-app-paths }}
        run: |
          set -euo pipefail
          decide() {
            echo "non-app=$1" >> "$GITHUB_OUTPUT"
            echo "::notice title=script plan::$2"
            exit 0
          }
          # The event payload carries both SHAs; a value that is not a 40-hex object
          # name is a malformed event, not a diff to guess about, so the job fails.
          [[ "$BASE_SHA" =~ ^[0123456789abcdef]{40}$ ]] \
            || { echo "::error::base-sha is not a 40-hex object name"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0123456789abcdef]{40}$ ]] \
            || { echo "::error::head-sha is not a 40-hex object name"; exit 1; }
          changed="$RUNNER_TEMP/verjson-changed-paths-$$.jsonl"
          gh api --paginate "repos/${REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}?per_page=100" \
            --jq '.files[]? | (.filename, (.previous_filename // empty)) | @json' \
            > "$changed" 2>/dev/null \
            || decide false "full plan: the changed files could not be read"
          verdict="$(CHANGED="$changed" python3 -I - <<'PY' || true
          import json
          import os
          import re

          denied_names = {
              "package.json", "package-lock.json", "npm-shrinkwrap.json",
              "pnpm-lock.yaml", "pnpm-workspace.yaml", "yarn.lock", "bun.lock",
              "bun.lockb", ".nvmrc", ".node-version", ".tool-versions",
              ".yarnrc", ".yarnrc.yml",
          }
          builtin_prefixes = ("docs/", "NEXT/", "CHANGELOG/")
          prefix_pattern = re.compile(r"[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*/")
          # The compare API serves at most 3000 files; a list that long may be cut.
          file_cap = 2900

          def valid_prefix(value):
              return (
                  isinstance(value, str)
                  and prefix_pattern.fullmatch(value) is not None
                  and not any(part in (".", "..") for part in value.split("/"))
                  and value.lower() != ".github/"
                  and not value.lower().startswith(".github/")
              )

          def non_app(path, prefixes):
              if (not isinstance(path, str) or not path or len(path) > 1024
                      or path.startswith("/") or "\\" in path
                      or any(ord(c) < 32 or ord(c) == 127 for c in path)):
                  return False
              parts = path.split("/")
              if any(part in ("", ".", "..") for part in parts):
                  return False
              lowered = [part.lower() for part in parts]
              base = lowered[-1]
              if (lowered[0] == ".github" or base in denied_names
                      or base.startswith(".npmrc") or base.startswith(".git")):
                  return False
              if len(parts) == 1:
                  return base.endswith(".md")
              return path.startswith(prefixes)

          raw = os.environ.get("NON_APP_PATHS", "").strip()
          extra = []
          if raw:
              parsed = json.loads(raw)
              if (not isinstance(parsed, list) or len(parsed) > 32
                      or not all(valid_prefix(item) for item in parsed)):
                  raise SystemExit(1)
              extra = parsed
          prefixes = builtin_prefixes + tuple(extra)
          with open(os.environ["CHANGED"], encoding="utf-8") as handle:
              paths = [json.loads(line) for line in handle if line.strip()]
          if not paths or len(paths) >= file_cap:
              raise SystemExit(1)
          print("true" if all(non_app(path, prefixes) for path in paths) else "false")
          PY
          )"
          rm -f -- "$changed"
          if [ "$verdict" = "true" ]; then
            decide true "light plan: every changed path is non-application"
          fi
          decide false "full plan: the diff is not provably non-application"
