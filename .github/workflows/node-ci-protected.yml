              request = json.loads(compatibility_source)
              provenance_bytes = provenance_path.read_bytes()
              if hashlib.sha256(provenance_bytes).hexdigest() \
                      != os.environ["EXPECTED_COMPATIBILITY_PROVENANCE_SHA256"]:
                  raise SystemExit("compatibility provenance digest is missing or corrupt")
