                              "installed compatibility package parent is not a real directory"
                          )
                      if descriptor is not None:
                          os.close(descriptor)
                      descriptor = child
                  return descriptor
              except BaseException:
                  if descriptor is not None:
                      os.close(descriptor)
                  raise

