          BUILD_ARTIFACT_RUNTIME_INPUT_SECRETLESS_NESTED_MANIFESTS: ${{ toJSON(inputs.secretless-nested-manifests) }}
          BUILD_ARTIFACT_RUNTIME_INPUT_SECRETLESS_CI_SCRIPT_PLAN: ${{ toJSON(inputs.secretless-ci-script-plan) }}
          BUILD_ARTIFACT_RUNTIME_INPUT_SECRETLESS_CI_NON_APP_SCRIPT_PLAN: ${{ toJSON(inputs.secretless-ci-non-app-script-plan) }}
