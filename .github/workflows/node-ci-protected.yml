            printf 'NPM_CONFIG_GLOBALCONFIG=%s\n' "$NPM_CONFIG_GLOBALCONFIG"
            printf 'NPM_CONFIG_USERCONFIG=%s\n' "$NPM_CONFIG_USERCONFIG"
            if [ -n "$COMPATIBILITY_RANGES" ]; then
              printf 'VERJSON_SECRETLESS_COMPATIBILITY_ARTIFACT_DIR=%s\n' "$COMPATIBILITY_ARTIFACT_DIR"
              printf 'VERJSON_SECRETLESS_COMPATIBILITY_PROVENANCE=%s\n' "$COMPATIBILITY_ARTIFACT_DIR/provenance.json"
            fi
