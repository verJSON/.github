          BUILD_ARTIFACT_RUNTIME_INPUT_SECRETLESS_RUNTIME_PUBLIC_CACHE: ${{ toJSON(inputs.secretless-runtime-public-cache) }}
          BUILD_ARTIFACT_RUNTIME_INPUT_APPROVED_INTERNAL_PACKAGES: ${{ toJSON(inputs.approved-internal-packages) }}
          BUILD_ARTIFACT_RUNTIME_INPUT_APPROVED_INTERNAL_SCOPES: ${{ toJSON(inputs.approved-internal-scopes) }}
