          if actual_node != os.environ["EXPECTED_NODE_VERSION"].removeprefix("v"):
              raise SystemExit("selected ArtifactSet Node version differs from producer profile")
          actual_package_manager = subprocess.check_output(["npm", "--version"], text=True).strip()
          if actual_package_manager != os.environ["EXPECTED_PACKAGE_MANAGER_VERSION"].removeprefix("v"):
