                echo '::error::trusted compatibility sandbox filesystem boundary unsafe phase=unknown' >&2
                ;;
            esac
          }
          sandbox_supervisor_source() {
            /usr/bin/cat <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          import sys

          phases = (
              "ancestor-directories",
              "usrmerge-parser-link",
              "local-overrides",
              "abi-tree",
              "tunables-tree",
              "bwrap-binary",
              "parser-binary",
              "package-profile",
              "profile-semantics",
              "receipt-recomputation",
              "profile-load",
              "unknown",
              "package-profile-cleanup",
          )
          diagnostics = {
              70 + index: (
                  "::error::trusted compatibility sandbox filesystem boundary unsafe "
                  f"phase={phase}\n"
              ).encode("ascii")
              for index, phase in enumerate(phases)
          }
          diagnostic_status = {value: status for status, value in diagnostics.items()}
          unknown = diagnostics[81]

          try:
              profile_path, expected_digest = sys.argv[1:]
              if (
                  sys.version_info < (3, 9)
                  or os.geteuid() != 0
                  or profile_path
                  != "/run/verjson-compatibility-sandbox/bwrap-userns-restrict"
                  or re.fullmatch(r"[0-9a-f]{64}", expected_digest) is None
              ):
                  raise ValueError
              verifier_source = sys.stdin.buffer.read(1048577)
              if (
                  len(verifier_source) > 1048576
                  or hashlib.sha256(verifier_source).hexdigest() != expected_digest
              ):
                  raise ValueError
              verifier_text = verifier_source.decode("utf-8", "strict")
              completed = subprocess.run(
                  (
                      "/usr/bin/python3",
                      "-I",
                      "-c",
                      verifier_text,
                      "verify",
                      profile_path,
                  ),
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  env={
                      "PATH": "/usr/sbin:/usr/bin:/sbin:/bin",
                      "HOME": "/nonexistent",
                  },
                  cwd="/",
                  timeout=60,
                  check=False,
                  close_fds=True,
                  start_new_session=True,
              )
              output = completed.stdout
              status = completed.returncode
              if status == 0 and re.fullmatch(rb"[0-9a-f]{64}\n", output):
                  sanitized = output
              elif status == 1 and output in diagnostic_status:
                  sanitized = output
                  status = diagnostic_status[output]
              else:
                  sanitized = unknown
                  status = 81
          except BaseException:
              sanitized = unknown
              status = 81

          try:
              sys.stdout.buffer.write(sanitized)
              sys.stdout.buffer.flush()
          except BaseException:
              raise SystemExit(81)
          raise SystemExit(status)
          PY
          }
          verify_sandbox_files() (
            supervisor_source=''
            supervisor_output=''
            supervisor_status=0
            supervisor_source="$(sandbox_supervisor_source)" || {
              emit_verifier_diagnostic ''
              return 1
            }
            supervisor_output="$(
              { sandbox_verifier_source 2>&1 |
                /usr/bin/sudo --non-interactive /usr/bin/env -i \
                  PATH=/usr/sbin:/usr/bin:/sbin:/bin \
                HOME=/nonexistent \
                /usr/bin/python3 -I -c "$supervisor_source" \
                "$profile_path" \
                '1b44cb275c09e93c472c178cac0bd2173268d7daee6646c48ca606f2d8a40549'; } \
                2>/dev/null
            )" || supervisor_status=$?
            case "$supervisor_status" in
              0)
                if [[ "$supervisor_output" =~ ^[0123456789abcdef]{64}$ ]]; then
                  printf '%s\n' "$supervisor_output"
                  return 0
                fi
                ;;
              70) supervisor_phase='ancestor-directories' ;;
              71) supervisor_phase='usrmerge-parser-link' ;;
              72) supervisor_phase='local-overrides' ;;
              73) supervisor_phase='abi-tree' ;;
              74) supervisor_phase='tunables-tree' ;;
              75) supervisor_phase='bwrap-binary' ;;
              76) supervisor_phase='parser-binary' ;;
              77) supervisor_phase='package-profile' ;;
              78) supervisor_phase='profile-semantics' ;;
              79) supervisor_phase='receipt-recomputation' ;;
              80) supervisor_phase='profile-load' ;;
              81) supervisor_phase='unknown' ;;
              82) supervisor_phase='package-profile-cleanup' ;;
              *) supervisor_phase='unknown' ;;
            esac
            if [ "$supervisor_status" -ge 70 ] 2>/dev/null \
              && [ "$supervisor_status" -le 82 ] 2>/dev/null \
              && [ "$supervisor_output" = "::error::trusted compatibility sandbox filesystem boundary unsafe phase=$supervisor_phase" ]; then
              emit_verifier_diagnostic "$supervisor_output"
            else
              emit_verifier_diagnostic ''
            fi
            return 1
          )
          initial_sandbox_receipt="$(verify_sandbox_files)" || exit 1

          probe_bubblewrap() {
            local status_file status_code
            status_file="$(mktemp "$RUNNER_TEMP/bwrap-json-status.XXXXXX")" || return 1
            status_code=0
            /usr/bin/env -i \
              PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              HOME=/nonexistent \
              /usr/bin/bwrap \
              --json-status-fd 3 \
              --unshare-user \
              --unshare-pid \
              --unshare-ipc \
              --unshare-uts \
              --unshare-cgroup-try \
              --disable-userns \
              --die-with-parent \
              --new-session \
              --cap-drop ALL \
              --ro-bind / / \
              --dev /dev \
              --proc /proc \
              --tmpfs /dev/shm \
              -- /usr/bin/true 3>"$status_file" >/dev/null 2>&1 || status_code=$?
            if [ "$status_code" -ne 0 ] || ! python3 -I - "$status_file" "$status_code" <<'PY'
          import json
          import sys
          from pathlib import Path

          MAX_STATUS_BYTES = 16 * 1024
          MAX_STATUS_LINE_BYTES = 4096
          MAX_STATUS_RECORDS = 64

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON key")
                  result[key] = value
              return result

          def reject_nonfinite(value):
              raise ValueError(f"non-finite JSON constant: {value}")

          expected_status = int(sys.argv[2])
          raw = Path(sys.argv[1]).read_bytes()
          if not raw or len(raw) > MAX_STATUS_BYTES or not raw.endswith(b"\n"):
              raise SystemExit("Bubblewrap JSON status file is empty, oversized, or unterminated")
          lines = raw[:-1].split(b"\n")
          if not lines or len(lines) > MAX_STATUS_RECORDS:
              raise SystemExit("Bubblewrap JSON status record count is invalid")
          events = []
          child_pid = None
          exit_code = None
          for line in lines:
              if not line or len(line) > MAX_STATUS_LINE_BYTES:
                  raise SystemExit("Bubblewrap JSON status line is empty or oversized")
              try:
                  record = json.loads(
                      line.decode("utf-8", errors="strict"),
                      object_pairs_hook=reject_duplicate_keys,
                      parse_constant=reject_nonfinite,
                  )
              except (UnicodeDecodeError, json.JSONDecodeError, ValueError) as error:
                  raise SystemExit(f"Bubblewrap JSON status is malformed: {error}") from error
              if not isinstance(record, dict):
                  raise SystemExit("Bubblewrap JSON status event must be an object")
              known_events = {"child-pid", "exit-code"}.intersection(record)
              if len(known_events) > 1:
                  raise SystemExit("Bubblewrap JSON status event is contradictory")
              if "child-pid" in record:
                  value = record["child-pid"]
                  if type(value) is not int or value <= 0 or child_pid is not None:
                      raise SystemExit("Bubblewrap child-pid event is malformed or duplicated")
                  child_pid = value
                  events.append("child-pid")
              elif "exit-code" in record:
                  value = record["exit-code"]
                  if type(value) is not int or value < 0 or exit_code is not None:
                      raise SystemExit("Bubblewrap exit-code event is malformed or duplicated")
                  exit_code = value
                  events.append("exit-code")
          if events != ["child-pid", "exit-code"] or exit_code != expected_status:
              raise SystemExit("Bubblewrap JSON status events are incomplete, unordered, or disagree with process status")
          PY
            then
              rm -f -- "$status_file"
              return 1
            fi
            rm -f -- "$status_file"
          }
          if ! probe_bubblewrap; then
            current_sandbox_receipt="$(verify_sandbox_files)" || exit 1
            if [ "$current_sandbox_receipt" != "$initial_sandbox_receipt" ]; then
              echo "::error::trusted compatibility sandbox filesystem boundary unsafe phase=receipt-recomputation" >&2
              exit 1
            fi
            loader_status=0
            sandbox_verifier_source | /usr/bin/sudo --non-interactive /usr/bin/env -i \
              PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              HOME=/nonexistent \
              EXPECTED_SANDBOX_RECEIPT="$initial_sandbox_receipt" \
              /usr/bin/python3 -I - load "$profile_path" >/dev/null 2>&1 || loader_status=$?
            if [ "$loader_status" -ne 0 ]; then
              case "$loader_status" in
                70) loader_phase='ancestor-directories' ;;
                71) loader_phase='usrmerge-parser-link' ;;
                72) loader_phase='local-overrides' ;;
                73) loader_phase='abi-tree' ;;
                74) loader_phase='tunables-tree' ;;
                75) loader_phase='bwrap-binary' ;;
                76) loader_phase='parser-binary' ;;
                77) loader_phase='package-profile' ;;
                78) loader_phase='profile-semantics' ;;
                79) loader_phase='receipt-recomputation' ;;
                1|80) loader_phase='profile-load' ;;
                81) loader_phase='unknown' ;;
                82) loader_phase='package-profile-cleanup' ;;
                *) loader_phase='unknown' ;;
              esac
              echo "::error::trusted compatibility sandbox filesystem boundary unsafe phase=$loader_phase"
              exit 1
            fi
          fi
          if ! probe_bubblewrap; then
            echo "::error::trusted unprivileged bubblewrap namespace probe failed"
            exit 1
          fi

      - name: Revalidate protected pull-request identity
