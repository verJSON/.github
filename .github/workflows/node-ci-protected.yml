          NESTED_MANIFESTS="$NESTED_MANIFESTS" NESTED_PATHS_FILE="$NESTED_PATHS_FILE" \
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

