        if: needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && (inputs.protected-type-surface-declaration-path != '' || inputs.secretless-compatibility-ranges != '')
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
          AZURE_CREDENTIALS: ''
          CACHE_ENV: ${{ inputs.cache-env }}
          COMPATIBILITY_ARTIFACT_DIR: ${{ runner.temp }}/secretless-compatibility-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          COMPATIBILITY_RANGES: ${{ needs.acquire-secretless-dependencies.outputs.protected-baseline-request || inputs.secretless-compatibility-ranges }}
          COMPATIBILITY_REQUIRES_SERVICES: ${{ steps.compatibility-script-plan.outputs.requires-services }}
          DB_ENV: ${{ inputs.db-env }}
          EXPECTED_COMPATIBILITY_PROVENANCE_SHA256: ${{ needs.acquire-secretless-dependencies.outputs.compatibility-provenance-sha256 }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          JOB_WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          RESTORE_PERSISTED_PUBLIC_CACHE: ${{ inputs.cache && inputs.package-manager == 'npm' }}
          RUNTIME_CACHE_DIR: ${{ runner.temp }}/secretless-runtime-cache-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SECRETLESS_RUNTIME_PUBLIC_CACHE: ${{ inputs.secretless-runtime-public-cache }}
          VERJSON_CI_TRUSTED_DB_HOST: ${{ steps.db-service.outputs.host }}
        run: |
          unset -v GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN GOOGLE_APPLICATION_CREDENTIALS AZURE_CREDENTIALS ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          set -euo pipefail
          unset -v GITHUB_ENV GITHUB_PATH GITHUB_OUTPUT GITHUB_STATE GITHUB_STEP_SUMMARY
          [[ "$JOB_WORKFLOW_SHA" =~ ^[0123456789abcdef]{40}$ ]]
          [[ -n "${RUNNER_TEMP:-}" && "$RUNNER_TEMP" = /* && ! -L "$RUNNER_TEMP" ]]
          helper="$RUNNER_TEMP/ci_secretless_compatibility_lanes.py"
          [[ ! -e "$helper" && ! -L "$helper" ]]
          temporary="$(mktemp "$RUNNER_TEMP/.ci-secretless-compatibility-lanes.XXXXXX")"
          trap 'rm -f -- "$temporary"' EXIT
          curl -fsSL --proto "=https" --proto-redir "=https" --max-filesize 16777216 -o "$temporary" "https://raw.githubusercontent.com/Verjson/.github/${JOB_WORKFLOW_SHA}/scripts/ci_secretless_compatibility_lanes.py"
          [[ -f "$temporary" && ! -L "$temporary" ]]
          chmod 0400 "$temporary"
          mv -- "$temporary" "$helper"
          [[ "$(stat -c '%u:%a:%h' -- "$helper")" == "$(id -u):400:1" ]]
          digest="$(sha256sum -- "$helper" | cut -d' ' -f1)"
          [[ "$digest" =~ ^[0123456789abcdef]{64}$ ]]
          trap - EXIT
          exec /usr/bin/python3 -I "$helper" run
      - name: Bound Playwright browser cache before save
        id: bound-playwright-browser-cache
        if: needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && inputs.browser-cache && hashFiles(inputs.cache-dependency-path) != '' && steps.restore-playwright-browser-cache.outputs.cache-hit != 'true'
        env:
          BROWSER_CACHE_DIR: ${{ runner.temp }}/verjson-playwright-browsers-${{ github.run_id }}-${{ github.run_attempt }}
          MAX_BROWSER_CACHE_FILES: '10000'
          MAX_BROWSER_CACHE_BYTES: '1073741824'
        run: |
          set -euo pipefail
          [ -d "$BROWSER_CACHE_DIR" ] && [ ! -L "$BROWSER_CACHE_DIR" ] || {
            echo "BROWSER_CACHE_PATH" >&2
            exit 1
          }
          unsafe_entry="$(find "$BROWSER_CACHE_DIR" -xdev \! -type f \! -type d -print -quit)"
          [ -z "$unsafe_entry" ] || {
            echo "BROWSER_CACHE_SYMLINK:$unsafe_entry" >&2
            exit 1
          }
          file_count="$(find "$BROWSER_CACHE_DIR" -xdev -type f -printf '.' | wc -c)"
          [ "$file_count" -le "$MAX_BROWSER_CACHE_FILES" ] || {
            echo "BROWSER_CACHE_FILE_BOUND:$file_count" >&2
            exit 1
          }
          byte_count="$(find "$BROWSER_CACHE_DIR" -xdev -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          [ "$byte_count" -le "$MAX_BROWSER_CACHE_BYTES" ] || {
            echo "BROWSER_CACHE_BYTE_BOUND:$byte_count" >&2
            exit 1
          }
          if [ "$file_count" -eq 0 ]; then
            echo "::notice::Playwright browser cache is empty; skipping cache save"
            printf 'should-save=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'should-save=true\n' >> "$GITHUB_OUTPUT"
          fi
      - id: save-playwright-browser-cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && inputs.browser-cache && hashFiles(inputs.cache-dependency-path) != '' && steps.restore-playwright-browser-cache.outputs.cache-hit != 'true' && steps.bound-playwright-browser-cache.outputs.should-save == 'true'
        with:
          path: ${{ runner.temp }}/verjson-playwright-browsers-${{ github.run_id }}-${{ github.run_attempt }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.cache-dependency-path) }}
      - name: Remove job-scoped Playwright browser cache
        if: always() && needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && inputs.browser-cache && steps.prepare-playwright-browser-cache.outputs.owned == 'true'
        env:
          BROWSER_CACHE_DIR: ${{ runner.temp }}/verjson-playwright-browsers-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$BROWSER_CACHE_DIR"
      - name: Remove job-scoped secretless runtime cache
        if: always() && needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref)
        env:
          RUNTIME_CACHE_DIR: ${{ runner.temp }}/secretless-runtime-cache-${{ github.run_id }}-${{ github.run_attempt }}
          COMPATIBILITY_ARTIFACT_DIR: ${{ runner.temp }}/secretless-compatibility-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          PERSISTED_PUBLIC_CACHE_DIR: ${{ runner.temp }}/secretless-public-npm-${{ hashFiles(inputs.cache-dependency-path) }}
        run: rm -rf "$RUNTIME_CACHE_DIR" "$COMPATIBILITY_ARTIFACT_DIR" "$PERSISTED_PUBLIC_CACHE_DIR"
      - name: Remove restored secretless auxiliary content
        if: always() && needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && needs.acquire-secretless-dependencies.outputs.auxiliary-content-path != ''
        env:
          AUXILIARY_CONTENT_PATH: ${{ needs.acquire-secretless-dependencies.outputs.auxiliary-content-path }}
        run: |
          auxiliary_target="$GITHUB_WORKSPACE/$AUXILIARY_CONTENT_PATH"
          [ ! -e "$auxiliary_target" ] || find "$auxiliary_target" -depth -delete
      - name: Bound npm cache upload
        if: always() && needs.eligibility.outputs.should-run != 'false' && inputs.cache && !(inputs.secretless-pr || inputs.secretless-trusted-ref)
        env:
          CACHE_MAX_MB: ${{ inputs.cache-max-mb }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/verjson-npm-cache"
          mkdir -p "$cache_dir"
          size_kb="$(du -sk "$cache_dir" | cut -f1)"
          size_mb="$(( (size_kb + 1023) / 1024 ))"
          {
            echo "### npm cache"
            echo "- scoped path: \`$cache_dir\`"
            echo "- size: ${size_mb} MB"
            echo "- upload limit: ${CACHE_MAX_MB} MB"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_kb" -gt "$(( CACHE_MAX_MB * 1024 ))" ]; then
            echo "::warning::npm cache is ${size_mb} MB; clearing it instead of uploading more than ${CACHE_MAX_MB} MB"
            find "$cache_dir" -mindepth 1 -delete
          fi
      - name: Create trusted per-lane TestReceipt
        id: create-build-artifact-receipt
        if: needs.eligibility.outputs.should-run != 'false' && success() && inputs.build-artifact-role == 'consumer' && steps.verify-build-artifact.outcome == 'success' && steps.run-script-plan.outcome == 'success'
        env:
          BUILD_ARTIFACT_LEVEL_ID: ${{ inputs.build-artifact-level-id }}
          CALLER_COMMIT: ${{ inputs.head-sha }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REUSABLE_WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
          RECEIPT_PROFILE: ${{ inputs.build-artifact-profile }}
          RECEIPT_COMMAND_DIGEST: ${{ steps.run-script-plan.outputs.command-digest }}
          RECEIPT_ARTIFACT_ID: ${{ inputs.build-artifact-role == 'consumer' && inputs.build-artifact-id || '' }}
          RECEIPT_ARTIFACT_DIGEST: ${{ inputs.build-artifact-role == 'consumer' && inputs.build-artifact-digest || '' }}
        run: |
          set -euo pipefail
          receipt_args=()
          if [[ -n "$RECEIPT_ARTIFACT_ID" || -n "$RECEIPT_ARTIFACT_DIGEST" ]]; then
            [[ -n "$RECEIPT_ARTIFACT_ID" && -n "$RECEIPT_ARTIFACT_DIGEST" ]]
            receipt_args+=(--manifest-file "$RUNNER_TEMP/ci-build-artifact-manifest.json" \
              --artifact-id "$RECEIPT_ARTIFACT_ID" --artifact-digest "$RECEIPT_ARTIFACT_DIGEST")
          fi
          python3 -I "$RUNNER_TEMP/ci_build_artifacts.py" receipt \
            --lane "$BUILD_ARTIFACT_LEVEL_ID" --profile "$RECEIPT_PROFILE" \
            --command-digest "$RECEIPT_COMMAND_DIGEST" "${receipt_args[@]}"
      - name: Stop Postgres sandbox profile
        if: always() && needs.eligibility.outputs.should-run != 'false' && inputs.postgres-sandbox-profile != '' && (inputs.secretless-pr || inputs.secretless-trusted-ref)
        env:
          POSTGRES_STATE_FILE: ${{ runner.temp }}/ci-postgres-sandbox-state.json
        run: |
          set -uo pipefail
          cleanup_status=0
          cleanup_script="$RUNNER_TEMP/ci_postgres_sandbox.py"
          for state_file in \
            "$POSTGRES_STATE_FILE" \
            "$RUNNER_TEMP/ci-postgres-sandbox-acceptance-state.json" \
            "$RUNNER_TEMP/ci-postgres-sandbox-fresh-state.json" \
            "$RUNNER_TEMP/ci-postgres-schema-validation-state.json"; do
            if [[ -e "$state_file" || -L "$state_file" ]]; then
              if [[ ! -f "$cleanup_script" ]]; then
                echo "::error::Postgres sandbox cleanup helper is missing" >&2
                cleanup_status=1
                continue
              fi
              python3 -I "$cleanup_script" cleanup \
                --runner-temp "$RUNNER_TEMP" \
                --state-file "$state_file" || cleanup_status=1
            fi
          done
          exit "$cleanup_status"
      - name: Remove Playwright system-library receipt
        if: always() && needs.eligibility.outputs.should-run != 'false' && inputs.playwright-sandbox-profile != ''
        env:
          PLAYWRIGHT_HELPER_SHA256: ${{ steps.validate-playwright-profile.outputs.helper-sha256 }}
          PLAYWRIGHT_STATE_FILE: /run/verjson-playwright-${{ github.run_id }}-${{ github.run_attempt }}-ci.json
          PLAYWRIGHT_STATE_IDENTITY: ${{ steps.provision-playwright-profile.outputs.receipt_identity }}
        run: |
          set -euo pipefail
          if [[ -e "$PLAYWRIGHT_STATE_FILE" || -L "$PLAYWRIGHT_STATE_FILE" ]]; then
            [[ -f "$RUNNER_TEMP/ci_playwright_system_libraries.py" ]]
            [[ "$PLAYWRIGHT_STATE_IDENTITY" =~ ^[0123456789]+:[0123456789]+$ ]] || {
              echo "::error::Playwright receipt identity is unavailable; refusing cleanup" >&2
              exit 1
            }
            [[ "$PLAYWRIGHT_HELPER_SHA256" =~ ^[0123456789abcdef]{64}$ ]]
            helper_copy_dir=""
            cleanup_helper_copy() {
              if [[ -n "$helper_copy_dir" ]]; then
                sudo /usr/bin/rm -f -- "$helper_copy_dir/ci_playwright_system_libraries.py"
                sudo /usr/bin/rmdir -- "$helper_copy_dir"
              fi
            }
            trap cleanup_helper_copy EXIT
            helper_copy_dir="$(sudo /usr/bin/mktemp -d /run/verjson-playwright-helper.XXXXXX)"
            helper_copy="$helper_copy_dir/ci_playwright_system_libraries.py"
            sudo /usr/bin/install -o root -g root -m 0500 -- "$RUNNER_TEMP/ci_playwright_system_libraries.py" "$helper_copy"
            helper_copy_sha256="$(sudo /usr/bin/sha256sum -- "$helper_copy")"
            [[ "${helper_copy_sha256%% *}" == "$PLAYWRIGHT_HELPER_SHA256" ]] || {
              echo "::error::trusted Playwright helper changed before privileged use" >&2
              exit 1
            }
            sudo /usr/bin/env -i \
              PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              HOME=/nonexistent \
              DEBIAN_FRONTEND=noninteractive \
              LC_ALL=C \
              APT_CONFIG=/dev/null \
              /usr/bin/python3 -I "$helper_copy" cleanup \
                --state-file "$PLAYWRIGHT_STATE_FILE" \
                --expected-identity "$PLAYWRIGHT_STATE_IDENTITY"
          fi
      - name: Stop cache service
        if: always() && needs.eligibility.outputs.should-run != 'false' && inputs.cache-image != ''
        env:
          CONTAINER_ID: ${{ steps.cache-service.outputs.container-id }}
        run: |
          [ -n "$CONTAINER_ID" ] || exit 0
          if ! rm_out="$(docker rm -f "$CONTAINER_ID" 2>&1)"; then
            grep -Fq 'No such container' <<< "$rm_out" || {
              echo "$rm_out" >&2
              exit 1
            }
          fi
      - name: Stop database service
        # Always tear the job's container down after every consumer and cache
        # step, so the suite can use it and any earlier failure still cleans up
        # (#585). The handle is the container ID published by the start step —
        # not a name, and not a re-derived literal: an ID can only ever name the
        # container this job created, so a job can never remove a concurrent
        # job's live container (#116). An empty output means no container was
        # started, so there is nothing to remove.
        if: always() && needs.eligibility.outputs.should-run != 'false' && inputs.db-image != ''
        env:
          CONTAINER_ID: ${{ steps.db-service.outputs.container-id }}
        run: |
          [ -n "$CONTAINER_ID" ] || exit 0
          # A removal failure is not swallowed: with an OS-assigned port a leaked
          # container no longer announces itself by breaking the next job's bind,
          # so the only signal is this one. An already-gone container is fine.
          if ! rm_out="$(docker rm -f "$CONTAINER_ID" 2>&1)"; then
            case "$rm_out" in
              *"No such container"*)
                echo "database container $CONTAINER_ID was already gone" ;;
              *)
                echo "failed to remove database container $CONTAINER_ID:" \
                     "$rm_out — it may be leaking on this runner" >&2
                exit 1 ;;
            esac
          fi
