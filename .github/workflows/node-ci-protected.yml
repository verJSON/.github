              lock = directory / "package-lock.json"
              if (not directory.is_dir() or workspace not in directory.resolve().parents
                      or not lock.is_file() or workspace not in lock.resolve().parents):
                  raise SystemExit(f"nested manifest is not a contained checkout directory: {path}")
              paths.append(path)
              binding.append(f"{path}\t{hashlib.sha256(lock.read_bytes()).hexdigest()}\n")
