              lane_keys = {"index", "package", "range", "script", "version",
                           "integrity", "tarball", "sha512"}
              for index, lane in enumerate(provenance["lanes"]):
                  if (not isinstance(lane, dict) or set(lane) != lane_keys
                          or lane["index"] != index or lane["package"] != request["package"]
                          or lane["range"] != request["ranges"][index]
                          or lane["script"] != request["script"]
                          or not isinstance(lane["sha512"], str)
                          or re.fullmatch(r"[0-9a-f]{128}", lane["sha512"]) is None):
                      raise SystemExit("compatibility provenance lane identity is invalid")
                  try:
                      digest = base64.b64decode(
                          lane["integrity"].removeprefix("sha512-"), validate=True)
                  except (AttributeError, ValueError):
                      raise SystemExit("compatibility provenance integrity is invalid")
