                      r"sha512-[A-Za-z0-9+/]{86}==", integrity) is None:
                  raise SystemExit("locked private package has invalid sha512 integrity")
              digest = base64.b64decode(integrity.removeprefix("sha512-"), validate=True)
              digest_hex = digest.hex()
              content = cache / "_cacache" / "content-v2" / "sha512" \
                  / digest_hex[:2] / digest_hex[2:4] / digest_hex[4:]
              expected_content[content] = digest
