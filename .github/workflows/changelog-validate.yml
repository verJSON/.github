name: changelog contract

on:
  workflow_call:
    inputs:
      contract_ref:
        description: Immutable Verjson/.github commit containing this workflow
        required: true
        type: string
      legacy_dir:
        description: Temporary former unreleased-fragment directory
        required: false
        type: string
        default: ''
      runner:
        description: Optional JSON runner labels; Verjson defaults by visibility, external callers use ubuntu-24.04.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.CI_RUNNER_OVERFLOW || vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.CI_RUNNER_OVERFLOW || vars.CI_LANE_UNTRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    steps:
      # Reject a mutable contract_ref BEFORE either checkout, so an invalid call
      # fetches nothing at all (#412). `ref:` accepts any ref of Verjson/.github
      # and this job then executes `python3` from the result, so the ref decides
      # what code runs on the Verjson lane. A branch or tag can move after review;
      # `refs/pull/<n>/merge` is an unreviewed pull request against a PUBLIC
      # repository, so accepting one would let anyone able to open a PR run their
      # own contract engine here. ~90 repositories call this workflow.
      #
      # Ported verbatim from generated-artifacts.yml, which already carries this
      # guard (#407) — the two must not disagree about what counts as a pin.
      - name: Require an immutable contract pin
        id: pin
        env:
          CONTRACT_REF: ${{ inputs.contract_ref }}
        run: |
          set -euo pipefail
          # Exactly 40 lower-case hex, matching scripts/node-workflow-pins.test.sh.
          # An abbreviated SHA is ambiguous by construction — git resolves it
          # against whatever objects exist at fetch time — so a prefix is not a
          # pin (#312). Upper-case is rejected too: `ref:` is passed through
          # unchanged, and accepting two spellings of one commit means two
          # spellings to audit for no benefit.
          ref_is_immutable() { [[ "$1" =~ ^[0-9a-f]{40}$ ]]; }

          if ! ref_is_immutable "$CONTRACT_REF"; then
            reason="contract_ref must be a full 40-character lower-case Verjson/.github commit SHA; got '$CONTRACT_REF'. A branch, a tag or refs/pull/<n>/merge can change after review, and an abbreviated SHA is ambiguous, so the contract that runs would not be the contract that was reviewed."
            printf '::error title=Changelog contract check unavailable::%s\n' "$reason"
            printf '### Changelog contract could not be validated\n\n%s\n\n' "$reason" \
              >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          printf 'ok - contract_ref is an immutable commit pin\n'
      - name: Check out consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # The contract engine is `python3` from a SEPARATE checkout running in
          # this same workspace, so a persisted credential in the consumer's
          # `.git/config` sits inside the blast radius of whatever that engine
          # does. Nothing here pushes. Matches generated-artifacts.yml.
          persist-credentials: false
      - name: Check out canonical contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ inputs.contract_ref }}
          path: .changelog-contract
          persist-credentials: false
      - name: Validate fragments and pull-request policy
        env:
          LEGACY_DIR: ${{ inputs.legacy_dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(--repo-root "$GITHUB_WORKSPACE")
          if [ -n "$LEGACY_DIR" ]; then args+=(--legacy-dir "$LEGACY_DIR"); fi
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            args+=(--base "$BASE_SHA" --head "$HEAD_SHA")
            # #800: branches created under the implicit-patch contract have a
            # bounded migration window. From 2026-08-30 UTC, every fragment a
            # pull request adds must state major, minor, or patch explicitly.
            args+=(--allow-missing-impact-through 2026-08-29)
          fi
          python3 -I .changelog-contract/scripts/changelog.py validate "${args[@]}"
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            python3 -I .changelog-contract/scripts/changelog.py check-pr \
              --repo-root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA"
          fi
      - name: Preview the release notes this would publish
        env:
          LEGACY_DIR: ${{ inputs.legacy_dir }}
          CONTRACT_REF: ${{ inputs.contract_ref }}
        run: |
          # A released snapshot is immutable (ADR 0059), so without this the
          # released form is first seen when it can no longer be changed. Every
          # repository adopting the contract runs this workflow, and until #437
          # lands none of them can move to generated-artifacts.yml, so this is
          # the only place the preview reaches an adopter (#449).
          #
          # A separate step because it is informational: it runs only when the
          # verdict above passed, and its own outcome is not that verdict.
          # Run through `bash` and test for -f, not -x. A file mode is the one
          # thing about this script that no test upstream can observe from
          # inside a fixture, and a lost execute bit would put every adopter on
          # the warning branch below — silently, permanently, and looking
          # exactly like the bug #449 fixed.
          preview="$GITHUB_WORKSPACE/.changelog-contract/scripts/changelog-preview.sh"
          if [ -f "$preview" ]; then
            bash "$preview" "$GITHUB_WORKSPACE/.changelog-contract/scripts/changelog.py" "$CONTRACT_REF"
          else
            # Reachable only when contract_ref and the ref this workflow was
            # called at disagree, or point before the script existed.
            printf '::warning title=Release-note preview unavailable::%s\n' \
              "The changelog check itself PASSED and this does not change that verdict. Verjson/.github@$CONTRACT_REF has no scripts/changelog-preview.sh, so contract_ref predates the preview or does not match the ref this workflow was called at."
          fi
