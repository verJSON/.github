name: notify-umbrella (reusable)

# Reusable workflow. A git-submodule leaf repo tells its umbrella that `main`
# advanced, so the umbrella's bump-submodule-pointers.yml re-points it via an
# auto-merged pointer-bump PR. Centralised here so runner selection and the
# dispatch contract live in one place instead of being copy-pasted per repo.
#
# Verjson callers default to the general self-hosted pool. External callers
# retain a portable hosted default; trusted callers can select another pool.
#
# Caller (in each leaf repo's .github/workflows/notify-umbrella.yml):
#
#   name: notify-umbrella
#   on:
#     push:
#       branches: [main]
#   jobs:
#     notify:
#       uses: Verjson/.github/.github/workflows/notify-umbrella.yml@main
#       with:
#         umbrella: Verjson/catalog
#       secrets: inherit
#
# ORG_ADMIN_TOKEN (org secret) has WRITE on the umbrella so it can POST the
# repository dispatch; the default GITHUB_TOKEN cannot reach a sibling repo.

on:
  workflow_call:
    inputs:
      umbrella:
        description: owner/repo of the umbrella to notify (e.g. Verjson/catalog)
        required: true
        type: string
      runner:
        description: Optional JSON runner labels; Verjson defaults general, external callers ubuntu-24.04.
        required: false
        type: string
        default: ''
    secrets:
      ORG_ADMIN_TOKEN:
        description: Org-admin PAT with write on the umbrella, to POST the dispatch
        required: true

jobs:
  reject-public-pull-request-caller:
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.repository.private != true }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Reject public pull request callers
        run: |
          echo "::error::This reusable workflow does not accept public pull request callers"
          exit 1
  dispatch:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' || github.event.repository.private == true) }}
    # Runner routing is policy, not preference — see ADR 0033. In tier order:
    # an explicit `runner` input wins; a caller outside Verjson gets hosted
    # (portable, their billing); a Verjson PRIVATE repo gets the general
    # self-hosted pool; anything else — public, or an event that carries no
    # visibility — gets the ephemeral untrusted-PR pool. That last tier is
    # fail-SAFE, not a fallback: unresolved visibility must never put fork code
    # on the persistent pool. Both pools are org variables so a provider move
    # (GCP -> DigitalOcean) is a variable flip, not a PR here.
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.CI_LANE_UNTRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    steps:
      - name: Dispatch submodule-updated to the umbrella
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          gh api "repos/${{ inputs.umbrella }}/dispatches" \
            -f event_type=submodule-updated \
            -f "client_payload[repo]=${{ github.event.repository.name }}" \
            -f "client_payload[sha]=${{ github.sha }}"
