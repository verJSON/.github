name: Main-only App key environment admission

on:
  workflow_call:
    inputs:
      role:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      AI_REVIEW_APP_PRIVATE_KEY:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify the caller's main-only role environment before key-job admission
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ROLE: ${{ inputs.role }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$ROLE" in release|merge|ai-review) ;; *) exit 1 ;; esac
          [ "$ENVIRONMENT" = "$ROLE-app" ]
          [ "$REF" = refs/heads/main ]
          [ "$DEFAULT_BRANCH" = main ]
          environment_record=$(gh api "repos/$REPOSITORY/environments/$ENVIRONMENT")
          jq -e --arg name "$ENVIRONMENT" '
            .name == $name and (.id | type == "number" and . > 0) and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true
          ' <<<"$environment_record" >/dev/null
          policies=$(gh api "repos/$REPOSITORY/environments/$ENVIRONMENT/deployment-branch-policies?per_page=100")
          jq -e '
            .total_count == 1 and (.branch_policies | length) == 1 and
            .branch_policies[0].name == "main" and
            .branch_policies[0].type == "branch"
          ' <<<"$policies" >/dev/null

  validate-ai-review-key:
    if: ${{ inputs.role == 'ai-review' }}
    needs: validate
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || github.event_name == 'merge_group' || github.event_name == 'pull_request_target') && github.event.repository.private != true && 'ubuntu-24.04' || (github.event.repository.private == true && fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.CI_LANE_UNTRUSTED || '["ubuntu-24.04"]')) }}
    timeout-minutes: 2
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Validate resolved AI review App private key
        env:
          AI_REVIEW_APP_PRIVATE_KEY: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          key="${AI_REVIEW_APP_PRIVATE_KEY:-}"
          if [ -z "$key" ]; then
            echo "::error::AI_REVIEW_APP_PRIVATE_KEY is empty or unavailable" >&2
            exit 1
          fi

          umask 077
          key_file="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ai-review-app-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$key" >"$key_file"
          unset key

          if ! openssl rsa -in "$key_file" -check -noout >/dev/null 2>&1; then
            echo "::error::AI_REVIEW_APP_PRIVATE_KEY is not a valid PEM RSA private key" >&2
            exit 1
          fi
