name: AI terminal promotion retry

# Cheap, event-driven continuation for this repository's deterministic CI.
# It can call only the privileged promotion workflow; it cannot dispatch the
# paid model workflow. A pending promotion exits and the next completion event
# supplies another bounded attempt.
on:
  workflow_run:
    workflows: [actions-ci]
    types: [completed]
  workflow_call:
    inputs:
      merge_environment:
        required: true
        type: string
      required_checks:
        required: true
        type: string
      privileged_lane:
        required: false
        type: string
      merge_app_client_id:
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ai-terminal-promotion-retry-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ${{ github.repository_owner == 'Verjson' && fromJSON(vars.CI_RUNNER_FASTLANE || vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || 'ubuntu-24.04' }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.resolve.outputs.ready || steps.adoption.outputs.ready }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      expected_head_sha: ${{ steps.resolve.outputs.expected_head_sha }}
      authorization_check_id: ${{ steps.resolve.outputs.authorization_check_id }}
      arm_run_id: ${{ steps.resolve.outputs.arm_run_id }}
      arm_run_attempt: ${{ steps.resolve.outputs.arm_run_attempt }}
      review_policy: ${{ steps.resolve.outputs.review_policy }}
    steps:
      - name: Resolve AI review adoption
        id: adoption
        env:
          EXPECTED_APP_ID: ${{ vars.AI_REVIEW_APP_ID }}
          EXPECTED_APP_SLUG: ${{ vars.AI_REVIEW_APP_SLUG }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_APP_ID" ] && [ -z "$EXPECTED_APP_SLUG" ]; then
            printf 'adopted=false\nready=false\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "$EXPECTED_APP_ID" ] || {
            echo '::error::AI_REVIEW_APP_ID is required when AI_REVIEW_APP_SLUG is configured'
            exit 1
          }
          [ -n "$EXPECTED_APP_SLUG" ] || {
            echo '::error::AI_REVIEW_APP_SLUG is required when AI_REVIEW_APP_ID is configured'
            exit 1
          }
          [[ "$EXPECTED_APP_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::AI_REVIEW_APP_ID must be a positive decimal App ID'
            exit 1
          }
          [[ "$EXPECTED_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
            echo '::error::AI_REVIEW_APP_SLUG must be a lowercase GitHub App slug'
            exit 1
          }
          echo 'adopted=true' >>"$GITHUB_OUTPUT"

      - name: Resolve executing trusted workflow revision
        id: trusted-revision
        if: steps.adoption.outputs.adopted == 'true'
        env:
          EXECUTING_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: echo "sha=$EXECUTING_WORKFLOW_SHA" >>"$GITHUB_OUTPUT"

      - name: Check out immutable review-policy decoder
        if: steps.adoption.outputs.adopted == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ steps.trusted-revision.outputs.sha }}
          path: .promotion-trust
          sparse-checkout: scripts/ci-gate/review-policy-envelope.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve exact-head authorization
        id: resolve
        if: steps.adoption.outputs.adopted == 'true'
        env:
          EXPECTED_APP_ID: ${{ vars.AI_REVIEW_APP_ID }}
          EXPECTED_APP_SLUG: ${{ vars.AI_REVIEW_APP_SLUG }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(jq 'length' <<<"$PULL_REQUESTS")" = 1 ] || {
            echo 'ready=false' >>"$GITHUB_OUTPUT"; exit 0;
          }
          pr_number="$(jq -r '.[0].number // ""' <<<"$PULL_REQUESTS")"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          check="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
            --jq "[.check_runs[] | select(.name == \"AI review authorization\" and .head_sha == \"$HEAD_SHA\" and .app.id == 15368 and .app.slug == \"github-actions\")] | sort_by(.id) | last // {}")"
          check_id="$(jq -r '.id // ""' <<<"$check")"
          # The arm run is carried by external_id; details_url is the check's own page (#1648).
          arm_run_id="$(jq -r --arg repo "$GITHUB_REPOSITORY" --arg pr "$pr_number" --arg head "$HEAD_SHA" '
                (.external_id // "" | split(":")) as $p |
                if ($p | length) == 8 and $p[0] == "ai-review" and $p[1] == "v1" and
                   $p[2] == $repo and $p[3] == $pr and $p[4] == $head and
                   ($p[5] | test("^[1-9][0-9]*$")) and
                   ($p[6] | test("^[1-9][0-9]*$")) and ($p[7] | test("^[0-9a-f]{64}$")) then $p[5] else "" end' <<<"$check")"
          if ! [[ "$check_id" =~ ^[1-9][0-9]*$ ]] || ! [[ "$arm_run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo 'ready=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq -r '.app.id // ""' <<<"$check")" != 15368 ] ||
             [ "$(jq -r '.app.slug // ""' <<<"$check")" != github-actions ] ||
             [ "$(jq -r '.status // ""' <<<"$check")" != completed ] ||
             [ "$(jq -r '.conclusion // ""' <<<"$check")" != success ]; then
            echo 'ready=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          authorization_marker="<!-- ai-review-authorized:v1:${check_id}:${HEAD_SHA}:ai-merge -->"
          if ! jq -er --arg marker "$authorization_marker" '
            .output.summary | strings | split("\n") | index($marker) != null
          ' <<<"$check" >/dev/null; then
            echo 'ready=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          arm_run_attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$arm_run_id" --jq '.run_attempt // ""')"
          [[ "$arm_run_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          receipt_name="ai-review-arm-$arm_run_id-$arm_run_attempt"
          receipt_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ai-promotion-retry.XXXXXX")"
          trap 'rm -rf "$receipt_dir"' EXIT
          gh run download "$arm_run_id" --repo "$GITHUB_REPOSITORY" --name "$receipt_name" --dir "$receipt_dir"
          [ -f "$receipt_dir/receipt.json" ] || exit 1
          review_policy="$(jq -er '.review_policy | select(type == "string")' "$receipt_dir/receipt.json")"
          [[ "$review_policy" =~ ^[A-Za-z0-9_-]{1,2048}$ ]] || exit 1
          policy_json="$(python3 -I .promotion-trust/scripts/ci-gate/review-policy-envelope.py decode "$review_policy")" || exit 1
          if [ "$(jq -r '.authority // "human"' <<<"$policy_json")" != ai-merge ]; then
            echo 'ready=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'ready=true\npr_number=%s\nexpected_head_sha=%s\nauthorization_check_id=%s\narm_run_id=%s\narm_run_attempt=%s\nreview_policy=%s\n' \
            "$pr_number" "$HEAD_SHA" "$check_id" "$arm_run_id" "$arm_run_attempt" "$review_policy" >>"$GITHUB_OUTPUT"

  promote:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/ai-privileged-merge.yml
    secrets: inherit
    with:
      merge_environment: ${{ inputs.merge_environment || 'merge-app' }}
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      expected_head_sha: ${{ needs.resolve.outputs.expected_head_sha }}
      authorization_check_id: ${{ needs.resolve.outputs.authorization_check_id }}
      arm_run_id: ${{ needs.resolve.outputs.arm_run_id }}
      arm_run_attempt: ${{ needs.resolve.outputs.arm_run_attempt }}
      review_policy: ${{ needs.resolve.outputs.review_policy }}
      required_checks: ${{ github.repository == 'Verjson/.github' && '[{"name":"shell-tests","app_id":15368,"workflow_id":315894159,"workflow_path":".github/workflows/actions-ci.yml"}]' || inputs.required_checks }}
      privileged_lane: ${{ inputs.privileged_lane || vars.CI_LANE_PRIVILEGED }}
      merge_app_client_id: ${{ inputs.merge_app_client_id || vars.MERGE_APP_CLIENT_ID }}
