name: fleet watchdog

# Retains selector-health monitoring while the former merge-gate poll watchdog
# remains inert after ADR 0079. The cancellation job is kept temporarily for a
# reversible ruleset migration and has an empty production allowlist.
#
# `gate` and `privileged_merge` hold a runner for tens of minutes while POLLING
# for checks they cannot influence. On a fixed pool that is a deadlock, not
# slowness — six gate jobs held all six runners on 2026-08-03 while waiting for
# CI that could not start because it needed those runners.
#
# ADR 0053's `CI_RUNNER_OVERFLOW` routes `preflight`/`gate`/`dispatch-merge`
# off the pool while it is set, and ADR 0064 (#487) extends it to
# `ai-privileged-merge.yml` — which ADR 0056 had already called "probably the
# right permanent fix", deferred to #341's re-scope.
#
# That NARROWS the residual exposure without removing it, which is why this
# watchdog is still here. Overflow heads the LANE tail only, so it is reached
# solely by callers that omit `inputs.runner_labels` (ADR 0057 / #405). Every
# caller generated before that — most of them until the #365 sweep — still routes
# `privileged_merge` onto the pool by label, so a `privileged_merge` jam remains
# reachable and this watchdog remains its only mitigation. 3 of the 4 runs it has
# ever preempted were `AI privileged merge`; the fourth was a `gate` on
# 2026-08-03, when `gate` was still on the pool. ADR 0056 records why it is
# retained rather than retired (#341), and why a candidate must now prove it
# holds a runner from the saturated pool.
#
# Runs on the FAST LANE: this repository is public, so these minutes are free,
# and a watchdog that queued for a self-hosted runner would be waiting behind the
# exact jam it exists to clear.
#
# There is deliberately no `workflow_dispatch`: this job reads
# `secrets.ORG_ADMIN_TOKEN`, and a branch-selectable dispatch would hand that
# secret to workflow code chosen by the dispatcher (#350, and the reason #385
# removed the other privileged dispatches).

on:
  schedule:
    # Every 15 minutes NOMINALLY. GitHub deprioritizes scheduled workflows under
    # load and the observed cadence over 2026-08-03..05 was roughly 15 runs a day,
    # not 96, with gaps up to ~2.5 h. Nothing in this repository fixes that, so
    # treat the watchdog as an eventual backstop, never as a bounded-latency one.
    # The final step records each observed interval and warns above 30 minutes
    # (#414); it measures scheduler reliability without claiming to improve it.
    - cron: '*/15 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: fleet-watchdog
  cancel-in-progress: false

jobs:
  selector-health:
    # Independent from watchdog: a slow or failed org-wide inventory must never
    # consume the deadlock cancellation job's established 10-minute budget.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_FASTLANE || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: .fleet-watchdog-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    timeout-minutes: 10
    steps:
      - name: Check out selector health
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .fleet-watchdog-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          persist-credentials: false

      - name: Report unsatisfiable runner selectors
        env:
          # Read-only org Actions inventory: queued jobs, runners, runner groups,
          # and selected-group repository admission. ORG_ADMIN_TOKEN already has
          # broader Actions write scope for the independent watchdog job; this
          # detector invokes only GET endpoints and never mutates org state.
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: bash scripts/runner-selector-health.sh

      - name: Remove the isolated selector-health checkout
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf ".fleet-watchdog-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"

  watchdog:
    # Never gate this job on the fleet it is policing.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_FASTLANE || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: .fleet-watchdog-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    timeout-minutes: 10
    steps:
      - name: Check out the watchdog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Schedule resolves this to the immutable default-branch SHA for the run.
          ref: ${{ github.sha }}
          path: .fleet-watchdog-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          persist-credentials: false

      - name: Confirm the retired poll watchdog has no candidates
        env:
          # Needs cross-repository read plus `actions: write` to cancel, which
          # `github.token` does not carry outside this repository.
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          WATCHDOG_ORG: ${{ github.repository_owner }}
          # The single place the arm/disarm decision lives; the script carries no
          # default of its own and faults on anything it cannot read as a
          # decision (#342). `schedule` supplies no inputs, so this expression is
          # the only one on the path that matters — the `inputs.dry_run == false`
          # form that made the switch inert is gone.
          #
          # Armed, because this switch now governs only the 35-minute age rule,
          # which is the rule with production evidence behind it (2026-08-03
          # 05:59Z, four preemptions, jam cleared). Disarming it would have
          # removed the only mitigation for a `privileged_merge` jam.
          WATCHDOG_DRY_RUN: ${{ vars.CI_WATCHDOG_DRY_RUN || 'false' }}
          # The #343 poll-step rule is new and has no production evidence, so it
          # reports only until an operator sets
          # `CI_WATCHDOG_POLL_STEP_DRY_RUN=false` after reading a few
          # `DRY RUN would cancel` lines. Separate switch, not a second default
          # for the same decision: the two rules carry different evidence, and a
          # default that can only SUPPRESS a cancel cannot ship armed by drift
          # the way #336 did.
          WATCHDOG_POLL_STEP_DRY_RUN: ${{ vars.CI_WATCHDOG_POLL_STEP_DRY_RUN || 'true' }}
          # Fallback for a poll workflow with no separable poll step, i.e.
          # `AI privileged merge`, whose 45-minute ceiling this still fits under.
          WATCHDOG_MIN_AGE_MINUTES: '35'
          # Floor for the provable-poll path (#343). The 2026-08-03 jam was fully
          # formed at ~12 minutes.
          WATCHDOG_MIN_POLL_MINUTES: '10'
        run: bash scripts/fleet-watchdog.sh

      - name: Record the observed scheduler interval
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_MAX_GAP_MINUTES: '30'
        run: python3 -I scripts/fleet-watchdog-cadence.py

      - name: Remove the isolated watchdog checkout
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf ".fleet-watchdog-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
