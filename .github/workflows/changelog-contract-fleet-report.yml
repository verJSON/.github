name: Changelog contract fleet report

on:
  workflow_call:
    inputs:
      app_client_id:
        description: GitHub App client ID for the read-only organization inventory.
        required: true
        type: string
    secrets:
      RENOVATE_COMPATIBILITY_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.repository == 'Verjson/verjson-agents' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate caller inputs
        env:
          APP_CLIENT_ID: ${{ inputs.app_client_id }}
        run: |
          if [[ ! "$APP_CLIENT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::app_client_id must be a numeric GitHub App client ID."
            exit 1
          fi

      - name: Check out the pinned inventory implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: contract-source
          persist-credentials: false

      - name: Mint read-only organization inventory token
        id: inventory-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.RENOVATE_COMPATIBILITY_APP_PRIVATE_KEY }}
          owner: Verjson
          permission-contents: read

      - name: Inventory and render contract drift
        id: inventory
        working-directory: contract-source
        env:
          GH_TOKEN: ${{ steps.inventory-token.outputs.token }}
          INVENTORY_PATH: ${{ runner.temp }}/contract-inventory.tsv
          DIAGNOSTICS_PATH: ${{ runner.temp }}/contract-inventory.log
          REPORT_PATH: ${{ runner.temp }}/contract-inventory-report.md
        run: |
          set +e
          python3 -I scripts/fleet-contract-inventory.py >"$INVENTORY_PATH" 2>"$DIAGNOSTICS_PATH"
          inventory_status=$?
          set -e
          python3 -I scripts/render-fleet-contract-inventory-report.py \
            --inventory "$INVENTORY_PATH" \
            --diagnostics "$DIAGNOSTICS_PATH" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --inventory-status "$inventory_status" \
            --output "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "inventory_status=$inventory_status" >> "$GITHUB_OUTPUT"

      - name: Upload private inventory report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-contract-fleet-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/contract-inventory.tsv
            ${{ runner.temp }}/contract-inventory.log
            ${{ runner.temp }}/contract-inventory-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Fail on an incomplete inventory
        if: ${{ always() && steps.inventory.outputs.inventory_status != '0' }}
        run: |
          echo "::error::The fleet inventory was incomplete; inspect the private report and diagnostics."
          exit 1
