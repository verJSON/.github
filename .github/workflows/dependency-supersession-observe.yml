name: Dependency supersession observation

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name in this organization to observe
        required: true
        type: string

permissions:
  contents: read

jobs:
  observe:
    runs-on: ${{ fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .dependency-supersession-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .dependency-supersession-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          persist-credentials: false
          # An exact non-cone list of the files this job reads: ADR 0235's
          # backlog digest binds every byte a checkout puts on disk, and a
          # full checkout would put the whole tree there. Keep it in step
          # with backlog-sparse-closure.test.py, which derives the programs
          # and their imports and requires each one listed here.
          sparse-checkout: scripts/dependency-supersession.py
          sparse-checkout-cone-mode: false
      - name: Validate exact target repository
        id: target
        env:
          REPOSITORY_NAME: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_NAME" =~ ^[ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-]+$ ]] || {
            echo '::error::repository must be one unqualified repository name'
            exit 1
          }
          printf 'repository=%s/%s\n' "$GITHUB_REPOSITORY_OWNER" "$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
      - name: Require the read-only compatibility App client ID
        env:
          APP_CLIENT_ID: ${{ vars.RENOVATE_COMPATIBILITY_CLIENT_ID }}
        run: |
          [[ -n "$APP_CLIENT_ID" && ! "$APP_CLIENT_ID" =~ ^[0123456789]+$ ]] || {
            echo '::error::RENOVATE_COMPATIBILITY_CLIENT_ID must be a nonnumeric GitHub App client ID'
            exit 1
          }
      - name: Mint exact-repository read-only observation token
        id: observer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RENOVATE_COMPATIBILITY_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_COMPATIBILITY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repository }}
          permission-contents: read
          permission-pull-requests: read
      - name: Produce immutable observe-only proposal
        env:
          GH_TOKEN: ${{ steps.observer-token.outputs.token }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          python3 -I scripts/dependency-supersession.py observe \
            --repository "$TARGET_REPOSITORY" \
            --output dependency-supersession-proposal.json
          jq -e '.schema == "canonical-dependency-supersession/v1" and .mode == "observe-only" and .repository == env.TARGET_REPOSITORY' \
            dependency-supersession-proposal.json >/dev/null
          jq '{mode,repository,proposals:(.proposals | length),refused:(.refused | length)}' \
            dependency-supersession-proposal.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable proposal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-supersession-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dependency-supersession-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/dependency-supersession-proposal.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove the isolated checkout
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf ".dependency-supersession-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
