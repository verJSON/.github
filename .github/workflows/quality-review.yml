# Advisory quality review (#1820 / ADR 0270). Never a required check.
name: quality-review

on:
  workflow_call:
    inputs:
      contract_ref:
        description: Immutable Verjson/.github commit containing this workflow and scripts
        required: true
        type: string
      provider:
        description: Provider id from config/quality-review-providers.json
        required: false
        type: string
        default: ""
      model:
        description: Optional pinned model override (never *-latest)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Always GitHub-hosted: advisory review fetches the PR diff over the API and
    # never executes PR head code (ADR 0235 / #1831 / #1820).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Require an immutable contract pin
        env:
          CONTRACT_REF: ${{ inputs.contract_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTRACT_REF" =~ ^[0123456789abcdef]{40}$ ]]; then
            echo "::error::contract_ref must be a full 40-character lower-case commit SHA"
            exit 1
          fi

      - name: Resolve mode
        id: mode
        env:
          MODE: ${{ vars.QUALITY_REVIEW }}
          # Exact label match only (comma-joined names bounded by commas).
          HAS_LABEL: ${{ contains(format(',{0},', join(github.event.pull_request.labels.*.name, ',')), ',quality-review,') }}
        run: |
          set -euo pipefail
          mode="${MODE:-off}"
          case "$mode" in
            off|label|auto) ;;
            *)
              echo "summary=quality evidence not obtained: invalid QUALITY_REVIEW mode '$mode'" >>"$GITHUB_OUTPUT"
              echo "run=false" >>"$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ "$mode" = "off" ]; then
            echo "summary=quality evidence not obtained: QUALITY_REVIEW=off" >>"$GITHUB_OUTPUT"
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$mode" = "label" ] && [ "$HAS_LABEL" != "true" ]; then
            echo "summary=quality evidence not obtained: quality-review label absent" >>"$GITHUB_OUTPUT"
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >>"$GITHUB_OUTPUT"

      - name: Refuse a symlink at the .quality-review-contract checkout path
        if: steps.mode.outputs.run == 'true'
        run: |
          if [ -L .quality-review-contract ]; then echo "::error::.quality-review-contract is a symlink; actions/checkout would empty its target"; exit 1; fi

      - name: Check out contract (no PR head)
        if: steps.mode.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ inputs.contract_ref }}
          path: .quality-review-contract
          persist-credentials: false

      - name: Fetch PR diff
        if: steps.mode.outputs.run == 'true'
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-review"
          out="$RUNNER_TEMP/quality-review/pr.diff"
          # Read-only REST diff; never checkout PR head. API failure stays green.
          set +e
          gh api \
            -H "Accept: application/vnd.github.diff" \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            >"$out" 2>"$RUNNER_TEMP/quality-review/diff.err"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            summary="quality evidence not obtained: diff fetch failed (exit $status)"
            printf '%s\n' "$summary" >>"$GITHUB_STEP_SUMMARY"
            echo "summary=$summary" >>"$GITHUB_OUTPUT"
            echo "ok=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "path=$out" >>"$GITHUB_OUTPUT"
          echo "ok=true" >>"$GITHUB_OUTPUT"

      - name: Acquire pinned gitleaks
        if: steps.mode.outputs.run == 'true' && steps.diff.outputs.ok == 'true'
        id: gitleaks
        env:
          # Upstream release asset digests from gitleaks_8.30.1_checksums.txt
          # (archive) and the extracted linux_x64 binary (sha256sum).
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_BINARY_SHA256: "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-review/gitleaks"
          cd "$RUNNER_TEMP/quality-review/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          set +e
          curl -fsSL "$url" -o "$archive"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            summary="quality evidence not obtained: gitleaks download failed (exit $status)"
            printf '%s\n' "$summary" >>"$GITHUB_STEP_SUMMARY"
            {
              echo "summary=$summary"
              echo "ok=false"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict; then
            summary='quality evidence not obtained: gitleaks archive digest mismatch'
            printf '%s\n' "$summary" >>"$GITHUB_STEP_SUMMARY"
            {
              echo "summary=$summary"
              echo "ok=false"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi
          tar -xzf "$archive" gitleaks
          chmod +x gitleaks
          if ! printf '%s  %s\n' "$GITLEAKS_BINARY_SHA256" gitleaks | sha256sum --check --strict; then
            summary='quality evidence not obtained: gitleaks binary digest mismatch'
            printf '%s\n' "$summary" >>"$GITHUB_STEP_SUMMARY"
            {
              echo "summary=$summary"
              echo "ok=false"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "path=$RUNNER_TEMP/quality-review/gitleaks/gitleaks"
            echo "binary_sha256=$GITLEAKS_BINARY_SHA256"
            echo "ok=true"
          } >>"$GITHUB_OUTPUT"

      - name: Evaluate
        if: steps.mode.outputs.run == 'true' && steps.diff.outputs.ok == 'true'
        id: evaluate
        env:
          DIFF_PATH: ${{ steps.diff.outputs.path }}
          GITLEAKS_PATH: ${{ steps.gitleaks.outputs.path }}
          GITLEAKS_OK: ${{ steps.gitleaks.outputs.ok }}
          GITLEAKS_SUMMARY: ${{ steps.gitleaks.outputs.summary }}
          GITLEAKS_BINARY_SHA256: ${{ steps.gitleaks.outputs.binary_sha256 }}
          PROVIDER_INPUT: ${{ inputs.provider }}
          MODEL_INPUT: ${{ inputs.model }}
          PROVIDER_VAR: ${{ vars.QUALITY_REVIEW_PROVIDER }}
          MODEL_VAR: ${{ vars.QUALITY_REVIEW_MODEL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/.quality-review-contract/scripts
        run: |
          set -euo pipefail
          if [ "${GITLEAKS_OK:-}" != "true" ]; then
            summary="${GITLEAKS_SUMMARY:-quality evidence not obtained: gitleaks scanner absent}"
            printf '%s\n' "$summary" >>"$GITHUB_STEP_SUMMARY"
            echo "summary=$summary" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          provider="${PROVIDER_INPUT:-}"
          if [ -z "$provider" ]; then
            provider="${PROVIDER_VAR:-jev}"
          fi
          model="${MODEL_INPUT:-}"
          if [ -z "$model" ]; then
            model="${MODEL_VAR:-}"
          fi
          # Without a selected secret, stay advisory-green via not-obtained.
          if [ -z "${JEV_API_KEY:-}" ] && [ "$provider" = "jev" ]; then
            summary='quality evidence not obtained: JEV_API_KEY absent'
            printf '%s\n' "$summary" >>"$GITHUB_STEP_SUMMARY"
            echo "summary=$summary" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          export QR_PROVIDER="$provider"
          export QR_MODEL="$model"
          set +e
          # -I ignores PYTHONPATH; inject the contract scripts dir explicitly.
          summary="$(python3 -I - <<'PY'
          import os
          import sys
          from pathlib import Path

          scripts = Path(os.environ["GITHUB_WORKSPACE"]) / ".quality-review-contract" / "scripts"
          sys.path.insert(0, str(scripts))
          from quality_review.gitleaks import subprocess_scanner, verify_pinned_binary
          from quality_review.run import run_review

          binary = Path(os.environ["GITLEAKS_PATH"])
          verify_pinned_binary(binary, os.environ["GITLEAKS_BINARY_SHA256"])
          scanner = subprocess_scanner(binary)
          diff = Path(os.environ["DIFF_PATH"]).read_text(encoding="utf-8", errors="replace")
          model = os.environ.get("QR_MODEL") or None
          result = run_review(
              diff,
              provider_id=os.environ["QR_PROVIDER"],
              api_key=os.environ.get("JEV_API_KEY"),
              model_override=model,
              scanner=scanner,
          )
          print(result.summary)
          PY
          )"
          status=$?
          set -e
          if [ "$status" -ne 0 ] || [ -z "${summary:-}" ]; then
            summary="quality evidence not obtained: evaluate failed (exit ${status:-?})"
          fi
          printf '%s\n' "$summary" >>"$GITHUB_STEP_SUMMARY"
          echo "summary=$summary" >>"$GITHUB_OUTPUT"

      - name: Record skipped mode
        if: steps.mode.outputs.run != 'true'
        env:
          SUMMARY: ${{ steps.mode.outputs.summary }}
        run: |
          set -euo pipefail
          printf '%s\n' "${SUMMARY:-quality evidence not obtained: skipped}" >>"$GITHUB_STEP_SUMMARY"

      - name: Write artifact and sticky comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY: ${{ steps.evaluate.outputs.summary || steps.gitleaks.outputs.summary || steps.diff.outputs.summary || steps.mode.outputs.summary }}
        run: |
          set -euo pipefail
          # Do not read the contract checkout here: this step runs under
          # always() and must stay safe if the symlink refusal stopped checkout.
          summary="${SUMMARY:-quality evidence not obtained: skipped}"
          mkdir -p "$RUNNER_TEMP/quality-review"
          export SUMMARY="$summary"
          python3 -I - <<'PY' >"$RUNNER_TEMP/quality-review/report.json"
          import json, os
          summary = os.environ.get("SUMMARY") or "quality evidence not obtained: skipped"
          print(json.dumps({
              "obtained": not summary.startswith("quality evidence not obtained:"),
              "summary": summary,
              "provider": None,
              "model": None,
              "answers": [],
              "dropped": [],
          }, indent=2, sort_keys=True))
          PY
          marker='<!-- quality-review:v1 -->'
          body="$(printf '%s\n## Advisory quality review\n\n%s\n\n_Advisory only — never a required check (ADR 0270)._\n' "$marker" "$summary")"
          set +e
          existing="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
          comment_id="$(printf '%s' "$existing" | jq -r --arg m "$marker" '.[] | select((.body // "") | contains($m)) | .id' | head -n1)"
          if [ -n "${comment_id:-}" ] && [ "$comment_id" != "null" ]; then
            gh api -X PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api -X POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
          set -e

      - name: Upload quality-review artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-review-report
          path: ${{ runner.temp }}/quality-review/report.json
          if-no-files-found: ignore
