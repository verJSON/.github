name: Merge admission

# This repository's own merge-admission producer (ADR 0260, #1990, #2031). It posts the
# `merge-admission` context while no ruleset requires it. Every trigger starts a run on the
# default-branch commit, outside every pull-request head's workflow-run and check-run
# inventories (ADR 0260, action 3); pull-request and review events reach it only through
# the keyless `Merge admission trigger` workflow, which completes first.
on:
  # Completion of each workflow that reports a check on a pull-request head, and of the
  # trigger (ADR 0260, action 5). The producer's own path is not listed.
  # scripts/ci-gate/merge-admission-workflow.test.py derives this list from every workflow
  # here that a pull-request or review event starts and requires an exact match.
  workflow_run:
    workflows:
      - Merge admission trigger
      - actions-ci
      - actionlint
      - actionlint reusable-call contract
      - container candidate reusable-call contract
      - runner-isolation
      - AI review authorization arm
      - AI review label re-arm
      - AI review lifecycle re-arm
      - AI review + auto-merge
      - Authn required type surface
      - CLI projects required package surface
    types: [completed]
  # The periodic sweep, targeted every 15 minutes. A schedule is best-effort: GitHub delays
  # or drops scheduled runs under load and disables them on a public repository after 60
  # days without activity, so this is a target the canaries measure, not a bound (ADR 0260).
  # It is also the completion trigger for checks from Apps other than GitHub Actions:
  # `check_suite` is not yet classified by the ADR 0235 runner-isolation checker, so that
  # window is documented in ADR 0260 instead.
  # It also covers ruleset edits and changes no event reports.
  schedule:
    - cron: '*/15 * * * *'
  # A sweep on demand, after a ruleset edit (no event reports one to a workflow).
  workflow_dispatch: {}

# Bounds the fan-out (ADR 0260, 2026-11-12 fan-out amendment): one running and one pending
# run per group, and a newer pending run replaces an older one. The key repeats the plan
# job's EVENT_HEAD choice: a completed pull-request or review run names its head, so its
# group is that head and the replacing run evaluates the same head with later state; every
# other trigger plans a sweep, so it joins the single sweep group and the replacing sweep
# covers every head. A running run is never cancelled. The `-caller-` prefix keeps these
# groups distinct from the evaluate job's per-head groups.
concurrency:
  group: merge-admission-caller-${{ contains(fromJSON('["pull_request","pull_request_target","pull_request_review"]'), github.event.workflow_run.event) && github.event.workflow_run.head_sha || 'sweep' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admit:
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/merge-admission.yml
    # The App key lives only in the `ai-review-app` environment; a reusable workflow's
    # environment-bound jobs resolve it only through inheritance (ADR 0171, #2031).
    secrets: inherit
    with:
      ai_review_environment: ai-review-app
