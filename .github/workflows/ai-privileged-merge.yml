name: AI terminal merge promotion

# Required check configuration (ADR 0079): require the context
# `AI review authorization` from the dedicated authorization App, not the
# workflow job named `gate`. The App must have Checks and pull requests write
# permissions; changing its permissions requires organization approval and may
# require reinstalling the App before these workflows are enabled. Roll out this
# workflow and gate-rearm first, migrate the ruleset identity second, then retire
# the old required-workflow rule. Roll back by restoring the old required
# workflow before removing this context.
on:
  workflow_dispatch:
    inputs:
      merge_environment:
        description: Main-only environment containing the merge App private key
        required: true
        type: string
        default: merge-app
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      authorization_check_id:
        required: true
        type: string
      arm_run_id:
        required: true
        type: string
      arm_run_attempt:
        required: true
        type: string
      review_policy:
        description: Exact opaque policy envelope from the immutable arm receipt
        required: true
        type: string
      source_run_id:
        required: false
        type: string
  workflow_call:
    inputs:
      merge_environment:
        description: Main-only environment containing the merge App private key
        required: true
        type: string
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      authorization_check_id:
        required: true
        type: string
      arm_run_id:
        required: true
        type: string
      arm_run_attempt:
        required: true
        type: string
      review_policy:
        required: true
        type: string
      source_run_id:
        required: false
        type: string
      required_checks:
        required: true
        type: string
      runner_labels:
        required: false
        type: string
      privileged_lane:
        required: false
        type: string
      merge_app_client_id:
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-terminal-promotion-${{ inputs.pr_number }}-${{ inputs.expected_head_sha }}
  cancel-in-progress: false

jobs:
  app-key-policy:
    uses: ./.github/workflows/app-key-environment.yml
    permissions:
      actions: read
      contents: read
    with:
      role: merge
      environment: ${{ inputs.merge_environment }}

  invalid_verjson_route:
    if: ${{ github.repository_owner == 'Verjson' && !(github.event.repository.visibility == 'public' && (github.repository == 'Verjson/.github' || github.repository == 'Verjson/verjson-github-runner') || github.event.repository.visibility == 'private' && github.repository != 'Verjson/.github' && github.repository != 'Verjson/verjson-github-runner') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Reject unavailable or unregistered privileged route
        run: |
          echo "::error::privileged terminal route is unregistered or visibility is unavailable"
          exit 1

  validate_privileged_lane:
    if: ${{ github.repository_owner == 'Verjson' && github.event.repository.visibility == 'private' && github.repository != 'Verjson/.github' && github.repository != 'Verjson/verjson-github-runner' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    env:
      PRIVILEGED_LANE: ${{ inputs.privileged_lane }}
    steps:
      - name: Validate caller-supplied privileged lane routing
        run: |
          set -euo pipefail
          # A here-string always appends a trailing newline, so an unset,
          # empty, or whitespace-only PRIVILEGED_LANE feeds jq a stream with
          # no JSON values. jq treats that as "the filter never ran" and
          # exits 0 regardless of -e (#1612), so -e alone cannot be trusted.
          # Trailing garbage after a valid value (e.g. a second concatenated
          # JSON value) is the mirror problem: jq emits "true" for the first
          # value on stdout, then fails on the remainder, so stdout alone
          # cannot be trusted either. Require both: -e's exit status AND an
          # exact "true" on stdout.
          # Capture the assignment's status here, before another command replaces $?.
          lane_check="$(jq -e '. == ["ubuntu-24.04"]' <<<"${PRIVILEGED_LANE:-}" 2>/dev/null)" \
            && lane_check_status=0 || lane_check_status=$?
          [ "$lane_check_status" -eq 0 ] && [ "$lane_check" = "true" ] || {
            echo "::error::privileged_lane is missing, malformed, or is not the exact admitted ubuntu-24.04 lane (ADR 0118); got: ${PRIVILEGED_LANE:-<empty>}"
            exit 1
          }
          echo "privileged_lane validated: exact match for the admitted ubuntu-24.04 lane."

  privileged_merge:
    environment: ${{ inputs.merge_environment }}
    needs: [validate_privileged_lane, app-key-policy]
    if: ${{ needs.app-key-policy.result == 'success' && (always() && (github.repository_owner != 'Verjson' || github.event.repository.visibility == 'public' && (github.repository == 'Verjson/.github' || github.repository == 'Verjson/verjson-github-runner') || github.event.repository.visibility == 'private' && github.repository != 'Verjson/.github' && github.repository != 'Verjson/verjson-github-runner' && inputs.privileged_lane == '["ubuntu-24.04"]' && needs.validate_privileged_lane.result == 'success')) }}
    runs-on: ${{ github.repository_owner != 'Verjson' && inputs.runner_labels && fromJSON(inputs.runner_labels) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.visibility == 'public' && 'ubuntu-24.04' || fromJSON(inputs.privileged_lane) }}
    timeout-minutes: 5
    outputs:
      arm_receipt_artifact_id: ${{ steps.export-cleanup-receipt.outputs.arm_receipt_artifact_id }}
      terminal_merge_succeeded: ${{ steps.export-cleanup-receipt.outputs.terminal_merge_succeeded }}
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    env:
      AUTHORIZATION_CHECK_ID: ${{ inputs.authorization_check_id }}
      ARM_RUN_ID: ${{ inputs.arm_run_id }}
      ARM_RUN_ATTEMPT: ${{ inputs.arm_run_attempt }}
      REVIEW_POLICY: ${{ inputs.review_policy }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXPECTED_APP_ID: ${{ vars.AI_REVIEW_APP_ID }}
      EXPECTED_APP_SLUG: ${{ vars.AI_REVIEW_APP_SLUG }}
      PR_NUMBER: ${{ inputs.pr_number }}
      TARGET_REPO: ${{ github.repository }}
      REQUIRED_CHECK_POLICY: ${{ github.repository == 'Verjson/.github' && '[{"name":"shell-tests","app_id":15368,"workflow_id":315894159,"workflow_path":".github/workflows/actions-ci.yml"}]' || inputs.required_checks }}
    steps:
      - name: Validate terminal merge App and target repository
        id: merge-target
        env:
          MERGE_APP_CLIENT_ID: ${{ inputs.merge_app_client_id || vars.MERGE_APP_CLIENT_ID }}
          REPOSITORY_CONTEXT: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$MERGE_APP_CLIENT_ID" =~ ^Iv[0-9A-Za-z]{18}$ ]]; then
            echo "::error::MERGE_APP_CLIENT_ID must be a canonical GitHub App client ID, not an empty, malformed, or numeric legacy App ID."
            exit 1
          fi
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "::error::target repository identity is malformed"; exit 1;
          }
          [ "$TARGET_REPO" = "$REPOSITORY_CONTEXT" ] || {
            echo "::error::target repository differs from the trusted workflow context"; exit 1;
          }
          owner="${TARGET_REPO%%/*}"
          repository="${TARGET_REPO#*/}"
          printf 'owner=%s\nrepository=%s\n' "$owner" "$repository" >>"$GITHUB_OUTPUT"

      - name: Resolve executing trusted workflow revision
        id: trusted-revision
        env:
          EXECUTING_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: echo "sha=$EXECUTING_WORKFLOW_SHA" >>"$GITHUB_OUTPUT"

      - name: Check out immutable arm verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ steps.trusted-revision.outputs.sha }}
          path: .gate-trust
          sparse-checkout: |
            scripts/ci-gate/closing-issue-visibility.py
            scripts/ci-gate/terminal-merge.sh
            scripts/ci-gate/verify-arm-receipt.sh
            scripts/ci-gate/review-policy-envelope.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize terminal merge from trusted metadata
        id: authorize-merge
        env:
          CALLER_REF: ${{ github.ref }}
          EXECUTING_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          EXECUTING_WORKFLOW_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::read-only repository token is unavailable"; exit 1; }
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$AUTHORIZATION_CHECK_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1

          default_branch="$(gh api "repos/$TARGET_REPO" --jq '.default_branch // ""')"
          [[ "$default_branch" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          [ "$CALLER_REF" = "refs/heads/$default_branch" ] || {
            echo "::error::promotion must execute from the target repository default branch"; exit 1;
          }
          [ "$EXECUTING_WORKFLOW_REPOSITORY" = Verjson/.github ] || {
            echo "::error::promotion is not executing from the canonical workflow repository"; exit 1;
          }
          [[ "$EXECUTING_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          canonical_main="$(gh api repos/Verjson/.github/commits/main --jq '.sha // ""')"
          [[ "$canonical_main" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ "$EXECUTING_WORKFLOW_SHA" != "$canonical_main" ]; then
            relation="$(gh api "repos/Verjson/.github/compare/$EXECUTING_WORKFLOW_SHA...$canonical_main" --jq '.status // ""')"
            [ "$relation" = ahead ] || {
              echo "::error::executing promotion revision is not reachable from canonical main"; exit 1;
            }
          fi

          meta="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
            --json state,isDraft,title,labels,headRefOid,headRepositoryOwner)"
          actual_head="$(jq -r '.headRefOid // ""' <<<"$meta")"
          # Every non-OPEN state is a no-op — no merge fires on any branch here —
          # but they are different events and must not share one silent `exit 0`.
          # MERGED is the ordinary duplicate-dispatch race. CLOSED means the gate
          # authorized a head a human then closed, and an unreadable state means
          # the metadata read did not resolve; both are upstream anomalies, and a
          # run that reports nothing makes them indistinguishable from the race.
          case "$(jq -r '.state // ""' <<<"$meta")" in
            OPEN) ;;
            MERGED) echo "Promotion is a no-op: PR #$PR_NUMBER is already merged."; exit 0 ;;
            CLOSED) echo "Promotion is a no-op: PR #$PR_NUMBER was closed without merging."; exit 0 ;;
            *) echo "Promotion is a no-op: PR #$PR_NUMBER has no readable state."; exit 0 ;;
          esac
          [ "$actual_head" = "$EXPECTED_HEAD_SHA" ] || {
            echo "Superseded promotion is a no-op: expected $EXPECTED_HEAD_SHA, current head is $actual_head."
            exit 0
          }
          export ARM_RECEIPT_ARTIFACT_ID_FILE="$RUNNER_TEMP/arm-receipt-artifact-id"
          bash .gate-trust/scripts/ci-gate/verify-arm-receipt.sh
          policy_json="$(python3 .gate-trust/scripts/ci-gate/review-policy-envelope.py decode "$REVIEW_POLICY")" || {
            echo "::error::receipt-bound review policy is malformed"; exit 1;
          }
          [ "$(jq -r '.authority // "human"' <<<"$policy_json")" = ai-merge ] || {
            echo "::error::receipt-bound authority does not permit terminal merge"; exit 1;
          }
          [ "$(jq -r '.headRepositoryOwner.login // ""' <<<"$meta")" = "$GITHUB_REPOSITORY_OWNER" ] || {
            echo "::error::fork PRs are not eligible for autonomous merge"; exit 1;
          }
          held="$(jq -r '
            ([.labels[].name | ascii_upcase | gsub("[ _-]+";" ")]) as $labels
            | (.isDraft or ($labels | index("HOLD")) or
               ($labels | index("DO NOT MERGE")) or
               (.title | ascii_upcase | test("(^|[^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_])DO NOT MERGE([^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_]|$)")))
            | if . then "true" else "false" end' <<<"$meta")"
          [ "$held" = false ] || exit 0

          authorization="$(gh api "repos/$TARGET_REPO/check-runs/$AUTHORIZATION_CHECK_ID")"
          jq -e --arg head "$EXPECTED_HEAD_SHA" '
            .name == "AI review authorization" and
            .head_sha == $head and
            .status == "completed" and
            (.conclusion | ascii_upcase) == "SUCCESS" and
            .app.id == 15368 and .app.slug == "github-actions"
          ' <<<"$authorization" >/dev/null || {
            echo "::error::authorization is absent, stale, unsuccessful, or from the wrong integration"; exit 1;
          }
          reviews="$(gh api --paginate \
            "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews?per_page=100" | jq -s '.')"
          jq -e --arg head "$EXPECTED_HEAD_SHA" \
            --arg login "${EXPECTED_APP_SLUG}[bot]" \
            --arg check "$AUTHORIZATION_CHECK_ID" '
              type == "array" and all(.[]; type == "array") and
              any(.[][];
                .state == "APPROVED" and .commit_id == $head and
                .user.login == $login and
                (.body | contains("ai-review-authorization:" + $check)))
            ' <<<"$reviews" >/dev/null || {
              echo "::error::the exact-head dedicated App approval is absent"; exit 1;
            }

          required_checks="${REQUIRED_CHECK_POLICY:-}"
          jq -e 'type == "array" and length > 0 and
            ([.[].name] | unique | length) == length and all(.[];
            type == "object" and
            (keys | sort) == ["app_id", "name", "workflow_id", "workflow_path"] and
            (.name | type == "string" and length > 0 and
             all(explode[]; . >= 32 and (. < 127 or . > 159) and . != 8232 and . != 8233) and
             (contains("$" + "{{") | not)) and
            (.app_id | type == "number" and . > 0 and floor == .) and
            (.workflow_id | type == "number" and . > 0 and floor == .) and
            (.workflow_path | type == "string" and test("^\\.github/workflows/[A-Za-z0-9._-]+\\.ya?ml$")) and
            (.name | test("^(AI review authorization|AI terminal merge promotion|AI terminal promotion retry)$") | not) and
            (.workflow_path | test("/ai-(review-merge|privileged-merge|promotion-retry)\\.yml$") | not)
          )' \
            <<<"$required_checks" >/dev/null || {
            echo "::error::required_checks must declare trusted non-promotion Actions checks"; exit 1;
          }
          all_checks="$(gh api --paginate "repos/$TARGET_REPO/commits/$EXPECTED_HEAD_SHA/check-runs?per_page=100" | jq -s '[.[].check_runs[]]')"
          default_branch="$(gh api "repos/$TARGET_REPO" --jq '.default_branch // ""')"
          [[ "$default_branch" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          # The adopter's default branch is adopter-controlled text, and the guard above is a
          # general-purpose input check that sits far from the reads below. Encode it here so
          # relaxing that guard cannot re-arm an injection. Two encodings, not one:
          # $branch_ref for a query VALUE, where "/" is an ordinary character the API wants
          # literal; $branch_path for a PATH segment, where a literal "/" re-addresses the
          # resource -- heads/../../x would leave the endpoint entirely -- so the
          # slash-restoring gsub is deliberately absent there.
          branch_ref="$(jq -rn --arg branch "$default_branch" '$branch | @uri | gsub("%2F"; "/")')"
          branch_path="$(jq -rn --arg branch "$default_branch" '$branch | @uri')"
          while IFS= read -r required; do
            name="$(jq -r .name <<<"$required")"
            expected_app_id="$(jq -r .app_id <<<"$required")"
            expected_workflow_id="$(jq -r .workflow_id <<<"$required")"
            workflow_path="$(jq -r .workflow_path <<<"$required")"
            workflow_metadata=""
            if ! workflow_metadata="$(gh api "repos/$TARGET_REPO/actions/workflows/$expected_workflow_id")"; then
              echo "::error::required check $name names a deleted or unreadable workflow ID $expected_workflow_id"
              exit 1
            fi
            jq -e --arg path "$workflow_path" --argjson workflow_id "$expected_workflow_id" '
              .id == $workflow_id and .path == $path and .state == "active"
            ' <<<"$workflow_metadata" >/dev/null || {
              echo "::error::required check $name names a wrong, renamed, or inactive workflow"; exit 1;
            }
            latest="$(jq -c --arg name "$name" '[.[] | select(.name == $name)] | sort_by(.id) | last // {}' <<<"$all_checks")"
            check_id="$(jq -r '.id // ""' <<<"$latest")"
            if ! [[ "$check_id" =~ ^[1-9][0-9]*$ ]]; then
              workflow_runs="$(gh api --paginate \
                "repos/$TARGET_REPO/actions/workflows/$expected_workflow_id/runs?head_sha=$EXPECTED_HEAD_SHA&event=pull_request&per_page=100" \
                | jq -s '[.[].workflow_runs[]]')"
              latest_workflow_run="$(jq -c '[.[]] | sort_by(.id) | last // {}' <<<"$workflow_runs")"
              workflow_run_id="$(jq -r '.id // ""' <<<"$latest_workflow_run")"
              if ! [[ "$workflow_run_id" =~ ^[1-9][0-9]*$ ]]; then
                echo "Required check $name has not been reported because its trusted workflow has not started; a later workflow event will retry promotion."
                exit 0
              fi
              workflow_run_status="$(jq -r '.status // "" | ascii_upcase' <<<"$latest_workflow_run")"
              workflow_run_conclusion="$(jq -r '.conclusion // "" | ascii_upcase' <<<"$latest_workflow_run")"
              [ "$workflow_run_status" = COMPLETED ] || {
                echo "Required check $name is pending in trusted workflow run $workflow_run_id; a later workflow completion will retry promotion."
                exit 0
              }
              [ "$workflow_run_conclusion" = SUCCESS ] || {
                echo "::error::trusted workflow for required check $name is terminally unsuccessful: $workflow_run_conclusion"
                exit 1
              }
              echo "::error::trusted workflow completed successfully without required check $name; the reviewed policy is missing or renamed"
              exit 1
            fi
            jq -e --argjson app_id "$expected_app_id" '.app.id == $app_id' <<<"$latest" >/dev/null || {
              echo "::error::latest required check $name is from the wrong App"; exit 1;
            }
            status="$(jq -r '.status // "" | ascii_upcase' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // "" | ascii_upcase' <<<"$latest")"
            [ "$status" = COMPLETED ] || {
              echo "Required check $name is pending; a later workflow completion will retry promotion."; exit 0;
            }
            [ "$conclusion" = SUCCESS ] || {
              echo "::error::latest required check $name is terminally unsuccessful: $conclusion"; exit 1;
            }
            details_url="$(jq -r '.details_url // ""' <<<"$latest")"
            details_prefix="${GITHUB_SERVER_URL}/${TARGET_REPO}/actions/runs/"
            [[ "$details_url" == "$details_prefix"* ]] || {
              echo "::error::required check $name has untrusted Actions details"; exit 1;
            }
            details_suffix="${details_url#"$details_prefix"}"
            [[ "$details_suffix" =~ ^([1-9][0-9]*)(/job/[1-9][0-9]*)?$ ]] || {
              echo "::error::required check $name has malformed Actions details"; exit 1;
            }
            ci_run_id="${BASH_REMATCH[1]}"
            ci_run="$(gh api "repos/$TARGET_REPO/actions/runs/$ci_run_id")"
            expected_check_run_url="$GITHUB_API_URL/repos/$TARGET_REPO/check-runs/$check_id"
            ci_jobs="$(gh api --paginate "repos/$TARGET_REPO/actions/runs/$ci_run_id/jobs?per_page=100" \
              | jq -s '[.[].jobs[]]')"
            check_suite_id="$(jq -r '.check_suite.id // ""' <<<"$latest")"
            run_check_suite_id="$(jq -r '.check_suite_id // ""' <<<"$ci_run")"
            [[ "$check_suite_id" =~ ^[1-9][0-9]*$ ]] && [ "$check_suite_id" = "$run_check_suite_id" ] || {
              echo "::error::required check $name is not a member of its claimed trusted workflow run"; exit 1;
            }
            jq -e --arg url "$expected_check_run_url" --arg name "$name" '
              [.[] | select(.check_run_url == $url and .name == $name)] | length == 1
            ' <<<"$ci_jobs" >/dev/null || {
              echo "::error::required check $name is not the exact job check run of its claimed trusted workflow run"; exit 1;
            }
            jq -e --arg head "$EXPECTED_HEAD_SHA" --arg repo "$TARGET_REPO" \
              --arg path "$workflow_path" --argjson workflow_id "$expected_workflow_id" '
                .workflow_id == $workflow_id and .path == $path and
                .event == "pull_request" and .head_sha == $head and
                .head_repository.full_name == $repo
              ' <<<"$ci_run" >/dev/null || {
              echo "::error::required check $name is not backed by the trusted exact-head workflow run"; exit 1;
            }
            # Liveness/conclusion are checked separately from identity above: a
            # multi-job run whose required-check job already succeeded can still be
            # "in_progress" overall while a slower sibling job finishes (#1610). That
            # is retriable, not a trust failure — only a completed-but-unsuccessful
            # run is.
            ci_run_status="$(jq -r '.status // "" | ascii_upcase' <<<"$ci_run")"
            ci_run_conclusion="$(jq -r '.conclusion // "" | ascii_upcase' <<<"$ci_run")"
            [ "$ci_run_status" = COMPLETED ] || {
              echo "Required check $name is backed by workflow run $ci_run_id, which has not finished; a later workflow completion will retry promotion."; exit 0;
            }
            [ "$ci_run_conclusion" = SUCCESS ] || {
              echo "::error::workflow run $ci_run_id backing required check $name is terminally unsuccessful: $ci_run_conclusion"; exit 1;
            }
            head_workflow_blob="$(gh api "repos/$TARGET_REPO/contents/$workflow_path?ref=$EXPECTED_HEAD_SHA" --jq '.sha // ""')"
            trusted_workflow_blob="$(gh api "repos/$TARGET_REPO/contents/$workflow_path?ref=$branch_ref" --jq '.sha // ""')"
            [[ "$head_workflow_blob" =~ ^[0-9a-f]{40}$ ]] && [ "$head_workflow_blob" = "$trusted_workflow_blob" ] || {
              echo "::error::required check $name executed a workflow revision not equal to the trusted default branch"; exit 1;
            }
          done < <(jq -c '.[]' <<<"$required_checks")

          base_meta="$(gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER")"
          jq -e --arg head "$EXPECTED_HEAD_SHA" '
            .state == "open" and .head.sha == $head
          ' <<<"$base_meta" >/dev/null || {
            echo "::error::pull request moved or closed during base authorization"; exit 1;
          }
          base_ref="$(jq -r '.base.ref // ""' <<<"$base_meta")"
          authorized_base_sha="$(jq -r '.base.sha // ""' <<<"$base_meta")"
          [ "$base_ref" = "$default_branch" ] || {
            echo "::error::terminal promotion only accepts the trusted default branch as its base"; exit 1;
          }
          [[ "$authorized_base_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::pull request base OID is missing or malformed"; exit 1;
          }
          current_base_sha="$(gh api "repos/$TARGET_REPO/git/ref/heads/$branch_path" \
            --jq 'select(.object.type == "commit") | .object.sha // ""')"
          [[ "$current_base_sha" =~ ^[0-9a-f]{40}$ ]] && [ "$current_base_sha" = "$authorized_base_sha" ] || {
            echo "::error::pull request base is stale or the trusted default-branch ref moved during authorization"; exit 1;
          }

          printf 'authorized=true\ndefault_branch=%s\nauthorized_base_sha=%s\n' \
            "$default_branch" "$authorized_base_sha" >>"$GITHUB_OUTPUT"

      - name: Revalidate independent review receipt
        id: independent-review
        if: steps.authorize-merge.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker="<!-- independent-review:v1 pr:${PR_NUMBER} head:${EXPECTED_HEAD_SHA} verdict:approved -->"

          # author_association is not used as a gate: it reflects the *calling token's*
          # visibility into org membership, not the reviewer's actual standing (#1615 — a
          # default GITHUB_TOKEN without org-membership read access reports a real MEMBER as
          # "NONE"). The live collaborator-permission check is the authoritative eligibility
          # test instead.
          #
          # This is a PUBLIC repository, so dropping author_association means ANY GitHub
          # account can leave a review at the exact head SHA. Picking "whichever candidate has
          # the highest review ID" outright would let such a review — if posted after the real
          # approval — block or supersede it. Selection therefore walks candidates from the
          # highest ID down and accepts the first whose account currently holds admin/maintain,
          # skipping any that don't, rather than trusting the highest ID unconditionally. The
          # same walk is run again later to revalidate that nothing supersedes the accepted
          # receipt, so a single function is the one place this selection is defined (ADR 0208).
          #
          # The walk is bounded: without a cap, an attacker posting enough junk reviews above
          # the real approval could force this step through an unbounded number of live
          # permission lookups. Capping at MAX_CANDIDATE_LOOKUPS makes the worst case a
          # predictable, small amount of API calls rather than a griefing PR's review count —
          # exceeding it fails closed (no autonomous merge), same as finding no candidate at
          # all, rather than exhausting the token's request budget.
          MAX_CANDIDATE_LOOKUPS=20
          select_privileged_candidate() {
            local reviews_json="$1" cid clogin role attempts=0
            while IFS=$'\t' read -r cid clogin; do
              [ -n "$cid" ] || continue
              attempts=$((attempts + 1))
              [ "$attempts" -le "$MAX_CANDIDATE_LOOKUPS" ] || return 1
              role="$(gh api "repos/$TARGET_REPO/collaborators/$clogin/permission" \
                --jq '.role_name // ""' 2>/dev/null)" || role=""
              case "$role" in
                admin|maintain) printf '%s\t%s\n' "$cid" "$clogin"; return 0 ;;
              esac
            done < <(jq -r --arg head "$EXPECTED_HEAD_SHA" '
                [ .[][]
                  | select(
                      .commit_id == $head and
                      .user.type == "User" and
                      (.user.login | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9-]*$"))
                    )
                  | {id, login: .user.login}
                ]
                | sort_by(.id) | reverse | .[] | [.id, .login] | @tsv
              ' <<<"$reviews_json")
            return 1
          }

          reviews="$(gh api --paginate \
            "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews?per_page=100" | jq -s '.')"
          selected="$(select_privileged_candidate "$reviews")" || {
            echo "::error::an exact-head independent-review verdict is required before autonomous merge"; exit 1;
          }
          review_id="$(cut -f1 <<<"$selected")"
          reviewer="$(cut -f2 <<<"$selected")"

          live_review="$(gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews/$review_id")" || {
            echo "::error::could not re-fetch independent-review verdict $review_id"; exit 1;
          }
          jq -e --argjson id "$review_id" --arg head "$EXPECTED_HEAD_SHA" \
            --arg login "$reviewer" --arg marker "$marker" '
              .id == $id and
              .state == "COMMENTED" and
              .commit_id == $head and
              .user.type == "User" and
              .user.login == $login and
              (.body | type == "string" and gsub("^\\s+|\\s+$"; "") == $marker)
            ' <<<"$live_review" >/dev/null || {
              echo "::error::latest independent-review verdict is edited, withdrawn, dismissed, or not approving"; exit 1;
            }

          latest_reviews="$(gh api --paginate \
            "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews?per_page=100" | jq -s '.')"
          latest_selected="$(select_privileged_candidate "$latest_reviews")" || {
            echo "::error::could not revalidate latest independent-review verdict"; exit 1;
          }
          [ "$latest_selected" = "$selected" ] || {
            echo "::error::a later independent-review verdict superseded receipt $review_id"; exit 1;
          }
          echo "authorized=true" >>"$GITHUB_OUTPUT"
          echo "Independent review receipt $review_id for exact head $EXPECTED_HEAD_SHA was terminally revalidated for $reviewer."

      - name: Capture closing issue references
        if: steps.authorize-merge.outputs.authorized == 'true' && steps.independent-review.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .gate-trust/scripts/ci-gate/closing-issue-visibility.py capture \
            --output "$RUNNER_TEMP/closing-issues.json"

      - name: Mint exact-repository terminal merge App token
        if: steps.authorize-merge.outputs.authorized == 'true' && steps.independent-review.outputs.authorized == 'true'
        id: merge-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.merge_app_client_id || vars.MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          owner: ${{ steps.merge-target.outputs.owner }}
          repositories: ${{ steps.merge-target.outputs.repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge the authorized head
        id: terminal-merge
        if: steps.authorize-merge.outputs.authorized == 'true' && steps.independent-review.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ steps.merge-app-token.outputs.token }}
          AUTHORIZED_BASE_SHA: ${{ steps.authorize-merge.outputs.authorized_base_sha }}
          DEFAULT_BRANCH: ${{ steps.authorize-merge.outputs.default_branch }}
        run: |
          set -euo pipefail
          bash .gate-trust/scripts/ci-gate/terminal-merge.sh

      - name: Confirm terminal merge state
        id: confirm-terminal-merge
        if: ${{ always() && steps.authorize-merge.outputs.authorized == 'true' && steps.independent-review.outputs.authorized == 'true' && steps.terminal-merge.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merged="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json state,headRefOid)"
          jq -e --arg head "$EXPECTED_HEAD_SHA" '.state == "MERGED" and .headRefOid == $head' \
            <<<"$merged" >/dev/null || {
            echo "::error::GitHub did not confirm terminal merge of the authorized head"; exit 1;
          }
          echo "Merged authorized head $EXPECTED_HEAD_SHA after every declared required check succeeded."

      - name: Export terminal merge cleanup receipt
        id: export-cleanup-receipt
        if: steps.confirm-terminal-merge.outcome == 'success'
        run: |
          set -euo pipefail
          receipt_artifact_id="$(<"$RUNNER_TEMP/arm-receipt-artifact-id")"
          [[ "$receipt_artifact_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::confirmed terminal merge lacks a valid arm receipt artifact ID"
            exit 1
          }
          printf 'arm_receipt_artifact_id=%s\nterminal_merge_succeeded=true\n' \
            "$receipt_artifact_id" >>"$GITHUB_OUTPUT"

      - name: Report closing issue outcomes
        if: steps.authorize-merge.outputs.authorized == 'true' && steps.independent-review.outputs.authorized == 'true' && steps.terminal-merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .gate-trust/scripts/ci-gate/closing-issue-visibility.py report \
            --input "$RUNNER_TEMP/closing-issues.json"

  cleanup_arm_receipt:
    needs: privileged_merge
    if: ${{ always() && needs.privileged_merge.outputs.terminal_merge_succeeded == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      actions: write
    env:
      ARM_RECEIPT_ARTIFACT_ID: ${{ needs.privileged_merge.outputs.arm_receipt_artifact_id }}
      TARGET_REPO: ${{ github.repository }}
    steps:
      - name: Delete consumed arm receipt artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The receipt has now served its purpose: this is the terminal
          # consumption after a successful terminal merge, not an intermediate
          # check a retry could still repeat. Deleting it here
          # (instead of only at its 90-day retention limit) is a storage-cost
          # cleanup, not a trust boundary: a delete failure is logged and does
          # not fail an already-completed merge.
          receipt_artifact_id="$ARM_RECEIPT_ARTIFACT_ID"
          if [[ "$receipt_artifact_id" =~ ^[1-9][0-9]*$ ]]; then
              if gh api --method DELETE "repos/$TARGET_REPO/actions/artifacts/$receipt_artifact_id" \
                  >/dev/null 2>"$RUNNER_TEMP/arm-artifact-delete.stderr"; then
                echo "Consumed arm receipt artifact $receipt_artifact_id."
              else
                echo "::warning::failed to delete consumed arm receipt artifact $receipt_artifact_id (non-fatal; its own retention window still bounds it)"
                sed -E 's/(authorization: (token|bearer) )[A-Za-z0-9._-]+/\1***/Ig' "$RUNNER_TEMP/arm-artifact-delete.stderr" >&2
              fi
          else
            echo "::warning::not deleting consumed arm receipt artifact because its ID is invalid"
          fi
