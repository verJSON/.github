name: actionlint

# Lints the caller's GitHub Actions workflows deterministically, so nit classes
# the merge-gate AI reviewer used to catch by hand (inconsistent/deprecated
# action pins — e.g. #60 — and workflow-expression errors) fail pre-review for
# free. Local pull_request/push behavior from #80 is preserved; workflow_call
# exposes the same implementation to consumers (#153).
#
# Verjson validation uses the general self-hosted lane. Reusable calls outside
# Verjson retain a portable GitHub-hosted default.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  workflow_call:
    inputs:
      github-hosted-runner:
        description: Force ubuntu-24.04; external callers already use it by default.
        required: false
        type: boolean
        default: false
      config-file:
        description: Caller-relative actionlint config; defaults to the centrally versioned policy.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ${{ (github.repository_owner != 'Verjson' || inputs.github-hosted-runner) && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || github.event.repository.visibility == 'public' && fromJSON(vars.CI_RUNNER_FASTLANE || vars.CI_LANE_UNTRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.CI_LANE_UNTRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    env:
      ACTIONLINT_VERSION: 1.7.7
      # From actionlint_1.7.7_checksums.txt on the upstream GitHub Release.
      ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
      PYYAML_VERSION: 6.0.2
      PYYAML_SHA256: 'd584d9ec91ad65861cc08d42e834324ef890a082e591037abe114850ff7bbc3e'
      PYYAML_SOURCE_URL: 'https://files.pythonhosted.org/packages/54/ed/79a089b6be93607fa5cdaedf301d7dfb23af5f25c398d5ead2525b063e17/pyyaml-6.0.2.tar.gz'
      ACTIONLINT_CONFIG_FILE: ${{ inputs.config-file || '.verjson-actionlint-policy/.github/actionlint.yaml' }}
    defaults:
      run:
        working-directory: .actionlint-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .actionlint-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Check out centrally versioned actionlint policy
        if: inputs.config-file == '' || github.repository_owner == 'Verjson'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .actionlint-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/.verjson-actionlint-policy
          sparse-checkout: |
            .github/actionlint.yaml
            scripts/ci-gate/hosted-selector-policy.py
          persist-credentials: false
      - name: Install actionlint (pinned release binary)
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl -fsSL "$url" -o "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint --version
      - name: Prove invalid workflows fail actionlint
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat >"$tmp/valid.yml" <<'YAML'
          name: valid
          on: push
          jobs:
            test:
              runs-on: [self-hosted, general]
              steps:
                - run: echo valid
          YAML

          cat >"$tmp/invalid-syntax.yml" <<'YAML'
          name: invalid syntax
          on: push
          jobs:
            test:
              runs-on: [ubuntu-24.04
          YAML

          expression_marker='$'
          cat >"$tmp/invalid-expression.yml" <<YAML
          name: invalid expression
          on: push
          jobs:
            test:
              runs-on: ubuntu-24.04
              steps:
                - if: ${expression_marker}{{ github.property_that_does_not_exist }}
                  run: echo unreachable
          YAML

          cat >"$tmp/invalid-runner.yml" <<'YAML'
          name: invalid runner
          on: push
          jobs:
            test:
              runs-on: [self-hosted, retired-runner-label]
              steps:
                - run: echo unreachable
          YAML

          ./actionlint -config-file "$ACTIONLINT_CONFIG_FILE" "$tmp/valid.yml"
          if ./actionlint -config-file "$ACTIONLINT_CONFIG_FILE" "$tmp/invalid-syntax.yml"; then
            echo "::error::actionlint accepted malformed workflow syntax"
            exit 1
          fi
          if ./actionlint -config-file "$ACTIONLINT_CONFIG_FILE" "$tmp/invalid-expression.yml"; then
            echo "::error::actionlint accepted an invalid workflow expression"
            exit 1
          fi
          if ./actionlint -config-file "$ACTIONLINT_CONFIG_FILE" "$tmp/invalid-runner.yml"; then
            echo "::error::actionlint accepted a runner label absent from the central policy"
            exit 1
          fi
      - name: Install hosted-selector policy dependency
        if: github.repository_owner == 'Verjson'
        run: |
          set -euo pipefail
          umask 077
          runner_temp="$(cd "${{ runner.temp }}" && pwd -P)"
          workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          case "$runner_temp/" in
            "$workspace/"*)
              echo "::error::RUNNER_TEMP must be outside the caller workspace"
              exit 1
              ;;
          esac
          policy_dir="$(mktemp -d "$runner_temp/verjson-hosted-selector-policy.XXXXXX")"
          printf 'VERJSON_HOSTED_SELECTOR_POLICY_DIR=%s\n' "$policy_dir" >>"$GITHUB_ENV"
          archive="$policy_dir/pyyaml-${PYYAML_VERSION}.tar.gz"
          dependency_dir="$policy_dir/python"
          curl -fsSL "$PYYAML_SOURCE_URL" -o "$archive"
          printf '%s  %s\n' "$PYYAML_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$dependency_dir"
          tar -xzf "$archive" -C "$dependency_dir" --strip-components=2 \
            "pyyaml-${PYYAML_VERSION}/lib/yaml"
          test -f "$dependency_dir/yaml/__init__.py"
      - name: Refuse literal hosted selectors in Verjson callers
        if: github.repository_owner == 'Verjson'
        env:
          VERJSON_HOSTED_SELECTOR_POLICY_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          runner_temp="$(cd "${{ runner.temp }}" && pwd -P)"
          policy_dir="${VERJSON_HOSTED_SELECTOR_POLICY_DIR:?policy dependency path is unavailable}"
          case "$policy_dir" in
            "$runner_temp"/verjson-hosted-selector-policy.*) ;;
            *)
              echo "::error::Hosted-selector policy dependency escaped RUNNER_TEMP"
              exit 1
              ;;
          esac
          if [ ! -d "$policy_dir" ] || [ -L "$policy_dir" ]; then
            echo "::error::Hosted-selector policy dependency is not a secure directory"
            exit 1
          fi
          policy_mode=(--consumer-policy)
          repository_normalized="$(printf '%s' "${GITHUB_REPOSITORY:?repository identity is unavailable}" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
          if [ "$repository_normalized" = "verjson/.github" ]; then
            # This repository retains ADR 0089's two exact, fixed-hosted
            # security boundaries. Consumers have no such exception.
            policy_mode=(--visibility public)
          fi
          python3 -I -S \
            .verjson-actionlint-policy/scripts/ci-gate/hosted-selector-policy.py \
            --dependency-path "$policy_dir/python" \
            "${policy_mode[@]}" .github/workflows
      - name: Remove hosted-selector policy dependency
        if: ${{ always() && github.repository_owner == 'Verjson' }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          policy_dir="${VERJSON_HOSTED_SELECTOR_POLICY_DIR:-}"
          [ -n "$policy_dir" ] || exit 0
          runner_temp="$(cd "${{ runner.temp }}" && pwd -P)"
          case "$policy_dir" in
            "$runner_temp"/verjson-hosted-selector-policy.*) ;;
            *)
              echo "::error::Refusing to clean a policy path outside RUNNER_TEMP"
              exit 1
              ;;
          esac
          if [ -L "$policy_dir" ]; then
            echo "::error::Refusing to follow a policy dependency symlink"
            exit 1
          fi
          [ ! -e "$policy_dir" ] || rm -rf -- "$policy_dir"
      - name: Run actionlint over all workflows
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || {
            echo "::error::The selected runner must provide shellcheck"
            exit 1
          }
          ./actionlint -config-file "$ACTIONLINT_CONFIG_FILE" -shellcheck=shellcheck -color
      - name: Remove the isolated actionlint checkout
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf ".actionlint-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
