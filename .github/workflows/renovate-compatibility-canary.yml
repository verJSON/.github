name: Renovate compatibility canary

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      candidate:
        type: string
        required: true
      stack-profile:
        type: string
        required: true

permissions:
  contents: read

jobs:
  canary:
    runs-on: ${{ fromJSON(vars.CI_LANE_UNTRUSTED || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Validate public candidate coordinates
        env:
          PACKAGE: ${{ inputs.package }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE" =~ ^(@[abcdefghijklmnopqrstuvwxyz0123456789._-]+/)?[abcdefghijklmnopqrstuvwxyz0123456789._-]+$ ]]
          [[ "$CANDIDATE" =~ ^[0123456789]+\.[0123456789]+\.[0123456789]+([+-][0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz.-]+)?$ ]]
          npm view --registry=https://registry.npmjs.org/ "$PACKAGE@$CANDIDATE" version >/dev/null
      - name: Install exact candidate without lifecycle scripts or credentials
        env:
          PACKAGE: ${{ inputs.package }}
          CANDIDATE: ${{ inputs.candidate }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/empty-npmrc
        run: |
          set -euo pipefail
          : > "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN NPM_TOKEN GH_TOKEN GITHUB_TOKEN
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact "$PACKAGE@$CANDIDATE"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Run bounded compatibility commands
        run: |
          set -euo pipefail
          for command in build typecheck test; do
            if npm pkg get "scripts.$command" | grep -vq '^{}$\|^null$'; then
              npm run "$command"
            fi
          done
  receipt:
    if: ${{ always() }}
    needs: canary
    permissions: {}
    runs-on: ${{ fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    steps:
      - name: Write authoritative machine-readable receipt
        env:
          PACKAGE: ${{ inputs.package }}
          CANDIDATE: ${{ inputs.candidate }}
          PROFILE: ${{ inputs.stack-profile }}
          RESULT: ${{ needs.canary.result }}
          CALLER_REF: ${{ github.workflow_ref }}
          CALLER_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          jq -n --arg package "$PACKAGE" --arg candidate "$CANDIDATE" \
            --arg profile "$PROFILE" --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" --arg result "$RESULT" \
            --arg callerRef "$CALLER_REF" --arg callerSha "$CALLER_SHA" \
            '{package:$package,candidate:$candidate,stackProfile:$profile,
              repository:$repository,commit:$commit,result:$result,
              caller:{ref:$callerRef,sha:$callerSha},
              commandContract:["npm:build","npm:typecheck","npm:test"]}' \
            > compatibility-receipt.json
      - name: Upload canary receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: compatibility-receipt.json
          if-no-files-found: error
