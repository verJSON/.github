name: pulumi-ci (reusable)

# Reusable CI for verJSON Pulumi (TypeScript) infra repos. Validation and live
# preview deliberately run in separate trust domains:
#
#   1. Credential-free validation runs on the caller's untrusted-workload lane with
#      only `contents: read`. Caller-supplied install/validate commands never see
#      package, Git, cloud, OIDC, or repository-write credentials.
#   2. Live `pulumi preview` runs on the caller-selected runner only for a trusted
#      ref (push or workflow_dispatch on the repository's default branch), or for a
#      same-repository PR a human gated behind the caller's `preview-environment`
#      (ADR 0239). Same-repository is NOT reviewed code: without that environment a
#      PR runs the credential-free validation gate only. Fork PRs, unknown events,
#      and missing-secret runs fail closed to validation.
#
# Lifted from viager-infra's preview.yml so infra repos stop reinventing the
# credential-gating dance; Node + the @verjson registry come from the org
# setup-verjson-node composite action (Verjson/.github#36), and the runner is
# resolved by organization: Verjson defaults general, while outside callers
# retain GitHub-hosted portability.
#
# Caller (each infra repo's .github/workflows/ci.yml):
#
#   name: CI
#   on:
#     pull_request:
#   jobs:
#     pulumi:
#       uses: Verjson/.github/.github/workflows/pulumi-ci.yml@main
#       with:
#         stacks: '["dev"]'
#         validate-command: |
#           npm run build
#           npm test
#       secrets:
#         node-auth-token: ${{ secrets.NODE_AUTH_TOKEN }}
#         gcp-wip: ${{ secrets.GCP_WIP }}
#         gcp-sa: ${{ secrets.GCP_SA }}
#         pulumi-access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for setup-verjson-node.
        required: false
        type: string
        default: '24'
      scope:
        description: >-
          npm scope for the @verjson GitHub Packages registry. Empty string skips
          registry auth (public-only installs).
        required: false
        type: string
        default: '@verjson'
      stacks:
        description: JSON array of Pulumi stack names to preview (matrix).
        required: false
        type: string
        default: '["dev"]'
      pulumi-command:
        description: pulumi/actions command for the live cloud step (preview|up|refresh).
        required: false
        type: string
        default: 'preview'
      install-command:
        description: Dependency install command (credential-free gate).
        required: false
        type: string
        default: 'npm ci'
      validate-command:
        description: >-
          Credential-free validation run after install (a compile/typecheck and,
          where present, `npm test` with Pulumi mocks). Multiline is run verbatim
          as one shell block; a failing line fails the gate.
        required: false
        type: string
        default: 'npm run build'
      comment-on-pr:
        description: Whether pulumi/actions posts the preview as a PR comment.
        required: false
        type: boolean
        default: true
      runner:
        description: >-
          Optional JSON runner labels for the trusted preview job. Verjson
          validation always uses the general lane and outside validation uses
          ubuntu-24.04; this override cannot move untrusted validation.
        required: false
        type: string
        default: ''
      preview-environment:
        description: >-
          Name of a caller-owned GitHub environment with required reviewers. When
          set, a same-repository pull_request runs the credentialed preview inside
          it, so a reviewer approves before any credential reaches PR code. The
          admission job verifies through the API (using `environment-read-token`) that
          the environment exists with a required-reviewers rule that prevents
          self-review, and fails closed otherwise (GitHub silently
          creates unprotected environments on first use). Empty (default) means
          such PRs get the credential-free validation gate only. This input is an
          approval gate, not secret scoping: reusable-workflow secret aliases are
          caller-mapped. Fork PRs and other events are never admitted by it.
        required: false
        type: string
        default: ''
    secrets:
      environment-read-token:
        description: >-
          Token able to read the preview environment's protection rules (fine-grained
          "Actions: read" on the caller repository). Needed only with
          `preview-environment`; without it the reviewed route fails closed. It is
          used only by the credential-light admission job, never by PR code.
        required: false
      node-auth-token:
        description: >-
          read:packages token used only by the admitted preview job's fixed
          dependency install. It is never exposed to validation commands.
        required: false
      git-token:
        description: >-
          Repo-scoped token used only by the admitted preview job's fixed
          dependency install for private Git dependencies over HTTPS. It is
          never exposed to validation commands.
        required: false
      gcp-wip:
        description: GCP Workload-Identity provider. Live preview is skipped when empty.
        required: false
      gcp-sa:
        description: GCP service account email for Workload-Identity auth.
        required: false
      pulumi-access-token:
        description: Pulumi backend token. Live preview is skipped when empty.
        required: false

jobs:
  validate:
    # Runner routing is policy, not preference — see ADR 0033. In tier order:
    # an explicit `runner` input wins; a caller outside Verjson gets hosted
    # (portable, their billing); a Verjson PRIVATE repo gets the general
    # self-hosted pool; anything else — public, or an event that carries no
    # visibility — gets the ephemeral untrusted-PR pool. That last tier is
    # fail-SAFE, not a fallback: unresolved visibility must never put fork code
    # on the persistent pool. Both pools are org variables so a provider move
    # (GCP -> DigitalOcean) is a variable flip, not a PR here.
    runs-on: ${{ github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.CI_LANE_UNTRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The event's immutable SHA (for a PR, the merge commit at trigger time),
          # so validation and preview execute the same bytes.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up credential-free Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install + validate (credential-free gate)
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          VALIDATE_COMMAND: ${{ inputs.validate-command }}
          # Defense in depth against unexpected Git/npm credential state.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/pulumi-validation.npmrc
        run: |
          set -euo pipefail
          : > "$NPM_CONFIG_USERCONFIG"
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE GOOGLE_APPLICATION_CREDENTIALS
          unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN
          unset PULUMI_ACCESS_TOKEN VERJSON_GIT_TOKEN
          eval "$INSTALL_COMMAND"
          eval "$VALIDATE_COMMAND"

  preview-admission:
    needs: validate
    runs-on: ${{ github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.CI_LANE_UNTRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    permissions:
      contents: read
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
      route: ${{ steps.admission.outputs.route }}
    steps:
      - name: Decide trusted preview admission
        id: admission
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REF: ${{ github.ref }}
          # Exposed only on the one route that needs it; empty otherwise.
          GH_TOKEN: ${{ github.event_name == 'pull_request' && inputs.preview-environment != '' && secrets.environment-read-token || '' }}
          EXECUTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PREVIEW_ENVIRONMENT: ${{ inputs.preview-environment }}
          HAS_GCP_WIP: ${{ secrets.gcp-wip != '' }}
          HAS_GCP_SA: ${{ secrets.gcp-sa != '' }}
          HAS_PULUMI_TOKEN: ${{ secrets.pulumi-access-token != '' }}
        run: |
          set -euo pipefail
          # Unified untrusted-execution boundary (ADR 0239). A credentialed run is
          # admitted only for (a) a trusted ref: push or workflow_dispatch on the
          # default branch; or (b) a same-repository pull_request when the caller
          # supplied a preview environment whose reviewers gate the job. Everything
          # else, including unknown events and missing identity, is untrusted.
          repo_lower="${REPOSITORY,,}"
          head_repo_lower="${HEAD_REPOSITORY,,}"
          trusted_ref=false
          reviewed_route=false
          case "$EVENT_NAME" in
            push|workflow_dispatch)
              if [ -n "$DEFAULT_BRANCH" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                trusted_ref=true
              fi
              ;;
            pull_request)
              # The name is caller-workflow data a PR can edit: constrain it before
              # it reaches an output file or an API path, then require a real gate.
              if [ -n "$PREVIEW_ENVIRONMENT" ] && [ -n "$head_repo_lower" ] \
                && [ "$head_repo_lower" = "$repo_lower" ] \
                && [[ "$PREVIEW_ENVIRONMENT" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,63}$ ]]; then
                if [ -z "${GH_TOKEN:-}" ]; then
                  echo "::warning title=Pulumi preview environment cannot be verified::environment-read-token was not provided; refusing credentialed PR preview."
                fi
                reviewers="$(gh api "repos/$REPOSITORY/environments/$PREVIEW_ENVIRONMENT" \
                  --jq '[.protection_rules[]? | select(.type == "required_reviewers" and .prevent_self_review == true)] | length' 2>/dev/null || echo 0)"
                if [ "$reviewers" -gt 0 ] 2>/dev/null; then
                  reviewed_route=true
                else
                  echo "::warning title=Pulumi preview environment is not a gate::Environment '$PREVIEW_ENVIRONMENT' is missing, unreadable, or lacks a required-reviewers rule with self-review prevented; refusing credentialed PR preview."
                fi
              fi
              ;;
          esac

          admitted=false
          route=none
          if [ "$trusted_ref" = true ] \
            && [ "$HAS_GCP_WIP" = true ] \
            && [ "$HAS_GCP_SA" = true ] \
            && [ "$HAS_PULUMI_TOKEN" = true ]; then
            admitted=true
            route=trusted
          elif [ "$reviewed_route" = true ] \
            && [ "$HAS_GCP_WIP" = true ] \
            && [ "$HAS_GCP_SA" = true ] \
            && [ "$HAS_PULUMI_TOKEN" = true ]; then
            admitted=true
            route=reviewed
          fi
          echo "Event ${EVENT_NAME} executes ${EXECUTED_SHA} (pull request head: ${HEAD_SHA:-n/a})"

          echo "admitted=$admitted" >> "$GITHUB_OUTPUT"
          echo "route=$route" >> "$GITHUB_OUTPUT"

          if [ "$admitted" != true ]; then
            echo "::notice title=Pulumi preview skipped::Not a trusted ref and no reviewed-preview environment applies, or required cloud credentials are unavailable; ran the credential-free validation gate only."
          fi

  preview:
    needs: [validate, preview-admission]
    if: needs.preview-admission.outputs.admitted == 'true'
    # Derived from the event, never from a step output: GitHub drops an output whose
    # value equals a secret, and a PR author controls the caller's secret mapping, so
    # an output-carried name could be redacted into "no environment". Under
    # `admitted == 'true'` a pull_request can only have come through the reviewed route.
    environment: ${{ github.event_name == 'pull_request' && inputs.preview-environment || '' }}
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.CI_LANE_UNTRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(inputs.stacks) }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node + @verjson registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.scope != '' && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.scope }}

      - name: Install trusted preview dependencies
        # This command is workflow-owned, not a caller input. Package/Git
        # credentials are step-scoped and gone before cloud auth and Pulumi.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.node-auth-token }}
          VERJSON_GIT_TOKEN: ${{ secrets.git-token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: 'git@github.com:'
          GIT_CONFIG_KEY_2: credential.https://github.com.helper
          GIT_CONFIG_VALUE_2: '!f() { echo "username=x-access-token"; echo "password=${VERJSON_GIT_TOKEN}"; }; f'
        run: npm ci

      - name: Authenticate to GCP (Workload Identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.gcp-wip }}
          service_account: ${{ secrets.gcp-sa }}

      - name: Pulumi ${{ inputs.pulumi-command }}
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          command: ${{ inputs.pulumi-command }}
          stack-name: ${{ matrix.stack }}
          # No-op contract on non-PR events: only ask pulumi/actions to comment
          # when a PR context actually exists. On `push` (or any non-pull_request
          # trigger) there is no PR to comment on, so this resolves to false and
          # the preview runs without attempting to post — never hard-failing.
          comment-on-pr: ${{ inputs.comment-on-pr && github.event_name == 'pull_request' }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.pulumi-access-token }}
