name: AI review authorization arm

# Trusted base-branch entrypoint for ADR 0079 and the organization ruleset
# workflow selected by ADR 0091. This workflow never checks out or executes
# pull-request code. The dedicated App must be installed with Checks:write; its
# identity and the immutable receipt are the AI authorization trust boundary.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_call:
    inputs:
      ai_review_environment:
        description: Main-only environment containing the ai-review App private key
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-review-arm-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  event-policy:
    runs-on: ${{ fromJSON(vars.CI_LANE_UNTRUSTED || '["ubuntu-24.04"]') }}
    permissions: {}
    outputs:
      run_control_plane: ${{ steps.classify.outputs.run_control_plane }}
      old_title_held: ${{ steps.classify.outputs.old_title_held }}
      new_title_held: ${{ steps.classify.outputs.new_title_held }}
    steps:
      - id: classify
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          EVENT_TITLE_CHANGED: ${{ github.event.changes.title.from != null }}
          EVENT_OLD_TITLE: ${{ github.event.changes.title.from || '' }}
          EVENT_NEW_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          set -euo pipefail
          run_control_plane=true
          old_title_held=false
          new_title_held=false
          if [ "$EVENT_ACTION" = unlabeled ]; then
            removed_normalized="$(jq -nr --arg raw_label "$EVENT_LABEL" '$raw_label | ascii_upcase | gsub("[ _-]+";" ")')"
            case "$removed_normalized" in HOLD|'DO NOT MERGE') ;; *) run_control_plane=false ;; esac
          elif [ "$EVENT_ACTION" = labeled ]; then
            # Hold additions reach arm so it can disable native auto-merge.
            added_normalized="$(jq -nr --arg raw_label "$EVENT_LABEL" '$raw_label | ascii_downcase | gsub("[ _-]+";"-")')"
            case "$added_normalized" in ai-review|re-review|hold|do-not-merge) ;; *) run_control_plane=false ;; esac
          elif [ "$EVENT_ACTION" = edited ]; then
            if [ "$EVENT_TITLE_CHANGED" = true ]; then
              old_title_ascii="$(jq -nr --arg title "$EVENT_OLD_TITLE" '$title | ascii_upcase')"
              new_title_ascii="$(jq -nr --arg title "$EVENT_NEW_TITLE" '$title | ascii_upcase')"
              [[ "$old_title_ascii" =~ (^|[^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_])DO\ NOT\ MERGE([^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_]|$) ]] && old_title_held=true
              [[ "$new_title_ascii" =~ (^|[^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_])DO\ NOT\ MERGE([^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_]|$) ]] && new_title_held=true
              [ "$old_title_held" != "$new_title_held" ] || run_control_plane=false
            else
              run_control_plane=false
            fi
          fi
              {
                printf 'run_control_plane=%s\n' "$run_control_plane"
                printf 'old_title_held=%s\n' "$old_title_held"
                printf 'new_title_held=%s\n' "$new_title_held"
              } >>"$GITHUB_OUTPUT"

  app-key-policy:
    needs: event-policy
    if: ${{ needs.event-policy.outputs.run_control_plane == 'true' }}
    # Absolute pinned reference, not a relative path: when this file runs as an
    # organization ruleset required workflow, a relative reusable call fails at
    # startup with zero jobs (canary receipt, 2026-09-11), so the policy check
    # must name its trusted revision explicitly. Pinned to ebe23faf, a main
    # commit reachable from refs (the earlier f56af66c pin named a squashed
    # PR-branch head on no ref, and the injected run then had no jobs), which
    # contains the inline App-key validator; update the pin with a reviewed
    # revision bump so this nested call does not inherit the outer caller SHA.
    uses: Verjson/.github/.github/workflows/app-key-environment.yml@ebe23fafbdb77dd2cca6f1862d932fde881b80d7
    permissions:
      actions: read
      contents: read
    # The validator's validate-ai-review-key job binds the environment inside
    # the called workflow and needs a grant on this edge to resolve the key
    # (an edge with no grant delivers nothing: run 36289883288). The narrow
    # named grant, proven post-withdrawal of the organization copy on
    # ai-review-merge's identical edge (run 36290560349), is used instead of
    # inheritance so this injected workflow forwards one secret, not the set.
    secrets:
      AI_REVIEW_APP_PRIVATE_KEY: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
    with:
      role: ai-review
      environment: ${{ inputs.ai_review_environment || 'ai-review-app' }}

  # ADR 0230: `timeout-minutes` never counts queue time, so a job GitHub never
  # hands to a runner stays queued indefinitely, and with this workflow's
  # non-cancelling PR concurrency group it holds every later arm for the PR as
  # pending (verjson-payments run 37352915856). This job bounds that wait from
  # the untrusted lane with no environment or repository secret, only a
  # write-scoped GITHUB_TOKEN, which each step uses solely on an ephemeral
  # GitHub-hosted runner (ADR 0147 allows that lane to roll back to the
  # persistent pool). Past the limit it names the stalled job and cancels the
  # run, so the always() arm job completes the authorization check as failed
  # and the group is released; it force-cancels only if that job persists.
  runner-acquisition-watchdog:
    needs: event-policy
    # The job, and with it the write-scoped token, exists only when the lane
    # resolves through the same chain as `runs-on` to ADR 0147's exact hosted
    # value. Any other value, including a rollback to the persistent pool or a
    # reformatted array, skips the job (dormant, fail-safe), so no token is
    # issued to a persistent host. The step guards remain as a backstop.
    if: ${{ needs.event-policy.outputs.run_control_plane == 'true' && (vars.CI_LANE_UNTRUSTED || '["ubuntu-24.04"]') == '["ubuntu-24.04"]' }}
    # A watchdog defect must never become a veto on an otherwise-authorized
    # merge; the stall path acts through cancellation, not this job's result.
    continue-on-error: true
    runs-on: ${{ fromJSON(vars.CI_LANE_UNTRUSTED || '["ubuntu-24.04"]') }}
    # Two sequential acquisitions at the limit, the policy jobs between them,
    # and the cancellation grace (asserted by the registered watchdog test).
    timeout-minutes: 40
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPO: ${{ github.repository }}
      ARM_RUN_ID: ${{ github.run_id }}
      ARM_RUN_ATTEMPT: ${{ github.run_attempt }}
      ACQUISITION_LIMIT_SECONDS: '900'
      POLL_INTERVAL_SECONDS: '15'
      CANCEL_GRACE_SECONDS: '120'
      # Classifies one attempt's jobs: `stalled` names the first job still
      # waiting for a runner past the limit (this job holds one while polling,
      # an environment `waiting` state is a human gate, not acquisition, and a
      # job without a queue time cannot be aged); `acquired` means the final
      # arm job holds a runner, after which its own timeout bounds it.
      ACQUISITION_VERDICT: |
        .jobs as $jobs
        | [$jobs[] | select(.status == "queued" or .status == "pending" or .status == "requested")
            | select(.created_at | type == "string")
            | {id, name, labels, age: ($now - (.created_at | fromdateiso8601))}
            | select(.age >= $limit)] as $stalled
        | if ($stalled | length) > 0 then
            $stalled[0] | {state: "stalled", age, id,
              name: (.name | tostring | gsub("[^A-Za-z0-9 ._/-]"; "?")),
              labels: ([.labels // [] | .[] | tostring | gsub("[^A-Za-z0-9._-]"; "?")] | join(","))}
          elif any($jobs[]; (.name | test("(^| / )arm$")) and (.status == "in_progress" or .status == "completed"))
          then {state: "acquired"}
          else {state: "waiting"} end
    steps:
      - name: Bound runner acquisition for this arm attempt
        id: detect
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] || { echo "::notice::runner-acquisition watchdog is dormant on a ${RUNNER_ENVIRONMENT:-unidentified} runner; its write-scoped token is used only on ephemeral GitHub-hosted runners"; exit 0; }
          set -euo pipefail
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$ARM_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$ARM_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          jobs_path="repos/$TARGET_REPO/actions/runs/$ARM_RUN_ID/attempts/$ARM_RUN_ATTEMPT/jobs?per_page=100"
          while :; do
            now="$(date -u +%s)"
            # An unreadable or malformed jobs listing is not evidence of a stall:
            # keep polling, and let this job's timeout end an unobservable run.
            if listing="$(gh api "$jobs_path")" &&
              verdict="$(jq -ce --argjson now "$now" --argjson limit "$ACQUISITION_LIMIT_SECONDS" \
                "$ACQUISITION_VERDICT" <<<"$listing" 2>/dev/null)"; then
              case "$(jq -r .state <<<"$verdict")" in
                acquired) echo "Every arm job acquired a runner."; exit 0 ;;
                stalled)
                  stalled_job_id="$(jq -r .id <<<"$verdict")"
                  [[ "$stalled_job_id" =~ ^[1-9][0-9]*$ ]] || stalled_job_id=''
                  {
                    echo "stalled_job_id=$stalled_job_id"
                    echo 'stalled=true'
                  } >>"$GITHUB_OUTPUT"
                  jq -r --arg run "$ARM_RUN_ID" '"::error title=Runner acquisition stalled::\(.name) waited \(.age)s for a runner labelled [\(.labels)], past the \(env.ACQUISITION_LIMIT_SECONDS)s limit. Cancelling arm run \($run) to release this pull request'"'"'s arm concurrency group; re-run the arm or push to re-arm."' <<<"$verdict"
                  gh api --method POST "repos/$TARGET_REPO/actions/runs/$ARM_RUN_ID/cancel" >/dev/null ||
                    echo "::warning::cancel request for arm run $ARM_RUN_ID was not accepted"
                  exit 1
                  ;;
              esac
            else
              echo "::warning::arm jobs listing unavailable; retrying"
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done

      - name: Force-cancel when the stalled job survives cancellation
        if: ${{ always() && steps.detect.outputs.stalled == 'true' }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          STALLED_JOB_ID: ${{ steps.detect.outputs.stalled_job_id }}
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] || { echo "::notice::runner-acquisition watchdog is dormant on a ${RUNNER_ENVIRONMENT:-unidentified} runner; its write-scoped token is used only on ephemeral GitHub-hosted runners"; exit 0; }
          set -euo pipefail
          sleep "$CANCEL_GRACE_SECONDS"
          jobs_path="repos/$TARGET_REPO/actions/runs/$ARM_RUN_ID/attempts/$ARM_RUN_ATTEMPT/jobs?per_page=100"
          # Escalate only for the very job detection named, still unassigned: any
          # other queued job, such as the arm job the cancellation queued, may be
          # about to complete the authorization check, and force-cancelling it
          # would orphan that check. An unobservable listing or an unidentified
          # job is not evidence the stall persists.
          state=unobservable
          if [[ "$STALLED_JOB_ID" =~ ^[1-9][0-9]*$ ]] && listing="$(gh api "$jobs_path")"; then
            state="$(jq -r --argjson id "$STALLED_JOB_ID" '
              [.jobs[] | select(.id == $id)] as $same
              | if ($same | length) == 1 and ($same[0].status | IN("queued", "pending", "requested"))
                then "stalled" else "cleared" end' <<<"$listing" 2>/dev/null)" || state=unobservable
          fi
          case "$state" in
            stalled)
              echo "::error::arm run $ARM_RUN_ID still holds stalled job $STALLED_JOB_ID after ${CANCEL_GRACE_SECONDS}s; force-cancelling"
              gh api --method POST "repos/$TARGET_REPO/actions/runs/$ARM_RUN_ID/force-cancel" >/dev/null
              ;;
            unobservable) echo "::warning::arm jobs listing unavailable; not escalating to force-cancel" ;;
            *) echo "Cancellation cleared the stalled job." ;;
          esac

  arm:
    environment: ${{ inputs.ai_review_environment || 'ai-review-app' }}
    needs: [event-policy, app-key-policy]
    # Body/base-only edits and title edits that do not change held state skip
    # runner placement and credential validation in the permissionless event-policy job.
    if: ${{ always() && needs.event-policy.outputs.run_control_plane == 'true' }}
    # AI remains advisory under ADR 0090. A missing credential, App outage, or
    # authorization defect must fail this job visibly without turning the
    # ruleset workflow into a veto on an otherwise-authorized human merge.
    # Exact-head App approval and terminal promotion still require successful
    # receipt-bound completion, so tolerating this job cannot grant authority.
    continue-on-error: true
    # This trusted, secret-bearing control-plane job follows the organization
    # lane contract. Fleet placement changes through variables, never by
    # hardcoding a provider or runner label in this reusable workflow.
    runs-on: ${{ fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      checks: write
    env:
      APP_ID: ${{ vars.AI_REVIEW_APP_ID }}
      APP_SLUG: ${{ vars.AI_REVIEW_APP_SLUG }}
      AI_REVIEW_ENVIRONMENT: ${{ inputs.ai_review_environment || 'ai-review-app' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_LABEL: ${{ github.event.label.name || '' }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_OLD_TITLE_HELD: ${{ needs.event-policy.outputs.old_title_held }}
      EVENT_NEW_TITLE_HELD: ${{ needs.event-policy.outputs.new_title_held }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY_ID: ${{ github.repository_id }}
      TARGET_REPO: ${{ github.repository }}
      REVIEW_AUTHORITY: ${{ vars.AI_REVIEW_AUTHORITY || 'human' }}
      PRIMARY_PROVIDER: ${{ vars.AI_REVIEW_PRIMARY_PROVIDER || 'anthropic' }}
      PRIMARY_MODEL: ${{ vars.AI_REVIEW_PRIMARY_MODEL || 'auto' }}
      PRIMARY_BUDGET_USD: ${{ vars.AI_REVIEW_PRIMARY_BUDGET_USD || 'auto' }}
      PRIMARY_FALLBACK_MODEL: ${{ vars.AI_REVIEW_PRIMARY_FALLBACK_MODEL }}
      PRIMARY_FALLBACK_BUDGET_USD: ${{ vars.AI_REVIEW_PRIMARY_FALLBACK_BUDGET_USD }}
      REREVIEW_PROVIDER: ${{ vars.AI_REVIEW_REREVIEW_PROVIDER }}
      REREVIEW_MODEL: ${{ vars.AI_REVIEW_REREVIEW_MODEL }}
      REREVIEW_BUDGET_USD: ${{ vars.AI_REVIEW_REREVIEW_BUDGET_USD }}
      REREVIEW_FALLBACK_MODEL: ${{ vars.AI_REVIEW_REREVIEW_FALLBACK_MODEL }}
      REREVIEW_FALLBACK_BUDGET_USD: ${{ vars.AI_REVIEW_REREVIEW_FALLBACK_BUDGET_USD }}
      REQUEST_ACTOR: ${{ github.event.sender.login || github.actor }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Authorize hold-clearing actor before AI review admission
        if: "${{ github.event.action == 'ready_for_review' || github.event.action == 'edited' || github.event.action == 'unlabeled' || github.event.action == 'labeled' }}"
        env:
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EVENT_ACTION" in
            ready_for_review) ;;
            edited)
              if [ "$EVENT_OLD_TITLE_HELD" = false ] && [ "$EVENT_NEW_TITLE_HELD" = true ]; then
                exit 0
              fi
              [ "$EVENT_OLD_TITLE_HELD" = true ] && [ "$EVENT_NEW_TITLE_HELD" = false ] || {
                echo "::error::title edit did not change hold state"; exit 1;
              }
              ;;
            unlabeled)
              removed_normalized="$(jq -nr --arg raw_label "$EVENT_LABEL" '$raw_label | ascii_upcase | gsub("[ _-]+";" ")')"
              case "$removed_normalized" in HOLD|'DO NOT MERGE') ;; *) exit 0 ;; esac
              ;;
            labeled)
              added_normalized="$(jq -nr --arg raw_label "$EVENT_LABEL" '$raw_label | ascii_downcase | gsub("[ _-]+";"-")')"
              case "$added_normalized" in
                ai-review|re-review) ;;
                hold|do-not-merge) exit 0 ;;
                *) echo "::error::unsupported labeled event reached hold authorization"; exit 1 ;;
              esac
              ;;
            *) echo "::error::unsupported hold-clearing event"; exit 1 ;;
          esac
          [[ "$REQUEST_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]] || {
            echo "::error::hold-clearing actor is invalid"; exit 1;
          }
          actor_permission_response="$(GH_TOKEN="$ACTIONS_TOKEN" gh api \
            "repos/$TARGET_REPO/collaborators/$REQUEST_ACTOR/permission")" || {
            echo "::error::could not authorize hold-clearing actor"; exit 1;
          }
          actor_role="$(jq -er '.role_name // ""' <<<"$actor_permission_response")" || {
            echo "::error::could not read hold-clearing actor role"; exit 1;
          }
          case "$actor_role" in
            admin|maintain)
              if [ "$EVENT_ACTION" = labeled ]; then
                exit 0
              fi
              printf 'HOLD_CLEAR_ACTOR_PERMISSION=%s\n' "$actor_role" >>"$GITHUB_ENV"
              ;;
            *) echo "::error::$REQUEST_ACTOR lacks maintain/admin permission to clear a hold"; exit 1 ;;
          esac

      - name: Create exact-head authorization receipt
        id: arm
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          APP_KEY_POLICY_RESULT: ${{ needs.app-key-policy.result }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          [[ "$APP_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::AI_REVIEW_APP_ID is unavailable"; exit 1; }
          [[ "$APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::AI_REVIEW_APP_SLUG is unavailable"; exit 1; }

          source_bound_delivery=false
          explicit_label_delivery=false
          if [ "$EVENT_NAME" = pull_request_target ] && [ "$EVENT_ACTION" = labeled ]; then
            label_normalized="$(jq -nr --arg raw_label "$EVENT_LABEL" '$raw_label | ascii_downcase | gsub("[ _-]+";"-")')"
            case "$label_normalized" in ai-review|re-review|hold|do-not-merge) ;; *) exit 0 ;; esac
            explicit_label_delivery=true
          fi

          local_delivery_path=""
          local_workflow=""
          case "$WORKFLOW_REF" in
            "$TARGET_REPO/.github/workflows/ai-review-label-rearm.yml@refs/heads/$DEFAULT_BRANCH")
              local_delivery_path=".github/workflows/ai-review-label-rearm.yml"
              local_workflow="ai-review-label-rearm.yml"
              ;;
            "$TARGET_REPO/.github/workflows/ai-review-lifecycle-rearm.yml@refs/heads/$DEFAULT_BRANCH")
              local_delivery_path=".github/workflows/ai-review-lifecycle-rearm.yml"
              local_workflow="ai-review-lifecycle-rearm.yml"
              ;;
          esac

          if [ "$explicit_label_delivery" = true ] || [ -n "$local_delivery_path" ]; then
            if [ "$explicit_label_delivery" = true ]; then
              [ "$local_delivery_path" = .github/workflows/ai-review-label-rearm.yml ] || {
                echo "::error::label delivery must enter through the protected label caller"; exit 1;
              }
            fi
            case "$local_delivery_path:$EVENT_ACTION" in
              .github/workflows/ai-review-label-rearm.yml:labeled) ;;
              .github/workflows/ai-review-lifecycle-rearm.yml:ready_for_review|.github/workflows/ai-review-lifecycle-rearm.yml:converted_to_draft|.github/workflows/ai-review-lifecycle-rearm.yml:edited|.github/workflows/ai-review-lifecycle-rearm.yml:unlabeled) ;;
              *) echo "::error::local arm caller does not own this delivery event"; exit 1 ;;
            esac
            [ "${GITHUB_RUN_ATTEMPT:-}" = 1 ] || { echo "::error::local arm deliveries cannot be replayed by rerunning a workflow"; exit 1; }
            [[ "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::local arm delivery run ID is malformed"; exit 1; }
            [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::protected workflow SHA is malformed"; exit 1; }
            [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::local arm event head is malformed"; exit 1; }
            expected_workflow_ref="$TARGET_REPO/$local_delivery_path@refs/heads/$DEFAULT_BRANCH"
            [ "$WORKFLOW_REF" = "$expected_workflow_ref" ] || {
              echo "::error::local arm delivery did not use its exact protected workflow ref"; exit 1;
            }
            source_run="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$GITHUB_RUN_ID")" || {
              echo "::error::could not authenticate local arm delivery identity"; exit 1;
            }
            jq -e --argjson run_id "$GITHUB_RUN_ID" --arg repo "$TARGET_REPO" --argjson repo_id "$REPOSITORY_ID" \
              --arg path "$local_delivery_path" --arg head "$EVENT_HEAD_SHA" --arg actor "$REQUEST_ACTOR" '
                .id == $run_id and .event == "pull_request_target" and .path == $path and
                .run_attempt == 1 and .head_sha == $head and
                (.head_repository.full_name | ascii_downcase) == ($repo | ascii_downcase) and .repository.id == $repo_id and
                (.repository.full_name | ascii_downcase) == ($repo | ascii_downcase) and .actor.login == $actor
              ' <<<"$source_run" >/dev/null || {
                echo "::error::local arm delivery source, repository, or actor is not trusted"; exit 1;
              }
            source_workflow_id="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/workflows/$local_workflow" --jq '.id')" || {
              echo "::error::could not authenticate local arm workflow identity"; exit 1;
            }
            if ! [[ "$source_workflow_id" =~ ^[1-9][0-9]*$ ]] ||
              ! jq -e --argjson workflow_id "$source_workflow_id" '.workflow_id == $workflow_id' <<<"$source_run" >/dev/null; then
              echo "::error::local arm workflow identity does not match its protected path"; exit 1
            fi
            branch_ref="$(jq -rn --arg branch "$DEFAULT_BRANCH" '$branch | @uri | gsub("%2F"; "/")')"
            protected_blob="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/contents/$local_delivery_path?ref=$branch_ref" --jq '.sha')" || {
              echo "::error::could not resolve protected local arm workflow"; exit 1;
            }
            delivery_blob="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/contents/$local_delivery_path?ref=$WORKFLOW_SHA" --jq '.sha')" || {
              echo "::error::could not resolve delivered local arm workflow"; exit 1;
            }
            [[ "$protected_blob" =~ ^[0-9a-f]{40}$ ]] && [ "$delivery_blob" = "$protected_blob" ] || {
              echo "::error::local arm workflow does not match the protected caller revision"; exit 1;
            }
            source_bound_delivery=true
          else
            [ "$EVENT_NAME" = pull_request_target ] || { echo "::error::unsupported authorization-arm event"; exit 1; }
            case "$EVENT_ACTION" in opened|reopened|synchronize) ;;
              *) echo "::error::unsupported authorization-arm caller or event"; exit 1 ;;
            esac
          fi

          meta="$(GH_TOKEN="$ACTIONS_TOKEN" gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
            --json id,state,isDraft,title,labels,headRefOid,headRepositoryOwner,autoMergeRequest)"
          state="$(jq -r '.state' <<<"$meta")"
          head_sha="$(jq -r '.headRefOid // ""' <<<"$meta")"
          head_owner="$(jq -r '.headRepositoryOwner.login // ""' <<<"$meta")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::current PR head is unavailable"; exit 1; }
          if [ "$source_bound_delivery" = true ] && [ "$head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "::error::local arm delivery head is stale"; exit 1
          fi
          [ "$state" = OPEN ] || exit 0

          held="$(jq -r '
            ([.labels[].name | ascii_upcase | gsub("[ _-]+";" ")]) as $labels
            | (.isDraft or ($labels | index("HOLD")) or ($labels | index("DO NOT MERGE")) or
               (.title | ascii_upcase | test("(^|[^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_])DO NOT MERGE([^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_]|$)")))
            | if . then "true" else "false" end' <<<"$meta")"
          if [ "$held" = true ]; then
            if [ "$(jq -r '.autoMergeRequest != null' <<<"$meta")" = true ]; then
              pr_id="$(jq -r '.id // ""' <<<"$meta")"
              [ -n "$pr_id" ] || exit 1
              # $id is a GraphQL variable, not shell expansion.
              # shellcheck disable=SC2016
              disable_result="$(GH_TOKEN="$ACTIONS_TOKEN" gh api graphql \
                -f query='mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{id}}}' \
                -f id="$pr_id")"
              jq -e --arg id "$pr_id" "
                (.errors? == null) and
                .data.disablePullRequestAutoMerge.pullRequest.id == \$id
              " <<<"$disable_result" >/dev/null || {
                echo "::error::GitHub did not confirm auto-merge was disabled for the expected PR"; exit 1;
              }
              disabled_meta="$(GH_TOKEN="$ACTIONS_TOKEN" gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
                --json id,autoMergeRequest)"
              jq -e --arg id "$pr_id" ".id == \$id and .autoMergeRequest == null" \
                <<<"$disabled_meta" >/dev/null || {
                echo "::error::authoritative PR state still reports auto-merge enabled"; exit 1;
              }
            fi
            echo "PR is held or draft; native auto-merge is disabled. Clearing draft or hold requires the protected ai-review-lifecycle-rearm.yml caller; explicit label delivery stays on ai-review-label-rearm.yml."
            exit 0
          fi

          explicit_rereview=false
          explicit_ai_review=false
          hold_removed=false
          select_compatible_review_policy() {
            local policy_json="$1" caller_file caller_sha256 selected_json branch_ref
            # $DEFAULT_BRANCH is adopter-controlled text reaching a query string in
            # hub-privileged automation, so percent-encode it here; "/" stays literal, as in
            # ai-review-required-workflow-audit.py's quote(branch, safe="/"). Preserving "/"
            # is correct for a query VALUE only, where it is an ordinary character. A path
            # segment must not restore it: with a literal "/" a branch name re-addresses the
            # resource, so path sites encode with @uri alone (ai-privileged-merge.yml's
            # branch_path, terminal-merge.sh, post-merge-reconcile.sh). The
            # ^[A-Za-z0-9._/-]+$ guard at the top of this step makes the encoding redundant
            # today. Keep it anyway: that guard is a general-purpose input check far from
            # this use, and relaxing it to the broader set of branch names GitHub actually
            # permits would otherwise silently re-arm this interpolation. Inlined per block
            # because the ci-gate tests extract each block on its own.
            branch_ref="$(jq -rn --arg branch "$DEFAULT_BRANCH" '$branch | @uri | gsub("%2F"; "/")')"
            caller_file="$(mktemp "${RUNNER_TEMP:-/tmp}/ai-review-caller.XXXXXX")"
            if ! GH_TOKEN="$ACTIONS_TOKEN" gh api \
              "repos/$TARGET_REPO/contents/.github/workflows/ai-review-merge.yml?ref=$branch_ref" \
              -H 'Accept: application/vnd.github.raw+json' >"$caller_file"; then
              rm -f "$caller_file"
              echo "::error::could not read the protected default-branch review caller" >&2
              return 1
            fi
            caller_sha256="$(sha256sum "$caller_file" | cut -d' ' -f1)"
            rm -f "$caller_file"
            selected_json="$policy_json"
            if [ "$caller_sha256" = 39d9325e5a13b6f1cafb3237a920d1737f9e74b905e70e3ec0fcd5955a7679d6 ]; then
              selected_json="$(jq -ce '
                if .authority == "human"
                   and .provider == "anthropic"
                   and .pricing_version == "anthropic-native-v1"
                   and .fallback_model == ""
                   and .fallback_budget_usd == ""
                   and .explicit_rereview == false
                then {actor,actor_permission,budget_usd,model,pricing_version,provider}
                else error("legacy bootstrap caller accepts only ordinary human-authority Anthropic policy")
                end
              ' <<<"$policy_json")" || return 1
            fi
            printf '%s' "$selected_json" | base64 -w0 | tr '+/' '-_' | tr -d '='
          }
          [ "$explicit_label_delivery" = true ] && [ "$label_normalized" = re-review ] && explicit_rereview=true
          if [ "$explicit_rereview" = true ] && [ "${GITHUB_RUN_ATTEMPT:-1}" -ne 1 ]; then
            echo "::error::an explicit re-review requires a new authorized label event; reruns cannot spend another diagnostic pass"
            exit 1
          fi
          rereview_actor="${REQUEST_ACTOR:-}"
          rereview_label="$(jq -r '[.labels[].name | select((ascii_downcase | gsub("[ _-]+"; "-")) == "re-review")] | first // ""' <<<"$meta")"
          ai_review_label="$(jq -r '[.labels[].name | select((ascii_downcase | gsub("[ _-]+"; "-")) == "ai-review")] | first // ""' <<<"$meta")"
          authorize_ai_review_actor() {
            local actor="$1"
            if ! [[ "$actor" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]; then
              GH_TOKEN="$ACTIONS_TOKEN" gh pr edit "$PR_NUMBER" --repo "$TARGET_REPO" --remove-label "$ai_review_label" 2>/dev/null || true
              echo "::error::AI review label actor is invalid"; return 1
            fi
            actor_permission="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/collaborators/$actor/permission" --jq '.role_name // ""')" || {
              echo "::error::could not authorize AI review actor"; return 1;
            }
            case "$actor_permission" in
              admin|maintain) review_actor="$actor" ;;
              *)
                if ! GH_TOKEN="$ACTIONS_TOKEN" gh pr edit "$PR_NUMBER" --repo "$TARGET_REPO" --remove-label "$ai_review_label"; then
                  echo "::error::unauthorized AI review label could not be removed; future events remain blocked"
                fi
                echo "::error::$actor lacks maintain/admin permission for paid AI review"; return 1 ;;
            esac
          }
          authority="${REVIEW_AUTHORITY:-human}"
          case "$authority" in human|ai-approve|ai-merge) ;; *) echo "::error::AI_REVIEW_AUTHORITY must be human, ai-approve, or ai-merge"; exit 1 ;; esac
          if [ "$explicit_rereview" = true ]; then
            [ -n "$rereview_label" ] || { echo "::error::re-review event does not match current PR labels"; exit 1; }
            review_provider="${REREVIEW_PROVIDER:-}"; review_model="${REREVIEW_MODEL:-}"; review_budget_usd="${REREVIEW_BUDGET_USD:-}"
            fallback_model="${REREVIEW_FALLBACK_MODEL:-}"; fallback_budget_usd="${REREVIEW_FALLBACK_BUDGET_USD:-}"
            if [ -z "$review_provider" ] || [ -z "$review_model" ] || [ -z "$review_budget_usd" ]; then
              echo "::error::explicit re-review policy is not fully configured; refusing before paid dispatch"; exit 1
            fi
            [[ "$rereview_actor" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]] || { echo "::error::re-review actor is invalid"; exit 1; }
            actor_permission="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/collaborators/$rereview_actor/permission" --jq '.role_name // ""')" || {
              echo "::error::could not authorize re-review actor"; exit 1;
            }
            case "$actor_permission" in admin|maintain) ;; *) echo "::error::$rereview_actor lacks maintain/admin permission for paid re-review"; exit 1 ;; esac
            review_actor="$rereview_actor"
          else
            review_provider="${PRIMARY_PROVIDER:-anthropic}"; review_model="${PRIMARY_MODEL:-auto}"; review_budget_usd="${PRIMARY_BUDGET_USD:-auto}"
            fallback_model="${PRIMARY_FALLBACK_MODEL:-}"; fallback_budget_usd="${PRIMARY_FALLBACK_BUDGET_USD:-}"
            review_actor=trusted-arm; actor_permission=automation
          fi
          case "$review_provider" in
            anthropic)
              # Repository-level provider selection overrides the inherited
              # organization DeepSeek cascade as one policy unit. Clear stale
              # fallback values before validating and binding the receipt.
              fallback_model=""; fallback_budget_usd=""
              review_pricing_version=anthropic-native-v1
              ;;
            openai)
              if [ "$explicit_rereview" != true ] || [ "$review_model" != gpt-5.6-luna ]; then
                echo "::error::OpenAI gpt-5.6-luna is restricted to explicit re-review"; exit 1
              fi
              fallback_model=""; fallback_budget_usd=""
              review_pricing_version=openai-luna-long-context-2026-08-08
              ;;
            deepseek)
              [ "$review_model" = deepseek-v4-pro ] && [ "$fallback_model" = deepseek-v4-flash ] || {
                echo "::error::DeepSeek cascade must be deepseek-v4-pro then deepseek-v4-flash"; exit 1;
              }
              [ -n "$fallback_budget_usd" ] || { echo "::error::DeepSeek fallback budget is required"; exit 1; }
              review_pricing_version=deepseek-v4-2026-08-10
              ;;
            *) echo "::error::unsupported review provider"; exit 1 ;;
          esac
          if [ "$review_budget_usd" != auto ] && { ! [[ "$review_budget_usd" =~ ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$ ]] || ! awk -v b="$review_budget_usd" 'BEGIN { exit !(b > 0) }'; }; then
            echo "::error::invalid review budget"; exit 1
          fi
          if [ -n "$fallback_budget_usd" ] && { ! [[ "$fallback_budget_usd" =~ ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$ ]] || ! awk -v b="$fallback_budget_usd" 'BEGIN { exit !(b > 0) }'; }; then
            echo "::error::invalid fallback review budget"; exit 1
          fi
          if [ "$explicit_label_delivery" = true ] && [ "$explicit_rereview" = false ]; then
            [ "$label_normalized" = ai-review ] || exit 0
            explicit_ai_review=true
            [ -n "$ai_review_label" ] || { echo "::error::ai-review event does not match current PR labels"; exit 1; }
            authorize_ai_review_actor "$REQUEST_ACTOR" || exit 1
          fi
          review_policy_json="$(jq -cSn --arg provider "$review_provider" --arg model "$review_model" --arg budget_usd "$review_budget_usd" \
            --arg fallback_model "$fallback_model" --arg fallback_budget_usd "$fallback_budget_usd" \
            --arg pricing_version "$review_pricing_version" --arg actor "$review_actor" --arg actor_permission "$actor_permission" --arg authority "$authority" \
            --argjson explicit_rereview "$explicit_rereview" \
            '{provider:$provider,model:$model,budget_usd:$budget_usd,fallback_model:$fallback_model,fallback_budget_usd:$fallback_budget_usd,pricing_version:$pricing_version,actor:$actor,actor_permission:$actor_permission,authority:$authority,explicit_rereview:$explicit_rereview}')"
          review_policy="$(printf '%s' "$review_policy_json" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
          [[ "$review_policy" =~ ^[A-Za-z0-9_-]{1,2048}$ ]] || { echo "::error::review policy envelope is invalid"; exit 1; }
          [ "$EVENT_ACTION" = ready_for_review ] && hold_removed=true
          if [ "$EVENT_ACTION" = edited ]; then
            [ "$EVENT_OLD_TITLE_HELD" = true ] || exit 0
          current_title_held="$(jq -r '.title | ascii_upcase | test("(^|[^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_])DO NOT MERGE([^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_]|$)")' <<<"$meta")"
            [ "$current_title_held" = false ] || exit 0
            hold_removed=true
          fi
          if [ "$EVENT_ACTION" = unlabeled ]; then
            removed_normalized="$(jq -nr --arg raw_label "$EVENT_LABEL" "\$raw_label | ascii_upcase | gsub(\"[ _-]+\";\" \")")"
            case "$removed_normalized" in HOLD|'DO NOT MERGE') hold_removed=true ;; *) exit 0 ;; esac
          fi
          if [ "$hold_removed" = true ] && { [ "$EVENT_ACTION" = ready_for_review ] || [ "$EVENT_ACTION" = edited ] || [ "$EVENT_ACTION" = unlabeled ]; }; then
            case "${HOLD_CLEAR_ACTOR_PERMISSION:-}" in
              admin|maintain) ;;
              *) echo "::error::hold removal lacks trusted actor authorization"; exit 1 ;;
            esac
          fi

          latest="$(gh api "repos/$TARGET_REPO/commits/$head_sha/check-runs" -H 'Accept: application/vnd.github+json' --jq \
            "[.check_runs[] | select(.name == \"AI review authorization\" and .app.id == 15368 and .app.slug == \"github-actions\")] | sort_by(.id) | last // {}")"
          latest_id="$(jq -r '.id // ""' <<<"$latest")"
          latest_status="$(jq -r '.status // ""' <<<"$latest")"
          latest_conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
          latest_title="$(jq -r '.output.title // ""' <<<"$latest")"

          # BEGIN CROSS-RUN ORPHAN RECOVERY
          recover_orphaned_authorization() {
            local check_json="$1" check_id external_id details_url
            local scheme version receipt_repo receipt_pr receipt_head source_run_id source_attempt nonce extra
            local source_run completed_epoch now_epoch receipt_name artifacts receipt_count receipt_dir receipt_present
            local expected_review_title review_pages owned_reviews owned_count owned_status current patch check_app_id check_app_slug

            check_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$check_json")" || return 1
          check_app_id="$(jq -er '.app.id | select(type == "number" and . > 0)' <<<"$check_json")" || return 1
          check_app_slug="$(jq -er '.app.slug | select(type == "string" and test("^[A-Za-z0-9-]+$"))' <<<"$check_json")" || return 1
          [ "$check_app_id:$check_app_slug" = 15368:github-actions ] || return 1
            external_id="$(jq -er '.external_id | select(type == "string")' <<<"$check_json")" || return 1
            details_url="$(jq -er '.details_url | select(type == "string")' <<<"$check_json")" || return 1
            IFS=: read -r scheme version receipt_repo receipt_pr receipt_head source_run_id source_attempt nonce extra <<<"$external_id"
            [ "$scheme" = ai-review ] && [ "$version" = v1 ] && [ -z "${extra:-}" ] || return 1
            [ "$receipt_repo" = "$TARGET_REPO" ] && [ "$receipt_pr" = "$PR_NUMBER" ] && [ "$receipt_head" = "$head_sha" ] || return 1
            [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]] && [[ "$source_attempt" =~ ^[1-9][0-9]*$ ]] \
              && [[ "$nonce" =~ ^[0-9a-f]{64}$ ]] || return 1
            [ "$source_run_id" != "$GITHUB_RUN_ID" ] || return 10
            # GitHub stores an Actions-owned check's own page as its details_url (#1648);
            # the arm run is named by external_id and by the receipt, never by this field.
            [ "$details_url" = "$GITHUB_SERVER_URL/$TARGET_REPO/runs/$check_id" ] || return 1

            source_run="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$source_run_id")" || return 1
            jq -e --arg repo "$TARGET_REPO" --argjson repo_id "$REPOSITORY_ID" \
              --argjson run_id "$source_run_id" --argjson attempt "$source_attempt" '
                .id == $run_id and .run_attempt == $attempt and .status == "completed" and
                .event == "pull_request_target" and (.path == ".github/workflows/gate-rearm.yml" or .path == ".github/workflows/ai-review-label-rearm.yml" or .path == ".github/workflows/ai-review-lifecycle-rearm.yml") and
                (.head_repository.full_name | ascii_downcase) == ($repo | ascii_downcase) and .repository.id == $repo_id and
                # GitHub can report a completed run with completed_at still null
                # (an observed API anomaly, not evidence it might still be
                # active); accept updated_at as the terminal timestamp then.
                # `== null` also matches a missing key, which is intentional:
                # the GitHub REST API always sends this key on a run object.
                ((.completed_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) or
                 (.completed_at == null and (.updated_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))))
              ' <<<"$source_run" >/dev/null || return 10
            local source_path source_file source_workflow source_workflow_id
            source_path="$(jq -r '.path' <<<"$source_run")"
            case "$source_path" in
              .github/workflows/gate-rearm.yml) ;;
              .github/workflows/ai-review-label-rearm.yml)
                source_file=ai-review-label-rearm.yml
                source_workflow=.github/workflows/ai-review-label-rearm.yml
                ;;
              .github/workflows/ai-review-lifecycle-rearm.yml)
                source_file=ai-review-lifecycle-rearm.yml
                source_workflow=.github/workflows/ai-review-lifecycle-rearm.yml
                ;;
              *) return 10 ;;
            esac
            if [ -n "${source_file:-}" ]; then
              jq -e --arg head "$head_sha" --arg repo "$TARGET_REPO" --argjson repo_id "$REPOSITORY_ID" \
                --argjson attempt "$source_attempt" '
                  .run_attempt == 1 and .run_attempt == $attempt and .head_sha == $head and
                  (.head_repository.full_name | ascii_downcase) == ($repo | ascii_downcase) and .repository.id == $repo_id and
                  (.actor.login | type == "string" and length > 0)
                ' <<<"$source_run" >/dev/null || return 1
              source_workflow_id="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/workflows/$source_file" --jq '.id')" || return 1
              [[ "$source_workflow_id" =~ ^[1-9][0-9]*$ ]] || return 1
              jq -e --argjson workflow "$source_workflow_id" '.workflow_id == $workflow' <<<"$source_run" >/dev/null || return 1
            fi
            completed_epoch="$(date -u -d "$(jq -r '.completed_at // .updated_at' <<<"$source_run")" +%s)" || return 1
            now_epoch="$(date -u +%s)"
            [ "$now_epoch" -ge "$completed_epoch" ] || return 1
            # Bound API eventual consistency: a just-accepted workflow dispatch
            # may not be listable immediately after its source arm terminates.
            [ $((now_epoch - completed_epoch)) -ge 300 ] || return 10

            receipt_name="ai-review-arm-$source_run_id-$source_attempt"
            artifacts="$(GH_TOKEN="$ACTIONS_TOKEN" gh api --paginate --slurp \
              "repos/$TARGET_REPO/actions/runs/$source_run_id/artifacts?per_page=100")" || return 1
            receipt_count="$(jq -er --arg name "$receipt_name" '
              [.[].artifacts[] | select(.name == $name and .expired == false)] | length
            ' <<<"$artifacts")" || return 1
            receipt_present=false
            case "$receipt_count" in 0) ;; 1)
              receipt_present=true
              receipt_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ai-orphan-receipt.XXXXXX")" || return 1
              if ! GH_TOKEN="$ACTIONS_TOKEN" gh run download "$source_run_id" --repo "$TARGET_REPO" \
                --name "$receipt_name" --dir "$receipt_dir"; then
                rm -rf "$receipt_dir"; return 1
              fi
              jq -e --arg repo "$TARGET_REPO" --argjson pr "$PR_NUMBER" --arg head "$head_sha" \
                --argjson check "$check_id" --argjson run "$source_run_id" --argjson attempt "$source_attempt" \
                --arg external "$external_id" --arg url "$GITHUB_SERVER_URL/$TARGET_REPO/actions/runs/$source_run_id" --argjson app "$APP_ID" --arg slug "$APP_SLUG" --argjson check_app_id "$check_app_id" --arg check_app_slug "$check_app_slug" \
                --arg source_path "$(jq -r .path <<<"$source_run")" '
                .schema == (if $source_path == ".github/workflows/gate-rearm.yml" then 1 else 2 end) and
                  .repository == $repo and .pr_number == $pr and .head_sha == $head and
                  .check_run_id == $check and .arm_run_id == $run and .arm_run_attempt == $attempt and
                .external_id == $external and .details_url == $url and .app_id == $app and .app_slug == $slug and
                .check_app_id == $check_app_id and .check_app_slug == $check_app_slug
                ' "$receipt_dir/receipt.json" >/dev/null || { rm -rf "$receipt_dir"; return 1; }
              if [ -n "${source_file:-}" ]; then
                local receipt_workflow_sha protected_blob receipt_blob branch_ref expected_ref
                receipt_workflow_sha="$(jq -er '.workflow_sha' "$receipt_dir/receipt.json")" || { rm -rf "$receipt_dir"; return 1; }
                [[ "$receipt_workflow_sha" =~ ^[0-9a-f]{40}$ ]] || { rm -rf "$receipt_dir"; return 1; }
                # Keep the protected caller and the workflow revision recorded by the receipt identical.
                branch_ref="$(jq -rn --arg branch "$DEFAULT_BRANCH" '$branch | @uri | gsub("%2F"; "/")')"
                protected_blob="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/contents/$source_workflow?ref=$branch_ref" --jq '.sha')" || { rm -rf "$receipt_dir"; return 1; }
                receipt_blob="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/contents/$source_workflow?ref=$receipt_workflow_sha" --jq '.sha')" || { rm -rf "$receipt_dir"; return 1; }
                if ! [[ "$protected_blob" =~ ^[0-9a-f]{40}$ ]] || [ "$protected_blob" != "$receipt_blob" ]; then
                  rm -rf "$receipt_dir"
                  return 1
                fi
                expected_ref="$TARGET_REPO/$source_workflow@refs/heads/$DEFAULT_BRANCH"
                if ! jq -e --arg ref "$expected_ref" --arg path "$source_path" \
                    --arg actor "$(jq -r '.actor.login' <<<"$source_run")" '
                    .schema == 2 and .delivery_actor == $actor and .workflow_ref == $ref and
                    (.workflow_sha | test("^[0-9a-f]{40}$")) and
                    (if $path == ".github/workflows/ai-review-label-rearm.yml" then .delivery_event == "labeled"
                     else (.delivery_event == "ready_for_review" or .delivery_event == "converted_to_draft" or
                           .delivery_event == "edited" or .delivery_event == "unlabeled") end)
                  ' "$receipt_dir/receipt.json" >/dev/null; then
                  rm -rf "$receipt_dir"
                  return 1
                fi
              fi
              rm -rf "$receipt_dir" ;;
              *) return 1 ;;
            esac

            expected_review_title="AI review authorization $check_id from arm $source_run_id.$source_attempt"
            review_pages="$(GH_TOKEN="$ACTIONS_TOKEN" gh api --paginate --slurp \
              "repos/$TARGET_REPO/actions/workflows/ai-review-merge.yml/runs?event=workflow_dispatch&per_page=100")" || return 1
            owned_reviews="$(jq -ce --arg title "$expected_review_title" --arg branch "$DEFAULT_BRANCH" --arg repo "$TARGET_REPO" '
              [.[].workflow_runs[] | select(
                .display_title == $title and .event == "workflow_dispatch" and
                .path == ".github/workflows/ai-review-merge.yml" and .head_branch == $branch and
                (.head_repository.full_name | ascii_downcase) == ($repo | ascii_downcase) and (.repository.full_name | ascii_downcase) == ($repo | ascii_downcase)
              )]
            ' <<<"$review_pages")" || return 1
            owned_count="$(jq -r 'length' <<<"$owned_reviews")"
            [ "$owned_count" -le 1 ] || return 1
            if [ "$owned_count" = 1 ]; then
              owned_status="$(jq -r '.[0].status // ""' <<<"$owned_reviews")"
              case "$owned_status" in queued|in_progress|waiting|pending|requested) return 10 ;; completed) ;; *) return 1 ;; esac
            elif [ "$receipt_present" = true ]; then
              # workflow_dispatch has no documented visibility deadline. A
              # published receipt means an accepted but not-yet-listable review
              # could still verify authority and later own this check. Absence
              # from the run listing is therefore never proof of abandonment.
              return 10
            fi

            current="$(GH_TOKEN="$GH_TOKEN" gh api "repos/$TARGET_REPO/check-runs/$check_id")" || return 1
            jq -e --argjson id "$check_id" --argjson app "$check_app_id" --arg slug "$check_app_slug" \
              --arg external "$external_id" --arg head "$head_sha" '
                .id == $id and .app.id == $app and .app.slug == $slug and .external_id == $external and
                .head_sha == $head and .status == "in_progress" and .conclusion == null
              ' <<<"$current" >/dev/null || return 1
            patch="$(GH_TOKEN="$GH_TOKEN" gh api --method PATCH "repos/$TARGET_REPO/check-runs/$check_id" \
              -f status=completed -f conclusion=failure \
              -f 'output[title]=Orphaned authorization recovered' \
              -f "output[summary]=The source arm is terminal and no active receipt-bound review owns this exact check. Recovery run $GITHUB_RUN_ID closed it without granting authorization.")" || return 1
            jq -e --argjson id "$check_id" --argjson app "$check_app_id" --arg slug "$check_app_slug" \
              --arg external "$external_id" '
                .id == $id and .app.id == $app and .app.slug == $slug and .external_id == $external and
                .status == "completed" and .conclusion == "failure" and .output.title == "Orphaned authorization recovered"
              ' <<<"$patch" >/dev/null || return 1
          }

          if [ "$hold_removed" = false ] && [ "$explicit_rereview" = false ] && [ "$explicit_ai_review" = false ] \
             && [ "$latest_status" = in_progress ] && [[ "$latest_id" =~ ^[1-9][0-9]*$ ]]; then
            if recover_orphaned_authorization "$latest"; then
              latest_id=''; latest_status=''; latest_conclusion=''; latest_title=''
            else
              recovery_status=$?
              if [ "$recovery_status" = 10 ]; then
                echo "Existing authorization is not provably orphaned; duplicate event is a no-op."
                exit 0
              fi
            echo "::error::pending authorization recovery state is malformed, ambiguous, or unverifiable; no duplicate review was dispatched"
              exit 1
            fi
          elif [ "$hold_removed" = false ] && [ "$explicit_rereview" = false ] && [ "$explicit_ai_review" = false ] \
               && [ "$latest_status" = completed ] && [ "$latest_conclusion" = failure ] \
               && [ "$latest_title" = 'Orphaned authorization recovered' ]; then
            # A prior recovery may have terminated after closing the orphan but
            # before creating its replacement. The exact recovery marker makes
            # a later synchronized rerun idempotently continue that lifecycle.
            jq -e --arg repo "$TARGET_REPO" --arg pr "$PR_NUMBER" --arg head "$head_sha" \
              --arg server "$GITHUB_SERVER_URL" '
                (.external_id | select(type == "string") | split(":")) as $parts |
                ($parts | length == 8) and $parts[0] == "ai-review" and $parts[1] == "v1" and
                $parts[2] == $repo and $parts[3] == $pr and $parts[4] == $head and
                ($parts[5] | test("^[1-9][0-9]*$")) and ($parts[6] | test("^[1-9][0-9]*$")) and
                ($parts[7] | test("^[0-9a-f]{64}$")) and
                .details_url == ($server + "/" + $repo + "/runs/" + (.id | tostring))
              ' <<<"$latest" >/dev/null || {
                echo "::error::authorization recovery marker is malformed or not bound to the exact head"
                exit 1
              }
            latest_id=''; latest_status=''; latest_conclusion=''; latest_title=''
          fi
          # END CROSS-RUN ORPHAN RECOVERY
          if [ "$hold_removed" = true ] && [[ "$latest_id" =~ ^[1-9][0-9]*$ ]] && [ "$latest_conclusion" = success ]; then
            # The arm run is carried by external_id; details_url is the check's own page (#1648).
            arm_run_id="$(jq -r --arg repo "$TARGET_REPO" --arg pr "$PR_NUMBER" --arg head "$head_sha" '
                (.external_id // "" | split(":")) as $p |
                if ($p | length) == 8 and $p[0] == "ai-review" and $p[1] == "v1" and
                   $p[2] == $repo and $p[3] == $pr and $p[4] == $head and
                   ($p[5] | test("^[1-9][0-9]*$")) and
                   ($p[6] | test("^[1-9][0-9]*$")) and ($p[7] | test("^[0-9a-f]{64}$")) then $p[5] else "" end' <<<"$latest")"
            [[ "$arm_run_id" =~ ^[1-9][0-9]*$ ]] || exit 1
            arm_run_attempt="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$arm_run_id" --jq '.run_attempt // ""')"
            [[ "$arm_run_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
            receipt_name="ai-review-arm-$arm_run_id-$arm_run_attempt"
            receipt_count="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$arm_run_id/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"$receipt_name\" and .expired == false)] | length")"
            [ "$receipt_count" = 1 ] || {
              echo "::error::the approved head's arm receipt expired or is ambiguous; an administrator must restore independently verified authorization without dispatching another model review"
              exit 1
            }
            receipt_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ai-repromotion.XXXXXX")"
            trap 'rm -rf "$receipt_dir"' EXIT
            GH_TOKEN="$ACTIONS_TOKEN" gh run download "$arm_run_id" --repo "$TARGET_REPO" \
              --name "$receipt_name" --dir "$receipt_dir"
            [ -f "$receipt_dir/receipt.json" ] || exit 1
            review_policy="$(jq -er '.review_policy | select(type == "string")' "$receipt_dir/receipt.json")"
            [[ "$review_policy" =~ ^[A-Za-z0-9_-]{1,2048}$ ]] || exit 1
            [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
            GH_TOKEN="$ACTIONS_TOKEN" gh workflow run ai-privileged-merge.yml --repo "$TARGET_REPO" --ref "$DEFAULT_BRANCH" \
              -f pr_number="$PR_NUMBER" -f expected_head_sha="$head_sha" -f authorization_check_id="$latest_id" \
              -f arm_run_id="$arm_run_id" -f arm_run_attempt="$arm_run_attempt" -f review_policy="$review_policy"
            exit 0
          fi
          if [ "$hold_removed" = true ]; then
            if [[ "$latest_id" =~ ^[1-9][0-9]*$ ]] && [ "$latest_status" = in_progress ]; then
              pending_guidance='The existing AI review authorization for this exact head is still in progress. Wait for that review; do not add re-review, because it could incur a second model charge. If the linked arm run is stalled, an administrator must recover it without dispatching another model review.'
              arm_run_id="$(jq -r --arg repo "$TARGET_REPO" --arg pr "$PR_NUMBER" --arg head "$head_sha" '
                (.external_id // "" | split(":")) as $p |
                if ($p | length) == 8 and $p[0] == "ai-review" and $p[1] == "v1" and
                   $p[2] == $repo and $p[3] == $pr and $p[4] == $head and
                   ($p[5] | test("^[1-9][0-9]*$")) and
                   ($p[6] | test("^[1-9][0-9]*$")) and ($p[7] | test("^[0-9a-f]{64}$")) then $p[5] else "" end' <<<"$latest")"
              if [[ "$arm_run_id" =~ ^[1-9][0-9]*$ ]]; then
                arm_run="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$arm_run_id")"
                arm_run_attempt="$(jq -r '.run_attempt // ""' <<<"$arm_run")"
                receipt_name="ai-review-arm-$arm_run_id-$arm_run_attempt"
                receipt_count="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$arm_run_id/artifacts?per_page=100" \
                  --jq "[.artifacts[] | select(.name == \"$receipt_name\" and .expired == false)] | length")"
                if jq -e --arg repo "$TARGET_REPO" '
                    .event == "pull_request_target" and
                    (.path == ".github/workflows/gate-rearm.yml" or .path == ".github/workflows/ai-review-label-rearm.yml" or .path == ".github/workflows/ai-review-lifecycle-rearm.yml") and
                    (.head_repository.full_name | ascii_downcase) == ($repo | ascii_downcase) and
                    (.run_attempt | type == "number")
                  ' <<<"$arm_run" >/dev/null && [ "$receipt_count" = 1 ]; then
                  notice_body="$(printf '<!-- ai-review-hold-clear:%s -->\n%s' "$head_sha" "$pending_guidance")"
                  GH_TOKEN="$ACTIONS_TOKEN" gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" \
                    --body "$notice_body"
                  exit 0
                fi
              fi
              notice_body="$(printf '<!-- ai-review-hold-clear:%s -->\n%s' "$head_sha" \
                'The pending authorization cannot be tied to a live exact arm receipt. An administrator must recover the authorization without dispatching another model review.')"
              GH_TOKEN="$ACTIONS_TOKEN" gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" \
                --body "$notice_body"
              exit 1
            fi
            notice_body="$(printf '<!-- ai-review-hold-clear:%s -->\n%s' "$head_sha" \
              'This exact head has no successful AI review authorization. Add the re-review label only when you intentionally approve another paid review; hold removal never reruns the model automatically.')"
            GH_TOKEN="$ACTIONS_TOKEN" gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" \
              --body "$notice_body"
            exit 0
          fi
          if [ "$explicit_rereview" = false ] && [ "$explicit_ai_review" = false ] && [[ "$latest_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Authorization already exists for $head_sha; duplicate event is a no-op."
            exit 0
          fi

          review_policy="$(select_compatible_review_policy "$review_policy_json")" || exit 1
          [[ "$review_policy" =~ ^[A-Za-z0-9_-]{1,2048}$ ]] || { echo "::error::compatible review policy envelope is invalid"; exit 1; }

          nonce="$(openssl rand -hex 32)"
          [[ "$nonce" =~ ^[0-9a-f]{64}$ ]] || exit 1
          external_id="ai-review:v1:$TARGET_REPO:$PR_NUMBER:$head_sha:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$nonce"
          # Recorded in the receipt as the arm-run URL; GitHub replaces it on the stored
          # Actions-owned check with the check's own page, so verifiers never read it back (#1648).
          details_url="$GITHUB_SERVER_URL/$TARGET_REPO/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -nc --arg name 'AI review authorization' --arg sha "$head_sha" \
            --arg external_id "$external_id" --arg url "$details_url" \
            '{name:$name,head_sha:$sha,external_id:$external_id,status:"in_progress",details_url:$url,
              output:{title:"AI review pending",summary:"Trusted review is running for this exact head."}}')"
          check="$(gh api --method POST "repos/$TARGET_REPO/check-runs" --input - <<<"$payload")"
          check_id="$(jq -r '.id // ""' <<<"$check")"
          [[ "$check_id" =~ ^[1-9][0-9]*$ ]] || exit 1
          # Publish the accepted identifier before validating response
          # attribution. If attribution fails, the always-run terminalizer can
          # still complete the check instead of leaving it pending forever.
          {
            echo "check_id=$check_id"
            echo "head_sha=$head_sha"
            echo "external_id=$external_id"
          } >>"$GITHUB_OUTPUT"
          jq -e --argjson app_id 15368 --arg slug github-actions --arg external_id "$external_id" \
            '.app.id == $app_id and .app.slug == $slug and .external_id == $external_id' <<<"$check" >/dev/null || {
              echo "::error::created authorization check identity does not match the configured App and receipt"
              exit 1
            }

          if [ "$head_owner" != "$GITHUB_REPOSITORY_OWNER" ]; then
            gh api --method PATCH "repos/$TARGET_REPO/check-runs/$check_id" -f status=completed -f conclusion=failure \
              -f 'output[title]=Fork review requires a maintainer' \
              -f 'output[summary]=Secret-backed autonomous review is disabled for fork repositories.'
            exit 1
          fi

          if [ "$APP_KEY_POLICY_RESULT" != success ]; then
            echo 'failure_reason=ai_review_environment_policy' >>"$GITHUB_OUTPUT"
            echo "::error::AI review environment policy did not succeed; no review was dispatched"
            exit 1
          fi

          receipt_dir="$RUNNER_TEMP/ai-review-arm-receipt"
          mkdir -m 700 "$receipt_dir"
          jq -nc --arg repository "$TARGET_REPO" --argjson pr_number "$PR_NUMBER" --arg head_sha "$head_sha" \
            --argjson check_run_id "$check_id" --argjson arm_run_id "$GITHUB_RUN_ID" \
            --argjson arm_run_attempt "$GITHUB_RUN_ATTEMPT" --arg nonce "$nonce" --arg external_id "$external_id" \
            --arg details_url "$details_url" --argjson app_id "$APP_ID" --arg app_slug "$APP_SLUG" \
            --argjson check_app_id 15368 --arg check_app_slug github-actions \
            --arg review_policy "$review_policy" --arg delivery_event "$EVENT_ACTION" --arg delivery_actor "$REQUEST_ACTOR" \
            --arg workflow_ref "$WORKFLOW_REF" --arg workflow_sha "$WORKFLOW_SHA" \
            --argjson source_bound "$source_bound_delivery" \
            '{schema:(if $source_bound then 2 else 1 end),repository:$repository,pr_number:$pr_number,head_sha:$head_sha,check_run_id:$check_run_id,
              arm_run_id:$arm_run_id,arm_run_attempt:$arm_run_attempt,nonce:$nonce,external_id:$external_id,
              details_url:$details_url,app_id:$app_id,app_slug:$app_slug,check_app_id:$check_app_id,check_app_slug:$check_app_slug,review_policy:$review_policy}
             | if $source_bound then
                 . + {delivery_event:$delivery_event,delivery_actor:$delivery_actor,
                      workflow_ref:$workflow_ref,workflow_sha:$workflow_sha}
               else . end' >"$receipt_dir/receipt.json"
          {
                        echo "explicit_rereview=$explicit_rereview"
            echo "explicit_ai_review=$explicit_ai_review"
            echo "receipt_name=ai-review-arm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "review_policy=$review_policy"
          } >>"$GITHUB_OUTPUT"

      - name: Upload immutable arm receipt
        if: steps.arm.outputs.check_id != ''
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.arm.outputs.receipt_name }}
          path: ${{ runner.temp }}/ai-review-arm-receipt/receipt.json
          if-no-files-found: error
          # GitHub's repository maximum keeps authorization recoverable across
          # long-lived holds without paying for another same-head model review.
          retention-days: 90

      # A stale protected review caller cannot authorize its own update: GitHub runs
      # the default-branch caller, whose immutable verifier predates the canonical
      # organization casing (#1696, ADR 0227). This arm runs the organization ruleset's
      # current revision, so it alone can prove that a pull request is nothing but the
      # byte-exact generated caller update to a newer canonical main commit, plus any
      # allowlisted reusable CI pin moving to that same commit (ADR 0231). The proof
      # is inline because a required workflow cannot rely on checking out its own
      # revision. Any failed or unavailable proof leaves the ordinary dispatch in place.
      - name: Classify stale review caller bootstrap
        id: bootstrap
        if: steps.arm.outputs.check_id != '' && steps.arm.outputs.explicit_rereview != 'true' && steps.arm.outputs.explicit_ai_review != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.arm.outputs.head_sha }}
        run: |
          set -euo pipefail
          program="$RUNNER_TEMP/review-caller-bootstrap.py"
          cat >"$program" <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from datetime import date
          from urllib.parse import quote

          CANONICAL = "Verjson/.github"
          # 65529002 made every review-path repository comparison ASCII-case-insensitive; a
          # stale pin is one that predates it. Fixed: it defines which callers are stale.
          CASING_REPAIR = "65529002f4fecf2a5bb634047b07ead3ff0bdeaa"
          # The oldest review revision without a known, already-fixed authorization defect
          # (12098a0e, #1650: the finalizer binds the check to the exact head). It contains
          # CASING_REPAIR. Raise it whenever a review-path security fix lands on main.
          MINIMUM_SAFE_REVIEW = "12098a0e495317699131e97f1b2e136c5297ccad"
          CALLER = ".github/workflows/ai-review-merge.yml"
          MAX_PATHS = 32
          MAX_BLOB_BYTES = 262144
          SHA = re.compile(r"[0-9a-f]{40}")
          PIN = re.compile(rb"^    uses: Verjson/\.github/\.github/workflows/ai-review-merge\.yml@([0-9a-f]{40})$", re.M)
          FRAGMENT = re.compile(r"NEXT/([0-9]{4}-[0-9]{2}-[0-9]{2})-issue-([1-9][0-9]{0,8}|[0-9]{8}T[0-9]{6}Z|[0-9a-f]{6,12})"
                                r"-ai-review-caller-bootstrap\.md")
          # Canonical reusable CI whose caller a bootstrap may move to the contract (ADR 0231). Closed:
          # add a workflow only with evidence that a bootstrap cannot pass required checks without it.
          REUSABLE_CI = (".github/workflows/node-ci.yml", ".github/workflows/actionlint.yml")
          WORKFLOW_FILE = re.compile(r"\.github/workflows/[A-Za-z0-9._-]+\.ya?ml")
          COMMENT = re.compile(rb"[ \t]*#")
          # Line breaks YAML honors besides `\n` and `\r\n`. The proof splits on `\n` only, so any of them
          # would let YAML structure hide inside what the proof reads as one comment line.
          FOREIGN_BREAK = re.compile("\r(?!\n)|\x85|\u2028|\u2029")
          JOB_KEY = re.compile(rb"  [A-Za-z_][A-Za-z0-9_-]*:(?:[ \t]+(?:#.*)?)?\r?")
          JOBS_ROOT = re.compile(rb"jobs:(?:[ \t]+(?:#.*)?)?\r?")
          REUSABLE_REF = re.compile(rb"(    uses: )([A-Za-z0-9._-]+/[A-Za-z0-9._-]+)/(\.github/workflows/[A-Za-z0-9._-]+\.ya?ml)@([0-9a-f]{40})((?:[ \t]+(?:#.*)?)?\r?)")
          INPUTS = (
              ("pr_number", True), ("expected_head_sha", True), ("authorization_check_id", True),
              ("arm_run_id", True), ("arm_run_attempt", True), ("explicit_rereview", False),
              ("review_policy", True),
          )


          class Ineligible(Exception):
              pass


          def require(condition, reason):
              if condition is not True:
                  raise Ineligible(reason)


          def expression(name):
              # Built in pieces so the Actions runner never evaluates the template.
              return "$" + "{{ inputs." + name + " }}"


          def render_caller(sha):
              lines = [
                  "# GENERATED FILE — do not edit by hand.",
                  "# Regenerate with:",
                  f"#   scripts/gen-ai-review-caller.sh {sha} > .github/workflows/ai-review-merge.yml",
                  "name: AI review",
                  "run-name: AI review authorization " + expression("authorization_check_id")
                  + " from arm " + expression("arm_run_id") + "." + expression("arm_run_attempt"),
                  "",
                  "on:",
                  "  workflow_dispatch:",
                  "    inputs:",
              ]
              for name, required in INPUTS:
                  lines += [f"      {name}:", f"        required: {'true' if required else 'false'}"]
                  lines += ["        type: string"] if name != "explicit_rereview" else [
                      "        type: boolean", "        default: false"]
              lines += [
                  "", "permissions:", "  actions: write", "  checks: write", "  contents: read",
                  "  issues: write", "  pull-requests: write", "  statuses: read", "",
                  "jobs:", "  review:",
                  f"    uses: Verjson/.github/.github/workflows/ai-review-merge.yml@{sha}",
                  "    secrets: inherit", "    with:", "      ai_review_environment: ai-review-app",
                  f"      contract_ref: {sha}",
              ]
              lines += [f"      {name}: " + expression(name) for name, _ in INPUTS]
              return ("\n".join(lines) + "\n").encode()


          def render_fragment(date, identity, stale, contract):
              # Byte-identical to scripts/gen-ai-review-caller-bootstrap-fragment.sh.
              key = "issue" if re.fullmatch(r"[1-9][0-9]*", identity) else "id"
              return (
                  f"---\ndate: {date}\n{key}: {identity}\nimpact: patch\n"
                  "title: Bootstrap the AI review caller to a current canonical revision\n---\n\n"
                  f"Regenerate `.github/workflows/ai-review-merge.yml` at canonical Verjson/.github revision `{contract}`, "
                  f"replacing `{stale}`, whose receipt verifier cannot authorize its own update. The organization "
                  "authorization arm verified this byte-exact generated change under Verjson/.github ADR 0227.\n"
              ).encode()


          def api(path):
              completed = subprocess.run(["gh", "api", path], capture_output=True, check=False)
              require(completed.returncode == 0, f"GitHub API read failed: {shown(path)}")
              try:
                  return json.loads(completed.stdout)
              except ValueError as error:
                  raise Ineligible(f"GitHub API returned malformed JSON: {shown(path)}") from error


          def shown(text):
              # Paths and API routes are untrusted text; git permits newlines in paths, so a
              # raw path could forge a workflow command in this privileged job's log.
              return json.dumps(text)


          def same_repository(left, right):
              return isinstance(left, str) and left.casefold() == right.casefold()


          def git_blob_sha(content):
              return hashlib.sha1(b"blob %d\0" % len(content) + content).hexdigest()


          def tree(repo, commit):
              commit_object = api(f"repos/{repo}/git/commits/{commit}")
              require(commit_object.get("sha") == commit, "commit object does not match its ID")
              tree_sha = commit_object["tree"]["sha"]
              require(SHA.fullmatch(tree_sha) is not None, "commit tree ID is malformed")
              listing = api(f"repos/{repo}/git/trees/{tree_sha}?recursive=1")
              require(listing.get("sha") == tree_sha, "tree listing does not match its ID")
              require(listing.get("truncated") is False, "tree listing is truncated")
              entries = {}
              for entry in listing["tree"]:
                  if entry["type"] == "tree":
                      continue
                  require(entry["path"] not in entries, "tree listing repeats a path")
                  entries[entry["path"]] = (entry["mode"], entry["type"], entry["sha"])
              return entries


          def blob(repo, entry):
              mode, kind, sha = entry
              require(kind == "blob", "submodules and other non-blob entries may not change")
              require(mode == "100644", "only regular non-executable files may change")
              payload = api(f"repos/{repo}/git/blobs/{sha}")
              require(payload.get("sha") == sha and payload.get("encoding") == "base64", "blob payload is malformed")
              size = payload.get("size")
              require(type(size) is int and 0 <= size <= MAX_BLOB_BYTES, "blob is too large")
              content = base64.b64decode(payload["content"])
              require(len(content) == size and git_blob_sha(content) == sha, "blob content does not match its ID")
              return content


          def pinned(content):
              pins = PIN.findall(content)
              require(len(pins) == 1, "review caller does not name exactly one canonical revision")
              return pins[0].decode()


          def enclosing(lines, index, width):
              # The nearest earlier content line indented less than `width`; blanks and comments carry no structure.
              for line in reversed(lines[:index]):
                  content = line.lstrip(b" ")
                  if content.strip() and not content.startswith(b"#") and len(line) - len(content) < width:
                      return line
              return b""


          def job_call(lines, index):
              # A reference is a job's reusable workflow call only directly under a bare job key inside the
              # top-level `jobs:` map; under `note: >-` or a trigger key the same bytes mean something else.
              return (JOB_KEY.fullmatch(enclosing(lines, index, 4)) is not None
                      and JOBS_ROOT.fullmatch(enclosing(lines, index, 1)) is not None)


          def reusable_ci_pins(path, before, after, contract):
              # A reusable CI caller has no generator, so its proof is a line diff. A changed line is either an
              # allowlisted canonical reusable workflow reference whose 40-hex revision alone moves to the
              # contract, or a comment whose only change is that same revision swap.
              for content in (before, after):
                  try:
                      text = content.decode("utf-8")
                  except UnicodeDecodeError as error:
                      raise Ineligible(f"{shown(path)} is not UTF-8") from error
                  require(FOREIGN_BREAK.search(text) is None,
                          f"{shown(path)} contains a line break other than \\n or \\r\\n")
              old_lines, new_lines = before.split(b"\n"), after.split(b"\n")
              require(len(old_lines) == len(new_lines), f"{shown(path)} changes more than its reusable CI pin")
              stale, comments = set(), []
              for index, (old, new) in enumerate(zip(old_lines, new_lines)):
                  if old == new:
                      continue
                  if COMMENT.match(old) is not None:
                      comments.append((old, new))
                      continue
                  ref = REUSABLE_REF.fullmatch(old)
                  require(ref is not None and new == old[:ref.start(4)] + contract.encode() + old[ref.end(4):],
                          f"{shown(path)} changes more than its reusable CI pin")
                  require(same_repository(ref[2].decode(), CANONICAL) and ref[3].decode() in REUSABLE_CI,
                          f"{shown(path)} moves a workflow that is not an allowlisted canonical reusable CI workflow")
                  require(job_call(old_lines, index), f"{shown(path)} moves a reference that is not a job's reusable workflow call")
                  stale.add(ref[4].decode())
              for old, new in comments:
                  moved = old
                  for revision in stale:
                      moved = moved.replace(revision.encode(), contract.encode())
                  require(new == moved, f"{shown(path)} changes more than its reusable CI pin")
              return stale


          def compare(base, head):
              comparison = api(f"repos/{CANONICAL}/compare/{base}...{head}")
              require(comparison["base_commit"]["sha"] == base, "canonical comparison base is not exact")
              return comparison


          def contains(older, newer):
              comparison = compare(older, newer)
              status = comparison.get("status")
              return comparison.get("behind_by") == 0 and (
                  status == "identical"
                  or (status == "ahead" and comparison["merge_base_commit"]["sha"] == older))


          def verify(environment):
              repo = environment["TARGET_REPO"]
              pr_number = environment["PR_NUMBER"]
              head = environment["EXPECTED_HEAD_SHA"]
              branch = environment["DEFAULT_BRANCH"]
              require(re.fullmatch(r"[A-Za-z0-9._-]+/[A-Za-z0-9._-]+", repo) is not None, "repository is malformed")
              require(re.fullmatch(r"[1-9][0-9]*", pr_number) is not None, "pull request number is malformed")
              require(SHA.fullmatch(head) is not None, "head is malformed")
              require(re.fullmatch(r"[A-Za-z0-9._/-]+", branch) is not None and ".." not in branch,
                      "default branch is malformed")

              pull = api(f"repos/{repo}/pulls/{pr_number}")
              require(pull.get("state") == "open", "pull request is not open")
              require(pull["head"]["sha"] == head, "pull request head moved")
              require(pull["base"]["ref"] == branch, "pull request does not target the default branch")
              require(same_repository(pull["head"]["repo"]["full_name"], repo)
                      and same_repository(pull["base"]["repo"]["full_name"], repo),
                      "pull request crosses repositories")
              changed_files = pull.get("changed_files")
              require(type(changed_files) is int and 0 < changed_files <= MAX_PATHS, "pull request is too large")
              listed = api(f"repos/{repo}/pulls/{pr_number}/files?per_page=100")
              require(isinstance(listed, list) and len(listed) == changed_files, "pull request file list is incomplete")
              names = {item["filename"] for item in listed}
              require(len(names) == len(listed), "pull request file list repeats a path")
              require(CALLER in names, "the pull request does not change the generated review caller")

              protected = api(f"repos/{repo}/branches/{quote(branch, safe='')}")
              require(protected.get("protected") is True, "default branch is not protected")
              main = protected["commit"]["sha"]
              require(SHA.fullmatch(main) is not None, "default branch tip is malformed")
              comparison = api(f"repos/{repo}/compare/{main}...{head}")
              require(comparison.get("status") == "ahead" and comparison.get("behind_by") == 0
                      and comparison["base_commit"]["sha"] == main
                      and comparison["merge_base_commit"]["sha"] == main,
                      "head does not descend from the protected default branch tip")

              base_tree = tree(repo, main)
              head_tree = tree(repo, head)
              changed = {path for path in base_tree.keys() | head_tree.keys()
                         if base_tree.get(path) != head_tree.get(path)}
              require(changed == names, "pull request file list disagrees with the exact trees")
              require(CALLER in base_tree and CALLER in head_tree, "review caller is not modified in place")
              base_caller = blob(repo, base_tree[CALLER])
              head_caller = blob(repo, head_tree[CALLER])
              stale = pinned(base_caller)
              contract = pinned(head_caller)
              require(stale != contract, "review caller revision is unchanged")
              require(base_caller == render_caller(stale), "default-branch review caller is not generated")
              require(head_caller == render_caller(contract), "proposed review caller is not generated")
              # Consumer contract tests mirror the caller pin and digest. A mirror may change only by
              # swapping exactly those tokens; workflow and action configuration may not change at all.
              swaps = {stale.encode(): contract.encode(),
                       hashlib.sha256(base_caller).hexdigest().encode(): hashlib.sha256(head_caller).hexdigest().encode()}
              added = sorted(path for path in changed if path not in base_tree)
              require(len(added) <= 1, "the pull request adds more than one file")
              for path in added:
                  match = FRAGMENT.fullmatch(path)
                  require(match is not None, f"{shown(path)} is not the generated bootstrap changelog fragment")
                  try:
                      require(date.fromisoformat(match[1]).isoformat() == match[1], f"{shown(path)} has an invalid date")
                  except ValueError as error:
                      raise Ineligible(f"{shown(path)} has an invalid date") from error
                  require(blob(repo, head_tree[path]) == render_fragment(match[1], match[2], stale, contract),
                          f"{shown(path)} is not the generated bootstrap changelog fragment")
              modified = sorted(changed - {CALLER} - set(added))
              for path in modified:
                  require(path in base_tree and path in head_tree, f"{shown(path)} is not modified in place")
              # Exact-case only: GitHub runs workflows from `.github/workflows/` itself, never a subdirectory.
              reusable_ci = [path for path in modified if WORKFLOW_FILE.fullmatch(path) is not None]
              ci_stale = set()
              for path in reusable_ci:
                  ci_stale |= reusable_ci_pins(path, blob(repo, base_tree[path]), blob(repo, head_tree[path]), contract)
              # A contract test may mirror a moved reusable CI pin as well; it moves to the same contract.
              swaps.update({revision.encode(): contract.encode() for revision in ci_stale})
              swap = re.compile(b"|".join(re.escape(token) for token in sorted(swaps, key=len, reverse=True)))
              for path in modified:
                  if path in reusable_ci:
                      continue
                  base_entry, head_entry = base_tree[path], head_tree[path]
                  # GitHub matches these names case-insensitively on case-insensitive checkouts.
                  folded = path.casefold()
                  require(not folded.startswith(".github/") and folded.rsplit("/", 1)[-1] not in ("action.yml", "action.yaml"),
                          f"{shown(path)} is workflow or action configuration")
                  before = blob(repo, base_entry)
                  after = blob(repo, head_entry)
                  require(after != before and after == swap.sub(lambda match: swaps[match.group(0)], before),
                          f"{shown(path)} changes more than the review caller pin and digest")

              floor_to_stale = compare(CASING_REPAIR, stale)
              require(floor_to_stale.get("status") in ("behind", "diverged"),
                      "default-branch review caller already contains the casing repair")
              require(contains(MINIMUM_SAFE_REVIEW, contract), "proposed revision predates the minimum safe review revision")
              require(contains(stale, contract), "proposed revision does not descend from the stale revision")
              require(all(contains(revision, contract) for revision in ci_stale),
                      "proposed revision does not descend from the stale reusable CI revision")
              require(contains(contract, "main"), "proposed revision is not on canonical main")
              return {"contract_sha": contract, "head_sha": head, "main_sha": main,
                      "paths": sorted(changed), "stale_sha": stale}


          def main(arguments):
              try:
                  if not arguments:
                      print(json.dumps(verify(os.environ), sort_keys=True))
                      return 0
                  if len(arguments) == 2 and arguments[0] == "render-caller" and SHA.fullmatch(arguments[1]):
                      sys.stdout.buffer.write(render_caller(arguments[1]))
                      return 0
              except Ineligible as error:
                  print(f"not a stale review caller bootstrap: {error}", file=sys.stderr)
                  return 1
              except Exception as error:  # noqa: BLE001 - any unexpected shape is ineligible
                  print(f"stale review caller bootstrap proof failed: {type(error).__name__}", file=sys.stderr)
                  return 1
              print("usage: review-caller-bootstrap.py [render-caller <sha>]", file=sys.stderr)
              return 2


          sys.exit(main(sys.argv[1:]))
          PY
          eligible=false
          stale_sha=''
          contract_sha=''
          if proof="$(python3 -I "$program" 2>"$RUNNER_TEMP/review-caller-bootstrap.stderr")"; then
            stale_sha="$(jq -r '.stale_sha // ""' <<<"$proof" 2>/dev/null || true)"
            contract_sha="$(jq -r '.contract_sha // ""' <<<"$proof" 2>/dev/null || true)"
            if [[ "$stale_sha" =~ ^[0-9a-f]{40}$ ]] && [[ "$contract_sha" =~ ^[0-9a-f]{40}$ ]]; then
              eligible=true
            fi
          else
            # The reason can quote untrusted paths: print it with workflow commands disabled.
            token="$(openssl rand -hex 16 2>/dev/null || true)"
            if [[ "$token" =~ ^[0-9a-f]{32}$ ]]; then
              echo "::stop-commands::$token"
              head -c 400 "$RUNNER_TEMP/review-caller-bootstrap.stderr" || true
              echo
              echo "::$token::"
            fi
          fi
          if [ "$eligible" != true ]; then
            stale_sha=''
            contract_sha=''
          fi
          printf 'eligible=%s\nstale_sha=%s\ncontract_sha=%s\n' "$eligible" "$stale_sha" "$contract_sha" >>"$GITHUB_OUTPUT"

      - name: Mint stale review caller bootstrap App token
        id: bootstrap-app-token
        if: steps.bootstrap.outputs.eligible == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.AI_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      # Same check, same receipt, same App identity, and the same authority rule as
      # ordinary completion: approval only under ai-approve or ai-merge, otherwise the
      # human path. The stale privileged merge caller cannot verify this receipt, so
      # the bootstrap never grants terminal promotion: it records the approval-only
      # ai-approve marker even under ai-merge. Under either approving authority the App
      # approval has ADR 0079's native-merge effect (auto-merge or a writer's merge).
      - name: Complete stale review caller bootstrap authorization
        id: bootstrap-complete
        if: steps.bootstrap.outputs.eligible == 'true'
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.bootstrap-app-token.outputs.token }}
          MINTED_APP_SLUG: ${{ steps.bootstrap-app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.bootstrap-app-token.outputs.installation-id }}
          BOOTSTRAP_ELIGIBLE: ${{ steps.bootstrap.outputs.eligible }}
          STALE_SHA: ${{ steps.bootstrap.outputs.stale_sha }}
          CONTRACT_SHA: ${{ steps.bootstrap.outputs.contract_sha }}
          CHECK_ID: ${{ steps.arm.outputs.check_id }}
          EXPECTED_HEAD_SHA: ${{ steps.arm.outputs.head_sha }}
          EXPECTED_EXTERNAL_ID: ${{ steps.arm.outputs.external_id }}
          REVIEW_POLICY: ${{ steps.arm.outputs.review_policy }}
        run: |
          set -euo pipefail
          [ "$BOOTSTRAP_ELIGIBLE" = true ] || { echo "::error::stale review caller bootstrap was not proven"; exit 1; }
          [[ "$CHECK_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$STALE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$CONTRACT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::bootstrap App installation identity is unavailable"; exit 1;
          }
          [ -n "$APP_TOKEN" ] && [ "$MINTED_APP_SLUG" = "$APP_SLUG" ] || {
            echo "::error::minted App does not match the authorization App"; exit 1;
          }
          # Re-prove immediately before granting: the head, trees, or canonical main may have moved.
          recheck_errors="$RUNNER_TEMP/review-caller-bootstrap-recheck.stderr"
          proof="$(GH_TOKEN="$ACTIONS_TOKEN" python3 -I "$RUNNER_TEMP/review-caller-bootstrap.py" 2>"$recheck_errors")" || {
            token="$(openssl rand -hex 16 2>/dev/null || true)"
            if [[ "$token" =~ ^[0-9a-f]{32}$ ]]; then
              echo "::stop-commands::$token"
              head -c 400 "$recheck_errors" || true
              echo
              echo "::$token::"
            fi
            echo "::error::stale review caller bootstrap proof no longer holds"; exit 1;
          }
          jq -e --arg stale "$STALE_SHA" --arg contract "$CONTRACT_SHA" --arg head "$EXPECTED_HEAD_SHA" \
            '.stale_sha == $stale and .contract_sha == $contract and .head_sha == $head' <<<"$proof" >/dev/null || {
              echo "::error::stale review caller bootstrap proof changed"; exit 1;
            }
          check="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/check-runs/$CHECK_ID")"
          jq -e --argjson id "$CHECK_ID" --arg head "$EXPECTED_HEAD_SHA" --arg external "$EXPECTED_EXTERNAL_ID" '
            .id == $id and .name == "AI review authorization" and .head_sha == $head and
            .external_id == $external and .app.id == 15368 and .app.slug == "github-actions" and
            .status == "in_progress" and .conclusion == null
          ' <<<"$check" >/dev/null || {
            echo "::error::authorization check is not this arm's in-progress exact-head check"; exit 1;
          }
          [[ "$REVIEW_POLICY" =~ ^[A-Za-z0-9_-]{1,2048}$ ]] || { echo "::error::review policy envelope is invalid"; exit 1; }
          padded="$(printf '%s' "$REVIEW_POLICY" | tr -- '-_' '+/')"
          while [ $(( ${#padded} % 4 )) -ne 0 ]; do padded="$padded="; done
          policy_json="$(printf '%s' "$padded" | base64 -d)"
          authority="$(jq -er '(.authority // "human") | select(. == "human" or . == "ai-approve" or . == "ai-merge")' <<<"$policy_json")" || {
            echo "::error::receipt authority is invalid"; exit 1;
          }
          transition="the generated review caller moves from stale canonical revision $STALE_SHA to $CONTRACT_SHA"
          conclusion=neutral
          title='Stale caller bootstrap verified; human path ready'
          summary="The trusted arm verified that this exact head only makes the byte-exact generated update where $transition. Receipt authority is $authority, so no App approval was requested; GitHub branch protection remains authoritative."
          if [ "$authority" = ai-approve ] || [ "$authority" = ai-merge ]; then
            approval_body="$(printf '%s\n\n%s\n%s\n%s\n%s' \
              "Stale review caller bootstrap approved this exact head: $transition." \
              "<!-- ai-review-authorization:$CHECK_ID -->" "<!-- ai-review-head:$EXPECTED_HEAD_SHA -->" \
              "<!-- ai-review-run:$GITHUB_RUN_ID -->" "<!-- ai-review-bootstrap:$STALE_SHA:$CONTRACT_SHA -->")"
            # $head, $login, $check, $stale, and $contract are jq arguments, not shell expansion.
            # shellcheck disable=SC2016
            approval_filter='select(.state == "APPROVED" and .commit_id == $head and .user.login == $login and
              (.body | contains("ai-review-authorization:" + $check)) and
              (.body | contains("ai-review-bootstrap:" + $stale + ":" + $contract))) | .id | select(type == "number")'
            if approval="$(GH_TOKEN="$APP_TOKEN" gh api --method POST "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews" \
                 -f event=APPROVE -f commit_id="$EXPECTED_HEAD_SHA" -f body="$approval_body")" &&
               approval_id="$(jq -er --arg head "$EXPECTED_HEAD_SHA" --arg login "${APP_SLUG}[bot]" --arg check "$CHECK_ID" \
                 --arg stale "$STALE_SHA" --arg contract "$CONTRACT_SHA" "$approval_filter" <<<"$approval")" &&
               persisted="$(GH_TOKEN="$APP_TOKEN" gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews/$approval_id")" &&
               [ "$(jq -er --arg head "$EXPECTED_HEAD_SHA" --arg login "${APP_SLUG}[bot]" --arg check "$CHECK_ID" \
                 --arg stale "$STALE_SHA" --arg contract "$CONTRACT_SHA" "$approval_filter" <<<"$persisted")" = "$approval_id" ]; then
              conclusion=success
              title='Stale caller bootstrap approved for exact head'
              summary="$(printf '%s\n\n%s' \
                "The dedicated App approved this exact head because $transition and nothing else changes. Ordinary required CI and branch protection remain authoritative." \
                "<!-- ai-review-authorized:v1:$CHECK_ID:$EXPECTED_HEAD_SHA:ai-approve -->")"
            else
              title='Stale caller bootstrap approval unavailable; human path ready'
              summary="The bootstrap proof held, but no exact-head App approval was persisted and verified. Deterministic policy is green and a human approval may still authorize merge."
            fi
          fi
          patched="$(GH_TOKEN="$ACTIONS_TOKEN" gh api --method PATCH "repos/$TARGET_REPO/check-runs/$CHECK_ID" \
            -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=$title" -f "output[summary]=$summary")"
          jq -e --argjson id "$CHECK_ID" --arg conclusion "$conclusion" \
            '.id == $id and .status == "completed" and .conclusion == $conclusion' <<<"$patched" >/dev/null || {
              echo "::error::authorization check completion was not confirmed"; exit 1;
            }

      - name: Dispatch trusted review after receipt publication
        id: dispatch
        if: steps.arm.outputs.check_id != '' && steps.bootstrap.outputs.eligible != 'true'
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.arm.outputs.check_id }}
          EXPECTED_HEAD_SHA: ${{ steps.arm.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          fail_authorization() {
            local title="$1" summary="$2"
            GH_TOKEN="$ACTIONS_TOKEN" gh api --method PATCH "repos/$TARGET_REPO/check-runs/$CHECK_ID" \
              -f status=completed -f conclusion=failure \
              -f "output[title]=$title" -f "output[summary]=$summary"
          }
          authorization_label=''
          if [ "${{ steps.arm.outputs.explicit_rereview || false }}" = true ]; then
            authorization_label=re-review
          elif [ "${{ steps.arm.outputs.explicit_ai_review || false }}" = true ]; then
            authorization_label=ai-review
          fi
          if [ -n "$authorization_label" ]; then
            # Consuming the authorization label is a precondition for spend.
            # A failed edit is acceptable only when an authoritative reread
            # proves the label is already absent (for example, a racing event).
            gh pr edit "$PR_NUMBER" --repo "$TARGET_REPO" --remove-label "$authorization_label" 2>/dev/null || true
            if ! remaining_labels="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json labels)" ||
               ! jq -e '.labels | type == "array" and all(.[]; .name | type == "string")' <<<"$remaining_labels" >/dev/null; then
              fail_authorization 'Review label consumption unverified' \
                'The trusted arm could not verify that the authorization label was consumed; no review was dispatched.'
              exit 1
            fi
            if jq -e --arg expected "$authorization_label" \
              'any(.labels[]; (.name | ascii_downcase | gsub("[ _-]+"; "-")) == $expected)' <<<"$remaining_labels" >/dev/null; then
              fail_authorization 'Review label consumption failed' \
                'The authorization label remains applied, so dispatch was refused before provider spend.'
              exit 1
            fi
          fi
          if ! gh workflow run ai-review-merge.yml --repo "$TARGET_REPO" --ref "$DEFAULT_BRANCH" \
            -f pr_number="$PR_NUMBER" -f expected_head_sha="$EXPECTED_HEAD_SHA" \
            -f authorization_check_id="$CHECK_ID" -f arm_run_id="$GITHUB_RUN_ID" \
            -f arm_run_attempt="$GITHUB_RUN_ATTEMPT" -f explicit_rereview="${{ steps.arm.outputs.explicit_rereview || false }}" \
            -f review_policy="${{ steps.arm.outputs.review_policy }}"; then
            fail_authorization 'Review dispatch failed' \
              'The trusted review workflow could not be dispatched.'
            exit 1
          fi

      # The check-run is created before the receipt is published, so a failure
      # between the two -- an artifact-quota rejection, for example -- leaves a
      # required check pending forever: no review was dispatched, so nothing
      # else ever completes it, and ADR 0081's promotion retry deliberately
      # waits on a pending required check instead of resolving one. Give that
      # check-run a terminal state here. This can only ever write a failure, so
      # it cannot grant authorization, and it never touches a check-run that a
      # dispatched review or an earlier failure path already owns.
      - name: Complete the authorization when no review was dispatched
        if: always() && steps.arm.outputs.check_id != '' && steps.dispatch.outcome != 'success' && steps.bootstrap-complete.outcome != 'success'
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.arm.outputs.check_id }}
          EXPECTED_HEAD_SHA: ${{ steps.arm.outputs.head_sha }}
          EXPECTED_EXTERNAL_ID: ${{ steps.arm.outputs.external_id }}
          ARM_FAILURE_REASON: ${{ steps.arm.outputs.failure_reason }}
          AI_REVIEW_ENVIRONMENT: ${{ inputs.ai_review_environment || 'ai-review-app' }}
          BOOTSTRAP_ELIGIBLE: ${{ steps.bootstrap.outputs.eligible || 'false' }}
        run: |
          set -euo pipefail
          [[ "$CHECK_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          check="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/check-runs/$CHECK_ID")"
          jq -e --argjson id "$CHECK_ID" --arg head "$EXPECTED_HEAD_SHA" \
            --arg external "$EXPECTED_EXTERNAL_ID" \
            '.id == $id and .name == "AI review authorization" and .head_sha == $head and
             .external_id == $external and .app.id == 15368 and .app.slug == "github-actions"' \
            <<<"$check" >/dev/null || {
              echo "::error::refusing to terminalize an authorization check with unexpected identity"; exit 1;
            }
          [ "$(jq -r '.status // ""' <<<"$check")" = in_progress ] || exit 0
          if [ "${BOOTSTRAP_ELIGIBLE:-false}" = true ]; then
            summary='The stale review caller bootstrap did not complete, so no authorization was granted and the stale review was not dispatched. Push a new head to retry the bootstrap proof.'
          elif [ "$ARM_FAILURE_REASON" = invalid_ai_review_app_private_key ]; then
            summary="$(jq -nr --arg environment "$AI_REVIEW_ENVIRONMENT" '"AI_REVIEW_APP_PRIVATE_KEY is empty or invalid in environment \($environment); no App token was minted and no review was dispatched."')"
          elif [ "$ARM_FAILURE_REASON" = ai_review_environment_policy ]; then
            summary="$(jq -nr --arg environment "$AI_REVIEW_ENVIRONMENT" '"AI review environment policy failed for \($environment); no review was dispatched."')"
          else
            summary='The immutable arm receipt was not published, so no trusted review was dispatched and no model charge was incurred. Rerun this arm run to recover the authorization; do not add the re-review label.'
          fi
          GH_TOKEN="$ACTIONS_TOKEN" gh api --method PATCH "repos/$TARGET_REPO/check-runs/$CHECK_ID" \
            -f status=completed -f conclusion=failure \
            -f 'output[title]=AI review authorization failed before dispatch' \
            -f "output[summary]=$summary"
