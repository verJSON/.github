name: Renovate compatibility reconciliation

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: renovate-compatibility-reconcile
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ${{ fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .renovate-compatibility-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      # The observer reads no repository file: it only needs an isolated
      # working directory, so it creates one instead of checking out the
      # tree, which ADR 0235's backlog digest could not bind.
      - name: Create the isolated observer directory
        working-directory: ${{ github.workspace }}
        run: mkdir -- ".renovate-compatibility-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
      - name: Require the compatibility App client ID
        env:
          RENOVATE_COMPATIBILITY_CLIENT_ID: ${{ vars.RENOVATE_COMPATIBILITY_CLIENT_ID }}
        run: |
          if [[ -z "$RENOVATE_COMPATIBILITY_CLIENT_ID" || "$RENOVATE_COMPATIBILITY_CLIENT_ID" =~ ^[0123456789]+$ ]]; then
            echo "::error::RENOVATE_COMPATIBILITY_CLIENT_ID must be the GitHub App client ID, not an empty or numeric legacy App ID."
            exit 1
          fi
      - name: Mint managed-repository compatibility App token
        id: compatibility-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RENOVATE_COMPATIBILITY_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_COMPATIBILITY_APP_PRIVATE_KEY }}
          owner: Verjson
          repositories: .github,agents,renovate-config,verjson-agents,verjson-cli,verjson-cli-cloud,verjson-cli-projects,verjson-eslint-config,verjson-git-runners,verjson-infra,verjson-tsconfig
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: read
      - name: Fetch the reviewed policy registry
        env:
          GH_TOKEN: ${{ steps.compatibility-app-token.outputs.token }}
          POLICY_SHA: dd08f8471fdfabbdbbb32051e03387fcf5df63bd
        run: |
          set -euo pipefail
          gh api "repos/Verjson/renovate-config/contents/compatibility-holds.json?ref=$POLICY_SHA" \
            --jq .content | base64 -d > compatibility-holds.json
      - name: Inventory Renovate failures for controlled retry triage
        env:
          GH_TOKEN: ${{ steps.compatibility-app-token.outputs.token }}
        run: |
          set -euo pipefail
          # GraphQL and jq variables are data for those interpreters, not shell variables.
          # shellcheck disable=SC2016
          gh api graphql --paginate -f query='query($endCursor:String) {
            organization(login:"Verjson") { repositories(first:100,after:$endCursor) {
              pageInfo { hasNextPage endCursor }
              nodes { nameWithOwner pullRequests(first:50,states:OPEN,orderBy:{field:UPDATED_AT,direction:DESC}) {
                nodes { number url headRefOid baseRefName author { login } commits(last:1) { nodes { commit {
                  statusCheckRollup { state }
                } } } }
              } }
            } }
          }' --jq '[.data.organization.repositories.nodes[] as $repo |
            $repo.pullRequests.nodes[] |
            select(.author.login == "renovate" or .author.login == "renovate[bot]") |
            select(.commits.nodes[0].commit.statusCheckRollup.state == "FAILURE") |
            {repository:$repo.nameWithOwner,pullRequest:.number,url,headSha:.headRefOid,
             disposition:"needs-controlled-retry"}]' > compatibility-observations.json
          jq '{mode:"observe-only", observations:.}' compatibility-observations.json > compatibility-report.json
          jq . compatibility-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable observation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-compatibility-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: .renovate-compatibility-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/compatibility-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove the isolated observer checkout
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf ".renovate-compatibility-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
