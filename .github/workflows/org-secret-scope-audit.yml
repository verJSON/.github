name: Organization secret scope audit

on:
  schedule:
    - cron: "41 9 * * *"

permissions:
  contents: read

concurrency:
  group: org-secret-scope-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ${{ fromJSON(vars.CI_LANE_PRIVILEGED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: .org-secret-scope-audit-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    timeout-minutes: 10
    steps:
      - name: Check out the secret-scope audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .org-secret-scope-audit-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          persist-credentials: false
      - name: Compare live scope with reviewed policy
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: python3 -I scripts/org-secret-scope-audit.py
      - name: Remove the isolated secret-scope checkout
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf ".org-secret-scope-audit-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
