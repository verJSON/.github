name: AI review + auto-merge
run-name: AI review authorization ${{ inputs.authorization_check_id }} from arm ${{ inputs.arm_run_id }}.${{ inputs.arm_run_attempt }}

# Receipt-bound review workflow dispatched by the trusted authorization arm.
# The main-protection ruleset requires gate-rearm.yml, not this dispatch-only
# workflow. Deterministic policy is always required; code and agent-instruction
# changes require AI review, while human approval remains the outage fallback
# unless receipt-bound authority permits the dedicated App to approve or merge
# (ADR 0098, ADR 0091).
#
# Cost-lane design (ADR-018 second amendment):
#   1. `preflight` (free, deterministic bash) updates stale branches and routes
#      each current PR into a lane on one runner assignment:
#        - fast: generated-lockfile-only changes and non-agent documentation.
#          No model is invoked because the review payload elides lockfiles and
#          deterministic integrity/CI is the stronger evidence.
#        - ai: code, executable workflow/action, dependency manifest, prompt,
#          policy, and agent-instruction changes get one or two cumulative model
#          passes. Deletions are classified by the deleted surface.
#        - defer: a Renovate PR whose `renovate/stability-days` age gate is
#          still pending (e.g. a replacement PR that `internalChecksFilter`
#          can't hold back). No model, no gate runner — Renovate's rebase once
#          the release ages re-enters classify for a real review.
#   2. Model policy is immutable receipt data. Every provider invocation first
#      reserves an exact-head, PR-visible pass slot. DeepSeek Pro runs first and
#      Flash runs only when Pro yields no usable verdict and pass 2 remains.
#      Any usable verdict ends the cascade; no exact head can consume a third pass.
#   3. Reviews run on every ready-PR revision (incl. synchronize) so a
#      Renovate rebase re-fires the gate and the required check stays fresh on
#      the new head; cost stays bounded because fast-lane synchronizes invoke
#      no model and the AI lane only runs after CI is green. Re-run manually by
#      adding the `re-review` label (auto-removed) or via workflow_dispatch.
#
# Either lane produces a required validation result without administrative
# credentials. A separate pull_request_target job, loaded from the trusted base
# branch and consuming API metadata only, rechecks green CI and policy before a
# matched-head squash merge with the org-admin ruleset bypass. Humans opt a PR
# out with the `hold` label, a "DO NOT MERGE" title marker, or a draft.
#
# Cross-repo dispatch is bounded to THIS org (ADR 0020, #119). The optional
# Operators re-gate by dispatching this workflow in the repository that owns
# the PR. Cross-repository dispatch was retired by ADR 0036 because the
# unprivileged github.token is intentionally repository-scoped.
#
# Cross-ORG distribution (ADR 0022, #128): this file is ALSO a `workflow_call`
# reusable, so consumers in other orgs (e.g. tequityapp) pin it instead of
# hand-copying it — upstream fixes then reach every consumer via `@v1` and the
# shipped `scripts/ci-gate/*.test.sh` guard the shared logic once for everyone.
# The dispatch and reusable entrypoints share one file: the trusted arm invokes
# `workflow_dispatch`; a cross-org consumer adds a thin caller that `uses:` it
# under `workflow_call`. When called,
# `github.repository`/`github.event`/`github.repository_owner` are inherited from
# the CALLER, so `TARGET_REPO` and the PR number resolve to the consumer's own
# repository. Consumers must
# inherit secret context for environment resolution (ADR 0171). This transport
# requires the same organization or enterprise. A caller that runs on its
# OWN self-hosted fleet and has no `CI_LANE_*` variables may add
# `with.runner_labels`; a Verjson caller must omit it and let the lane variables
# select the pool (#405, ADR 0041, ADR 0057). MIND THE REF: `runner_labels` is
# optional from the first release cut AFTER #405. The `@v1` tag pinned in the
# example below still declares it `required: true`, so a caller that follows this
# guidance against a `v1` that predates the release fails with
# `Input runner_labels is required, but no value was supplied`. Either pin a ref
# that contains #405 or keep passing the input until `v1` advances.
# The reusable is review-only until signed producing-workflow provenance exists
# (#261): a consumer-authored caller can forge every unsigned merge signal, so
# `ai-privileged-merge.yml` deliberately refuses reusable-caller runs (#279).
# Consumers must merge an approved verdict manually. Example caller:
#
#   # consumer repo in the same org/enterprise: .github/workflows/ai-review-merge.yml
#   # The caller filename no longer grants merge authority; reusable runs review
#   # correctly but are always refused by privileged merge (#279, ADR 0044).
#   on: { pull_request: { types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled] }, workflow_dispatch: {} }
#   jobs:
#     gate:
#       uses: Verjson/.github/.github/workflows/ai-review-merge.yml@<reviewed-40-hex-commit>
#       with: {ai_review_environment: ai-review-app, contract_ref: <reviewed-40-hex-commit>}
#       secrets: inherit
#       # The environment selector is required; add runner_labels
#       # ONLY for an off-Verjson self-hosted fleet, or on a `v1` older than the
#       # first release after #405, where it is still required:
#       # with: { runner_labels: '["self-hosted","general"]' }
#
# Downstream copies must also omit any repository input and pin the target to
# the repository where the workflow executes.

on:
  workflow_dispatch:
    inputs:
      ai_review_environment:
        description: Main-only environment containing the ai-review App private key
        required: true
        type: choice
        options:
          - ai-review-app
        default: ai-review-app
      pr_number:
        description: PR number to review
        required: true
      expected_head_sha:
        description: Exact PR head authorized by the trusted arm
        required: true
      authorization_check_id:
        description: Exact Checks API record created by the trusted arm
        required: true
      arm_run_id:
        description: Trusted arm workflow run containing the immutable receipt
        required: true
      arm_run_attempt:
        description: Trusted arm run attempt containing the immutable receipt
        required: true
      explicit_rereview:
        description: Whether a maintainer explicitly requested a same-head review
        required: false
        type: boolean
        default: false
      review_policy:
        description: Receipt-bound canonical provider/model/budget/pricing base64url envelope
        required: true
      allow_absent_checks:
        description: >-
          Proceed even though the PR has NO CI checks at all. Absent checks are
          normally treated as not-green (#143); set this only for a PR that is
          genuinely expected to trigger nothing (e.g. docs-only under a `paths:`
          filter). Engaging it is logged as a warning on the run.
        required: false
        type: boolean
        default: false
  workflow_call:
    # Inherited context enables caller-owned main-only environment secrets.
    # This also grants accessible caller secrets to reviewed code (ADR 0171).
    inputs:
      ai_review_environment:
        description: Main-only environment containing the ai-review App private key
        required: true
        type: string
      contract_ref:
        description: Immutable Verjson/.github revision; must equal the reusable workflow uses pin
        required: true
        type: string
      pr_number:
        description: PR number to review; defaults to the caller's pull_request event
        required: false
        type: string
      expected_head_sha:
        description: Exact PR head authorized by a trusted caller
        required: false
        type: string
      authorization_check_id:
        description: Exact Checks API record created by a trusted caller
        required: false
        type: string
      arm_run_id:
        description: Trusted arm workflow run containing the immutable receipt
        required: false
        type: string
      arm_run_attempt:
        description: Trusted arm run attempt containing the immutable receipt
        required: false
        type: string
      explicit_rereview:
        description: Whether a maintainer explicitly requested a same-head review
        required: false
        type: boolean
        default: false
      review_policy:
        required: false
        type: string
        default: ''
      runner_labels:
        description: 'Optional JSON array of runs-on labels for all three gate jobs, e.g. ["self-hosted","general"], for a self-hosted caller whose org has no CI_LANE_* variables. Omit it (the default) to route by lane and degrade to a hosted runner.'
        required: false
        type: string
      allow_absent_checks:
        description: >-
          Proceed even though the PR has NO CI checks at all. Defaults to false
          (strict): absent checks are treated as not-green (#143). A consumer
          whose CI is path-filtered can set this per call; engaging it is logged
          as a warning on the run.
        required: false
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  # Label events start a workflow before job-level `if:` guards are evaluated.
  # Only gate-control changes may cancel an active review; in particular, the
  # classify step's own removal of `re-review` must not cancel its parent run.
  cancel-in-progress: >-
    ${{
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event.action == 'labeled' &&
        (github.event.label.name == 're-review' ||
         github.event.label.name == 'hold' ||
         github.event.label.name == 'DO NOT MERGE')) ||
      (github.event.action == 'unlabeled' &&
        (github.event.label.name == 'hold' || github.event.label.name == 'DO NOT MERGE'))
    }}

permissions:
  actions: read
  contents: read

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
  TARGET_REPO: ${{ github.repository }}
  EXPECTED_AUTHORIZED_HEAD_SHA: ${{ inputs.expected_head_sha }}
  AUTHORIZATION_CHECK_ID: ${{ inputs.authorization_check_id }}
  ARM_RUN_ID: ${{ inputs.arm_run_id }}
  ARM_RUN_ATTEMPT: ${{ inputs.arm_run_attempt }}
  EXPECTED_APP_ID: ${{ vars.AI_REVIEW_APP_ID }}
  EXPECTED_APP_SLUG: ${{ vars.AI_REVIEW_APP_SLUG }}
  REVIEW_POLICY: ${{ inputs.review_policy || '' }}

jobs:
  app-key-policy:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.ai_review_environment == 'ai-review-app'
    uses: ./.github/workflows/app-key-environment.yml
    secrets:
      AI_REVIEW_APP_PRIVATE_KEY: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
    permissions:
      actions: read
      contents: read
    with:
      role: ai-review
      environment: ${{ inputs.ai_review_environment }}

  title-policy:
    runs-on: ${{ fromJSON(vars.CI_LANE_UNTRUSTED || '["ubuntu-24.04"]') }}
    permissions: {}
    outputs:
      title_held: ${{ steps.classify.outputs.title_held }}
    steps:
      - id: classify
        env:
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          set -euo pipefail
          title_held=false
          title_ascii="$(jq -nr --arg title "$PR_TITLE" '$title | ascii_upcase')"
          if [[ "$title_ascii" =~ (^|[^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_])DO\ NOT\ MERGE([^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_]|$) ]]; then
            title_held=true
          fi
          printf 'title_held=%s\n' "$title_held" >>"$GITHUB_OUTPUT"

  preflight:
    needs: title-policy
    # Keep the branch current with its base BEFORE we review/merge, so a green
    # gate always means green against the *current* base — a behind-but-clean
    # branch never merges stale. Behind → update the branch (the resulting
    # synchronize starts a fresh run that steps this one aside). Conflicting →
    # first try the same update-branch merge (clears a conflict that was only
    # base drift, then steps aside like the behind path); a genuine content
    # conflict still holds and comments (can't auto-resolve). Renovate owns its
    # own rebases, so its branches are left untouched. Same opt-out guard as
    # classify.
    if: >-
      github.event_name != 'pull_request_target' &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          github.event.repository.default_branch == 'main' &&
          github.ref_protected &&
          inputs.ai_review_environment == 'ai-review-app'
        )
      ) &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          (
            (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
            (github.event.action == 'labeled' && github.event.label.name == 're-review') ||
            (github.event.action == 'unlabeled' &&
              (github.event.label.name == 'hold' || github.event.label.name == 'DO NOT MERGE'))
          ) &&
          !github.event.pull_request.draft &&
          !contains(github.event.pull_request.labels.*.name, 'hold') &&
          !contains(github.event.pull_request.labels.*.name, 'DO NOT MERGE') &&
          needs.title-policy.outputs.title_held != 'true'
        )
      )
    # A workflow_call consumer sets its own fleet via `with.runner_labels`; the
    # org direct paths (pull_request/workflow_dispatch) leave it empty and route
    # org-aware (#175, ADR 0030): non-Verjson callers to GitHub-hosted
    # ubuntu-24.04. Verjson preflight always takes the untrusted lane.
    # Downstream gate uses the resolved target visibility (#225, ADR 0035).
    # Fast lane for PUBLIC targets (ADR 0048). preflight cannot consult
    # `target_private` because it is the job that resolves it, so it keys on the
    # event's own repository — correct for the pull_request path, which is every
    # path that queues. `== false` and not `!= true`: an unresolved value must
    # fall through to the lane chain rather than take the fast lane. With every
    # lane variable set — the live state — that is the self-hosted pool; the
    # hosted tail beneath it is reached only if a lane variable is deleted.
    runs-on: ${{ inputs.runner_labels && fromJSON(inputs.runner_labels) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == false && fromJSON(vars.CI_RUNNER_FASTLANE || '["ubuntu-24.04"]') || fromJSON(vars.CI_RUNNER_OVERFLOW || vars.CI_LANE_UNTRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    # This job combines the former 10-minute freshness and classification jobs.
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      # 'true' → this run continues to classify/review/merge. 'false' → the branch
      # was just updated; a fresh run will handle it, so downstream jobs skip.
      proceed: ${{ steps.freshness.outputs.proceed }}
      lane: ${{ steps.classify.outputs.lane }}
      reason: ${{ steps.classify.outputs.reason }}
      model: ${{ steps.classify.outputs.model }}
      budget_usd: ${{ steps.classify.outputs.budget_usd }}
      provider: ${{ steps.classify.outputs.provider }}
      pricing_version: ${{ steps.classify.outputs.pricing_version }}
      authority: ${{ steps.classify.outputs.authority }}
      fallback_model: ${{ steps.classify.outputs.fallback_model }}
      fallback_budget_usd: ${{ steps.classify.outputs.fallback_budget_usd }}
      changed_lines: ${{ steps.classify.outputs.changed_lines }}
      sensitive: ${{ steps.classify.outputs.sensitive }}
      dependency_major: ${{ steps.classify.outputs.dependency_major }}
      # Preserve immutable dispatch identity even when classification never ran.
      head_sha: ${{ steps.classify.outputs.head_sha || inputs.expected_head_sha }}
      zero_provider_recovery: ${{ steps.zero-provider-recovery.outputs.eligible || 'false' }}
      completed_at: ${{ steps.preflight_complete.outputs.completed_at }}
      # 'false' → public target → hosted runner; 'true' or '' (unresolved,
      # fail closed) → self-hosted `gate`. See the gate job's `runs-on` (#170).
      target_private: ${{ steps.target_visibility.outputs.target_private }}
      trusted_review_sha: ${{ steps.trusted-revision.outputs.sha }}
    steps:
      - name: Record preflight runner timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          assigned_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at 2>/dev/null || true)"
          # Fail-safe epoch conversion: a bad/empty timestamp leaves the epoch
          # empty (never an empty $(( )) operand), so it degrades to "unknown"
          # instead of a fatal arithmetic syntax error aborting this required
          # diagnostic step (#106; ADR 0017 keeps diagnostics enforcement-neutral).
          assigned_epoch="$(date -u -d "$assigned_at" +%s 2>/dev/null || true)"
          created_epoch="$(date -u -d "$created_at" +%s 2>/dev/null || true)"
          if [[ -n "$created_at" && "$assigned_epoch" =~ ^[0-9]+$ && "$created_epoch" =~ ^[0-9]+$ ]]; then
            queue_seconds=$(( assigned_epoch - created_epoch ))
            echo "::notice::phase=preflight runner_assigned_at=$assigned_at workflow_created_at=$created_at initial_queue_seconds=$queue_seconds"
          else
            echo "::notice::phase=preflight runner_assigned_at=$assigned_at initial_queue_seconds=unknown"
          fi

      - name: Resolve target repo visibility (routes the gate runner, #170)
        id: target_visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `runs-on` expressions only see event/inputs context, and on the
          # workflow_dispatch re-gate path `github.event.repository` is the
          # DISPATCHING repo, not the target. Resolve the org-guarded
          # TARGET_REPO's actual visibility here so the gate job routes
          # hosted-vs-self-hosted on the target, not the dispatcher. An
          # unreadable repo emits an empty value and the gate falls back to
          # the self-hosted `gate` pool — fail closed to the operator-only
          # path, never onto a hosted runner with the wrong assumptions.
          if ! target_private="$(gh api "repos/$TARGET_REPO" --jq .private 2>"$RUNNER_TEMP/tv.err")"; then
            target_private=""
            echo "::warning::target visibility lookup failed for $TARGET_REPO (routing fail-closed to the gate pool): $(head -c 200 "$RUNNER_TEMP/tv.err" | tr -d '\n')"
          fi
          echo "target_private=$target_private" >> "$GITHUB_OUTPUT"
          echo "::notice::phase=preflight target_repo=$TARGET_REPO target_private=${target_private:-unknown}"

      - name: Resolve immutable canonical workflow revision
        id: trusted-revision
        env:
          CONTRACT_REF: ${{ inputs.contract_ref }}
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          trusted_review_sha="${CONTRACT_REF:-$EXECUTING_WORKFLOW_SHA}"
          if [[ ! "$trusted_review_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::canonical workflow revision must be an immutable lowercase 40-hex commit SHA"
            exit 1
          fi
          echo "sha=$trusted_review_sha" >>"$GITHUB_OUTPUT"

      - name: Check out immutable zero-provider recovery verifier
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ steps.trusted-revision.outputs.sha }}
          path: .gate-recovery
          sparse-checkout: |
            scripts/ci-gate/verify-zero-provider-recovery.sh
            scripts/ci-gate/verify-arm-receipt.sh
            scripts/ci-gate/review-policy-envelope.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify receipt-bound direct review admission
        id: zero-provider-recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          bash .gate-recovery/scripts/ci-gate/verify-zero-provider-recovery.sh
          if [ "$REVIEW_RUN_ATTEMPT" -gt 1 ]; then
            echo 'eligible=true' >>"$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >>"$GITHUB_OUTPUT"
          fi

      - name: Update branch if behind; hold on conflict
        id: freshness
        env:
          # Event token: updates/comments only in the repository owning this run.
          GH_TOKEN: ${{ github.token }}
          ZERO_PROVIDER_RECOVERY: ${{ steps.zero-provider-recovery.outputs.eligible || 'false' }}
        run: |
          set -euo pipefail
          REPO="$TARGET_REPO"
          if [ "${EXPLICIT_REREVIEW:-false}" = true ] && [ "${GITHUB_RUN_ATTEMPT:-1}" -ne 1 ] &&
             [ "${ZERO_PROVIDER_RECOVERY:-false}" != true ]; then
            echo "::error::an explicit re-review dispatch cannot be rerun; apply a new authorized re-review label"
            exit 1
          fi
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          # Retry the reads so a transient API blip doesn't red-gate the PR.
          pr_json() {
            for _ in 1 2 3; do
              gh pr view "$PR_NUMBER" --repo "$REPO" --json "$1" 2>/dev/null && return 0
              : # bounded retry without runner-held delay
            done
            return 1
          }

          read_mergeable() {
            local payload
            payload="$(pr_json mergeable)" || return 1
            jq -r '.mergeable // "UNKNOWN"' <<<"$payload"
          }

          hold_unreadable_mergeable() {
            out proceed false
            echo "::error::Could not read PR mergeability after bounded retries; holding rather than proceeding on an unverified state."
            exit 1
          }

          # An unreadable PR metadata read is indeterminate, not permissive.
          # This used to emit a ::warning:: and `out proceed true; exit 0`,
          # which skipped the freshness evaluation entirely — so a total API
          # outage proceeded without ever reaching the compare guard below,
          # making that guard unreachable on exactly the path it exists for
          # (Verjson/.github#1476, #1496, ADR 0195).
          if ! meta=$(pr_json author,headRefName,baseRefName,headRefOid,mergeable); then
            out proceed false
            echo "::error::Could not read PR metadata after 3 attempts, so freshness could not be evaluated at all. Holding rather than merging on a base we could not check."
            exit 1
          fi
          author="$(jq -r '.author.login // ""' <<<"$meta")"
          head_ref="$(jq -r '.headRefName // ""' <<<"$meta")"
          head_sha="$(jq -r '.headRefOid // ""' <<<"$meta")"
          base_ref="$(jq -r '.baseRefName // "the base branch"' <<<"$meta")"

          # Renovate rebases its own PRs on its stability schedule — leave them to
          # it. Match classify's anchored author pattern (plus the branch prefix).
          if printf '%s' "$author" | grep -qiE '^(app/)?renovate(\[bot\])?$' \
             || [ "${head_ref#renovate/}" != "$head_ref" ]; then
            echo "Renovate PR — leaving freshness to Renovate."; out proceed true; exit 0
          fi

          # mergeable is computed async; wait out UNKNOWN.
          mrg="$(jq -r '.mergeable // "UNKNOWN"' <<<"$meta")"
          for _ in 1 2 3 4 5 6; do
            [ "$mrg" != "UNKNOWN" ] && break
            : # bounded retry without runner-held delay
            mrg="$(read_mergeable)" || hold_unreadable_mergeable
          done
          echo "mergeable=$mrg"
          [ "$mrg" != "UNKNOWN" ] || hold_unreadable_mergeable

          # Base conflict. Try the same non-destructive update-branch (merge base
          # into head) the BEHIND path uses BEFORE giving up: a branch reported
          # CONFLICTING purely from base drift (non-overlapping changes GitHub
          # flags pessimistically) clears once the base is merged in. Re-check
          # mergeability after; if it clears, treat it exactly like the BEHIND
          # success path — the update pushed a `synchronize`, so a fresh run
          # reviews/merges against the current base and this run steps aside
          # (proceed=false). Only a *genuine* content conflict — the update-branch
          # API fails, or mergeable is still CONFLICTING afterwards — falls
          # through to hold (fail-closed) + a single marker-guarded comment.
          if [ "$mrg" = "CONFLICTING" ]; then
            if gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/update-branch" >/dev/null 2>&1; then
              # Re-read mergeable, again waiting out the async UNKNOWN window.
              mrg="$(read_mergeable)" || hold_unreadable_mergeable
              for _ in 1 2 3 4 5 6; do
                [ "$mrg" != "UNKNOWN" ] && break
                : # bounded retry without runner-held delay
                mrg="$(read_mergeable)" || hold_unreadable_mergeable
              done
              echo "post-update mergeable=$mrg"
              [ "$mrg" != "UNKNOWN" ] || hold_unreadable_mergeable
              if [ "$mrg" != "CONFLICTING" ]; then
                echo "Conflict was base drift; update-branch cleared it — a fresh run will merge against the current base."
                out proceed false; exit 0
              fi
            fi
            marker="<!-- gate:branch-conflict -->"
            note="$marker This PR conflicts with \`$base_ref\`. The merge gate can't auto-update a conflicting branch — please rebase/merge \`$base_ref\` and resolve the conflicts; the gate re-fires on push."
            # Dedup only on a *successful* read: a transient read failure must not
            # look like "marker absent" and post a duplicate. If we truly can't
            # read the comments (after pr_json's retries), post anyway — a rare
            # duplicate beats never telling the human why the PR is held.
            if existing="$(pr_json comments)"; then
              jq -r '.comments[].body' <<<"$existing" 2>/dev/null | grep -qF "$marker" \
                || gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$note" || true
            else
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$note" || true
            fi
            echo "::error::Branch conflicts with $base_ref — holding until resolved."
            exit 1
          fi

          compare_behind() {
            local raw base_ref_path
            # Behind the base? Ask the compare API for the real commit delta — it is
            # independent of branch protection, whereas mergeStateStatus only
            # reports BEHIND when a strict "up to date" rule is set (this org's
            # ruleset is NOT strict, so a behind-but-clean branch reads CLEAN).
            # Compare against the head SHA, not the ref, so a slash in the branch
            # name can't confuse the ...-path. Behind → update the branch; the push
            # fires `synchronize`, and that fresh run reviews/merges against the
            # current base, so this run steps aside.
            #
            # An indeterminate answer is NOT `behind=0`. Previously the request
            # failing, returning nothing, or returning an unparseable body all
            # collapsed into 0 via `|| echo 0` / `|| behind=0`, so an outage, a
            # rate limit, or an auth blip read as "not behind" and the gate
            # merged a review taken against a possibly stale base — a fail-open
            # whose only signal was silence (Verjson/.github#1476, ADR 0195).
            #
            # Only a numeric body counts as an answer; everything else returns
            # non-zero and is retried on a bounded loop, so a single transient
            # blip still self-heals rather than wedging the gate fleet-wide. If
            # it is still unanswerable after the retries we hold (fail closed)
            # and say so, rather than merging on an assumption we could not
            # check.
            #
            # The retries are delay-free, matching pr_json above. Spacing them
            # looks tempting — the fallback here is a hard hold, so waiting a
            # blip out is worth more than it is for pr_json — but this workflow
            # is under an event-driven no-runner-held-waiting contract, asserted
            # by runner-routing-policy.test.sh, event-driven-authorization.test.py
            # and gate-rearm-caller-contract.test.sh. Any runner-held delay here
            # fails all three, and they match on the file's text, so even naming
            # the construct in a comment trips them. If a tight retry proves too
            # weak against a rate-limit burst, the remedy is re-arming on an
            # event, not holding the runner.
            # The LEFT operand stays adopter-controlled, so it is percent-encoded as a
            # single path segment (`@uri`, no gsub back to "/"): a base ref named
            # `release/1.x` must address a branch, not a deeper path (Verjson/.github#1464).
            base_ref_path="$(jq -rn --arg base_ref "$base_ref" '$base_ref|@uri')"
            readonly base_ref_path
            raw="$(gh api "repos/$REPO/compare/$base_ref_path...$head_sha" --jq '.behind_by' 2>/dev/null)" || return 1
            [[ "$raw" =~ ^[0-9]+$ ]] || return 1
            printf '%s' "$raw"
          }
          compare_attempts=3
          behind=""
          attempt=0
          while [ "$attempt" -lt "$compare_attempts" ]; do
            behind="$(compare_behind)" && break
            behind=""
            attempt=$((attempt + 1))
          done
          if [ -z "$behind" ]; then
            out proceed false
            echo "::error::Could not determine whether the head is behind $base_ref: the compare API was unanswerable after $compare_attempts attempts. Holding rather than merging on a possibly stale base."
            exit 1
          fi
          if [ "$behind" -gt 0 ]; then
            if gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/update-branch" >/dev/null 2>&1; then
              echo "Branch was $behind commit(s) behind $base_ref; updated it — a fresh run will merge against the current base."
              out proceed false; exit 0
            fi
            echo "update-branch did not apply (race / fork / already current); proceeding."
          fi

          out proceed true

      - name: Check out immutable policy decoder
        if: steps.freshness.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ steps.trusted-revision.outputs.sha }}
          path: .gate-policy
          sparse-checkout: |
            scripts/ci-gate/review-policy-envelope.py
            scripts/ci-gate/classify-review-policy.py
            scripts/ci-gate/read-pr-files.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Classify PR into a lane
        id: classify
        if: steps.freshness.outputs.proceed == 'true'
        env:
          # Event token: classification reads this PR and public submodule refs.
          GH_TOKEN: ${{ github.token }}
          EXPLICIT_REREVIEW: ${{ inputs.explicit_rereview }}
          POLICY_DECODER: .gate-policy/scripts/ci-gate/review-policy-envelope.py
          PR_FILES_READER: .gate-policy/scripts/ci-gate/read-pr-files.sh
          REVIEW_CLASSIFIER: .gate-policy/scripts/ci-gate/classify-review-policy.py
        run: |
          set -euo pipefail
          REPO="$TARGET_REPO"
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          select_policy() {
            local default_model="$1" default_budget="$2" selected_model selected_budget selected_provider selected_pricing selected_authority fallback_model fallback_budget policy policy_explicit input_explicit
            policy_envelope="${REVIEW_POLICY:-}"
            [ -n "$policy_envelope" ] || policy_envelope=''
            policy="$(python3 "${POLICY_DECODER:-scripts/ci-gate/review-policy-envelope.py}" decode "$policy_envelope")" || {
              echo "::error::receipt-bound review policy is malformed"; return 1;
            }
            selected_provider="$(jq -r .provider <<<"$policy")"; selected_model="$(jq -r .model <<<"$policy")"
            selected_budget="$(jq -r .budget_usd <<<"$policy")"; selected_pricing="$(jq -r .pricing_version <<<"$policy")"
            selected_authority="$(jq -r '.authority // "human"' <<<"$policy")"
            fallback_model="$(jq -r '.fallback_model // ""' <<<"$policy")"
            fallback_budget="$(jq -r '.fallback_budget_usd // ""' <<<"$policy")"
            policy_explicit="$(jq -r '.explicit_rereview // false' <<<"$policy")"
            input_explicit="${EXPLICIT_REREVIEW:-false}"
            case "$policy_explicit:$input_explicit" in true:true|false:false) ;; *) echo "::error::explicit re-review input is not receipt-bound"; return 1 ;; esac
            case "$selected_authority" in human|ai-approve|ai-merge) ;; *) echo "::error::unsupported review authority"; return 1 ;; esac
            case "$selected_provider:$selected_pricing" in
              anthropic:anthropic-native-v1)
                [ "$selected_model" = auto ] && selected_model="$default_model"
                [ "$selected_budget" = auto ] && selected_budget="$default_budget"
                case "$selected_model" in claude-haiku-4-5|claude-sonnet-5|claude-opus-5) ;; *) echo "::error::unsupported Anthropic model"; return 1 ;; esac
                [ -z "$fallback_model$fallback_budget" ] || { echo "::error::unsupported Anthropic fallback"; return 1; }
                ;;
              openai:openai-luna-long-context-2026-08-08)
                [ "${EXPLICIT_REREVIEW:-false}" = true ] || { echo "::error::OpenAI policy is reachable only through explicit re-review"; return 1; }
                [ "$selected_model" = gpt-5.6-luna ] || { echo "::error::unsupported OpenAI model/pricing"; return 1; }
                [ "$selected_budget" != auto ] || { echo "::error::OpenAI budget is required"; return 1; }
                [ -z "$fallback_model$fallback_budget" ] || { echo "::error::unsupported OpenAI fallback"; return 1; }
                ;;
              deepseek:deepseek-v4-2026-08-10)
                [ "$selected_model" = deepseek-v4-pro ] && [ "$fallback_model" = deepseek-v4-flash ] || {
                  echo "::error::unsupported DeepSeek cascade"; return 1;
                }
                [ "$selected_budget" != auto ] && [ -n "$fallback_budget" ] || { echo "::error::DeepSeek budgets are required"; return 1; }
                ;;
              *) echo "::error::unknown provider or pricing version"; return 1 ;;
            esac
            if ! [[ "$selected_budget" =~ ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$ ]] || ! awk -v b="$selected_budget" 'BEGIN { exit !(b > 0) }'; then
              echo "::error::budget must be positive with at most two decimal places"; return 1
            fi
            if [ -n "$fallback_budget" ] && { ! [[ "$fallback_budget" =~ ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$ ]] || ! awk -v b="$fallback_budget" 'BEGIN { exit !(b > 0) }'; }; then
              echo "::error::fallback budget must be positive with at most two decimal places"; return 1
            fi
            out provider "$selected_provider"; out model "$selected_model"; out budget_usd "$selected_budget"; out pricing_version "$selected_pricing"
            out authority "$selected_authority"; out fallback_model "$fallback_model"; out fallback_budget_usd "$fallback_budget"
          }

          meta=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json labels,title,isDraft,author,headRefOid,baseRefName)
          # Re-check opt-outs here too: workflow_dispatch bypasses the job if.
          # A hold is any of: a `hold`/`DO NOT MERGE` label (case- and
          # separator-insensitive, so `do-not-merge` counts — #51), a
          # `DO NOT MERGE` title marker, or draft.
          #
          # Materialised into a `true`/`false` STRING rather than tested with
          # `if jq -e …` (#480). `jq -e` exits non-zero both when the predicate is
          # false AND when jq itself errors — malformed JSON, a truncated API
          # response, a field the filter cannot index — and `if` cannot tell those
          # apart, so "we could not evaluate the hold" was read as "not held" and
          # the gate proceeded toward merge. ADR 0012 makes hold terminal because
          # it is the mechanism a human uses to STOP an autonomous merge, so that
          # is the one direction this check must never fail in. A jq error now
          # aborts under `set -e`; anything other than the two expected strings
          # fails closed explicitly.
          held="$(jq -r '([.labels[].name | ascii_upcase | gsub("[ _-]+";" ")]) as $l | ($l | index("HOLD")) or ($l | index("DO NOT MERGE")) or (.title | ascii_upcase | test("(^|[^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_])DO NOT MERGE([^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_]|$)")) or .isDraft | if . then "true" else "false" end' <<<"$meta")"
          case "$held" in
            true)
              echo "PR is held (label/title/draft); no lane."
              out lane held; out reason "held by human opt-out"; out model none
              exit 0 ;;
            false) ;;
            *)
              echo "::error::could not evaluate the terminal hold for PR #$PR_NUMBER; failing closed (ADR 0012, #480)"
              exit 1 ;;
          esac
          # `// ""` matters: without it a missing key yields the STRING "null",
          # which passes an `-z` emptiness test and is then interpolated into an
          # Actions-runs URL that matches nothing (making the absence probe look
          # clean). Downstream validates the 40-hex shape; keep the empty case
          # empty so that validation sees it.
          head_sha="$(jq -r '.headRefOid // ""' <<<"$meta")"
          out head_sha "$head_sha"
          out dependency_major false
          # Consume the re-review label so it can be re-applied later.
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label re-review 2>/dev/null || true

          # ---- Defer: Renovate release-age gate still pending -------------
          # `internalChecksFilter: strict` holds back version *candidates* that
          # miss `minimumReleaseAge`, so no branch is raised — but a Renovate
          # *replacement* PR bypasses that candidate filter and is raised
          # immediately, carrying a pending `renovate/stability-days` status
          # until the age elapses. Reviewing or merging is impossible until
          # then, so a model review (and the long CI wait on a gate runner)
          # is pure waste that re-burns on every rebase. Defer: emit a lane no
          # downstream job runs for. Renovate's rebase once the release ages
          # fires `synchronize` and re-enters classify for a real review;
          # `workflow_dispatch` forces a review past the gate.
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            if ! age_pending=$(gh api "repos/$REPO/commits/$head_sha/status" \
              --jq '[.statuses[]? | select(.context == "renovate/stability-days" and .state == "pending")] | length' 2>/dev/null); then
              out lane defer
              out reason "Could not verify Renovate release-age gate; deferring review until status is readable"
              out model none
              exit 0
            fi
            if [ "${age_pending:-0}" -gt 0 ]; then
              out lane defer
              out reason "Renovate release-age gate pending (renovate/stability-days) — deferring review until minimumReleaseAge elapses and Renovate rebases"
              out model none
              exit 0
            fi
          fi

          # GitHub may transiently return 5xx while computing the PR diff. Retry
          # the required paginated read immediately and fail closed only after
          # the bounded helper exhausts its attempts. This remains preflight:
          # no model reservation or provider call can occur without valid input.
          files="$(bash "$PR_FILES_READER" "$REPO" "$PR_NUMBER")"
          nfiles=$(jq length <<<"$files")
          if [ "$nfiles" -eq 0 ]; then
            select_policy claude-haiku-4-5 1.00
            if [ "${EXPLICIT_REREVIEW:-false}" = true ]; then
              out lane ai; out reason "empty diff — explicit re-review"
            else
              out lane fast; out reason "empty diff; no reviewable patch"
            fi
            out changed_lines 0
            out sensitive false
            exit 0
          fi

          # additions+deletions across the PR, used for the budget tier below.
          # `// 0` per file (a binary/too-large entry can omit `.changes`) and
          # `add // 0` for the whole sum keep this an integer, never null —
          # a null here would make the `-ge` test below a syntax error and
          # abort classification.
          changed_lines=$(jq '[.[].changes // 0] | add // 0' <<<"$files")
          [[ "$changed_lines" =~ ^[0-9]+$ ]] || changed_lines=0
          out changed_lines "$changed_lines"

          # Sensitive-path classification remains fail-closed and observable,
          # but the default first paid pass uses one organization-wide policy:
          # Haiku 4.5 with a $1.00 cap. A receipt-bound explicit policy may
          # still select a supported stronger model.
          #
          # Fail-closed string form, not `if jq -e …` (#480). Sensitive status is
          # security telemetry and may drive an explicit receipt-bound policy;
          # malformed metadata must not be recorded as non-sensitive. Unlike the
          # cheap-lane detectors below, an unreadable classification is an error.
          sensitive="$(jq -r '[.[].filename] | any(test("(^|/)\\.github/|abac|(^|/|[._-])auth|polic|payment|ledger|webhook|secret|middleware|rbac|rls"; "i")) | if . then "true" else "false" end' <<<"$files")"
          case "$sensitive" in
            true|false) ;;
            *)
              echo "::error::could not classify sensitive paths for PR #$PR_NUMBER; failing closed (#480)"
              exit 1 ;;
          esac
          out sensitive "$sensitive"
          select_policy claude-haiku-4-5 1.00
          if [ "${EXPLICIT_REREVIEW:-false}" = true ]; then
            out lane ai
            out reason "explicit re-review requested"
            exit 0
          fi

          # Preserve dependency-major prompt telemetry, but dependency pins and
          # manifests now follow the same mandatory AI lane as other code.
          author=$(jq -r .author.login <<<"$meta")
          if [[ "$author" =~ ^(app/)?renovate(\[bot\])?$ ]]; then
            major=$(jq '.labels | map(.name) | index("update/major") != null' <<<"$meta")
            [ "$major" = true ] && out dependency_major true
          fi

          classification="$(python3 "$REVIEW_CLASSIFIER" <<<"$files")" || {
            echo "::error::review policy classifier failed; refusing to skip AI review"
            exit 1
          }
          lane="$(jq -er '.lane | select(. == "ai" or . == "fast")' <<<"$classification")"
          reason="$(jq -er '.reason | select(type == "string" and length > 0)' <<<"$classification")"
          out lane "$lane"
          out reason "$reason"

      - name: Record preflight completion
        id: preflight_complete
        if: always()
        run: |
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "completed_at=$completed_at" >> "$GITHUB_OUTPUT"
          echo "::notice::phase=preflight completed_at=$completed_at lane=${{ steps.classify.outputs.lane || 'none' }} proceed=${{ steps.freshness.outputs.proceed || 'unknown' }}"

  gate:
    environment: ${{ inputs.ai_review_environment }}
    needs: [preflight, app-key-policy]
    if: ${{ needs.app-key-policy.result == 'success' && (needs.preflight.outputs.lane == 'fast' || needs.preflight.outputs.lane == 'ai') }}
    outputs:
      review_outcome: ${{ steps.submit.outputs.outcome || 'skipped' }}
    # A workflow_call consumer sets its own fleet via `with.runner_labels`; the
    # org direct paths leave it empty. Non-Verjson callers run on GitHub-hosted
    # ubuntu-24.04. Verjson targets use the default or untrusted lane variable
    # from preflight visibility; both currently select the permissive `general`
    # pool (#204, ADR 0035).
    # Fast lane for PUBLIC targets (ADR 0048). This job no longer waits for
    # ordinary CI: it performs the bounded review and dispatches one immediate
    # promotion attempt. Deterministic CI completion re-enters through
    # ai-promotion-retry.yml (ADRs 0081 and 0087).
    # `== 'false'` is the explicitly-resolved-public case; '' (unreadable) and
    # 'true' both fall through to the lane chain, so visibility that fails to
    # resolve never takes the fast lane. The chain's hosted tail is an
    # operator-error landing (a deleted lane variable), not a routing choice.
    runs-on: ${{ inputs.runner_labels && fromJSON(inputs.runner_labels) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || needs.preflight.outputs.target_private == 'false' && fromJSON(vars.CI_RUNNER_FASTLANE || '["ubuntu-24.04"]') || fromJSON(vars.CI_RUNNER_OVERFLOW || vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    # Fast retains its former 45-minute ceiling. AI gets a bounded review
    # allowance plus checkout, input preparation, submission, and dispatch
    # buffer; none of this budget is an ordinary-CI wait.
    timeout-minutes: ${{ needs.preflight.outputs.lane == 'ai' && 80 || 45 }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    env:
      APP_CLIENT_ID: ${{ vars.AI_REVIEW_CLIENT_ID }}
      LANE: ${{ needs.preflight.outputs.lane }}
      LANE_REASON: ${{ needs.preflight.outputs.reason }}
      EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
    steps:
      - name: Resolve executing trusted workflow revision
        id: trusted-revision
        env:
          TRUSTED_REVIEW_SHA: ${{ needs.preflight.outputs.trusted_review_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TRUSTED_REVIEW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::validated canonical workflow revision is unavailable or malformed"
            exit 1
          fi
          echo "sha=$TRUSTED_REVIEW_SHA" >>"$GITHUB_OUTPUT"

      - name: Check out immutable arm verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ steps.trusted-revision.outputs.sha }}
          path: .gate-trust
          sparse-checkout: |
            scripts/ci-gate/verify-zero-provider-recovery.sh
            scripts/ci-gate/verify-arm-receipt.sh
            scripts/ci-gate/review-policy-envelope.py
            scripts/ci-gate/review-verdict.py
            scripts/ci-gate/openai-review.py
            scripts/ci-gate/deepseek-review.py
            scripts/ci-gate/prepare-deepseek-replay.py
            scripts/ci-gate/review-attempt-count.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate trusted head authorization
        id: trusted-authorization
        env:
          GH_TOKEN: ${{ github.token }}
          ZERO_PROVIDER_RECOVERY: ${{ needs.preflight.outputs.zero_provider_recovery }}
          REVIEW_EVENT: ${{ github.event_name }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          bash .gate-trust/scripts/ci-gate/verify-arm-receipt.sh
          case "${ZERO_PROVIDER_RECOVERY:-false}" in
            true)
              [ "$REVIEW_EVENT" = workflow_dispatch ] &&
                [[ "$REVIEW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] &&
                [ "$REVIEW_RUN_ATTEMPT" -gt 1 ] || {
                  echo "::error::invalid zero-provider gate recovery context"; exit 1;
                }
              # The preflight output requests recovery; fresh receipt/run/job evidence authorizes it.
              bash .gate-trust/scripts/ci-gate/verify-zero-provider-recovery.sh
              ;;
            false)
              authorization="$(gh api "repos/$TARGET_REPO/check-runs/$AUTHORIZATION_CHECK_ID")"
              [ "$(jq -r '.status + ":" + (.conclusion // "")' <<<"$authorization")" = "in_progress:" ] || {
                echo "::error::authorization is not pending review"; exit 1;
              }
              ;;
            *) echo "::error::invalid zero-provider recovery flag"; exit 1 ;;
          esac
          install -m 0555 .gate-trust/scripts/ci-gate/openai-review.py "$RUNNER_TEMP/openai-review.py"
          install -m 0555 .gate-trust/scripts/ci-gate/deepseek-review.py "$RUNNER_TEMP/deepseek-review.py"
          install -m 0555 .gate-trust/scripts/ci-gate/prepare-deepseek-replay.py "$RUNNER_TEMP/prepare-deepseek-replay.py"
          install -m 0555 .gate-trust/scripts/ci-gate/review-verdict.py "$RUNNER_TEMP/review-verdict.py"
          install -m 0555 .gate-trust/scripts/ci-gate/review-attempt-count.py "$RUNNER_TEMP/review-attempt-count.py"

      - name: Validate review-reservation App client ID
        if: needs.preflight.outputs.lane == 'ai'
        run: |
          [[ "$APP_CLIENT_ID" =~ ^Iv[A-Za-z0-9.]{8,126}$ ]] || {
            echo "::error::AI_REVIEW_CLIENT_ID is unavailable or malformed"; exit 1;
          }

      - name: Mint review-reservation App token
        if: needs.preflight.outputs.lane == 'ai'
        id: reservation-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.AI_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Record gate runner timing
        env:
          PREFLIGHT_COMPLETED_AT: ${{ needs.preflight.outputs.completed_at }}
        run: |
          set -uo pipefail
          assigned_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Fail-safe epoch conversion (see the preflight step): an unparseable
          # or empty PREFLIGHT_COMPLETED_AT degrades to "unknown" rather than an
          # arithmetic syntax error aborting this required step (#106; ADR 0017).
          assigned_epoch="$(date -u -d "$assigned_at" +%s 2>/dev/null || true)"
          completed_epoch="$(date -u -d "$PREFLIGHT_COMPLETED_AT" +%s 2>/dev/null || true)"
          if [[ -n "$PREFLIGHT_COMPLETED_AT" && "$assigned_epoch" =~ ^[0-9]+$ && "$completed_epoch" =~ ^[0-9]+$ ]]; then
            queue_seconds=$(( assigned_epoch - completed_epoch ))
            echo "::notice::phase=gate runner_assigned_at=$assigned_at preflight_completed_at=$PREFLIGHT_COMPLETED_AT transition_queue_seconds=$queue_seconds lane=$LANE"
          else
            echo "::notice::phase=gate runner_assigned_at=$assigned_at transition_queue_seconds=unknown lane=$LANE"
          fi

      - name: Checkout PR head
        if: needs.preflight.outputs.lane == 'ai'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ needs.preflight.outputs.head_sha }}
          token: ${{ github.token }}
          fetch-depth: 2

      # Cost/latency optimization (#120): when main is active a green PR keeps
      # getting a base-merge from preflight, which re-fires `synchronize` and
      # re-pays a full model review even though the PR's own net diff is
      # unchanged. Compute the PR's base..head patch-id (stable across
      # base-merges/rebases) and, if it byte-matches the patch-id embedded in the
      # most recent APPROVAL marker, reuse that approval and skip the model. This
      # is PURELY an optimization on an already-approved, unchanged diff: it
      # never merges by itself — the unchanged authoritative merge-recheck below
      # still re-verifies head/CI/hold/draft and does the squash. Every unknown
      # (no merge-base, empty diff, missing/old/blocking-only marker) falls
      # through to the full review — fail-closed.
      - name: Decide whether to skip re-review (unchanged diff)
        id: rereview
        if: needs.preflight.outputs.lane == 'ai'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLICIT_REREVIEW: ${{ inputs.explicit_rereview }}
        run: |
          # GitHub runs `run:` under `bash -e`, and `set -uo pipefail` does NOT
          # clear that. Explicitly disable errexit so a transient or no-match
          # git/gh/grep non-zero — e.g. `grep` finding no prior marker on a
          # first-review PR — degrades to "do not skip" instead of aborting this
          # required gate step and blocking every merge org-wide
          # (Verjson/.github#124). This step must never fail closed.
          set +e
          set -uo pipefail
          skip=false
          patch_id=""
          approved_head=""

          # 1. Current PR net patch-id. The depth-2 checkout lacks the base, so
          #    fetch it and use the merge-base; patch-id --stable is invariant to
          #    later base-merges/rebases. Any failure -> patch_id stays empty
          #    (UNKNOWN) -> never skip.
          base_ref="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json baseRefName --jq .baseRefName 2>/dev/null || true)"
          if [ -n "$base_ref" ]; then
            git fetch --no-tags --depth 50 origin "$base_ref" 2>/dev/null || git fetch --no-tags origin "$base_ref" 2>/dev/null || true
            mb="$(git merge-base "origin/$base_ref" HEAD 2>/dev/null || true)"
            if [ -z "$mb" ]; then
              git fetch --no-tags --unshallow origin "$base_ref" 2>/dev/null || true
              mb="$(git merge-base "origin/$base_ref" HEAD 2>/dev/null || true)"
            fi
            if [ -n "$mb" ]; then
              diff="$(git diff "$mb" HEAD 2>/dev/null || true)"
              # An empty net diff (no real change) is UNKNOWN, not a match.
              if [ -n "$diff" ]; then
                patch_id="$(printf '%s\n' "$diff" | git patch-id --stable | awk '{print $1}')"
              fi
            fi
          fi

          # 2. Patch-id embedded in the most recent APPROVAL marker. Only an
          #    APPROVED review, or the self-gate's "approved verdict" comment
          #    fallback, qualifies — a blocking/inconclusive record that also
          #    carries the marker must NOT authorize a skip. Newest wins.
          # The marker is only trustworthy if the gate/bot itself posted it.
          # The repository token's workflow identity is the account that submits
          # the deterministic review/approval, so restrict BOTH the approved-review
          # and approved-comment selects to that login. Without this, any PR
          # author could post a comment carrying a forged marker plus the
          # (locally computable) patch-id and skip the paid review entirely
          # (fail-open). No gate identity -> no skip.
          prior_patch=""
          gate_login="$(gh api user --jq '.login' 2>/dev/null || true)"
          if [ -n "$patch_id" ] && [ -n "$gate_login" ]; then
            prdata="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json reviews,comments 2>/dev/null || echo '{}')"
            winner="$(jq -r --arg gate "$gate_login" '
              [ (.reviews[]?  | select(.state == "APPROVED" and .author.login == $gate)                               | {t: .submittedAt, b: .body}),
                (.comments[]? | select(.author.login == $gate and (.body | contains("Merge gate: approved verdict"))) | {t: .createdAt,  b: .body}) ]
              | map(select(.b != null and (.b | test("ai-review-head:"))))
              | sort_by(.t) | reverse | (.[0].b // "")
            ' <<<"$prdata" 2>/dev/null || true)"
            prior_patch="$(printf '%s' "$winner" | grep -oE 'patchid:[^ ]+' | head -n1 | cut -d: -f2)"
            approved_head="$(printf '%s' "$winner" | grep -oE 'ai-review-head:[^ ]+' | head -n1 | cut -d: -f2)"
          fi

          # 3. Skip ONLY on a non-empty exact match against a prior approval.
          if [ "${EXPLICIT_REREVIEW:-false}" != true ] && [ -n "$patch_id" ] && [ -n "$prior_patch" ] && [ "$patch_id" = "$prior_patch" ]; then
            skip=true
          fi

          {
            echo "skip_model=$skip"
            echo "patch_id=$patch_id"
          } >> "$GITHUB_OUTPUT"

          if [ "$skip" = true ]; then
            echo "::notice::phase=rereview result=skip patch_id=$patch_id approved_head=$approved_head"
            # Synthesize the approved verdict the deterministic submit + merge
            # recheck consume, so the skip path runs exactly like a normal
            # approve (blocking=false) — the merge only happens through the
            # unchanged recheck.
            summary="re-review skipped: PR net diff unchanged since ${approved_head:-a prior approval} (patch-id match)"
            verdict="$(jq -cn --arg s "$summary" '{blocking:false,summary:$s,review_first:[],findings:[],followups:[]}')"
            {
              echo "skip_verdict<<VERDICT_EOF"
              printf '%s\n' "$verdict"
              echo "VERDICT_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::phase=rereview result=review patch_id=${patch_id:-unknown}"
          fi

      - name: Reserve cumulative AI review pass 1
        id: reserve_1
        if: needs.preflight.outputs.lane == 'ai' && steps.rereview.outputs.skip_model != 'true'
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.reservation-app-token.outputs.token }}
          PROVIDER: ${{ needs.preflight.outputs.provider }}
          MODEL: ${{ needs.preflight.outputs.model }}
          EXPLICIT_REREVIEW: ${{ inputs.explicit_rereview }}
        run: |
          set -euo pipefail
          app_login="${EXPECTED_APP_SLUG}[bot]"
          current_head="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER" --jq '.head.sha // ""')"
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            {
              echo "allowed=false"
              echo "count=0"
              echo "superseded=true"
              echo "cap_exhausted=false"
            } >>"$GITHUB_OUTPUT"
            echo "::warning::phase=model result=superseded expected_head=$EXPECTED_HEAD_SHA current_head=$current_head — refusing to reserve a paid pass for a stale head"
            exit 0
          fi
          {
            echo "superseded=false"
            echo "cap_exhausted=false"
          } >>"$GITHUB_OUTPUT"
          reviews="$(gh api --paginate "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews?per_page=100" | jq -s 'add // []')"
          pass_marker_re='ai-review-pass:v2:([12])/2 pr:([1-9][0-9]*) check:([1-9][0-9]*) head:([0-9a-f]{40}) run:([1-9][0-9]*) attempt:([1-9][0-9]*) provider:([a-z0-9_-]+) model:([A-Za-z0-9._-]+)'
          explicit_marker_re='ai-review-explicit:v1 pr:([1-9][0-9]*) check:([1-9][0-9]*) head:([0-9a-f]{40}) run:([1-9][0-9]*) attempt:([1-9][0-9]*) provider:([a-z0-9_-]+) model:([A-Za-z0-9._-]+)'
          explicit_receipt_consumed=false
          while IFS=$'\t' read -r review_head review_body; do
            marker_kind='' marker_pr='' marker_check='' marker_head=''
            if [[ "$review_body" =~ $pass_marker_re ]]; then
              marker_kind=automatic
              marker_pr="${BASH_REMATCH[2]}"; marker_check="${BASH_REMATCH[3]}"; marker_head="${BASH_REMATCH[4]}"
            elif [[ "$review_body" =~ $explicit_marker_re ]]; then
              marker_kind=explicit
              marker_pr="${BASH_REMATCH[1]}"; marker_check="${BASH_REMATCH[2]}"; marker_head="${BASH_REMATCH[3]}"
            else
              continue
            fi
            [ "$marker_pr" = "$PR_NUMBER" ] && [ "$marker_head" = "$review_head" ] || continue
            [ "$marker_head" = "$EXPECTED_HEAD_SHA" ] || continue
            check="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/check-runs/$marker_check")"
          jq -e --arg head "$marker_head" --arg repo "$TARGET_REPO" --arg pr "$PR_NUMBER" '
            .name == "AI review authorization" and .head_sha == $head and
            .app.id == 15368 and .app.slug == "github-actions" and
            (.external_id | startswith("ai-review:v1:" + $repo + ":" + $pr + ":" + $head + ":"))
          ' <<<"$check" >/dev/null || {
                echo "::error::App review reservation is not bound to a trusted exact-head authorization check"; exit 1;
              }
            if [ "$marker_kind" = explicit ] && [ "$marker_check" = "$AUTHORIZATION_CHECK_ID" ]; then
              explicit_receipt_consumed=true
            fi
          done < <(jq -r --arg login "$app_login" '.[] | select(.state == "COMMENTED" and .user.login == $login) | [.commit_id, .body] | @tsv' <<<"$reviews")
          consumed="$(python3 "$RUNNER_TEMP/review-attempt-count.py" --app-login "$app_login" --pr-number "$PR_NUMBER" --head-sha "$EXPECTED_HEAD_SHA" <<<"$reviews")"
          [[ "$consumed" =~ ^[0-9]+$ ]] || exit 1
          # One rollout attempt predates App-authored reservation reviews. Count
          # it only after independently revalidating its immutable workflow run,
          # exact GitHub Actions-owned arm check, PR, and head. This narrowly bound migration
          # record prevents corrected PR #769 from receiving two more calls.
          if [ "$TARGET_REPO:$PR_NUMBER:$EXPECTED_HEAD_SHA" = "Verjson/.github:769:1e7762067a23edcef7f36c1687e94a277f4e6ccf" ]; then
            legacy_run="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/31660690749")"
            legacy_check="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/check-runs/94324686490")"
            legacy_jobs="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/31660690749/jobs?per_page=100")"
            if ! jq -e '
              .id == 31660690749 and .event == "workflow_dispatch" and
              .path == ".github/workflows/ai-review-merge.yml" and
              .head_repository.full_name == "Verjson/.github" and
              .head_branch == "main" and .run_attempt == 1
            ' <<<"$legacy_run" >/dev/null; then
              echo "::error::the one-time PR #769 legacy workflow run cannot be proven"; exit 1
            fi
            if ! jq -e --argjson app_id "$EXPECTED_APP_ID" --arg slug "$EXPECTED_APP_SLUG" '
              .id == 94324686490 and .name == "AI review authorization" and
              .head_sha == "1e7762067a23edcef7f36c1687e94a277f4e6ccf" and
              .app.id == $app_id and .app.slug == $slug and
              (.external_id | startswith("ai-review:v1:Verjson/.github:769:1e7762067a23edcef7f36c1687e94a277f4e6ccf:31660681868:1:"))
            ' <<<"$legacy_check" >/dev/null; then
              echo "::error::the one-time PR #769 legacy authorization check cannot be proven"; exit 1
            fi
            if ! jq -e '
              any(.jobs[]; .name == "gate" and
                any(.steps[]; .name == "DeepSeek review pass 1" and .status == "completed" and .conclusion == "success"))
            ' <<<"$legacy_jobs" >/dev/null; then
              echo "::error::the one-time PR #769 legacy provider attempt cannot be proven"; exit 1
            fi
            consumed=$((consumed + 1))
          fi
          if [ "${EXPLICIT_REREVIEW:-false}" = true ] && [ "$explicit_receipt_consumed" = true ]; then
            {
              echo "allowed=false"
              echo "count=$consumed"
            } >>"$GITHUB_OUTPUT"
            echo "::error::this explicit authorization check already reserved its one diagnostic pass; apply a new authorized re-review label"
            exit 0
          fi
          if [ "${EXPLICIT_REREVIEW:-false}" != true ] && [ "$consumed" -ge 2 ]; then
            {
              echo "allowed=false"
              echo "count=$consumed"
              echo "cap_exhausted=true"
            } >>"$GITHUB_OUTPUT"
            echo "::error::AI review exact-head pass cap exhausted ($consumed/2); refusing a third model invocation"
            exit 0
          fi
          next=$((consumed + 1))
          if [ "${EXPLICIT_REREVIEW:-false}" = true ]; then
            marker="<!-- ai-review-explicit:v1 pr:${PR_NUMBER} check:${AUTHORIZATION_CHECK_ID} head:${EXPECTED_HEAD_SHA} run:${GITHUB_RUN_ID} attempt:${GITHUB_RUN_ATTEMPT} provider:${PROVIDER} model:${MODEL} -->"
            body="🤖 **Explicit maintainer-authorized AI code review consumed**

          This one-shot diagnostic pass was authorized by a consumed \`re-review\` label and is counted in cumulative telemetry. It does not enlarge the automatic two-pass allowance or permit an automatic fallback.

          $marker"
          else
            marker="<!-- ai-review-pass:v2:${next}/2 pr:${PR_NUMBER} check:${AUTHORIZATION_CHECK_ID} head:${EXPECTED_HEAD_SHA} run:${GITHUB_RUN_ID} attempt:${GITHUB_RUN_ATTEMPT} provider:${PROVIDER} model:${MODEL} -->"
            body="🤖 **AI code review pass ${next}/2 consumed**

          This pass slot is reserved before provider invocation, so a failed or inconclusive attempt still counts toward this exact head's two-pass maximum.

          $marker"
          fi
          created="$(gh api --method POST "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews" \
            -f event=COMMENT -f commit_id="$EXPECTED_HEAD_SHA" -f body="$body")"
          jq -e --arg login "$app_login" --arg head "$EXPECTED_HEAD_SHA" --arg marker "$marker" '
            .state == "COMMENTED" and .commit_id == $head and .user.login == $login and
            (.body | contains($marker)) and (.id | type == "number")
          ' <<<"$created" >/dev/null || {
            echo "::error::dedicated App review reservation was not persisted exactly"; exit 1;
          }
          {
            echo "allowed=true"
            echo "count=$next"
          } >>"$GITHUB_OUTPUT"

      - name: Prepare bounded review context
        id: prep
        if: needs.preflight.outputs.lane == 'ai' && steps.rereview.outputs.skip_model != 'true' && steps.reserve_1.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_MAJOR: ${{ needs.preflight.outputs.dependency_major }}
        run: |
          set -euo pipefail
          mkdir -p .ai-review
          gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
            --json title,body,author,labels,baseRefName,headRefName,additions,deletions,changedFiles \
            > .ai-review/pr.json
          # Build the diff from the immutable checked-out PR head instead of
          # GitHub's whole-diff endpoint, which rejects PRs over 300 files
          # (#323). Fetch only base history, retry bounded transport failures,
          # and fail closed when the merge base cannot be established. Keep
          # stderr off the log so a remote response can never leak through the
          # retry diagnostics.
          base_ref="$(jq -r '.baseRefName' .ai-review/pr.json)"
          if [ -z "$base_ref" ] || [ "$base_ref" = null ]; then
            echo "::error::phase=review-input result=unavailable kind=base_ref_missing — PR metadata did not identify a base ref"
            exit 1
          fi
          diff_max_attempts=4
          diff_error=.ai-review/base-fetch.error
          fetch_base_history() {
            local fetch_mode="$1" diff_attempt=1 diff_rc diff_delay
            while :; do
              : >"$diff_error"
              if git fetch --no-tags "$fetch_mode" origin \
                "+refs/heads/$base_ref:refs/remotes/origin/$base_ref" 2>"$diff_error"; then
                : >"$diff_error"
                return 0
              else
                diff_rc=$?
              fi
              : >"$diff_error"
              if [ "$diff_attempt" -ge "$diff_max_attempts" ]; then
                {
                  echo "review_input_available=false"
                  echo "review_input_failure=infrastructure_unavailable"
                } >>"$GITHUB_OUTPUT"
                echo "::error::phase=review-input result=unavailable kind=infrastructure_unavailable source=git_fetch mode=$fetch_mode attempts=$diff_attempt — base history remained unavailable; not a substantive review verdict"
                return "$diff_rc"
              fi
              diff_delay=$((1 << (diff_attempt - 1)))
              echo "::warning::phase=review-input result=retry kind=git_fetch mode=$fetch_mode attempt=$diff_attempt/$diff_max_attempts backoff_seconds=$diff_delay"
              : # retry immediately; never hold a runner merely for backoff
              diff_attempt=$((diff_attempt + 1))
            done
          }
          fetch_base_history --depth=100 || exit $?
          merge_base="$(git merge-base "origin/$base_ref" HEAD 2>/dev/null || true)"
          if [ -z "$merge_base" ] \
            && [ "$(git rev-parse --is-shallow-repository 2>/dev/null || true)" = true ]; then
            fetch_base_history --unshallow || exit $?
            merge_base="$(git merge-base "origin/$base_ref" HEAD 2>/dev/null || true)"
          fi
          [ -n "$merge_base" ] || {
            {
              echo "review_input_available=false"
              echo "review_input_failure=merge_base_unavailable"
            } >>"$GITHUB_OUTPUT"
            echo "::error::phase=review-input result=unavailable kind=merge_base_unavailable — fetched base history has no merge base with the checked-out PR head"
            exit 1
          }
          if ! git diff --find-renames "$merge_base" HEAD >.ai-review/pr.full.diff; then
            {
              echo "review_input_available=false"
              echo "review_input_failure=local_diff_failed"
            } >>"$GITHUB_OUTPUT"
            echo "::error::phase=review-input result=unavailable kind=local_diff_failed — could not render the checked-out PR head against its merge base"
            exit 1
          fi
          {
            echo "review_input_available=true"
            echo "review_input_failure=none"
          } >>"$GITHUB_OUTPUT"

          # Elide generated lockfiles from the review payload. A lockfile is a
          # derived artifact — the reviewer scrutinizes the manifest
          # (package.json, Cargo.toml, …), never the machine-generated lock. An
          # 8k-line package-lock in the diff once consumed the whole review
          # budget and produced a no-verdict, fail-closed run on an
          # otherwise-small PR (Verjson/.github#110). Keep the full diff on disk
          # for reference; hand the model the filtered diff plus a note of what
          # was dropped so it still scrutinizes the manifest counterpart.
          LOCK_RE='(^|/)(package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|Cargo\.lock|go\.sum|poetry\.lock|composer\.lock|gradle\.lockfile|Gemfile\.lock)$'
          awk -v re="$LOCK_RE" '
            /^diff --git / { p = $4; sub(/^b\//, "", p); keep = (p !~ re) }
            keep
          ' .ai-review/pr.full.diff > .ai-review/pr.diff
          elided_lockfiles="$(awk -v re="$LOCK_RE" '
            /^diff --git / { p = $4; sub(/^b\//, "", p);
              if (p ~ re) out = out (out == "" ? "" : ", ") p }
            END { print out }
          ' .ai-review/pr.full.diff)"

          # Re-read immediately before model spend. Duplicate webhook delivery
          # is deduplicated by the trusted arm; no runner debounce is needed.
          current=$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json headRefOid --jq .headRefOid)
          [ "$current" = "${{ needs.preflight.outputs.head_sha }}" ] || {
            echo "PR head moved to $current during debounce; a newer run will review it."
            exit 1
          }

          # Compose the review prompt once for the sole automatic paid pass. The
          # economy instruction (read the diff,
          # then only the files a finding depends on) keeps the agentic loop
          # from wandering the tree and burning tokens on context resends.
          major_note=""
          if [ "$DEPENDENCY_MAJOR" = "true" ]; then
            major_note="This is a major dependency update. Also inspect the changed dependency version and repository evidence for breaking changes, deprecations, migrations, and security-relevant fixes."
          fi
          lockfile_note=""
          if [ -n "$elided_lockfiles" ]; then
            lockfile_note="Generated lockfiles were omitted from the diff to conserve review budget. Their manifest changes are in the diff; review those and do not request omitted lockfiles."
          fi
          {
            echo "review_prompt<<PROMPT_EOF"
            cat <<EOF
          You are the autonomous merge gate for ${TARGET_REPO}.
          Review PR #${PR_NUMBER} in ${TARGET_REPO}.
          PR metadata and the generated-lockfile-elided diff are the required
          review inputs. They are available as .ai-review/pr.json and
          .ai-review/pr.diff on tool-capable paths and are embedded directly on
          tool-free paths. Review those inputs first; on tool-capable paths,
          open only specific repository files a potential finding depends on.

          The checked-out workspace and git HEAD are the PR head, not the base or default branch.
          Never use HEAD, the current checkout, or matching blob hashes as evidence that content is already on the base branch.
          Do not block because you infer this PR submission is stale, duplicate, closed, or already merged; the deterministic API recheck owns PR lifecycle state.
          Still review duplicate-processing and idempotency defects in the proposed behavior normally.

          Review for, in priority order:
          1. Correctness bugs and behavioral regressions.
          2. Security: authn/authz changes, tenant isolation, secret
             handling, input validation at boundaries, injection.
          3. Money-handling invariants (integer minor units, double-entry
             balance, idempotency, provider-confirmed amounts only).
          4. Missing or weakened tests for changed behavior.
          Style-only nits are not blocking; mention at most briefly.

          ${major_note}

          ${lockfile_note}

          Return exactly one JSON object with these canonical fields and item
          shapes: blocking: boolean; summary: string;
          review_first: [{location, why}];
          findings: [{location, reason, failure_scenario, evidence}];
          followups: [{location: "path/to/file.ext:42", note: "non-empty text"}].
          Both followup fields are strings. Return the verdict as soon as you can
          support it. Do not call GitHub or submit a review yourself. Set
          blocking=true only for real defects. Keep summary concise.
          Return no Markdown, code fences, or prose outside that JSON object.
          Use only the listed keys at every level. In particular, a followup
          has exactly location and note: fold any useful title, category,
          severity, or recommendation into note instead of adding another key.

          Every findings.location MUST contain exactly one repository-relative
          file and one positive line number in the form path/to/file.ext:42.
          Never return a line range or comma-separated lines for a finding; the
          evidence validator rejects rather than normalizes those locations.
          Every blocking finding MUST include "evidence": a single-line exact
          source fragment copied from its cited location at the checked-out PR
          head. Use 8-240 characters when the source line is at least 8
          characters; for a shorter line, copy the entire trimmed line. Do not
          copy evidence from a nearby line, a test mutation, the base branch,
          or another file. Copy the evidence verbatim: leading and trailing
          whitespace may be omitted, but interior tokens and spacing must match
          the reviewed commit exactly. A deterministic validator resolves the
          cited line from the reviewed commit and automatically rejects the
          entire verdict when the fragment does not occur on that exact line.

          Also return "review_first": the specific file:line hunks a human
          should eyeball first, highest blast-radius first, each with a one-line
          "why" it is load-bearing. This is MANDATORY (must be non-empty) when
          the diff touches a sensitive area — authn/authz, RBAC/ABAC, secrets,
          IAM/OIDC, database migrations, money-handling, or CI / rulesets /
          branch protection — so the human's eye lands on the exact lines that
          matter even when the verdict is to approve. For a low-risk diff (docs,
          formatting, a trivial change) it may be empty.
          Every review_first.location MUST contain exactly one file and one
          positive line number in the form path/to/file.ext:42. Never return a
          line range, comma-separated lines, or multiple files in one location;
          use separate review_first entries when more than one line matters.

          Also return "followups": substantive but non-blocking findings — real
          bugs or improvements that do not justify blocking this merge, each as
          {location, note}. Use note for the follow-up text; suggestion or
          recommendation are accepted provider aliases. These are filed as
          tracking issues when the PR merges, so nothing worth doing is lost.
          Do NOT put pure style /
          formatting / naming nitpicks here; mention those (at most briefly) in
          the summary only. Empty when there is nothing substantive to follow up.

          Be skeptical but calibrated: block on real defects, not
          hypotheticals. A docs-only PR with sane content should simply be
          approved.
          EOF
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Record model phase start
        id: model_timing
        if: needs.preflight.outputs.lane == 'ai' && steps.rereview.outputs.skip_model != 'true' && steps.reserve_1.outputs.allowed == 'true'
        run: |
          started_epoch="$(date +%s)"
          echo "started_epoch=$started_epoch" >> "$GITHUB_OUTPUT"
          echo "::notice::phase=model started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) provider=${{ needs.preflight.outputs.provider }} model=${{ needs.preflight.outputs.model }} budget_usd=${{ needs.preflight.outputs.budget_usd }} pricing=${{ needs.preflight.outputs.pricing_version }}"

      - name: Claude review (merge gate)
        id: claude
        if: needs.preflight.outputs.lane == 'ai' && needs.preflight.outputs.provider == 'anthropic' && steps.rereview.outputs.skip_model != 'true' && steps.reserve_1.outputs.allowed == 'true'
        # Preserve the transcript and fail closed below when this one paid pass
        # cannot produce a usable verdict. Automatic escalation is forbidden:
        # another paid attempt requires a maintainer-authorized `re-review`.
        continue-on-error: true
        uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # This audited action revision lowercases logins and removes one
          # trailing `[bot]` from both sides before comparison. Keep the source
          # GitHub logins explicit here; receipt validation above remains the
          # dispatch trust boundary.
          allowed_bots: "renovate[bot],mend[bot],github-actions[bot]"
          prompt: ${{ steps.prep.outputs.review_prompt }}
          claude_args: |
            --model ${{ needs.preflight.outputs.model }}
            --max-turns 30
            --max-budget-usd ${{ needs.preflight.outputs.budget_usd }}
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"},"review_first":{"type":"array","items":{"type":"object","properties":{"location":{"type":"string","description":"Exactly one file and positive line number (path/to/file.ext:42); no ranges or comma-separated locations."},"why":{"type":"string"}},"required":["location","why"],"additionalProperties":false}},"findings":{"type":"array","items":{"type":"object","properties":{"location":{"type":"string","description":"Exactly one repository-relative file and one positive line number (path/to/file.ext:42); no ranges or comma-separated locations."},"reason":{"type":"string"},"failure_scenario":{"type":"string"},"evidence":{"type":"string","description":"An 8-240 character exact fragment from the cited source line, or the entire trimmed line when shorter than 8 characters."}},"required":["location","reason","failure_scenario","evidence"],"additionalProperties":false}},"followups":{"type":"array","items":{"type":"object","properties":{"location":{"type":"string"},"note":{"type":"string"}},"required":["location","note"],"additionalProperties":false}}},"required":["blocking","summary","review_first","findings","followups"],"additionalProperties":false}'
            --allowedTools "Read,Grep,Glob"

      - name: OpenAI review (explicit re-review only)
        id: openai
        if: needs.preflight.outputs.lane == 'ai' && needs.preflight.outputs.provider == 'openai' && steps.rereview.outputs.skip_model != 'true' && steps.reserve_1.outputs.allowed == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ needs.preflight.outputs.model }}
          BUDGET_USD: ${{ needs.preflight.outputs.budget_usd }}
          REVIEW_PROMPT: ${{ steps.prep.outputs.review_prompt }}
          PROMPT_FILE: ${{ runner.temp }}/ai-review-openai-prompt.txt
          PR_JSON_FILE: ${{ github.workspace }}/.ai-review/pr.json
          PR_DIFF_FILE: ${{ github.workspace }}/.ai-review/pr.diff
        run: |
          umask 077
          printf '%s' "$REVIEW_PROMPT" >"$PROMPT_FILE"
          python3 "$RUNNER_TEMP/openai-review.py"

      - name: DeepSeek review pass 1
        id: deepseek_primary
        if: needs.preflight.outputs.lane == 'ai' && needs.preflight.outputs.provider == 'deepseek' && steps.rereview.outputs.skip_model != 'true' && steps.reserve_1.outputs.allowed == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODEL: ${{ needs.preflight.outputs.model }}
          BUDGET_USD: ${{ needs.preflight.outputs.budget_usd }}
          REVIEW_PROMPT: ${{ steps.prep.outputs.review_prompt }}
          PROMPT_FILE: ${{ runner.temp }}/ai-review-deepseek-primary-prompt.txt
          PR_JSON_FILE: ${{ github.workspace }}/.ai-review/pr.json
          PR_DIFF_FILE: ${{ github.workspace }}/.ai-review/pr.diff
          REPLAY_FILE: ${{ runner.temp }}/deepseek-replay-pass-1.json
          REVIEWED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          REVIEW_PASS: "1"
          SENSITIVE: ${{ needs.preflight.outputs.sensitive }}
          TRUSTED_REVIEW_SHA: ${{ steps.trusted-revision.outputs.sha }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER" --jq '.head.sha // ""')"
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::notice::phase=model result=superseded — refusing provider invocation for a stale head"
            exit 0
          fi
          umask 077
          printf '%s' "$REVIEW_PROMPT" >"$PROMPT_FILE"
          env -u GH_TOKEN python3 "$RUNNER_TEMP/deepseek-review.py"

      - name: Validate pass 1 verdict semantics
        id: verdict_1
        if: always() && needs.preflight.outputs.lane == 'ai' && steps.rereview.outputs.skip_model != 'true' && steps.reserve_1.outputs.allowed == 'true'
        env:
          VERDICT: ${{ needs.preflight.outputs.provider == 'openai' && steps.openai.outputs.structured_output || needs.preflight.outputs.provider == 'deepseek' && steps.deepseek_primary.outputs.structured_output || steps.claude.outputs.structured_output }}
          SENSITIVE: ${{ needs.preflight.outputs.sensitive }}
          REVIEW_PASS: "1"
          REVIEW_REPOSITORY: ${{ github.workspace }}
          REVIEWED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: |
          python3 "$RUNNER_TEMP/review-verdict.py"

      - name: Reserve cumulative AI review pass 2
        id: reserve_2
        if: ${{ !cancelled() && inputs.explicit_rereview != true && needs.preflight.outputs.provider == 'deepseek' && steps.reserve_1.outputs.allowed == 'true' && steps.verdict_1.outputs.usable != 'true' }}
        env:
          GH_TOKEN: ${{ steps.reservation-app-token.outputs.token }}
          PROVIDER: deepseek
          MODEL: ${{ needs.preflight.outputs.fallback_model }}
        run: |
          set -euo pipefail
          app_login="${EXPECTED_APP_SLUG}[bot]"
          consumed="${{ steps.reserve_1.outputs.count }}"
          [[ "$consumed" =~ ^[0-9]+$ ]] || exit 1
          current_head="$(gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER" --jq '.head.sha // ""')"
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            {
              echo "allowed=false"
              echo "count=$consumed"
              echo "superseded=true"
              echo "cap_exhausted=false"
            } >>"$GITHUB_OUTPUT"
            echo "::warning::phase=model result=superseded expected_head=$EXPECTED_HEAD_SHA current_head=$current_head — refusing to reserve fallback for a stale head"
            exit 0
          fi
          {
            echo "superseded=false"
            echo "cap_exhausted=false"
          } >>"$GITHUB_OUTPUT"
          if [ "$consumed" -ge 2 ]; then
            {
              echo "allowed=false"
              echo "count=$consumed"
              echo "cap_exhausted=true"
            } >>"$GITHUB_OUTPUT"
            echo "::notice::DeepSeek fallback suppressed because this exact head has consumed $consumed/2 AI review passes"
            exit 0
          fi
          next=$((consumed + 1))
          marker="<!-- ai-review-pass:v2:${next}/2 pr:${PR_NUMBER} check:${AUTHORIZATION_CHECK_ID} head:${EXPECTED_HEAD_SHA} run:${GITHUB_RUN_ID} attempt:${GITHUB_RUN_ATTEMPT} provider:${PROVIDER} model:${MODEL} -->"
          body="🤖 **AI code review pass ${next}/2 consumed**

          The first pass produced no usable verdict. This exact-head fallback slot is reserved before invocation and counts even if the provider attempt fails or is inconclusive.

          $marker"
          created="$(gh api --method POST "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews" \
            -f event=COMMENT -f commit_id="$EXPECTED_HEAD_SHA" -f body="$body")"
          jq -e --arg login "$app_login" --arg head "$EXPECTED_HEAD_SHA" --arg marker "$marker" '
            .state == "COMMENTED" and .commit_id == $head and .user.login == $login and
            (.body | contains($marker)) and (.id | type == "number")
          ' <<<"$created" >/dev/null || {
            echo "::error::dedicated App fallback reservation was not persisted exactly"; exit 1;
          }
          {
            echo "allowed=true"
            echo "count=$next"
          } >>"$GITHUB_OUTPUT"

      - name: DeepSeek review pass 2
        id: deepseek_fallback
        if: ${{ !cancelled() && inputs.explicit_rereview != true && needs.preflight.outputs.lane == 'ai' && needs.preflight.outputs.provider == 'deepseek' && steps.rereview.outputs.skip_model != 'true' && steps.verdict_1.outputs.usable != 'true' && steps.reserve_2.outputs.allowed == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODEL: ${{ needs.preflight.outputs.fallback_model }}
          BUDGET_USD: ${{ needs.preflight.outputs.fallback_budget_usd }}
          REVIEW_PROMPT: ${{ steps.prep.outputs.review_prompt }}
          PROMPT_FILE: ${{ runner.temp }}/ai-review-deepseek-fallback-prompt.txt
          PR_JSON_FILE: ${{ github.workspace }}/.ai-review/pr.json
          PR_DIFF_FILE: ${{ github.workspace }}/.ai-review/pr.diff
          REPLAY_FILE: ${{ runner.temp }}/deepseek-replay-pass-2.json
          REVIEWED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          REVIEW_PASS: "2"
          SENSITIVE: ${{ needs.preflight.outputs.sensitive }}
          TRUSTED_REVIEW_SHA: ${{ steps.trusted-revision.outputs.sha }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER" --jq '.head.sha // ""')"
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::notice::phase=model result=superseded — refusing provider invocation for a stale head"
            exit 0
          fi
          umask 077
          printf '%s' "$REVIEW_PROMPT" >"$PROMPT_FILE"
          env -u GH_TOKEN python3 "$RUNNER_TEMP/deepseek-review.py"

      - name: Validate pass 2 verdict semantics
        id: verdict_2
        if: always() && inputs.explicit_rereview != true && needs.preflight.outputs.provider == 'deepseek' && steps.deepseek_fallback.conclusion != 'skipped'
        env:
          VERDICT: ${{ steps.deepseek_fallback.outputs.structured_output }}
          SENSITIVE: ${{ needs.preflight.outputs.sensitive }}
          REVIEW_PASS: "2"
          REVIEW_REPOSITORY: ${{ github.workspace }}
          REVIEWED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: |
          python3 "$RUNNER_TEMP/review-verdict.py"

      - name: Record bounded model outcome
        id: retry_outcome
        if: always() && needs.preflight.outputs.lane == 'ai'
        env:
          STARTED_EPOCH: ${{ steps.model_timing.outputs.started_epoch }}
          FIRST_VERDICT: ${{ steps.verdict_1.outputs.usable == 'true' || steps.verdict_2.outputs.usable == 'true' }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          MODEL_CONCLUSION: ${{ needs.preflight.outputs.provider == 'openai' && steps.openai.conclusion || needs.preflight.outputs.provider == 'deepseek' && steps.verdict_1.outputs.usable == 'true' && steps.deepseek_primary.conclusion || needs.preflight.outputs.provider == 'deepseek' && steps.deepseek_fallback.conclusion || steps.claude.conclusion }}
          PROVIDER: ${{ needs.preflight.outputs.provider }}
          PASS_COUNT: ${{ steps.reserve_2.outputs.count || steps.reserve_1.outputs.count || '0' }}
        run: |
          elapsed=unknown
          if [[ "$STARTED_EPOCH" =~ ^[0-9]+$ ]]; then
            elapsed=$(( $(date +%s) - STARTED_EPOCH ))
          fi
          # Did the paid pass stop because it ran out of money? The transcript is an
          # array of SDK messages whose final `result` carries the subtype. A
          # missing, unset or unparseable file degrades to "no" — this step is
          # `always()` bookkeeping and must never fail the gate, and a false
          # positive would tell a maintainer to split a PR that is not oversized.
          budget_exhausted=false
          turns_exhausted=false
          terminal_error=false
          execution_evidence_usable=false
          permission_denials=0
          if { [ "$PROVIDER" = openai ] || [ "$PROVIDER" = deepseek ]; } && [ "$MODEL_CONCLUSION" = success ]; then
            execution_evidence_usable=true
          elif [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            subtype=$(jq -r '(if type == "array" then (map(select(.type == "result")) | last) else . end).subtype // ""' "$EXEC_FILE" 2>/dev/null || echo "")
            permission_denials=$(jq -r '(if type == "array" then (map(select(.type == "result")) | last) else . end).permission_denials_count // 0' "$EXEC_FILE" 2>/dev/null || echo 0)
            [[ "$permission_denials" =~ ^[0-9]+$ ]] || permission_denials=0
            # A structured_output is not a verdict when the same SDK result says
            # the pass terminated in error. The action can still emit the
            # shortest schema-valid filler while exhausting turns or budget
            # (#441); retain the factual subtype instead of guessing at content
            # quality.
            case "$subtype" in
              success) execution_evidence_usable=true ;;
              error_*) terminal_error=true; execution_evidence_usable=true ;;
            esac
            # Turn exhaustion is a DIFFERENT limit with a different remedy, and it
            # was invisible here (#442): only the budget subtype was matched, so a
            # run that died on the 15-turn cap surfaced as an unexplained gate
            # failure — the same illegible shape #293 fixed for the budget. Raising
            # the budget does nothing for it; the review ran out of exploration
            # steps, not money.
            case "$subtype" in
              error_max_budget_usd) budget_exhausted=true ;;
              error_max_turns)      turns_exhausted=true ;;
            esac
          fi
          # A schema-valid action output is not merge evidence without a
          # parseable SDK terminal result. Missing/unreadable telemetry must
          # never resurrect the #441 filler-verdict approval path.
          if [ "$FIRST_VERDICT" = true ] && [ "$execution_evidence_usable" != true ]; then
            terminal_error=true
            echo "::error::phase=model result=terminal-evidence-missing outcome=blocked — refusing a structured verdict without parseable SDK terminal evidence"
          fi
          usable_verdict=false
          [ "$FIRST_VERDICT" = true ] && [ "$terminal_error" != true ] && usable_verdict=true
          {
            echo "budget_exhausted=$budget_exhausted"
            echo "turns_exhausted=$turns_exhausted"
            echo "selected_pass_terminal_error=$terminal_error"
            echo "permission_denials=$permission_denials"
          } >> "$GITHUB_OUTPUT"
          # Say in words what the red `error_max_budget_usd` annotation means.
          retry_guidance='A maintainer may apply re-review to authorize the remaining paid attempt.'
          if [[ "${PASS_COUNT:-0}" =~ ^[2-9][0-9]*$ ]]; then
            retry_guidance='This exact head exhausted its two-pass maximum; no further model review is allowed for it.'
          fi
          if [ "$budget_exhausted" = true ]; then
            echo "::error::phase=model budget_exhausted=true outcome=blocked — the paid review hit its cost cap; no automatic retry is allowed. The gate blocks this PR. $retry_guidance"
          fi
          # Same treatment for the turn cap (#442). Stated separately rather than
          # folded into the budget wording, because the remedies diverge: a budget
          # failure says "this PR is larger than the review budget", while a turn
          # failure says the review ran out of exploration steps at the same size.
          # Telling a maintainer to split a PR that is not oversized is the false
          # positive the budget probe already takes care to avoid.
          if [ "$turns_exhausted" = true ]; then
            echo "::error::phase=model turns_exhausted=true outcome=blocked — the paid review hit its turn cap; no automatic retry is allowed. The gate blocks this PR. $retry_guidance"
          fi
          if [ "$permission_denials" -gt 0 ] && [ "$usable_verdict" != true ]; then
            echo "::error::phase=model permission_denials=$permission_denials outcome=blocked — denied tool calls prevented useful progress in the single paid review. Align the prompt and allowedTools before authorizing re-review."
          fi
          automatic_paid_attempts=1
          [ "${MODEL_CONCLUSION:-skipped}" = skipped ] && automatic_paid_attempts=0
          if [ "$PROVIDER" = deepseek ] && [ "${{ steps.deepseek_fallback.conclusion }}" != skipped ]; then automatic_paid_attempts=2; fi
          echo "::notice::phase=model elapsed_seconds=$elapsed first_verdict=$FIRST_VERDICT run_paid_attempts=$automatic_paid_attempts cumulative_pass_count=$PASS_COUNT/2 budget_exhausted=$budget_exhausted turns_exhausted=$turns_exhausted permission_denials=$permission_denials"

      - name: Submit deterministic PR review
        id: submit
        if: always() && needs.preflight.outputs.lane == 'ai'
        env:
          GH_TOKEN: ${{ github.token }}
          # On a base-merge-only re-fire (#120) the model never ran; reuse the
          # synthesized approved verdict from the rereview step. Otherwise use
          # the first usable verdict in the receipt-bound DeepSeek cascade.
          VERDICT: ${{ steps.rereview.outputs.skip_model == 'true' && steps.rereview.outputs.skip_verdict || steps.verdict_1.outputs.usable == 'true' && steps.verdict_1.outputs.verdict || steps.verdict_2.outputs.usable == 'true' && steps.verdict_2.outputs.verdict || '' }}
          # Passed via env (not inline ${{ }}) so the block is plain bash and can
          # be extracted and unit-tested (scripts/ci-gate/review-comment.test.sh).
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          MODEL: ${{ steps.verdict_2.outputs.usable == 'true' && needs.preflight.outputs.fallback_model || needs.preflight.outputs.model }}
          # PR net patch-id (#120), embedded in the approval marker so a future
          # base-merge re-fire can detect an unchanged diff and skip the model.
          PATCH_ID: ${{ steps.rereview.outputs.patch_id }}
          # #181: only chooses the no-verdict wording (budget-exceeded vs
          # generic). Never gates whether the merge is blocked — an unset or
          # garbage value degrades to the generic message, still fail-closed.
          BUDGET_EXHAUSTED: ${{ steps.retry_outcome.outputs.budget_exhausted }}
          # A pass that ended in an SDK terminal error did not produce a usable
          # verdict even if the action surfaced schema-valid filler (#441).
          SELECTED_PASS_TERMINAL_ERROR: ${{ steps.retry_outcome.outputs.selected_pass_terminal_error }}
          PRIMARY_EXTRACTION_DIAGNOSTIC: ${{ steps.deepseek_primary.outputs.extraction_diagnostic }}
          FALLBACK_EXTRACTION_DIAGNOSTIC: ${{ steps.deepseek_fallback.outputs.extraction_diagnostic }}
          PERMISSION_DENIALS: ${{ steps.retry_outcome.outputs.permission_denials }}
          PASS_CAP_EXHAUSTED: ${{ steps.rereview.outputs.skip_model != 'true' && (steps.reserve_1.outputs.cap_exhausted == 'true' || steps.reserve_2.outputs.cap_exhausted == 'true' || steps.reserve_2.outputs.count == '2') }}
          REVIEW_PASS_COUNT: ${{ steps.reserve_2.outputs.count || steps.reserve_1.outputs.count || '0' }}
          SUPERSEDED: ${{ steps.reserve_1.outputs.superseded == 'true' || steps.reserve_2.outputs.superseded == 'true' }}
          CHANGED_LINES: ${{ needs.preflight.outputs.changed_lines }}
          BUDGET_USD: ${{ steps.verdict_2.outputs.usable == 'true' && needs.preflight.outputs.fallback_budget_usd || needs.preflight.outputs.budget_usd }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER" --jq '.head.sha // ""')"
          superseded="${SUPERSEDED:-false}"
          [ "$current_head" = "$HEAD_SHA" ] || superseded=true
          if [ "$superseded" = true ] && { [ "${SELECTED_PASS_TERMINAL_ERROR:-}" = "true" ] || [ -z "${VERDICT//[[:space:]]/}" ]; }; then
            gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "⚠️ **AI review advisory: reviewed head superseded**

          Review of exact head \`$HEAD_SHA\` stopped without a usable verdict because the PR advanced to \`$current_head\`. Its reserved attempts do not consume the replacement head's allowance; the replacement run must review that head independently."
            echo "outcome=superseded" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Provider failure cannot mint AI authority, but it also cannot make
          # provider availability a prerequisite for the human approval path.
          # Leave an explained advisory record and return a successful policy
          # evaluation so ordinary branch protection remains authoritative.
          #
          # The blank check is load-bearing and must come FIRST (#181, ADR 0032):
          # when the pass returns no structured output, VERDICT is the
          # EMPTY STRING, and `jq -e` on empty input produces no output and exits
          # 0 — so `! jq -e ...` was false, this guard never fired, and the step
          # fell through to `--approve` and exited 0, green-lighting the merge of
          # a PR that was never reviewed. Only a malformed-but-non-empty verdict
          # (jq exit 4) ever reached the fail-closed branch.
          if [ "${SELECTED_PASS_TERMINAL_ERROR:-}" = "true" ] || [ -z "${VERDICT//[[:space:]]/}" ] || ! jq -e '.blocking | type == "boolean"' <<<"$VERDICT" >/dev/null 2>&1; then
            gh pr edit "$PR_NUMBER" --repo "$TARGET_REPO" --add-label ai-review-inconclusive 2>/dev/null || true
            # A budget-exhausted review is a legible outcome, not an opaque
            # `error_max_budget_usd`: name the cause, the diff size and the cap
            # so the maintainer knows the PR is oversized rather than broken.
            # The flag only chooses the wording; every branch remains advisory.
            heading="⚠️ **AI review advisory: review could not complete**"
            detail="The receipt-bound review cascade produced no usable verdict (budget/turn exhaustion, another terminal model error, or semantically invalid structured output). Human approval remains available. Apply the \`re-review\` label only when a maintainer explicitly authorizes another paid attempt."
            extraction_detail=""
            extraction_kind() {
              jq -er '
                if .stage == "completed_response_extraction"
                   and (.kind | IN("json_decode", "response_shape", "usage_envelope", "tool_call", "verdict_shape"))
                   and (.content_bytes | type == "number")
                   and (.content_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
                then .kind else empty end
              ' <<<"$1" 2>/dev/null || true
            }
            primary_extraction_kind="$(extraction_kind "${PRIMARY_EXTRACTION_DIAGNOSTIC:-}")"
            fallback_extraction_kind="$(extraction_kind "${FALLBACK_EXTRACTION_DIAGNOSTIC:-}")"
            if [ -n "$primary_extraction_kind" ]; then
              extraction_detail="DeepSeek pass 1 completed-response extraction failed with typed cause \`$primary_extraction_kind\`; its bounded, non-content diagnostic artifact is retained. "
            fi
            if [ -n "$fallback_extraction_kind" ]; then
              extraction_detail="${extraction_detail}DeepSeek pass 2 completed-response extraction failed with typed cause \`$fallback_extraction_kind\`; its bounded, non-content diagnostic artifact is retained. "
            fi
            if [ -n "$extraction_detail" ]; then
              heading="⚠️ **AI review advisory: completed-response extraction failed**"
              detail="${extraction_detail}Human approval remains available."
            fi
            if [ "${BUDGET_EXHAUSTED:-}" = "true" ]; then
              heading="⚠️ **AI review advisory: budget exceeded**"
              detail="The selected review pass ended in \`error_max_budget_usd\` without a usable verdict. The diff (~${CHANGED_LINES:-unknown} changed lines) exceeded its selected budget (\$${BUDGET_USD:-unknown}). Human approval remains available."
            fi
            if [[ "${PERMISSION_DENIALS:-0}" =~ ^[1-9][0-9]*$ ]]; then
              heading="⚠️ **AI review advisory: denied tool calls**"
              detail="The review recorded ${PERMISSION_DENIALS} denied tool call(s) and produced no usable verdict. This is tool-boundary non-progress, not evidence that the diff is oversized."
            fi
            if [ "${PASS_CAP_EXHAUSTED:-false}" = "true" ]; then
              heading="🛑 **AI review advisory: two-pass maximum reached**"
              detail="This exact head has consumed ${REVIEW_PASS_COUNT:-2}/2 model passes and has no usable verdict. ${extraction_detail}A third provider invocation for the same head is forbidden; autonomous AI approval and merge remain fail-closed. Human review remains available."
            fi
            gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "$heading

          $detail This advisory result does not block deterministic CI or human approval."
            echo "outcome=inconclusive" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Expose the verdict so this gate job can file follow-up issues for the
          # non-blocking findings once (and only if) the PR actually merges.
          {
            echo "verdict<<VERDICT_EOF"
            printf '%s\n' "$VERDICT"
            echo "VERDICT_EOF"
          } >>"$GITHUB_OUTPUT"
          body=$(jq -r '
            .summary
            + (if ((.review_first // []) | length) > 0
               then "\n\n**👀 Review these first**\n"
                    + (.review_first | map("- `" + .location + "` — " + .why) | join("\n"))
               else "" end)
            + (if ((.findings // []) | length) > 0
               then "\n\n**Findings**\n" + (.findings | map("- `" + .location + "` — " + .reason + " Failure scenario: " + .failure_scenario + " Source evidence: <code>" + (.evidence | @html) + "</code>") | join("\n"))
               else "" end)
            + (if ((.followups // []) | length) > 0
               then "\n\n**Follow-ups** (filed as issues on merge)\n"
                    + (.followups | map("- `" + .location + "` — " + .note) | join("\n"))
               else "" end)
          ' <<<"$VERDICT")
          body="$body

          <!-- ai-review-head:${HEAD_SHA} patchid:${PATCH_ID:-} model:${MODEL} -->
          <!-- ai-review-run:${GITHUB_RUN_ID} -->"
          if [ "$superseded" = true ]; then
            gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "⚠️ **AI review advisory: stale-head verdict retained**

          The following validator-confirmed verdict reviewed superseded head \`$HEAD_SHA\`, while the current head is \`$current_head\`. It is diagnostic evidence only and cannot authorize the current head.

          $body"
            echo "outcome=superseded" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq -r .blocking <<<"$VERDICT")" = true ]; then
            gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "🚫 **AI review advisory: blocking verdict**

            $body"
            echo "outcome=blocking" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "✅ **AI review advisory: non-blocking verdict**

          $body"
          echo "outcome=approved" >> "$GITHUB_OUTPUT"

      - name: Prepare failed DeepSeek pass 1 replay
        id: replay_primary
        if: always() && needs.preflight.outputs.lane == 'ai' && needs.preflight.outputs.provider == 'deepseek' && steps.trusted-authorization.outcome == 'success'
        continue-on-error: true
        env:
          TRANSPORT: ${{ steps.deepseek_primary.outcome }}
          USABLE: ${{ steps.verdict_1.outputs.usable }}
          PUBLICATION: ${{ steps.submit.conclusion }}
          DIAGNOSTIC: ${{ steps.verdict_1.outputs.diagnostic }}
          EXPECTED_MODEL: ${{ needs.preflight.outputs.model }}
          EXPECTED_HEAD: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_SENSITIVE: ${{ needs.preflight.outputs.sensitive }}
          EXPECTED_TRUSTED_REVIEW_SHA: ${{ steps.trusted-revision.outputs.sha }}
        run: |
          diagnostic=${DIAGNOSTIC:-}
          [ -n "$diagnostic" ] || diagnostic='{}'
          python3 "$RUNNER_TEMP/prepare-deepseek-replay.py" \
            --source "$RUNNER_TEMP/deepseek-replay-pass-1.json" \
            --output "$RUNNER_TEMP/deepseek-replay-upload/pass-1.json" \
            --transport "$TRANSPORT" --usable "$USABLE" --publication "$PUBLICATION" \
            --diagnostic "$diagnostic" --expected-head "$EXPECTED_HEAD" \
            --expected-check-id "$AUTHORIZATION_CHECK_ID" \
            --expected-model "$EXPECTED_MODEL" --expected-repository "$TARGET_REPO" \
            --expected-pr "$PR_NUMBER" --expected-pass 1 --expected-sensitive "$EXPECTED_SENSITIVE" \
            --expected-trusted-review-sha "$EXPECTED_TRUSTED_REVIEW_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload failed DeepSeek pass 1 replay
        if: always() && steps.replay_primary.outputs.available == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deepseek-diagnostic-replay-${{ github.run_id }}-${{ github.run_attempt }}-pass-1
          path: ${{ runner.temp }}/deepseek-replay-upload/pass-1.json
          retention-days: 1
          if-no-files-found: error

      - name: Prepare failed DeepSeek pass 2 replay
        id: replay_fallback
        if: always() && needs.preflight.outputs.lane == 'ai' && needs.preflight.outputs.provider == 'deepseek' && steps.trusted-authorization.outcome == 'success'
        continue-on-error: true
        env:
          TRANSPORT: ${{ steps.deepseek_fallback.outcome }}
          USABLE: ${{ steps.verdict_2.outputs.usable }}
          PUBLICATION: ${{ steps.submit.conclusion }}
          DIAGNOSTIC: ${{ steps.verdict_2.outputs.diagnostic }}
          EXPECTED_MODEL: ${{ needs.preflight.outputs.fallback_model }}
          EXPECTED_HEAD: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_SENSITIVE: ${{ needs.preflight.outputs.sensitive }}
          EXPECTED_TRUSTED_REVIEW_SHA: ${{ steps.trusted-revision.outputs.sha }}
        run: |
          diagnostic=${DIAGNOSTIC:-}
          [ -n "$diagnostic" ] || diagnostic='{}'
          python3 "$RUNNER_TEMP/prepare-deepseek-replay.py" \
            --source "$RUNNER_TEMP/deepseek-replay-pass-2.json" \
            --output "$RUNNER_TEMP/deepseek-replay-upload/pass-2.json" \
            --transport "$TRANSPORT" --usable "$USABLE" --publication "$PUBLICATION" \
            --diagnostic "$diagnostic" --expected-head "$EXPECTED_HEAD" \
            --expected-check-id "$AUTHORIZATION_CHECK_ID" \
            --expected-model "$EXPECTED_MODEL" --expected-repository "$TARGET_REPO" \
            --expected-pr "$PR_NUMBER" --expected-pass 2 --expected-sensitive "$EXPECTED_SENSITIVE" \
            --expected-trusted-review-sha "$EXPECTED_TRUSTED_REVIEW_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload failed DeepSeek pass 2 replay
        if: always() && steps.replay_fallback.outputs.available == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deepseek-diagnostic-replay-${{ github.run_id }}-${{ github.run_attempt }}-pass-2
          path: ${{ runner.temp }}/deepseek-replay-upload/pass-2.json
          retention-days: 1
          if-no-files-found: error

      - name: Build trusted post-merge evidence
        env:
          VERDICT: ${{ steps.submit.outputs.verdict }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/merge-attestation"
          rm -rf "$dir"
          mkdir -m 700 "$dir"
          followups='[]'
          if [ -n "${VERDICT:-}" ]; then
            followups="$(jq -c '.followups // []' <<<"$VERDICT")"
          fi
          jq -n --arg repository "$TARGET_REPO" \
            --argjson pr_number "$PR_NUMBER" --arg head_sha "$EXPECTED_HEAD_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson followups "$followups" \
            '{version:1, repository:$repository, pr_number:$pr_number,
              head_sha:$head_sha, run_id:$run_id, followups:$followups}' \
            >"$dir/attestation.json"

      - name: Upload trusted post-merge evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-attestation-${{ github.run_id }}
          path: ${{ runner.temp }}/merge-attestation/attestation.json
          retention-days: 7
          if-no-files-found: error

      # --- CI telemetry (best-effort). Every step is `continue-on-error` so it
      # can NEVER fail or block the gate, and it stays dormant until
      # OTEL_EXPORTER_OTLP_ENDPOINT is set — the composite action no-ops without
      # an endpoint. Emits one CiTelemetryPayload for the review. See ADR 0004
      # and docs/ci-telemetry.md.
      - name: Fetch telemetry helper scripts
        if: always() && needs.preflight.outputs.lane == 'ai'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Verjson/.github
          ref: main
          path: .gate-tools
          sparse-checkout: scripts/ci-telemetry
          sparse-checkout-cone-mode: false

      - name: Build ai-review telemetry payload
        if: always() && needs.preflight.outputs.lane == 'ai'
        continue-on-error: true
        env:
          # Only the semantically validated verdict published by submit is a verdict.
          VERDICT_JSON: ${{ steps.submit.outputs.verdict }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          ACTION_CONCLUSION: ${{ needs.preflight.outputs.provider == 'openai' && steps.openai.conclusion || needs.preflight.outputs.provider == 'deepseek' && steps.verdict_1.outputs.usable == 'true' && steps.deepseek_primary.conclusion || needs.preflight.outputs.provider == 'deepseek' && steps.deepseek_fallback.conclusion || steps.claude.conclusion }}
          LANE: ${{ needs.preflight.outputs.lane }}
          LANE_REASON: ${{ needs.preflight.outputs.reason }}
          MODEL: ${{ steps.verdict_2.outputs.usable == 'true' && needs.preflight.outputs.fallback_model || needs.preflight.outputs.model }}
          BUDGET_USD: ${{ steps.verdict_2.outputs.usable == 'true' && needs.preflight.outputs.fallback_budget_usd || needs.preflight.outputs.budget_usd }}
          PROVIDER: ${{ needs.preflight.outputs.provider }}
          PRICING_VERSION: ${{ needs.preflight.outputs.pricing_version }}
          INPUT_TOKEN_BOUND: ${{ needs.preflight.outputs.provider == 'deepseek' && steps.verdict_2.outputs.usable == 'true' && steps.deepseek_fallback.outputs.input_token_bound || needs.preflight.outputs.provider == 'deepseek' && steps.deepseek_primary.outputs.input_token_bound || steps.openai.outputs.input_token_bound }}
          MAX_OUTPUT_TOKENS: ${{ needs.preflight.outputs.provider == 'deepseek' && steps.verdict_2.outputs.usable == 'true' && steps.deepseek_fallback.outputs.max_output_tokens || needs.preflight.outputs.provider == 'deepseek' && steps.deepseek_primary.outputs.max_output_tokens || steps.openai.outputs.max_output_tokens }}
          REPORTED_INPUT_TOKENS: ${{ needs.preflight.outputs.provider == 'deepseek' && steps.verdict_2.outputs.usable == 'true' && steps.deepseek_fallback.outputs.reported_input_tokens || needs.preflight.outputs.provider == 'deepseek' && steps.deepseek_primary.outputs.reported_input_tokens || steps.openai.outputs.reported_input_tokens }}
          REPORTED_OUTPUT_TOKENS: ${{ needs.preflight.outputs.provider == 'deepseek' && steps.verdict_2.outputs.usable == 'true' && steps.deepseek_fallback.outputs.reported_output_tokens || needs.preflight.outputs.provider == 'deepseek' && steps.deepseek_primary.outputs.reported_output_tokens || steps.openai.outputs.reported_output_tokens }}
          REPORTED_COST_USD: ${{ needs.preflight.outputs.provider == 'deepseek' && steps.verdict_2.outputs.usable == 'true' && steps.deepseek_fallback.outputs.reported_cost_usd || needs.preflight.outputs.provider == 'deepseek' && steps.deepseek_primary.outputs.reported_cost_usd || steps.openai.outputs.reported_cost_usd }}
          PRIMARY_COST_USD: ${{ steps.deepseek_primary.outputs.reported_cost_usd }}
          FALLBACK_COST_USD: ${{ steps.deepseek_fallback.outputs.reported_cost_usd }}
          DEPENDENCY_MAJOR: ${{ needs.preflight.outputs.dependency_major }}
        run: |
          set -uo pipefail    # deliberately no -e: telemetry must never abort
          mkdir -p .telemetry
          exec_summary=$(.gate-tools/scripts/ci-telemetry/parse-claude-execution.sh "${EXECUTION_FILE:-}" 2>/dev/null || echo '{}')
          verdict_blocking=null
          findings_count=null
          if [ -n "${VERDICT_JSON:-}" ] && jq -e . >/dev/null 2>&1 <<<"$VERDICT_JSON"; then
            verdict_blocking=$(jq -c '.blocking // null' <<<"$VERDICT_JSON")
            findings_count=$(jq -c '(.findings // []) | length' <<<"$VERDICT_JSON")
          fi
          jq -n \
            --arg repository "$TARGET_REPO" \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg lane "${LANE:-}" \
            --arg lane_reason "${LANE_REASON:-}" \
            --arg model_selected "${MODEL:-}" \
            --arg provider "${PROVIDER:-}" --arg pricing_version "${PRICING_VERSION:-}" \
            --arg input_token_bound "${INPUT_TOKEN_BOUND:-}" --arg max_output_tokens "${MAX_OUTPUT_TOKENS:-}" \
            --arg reported_input_tokens "${REPORTED_INPUT_TOKENS:-}" --arg reported_output_tokens "${REPORTED_OUTPUT_TOKENS:-}" \
            --arg reported_cost_usd "${REPORTED_COST_USD:-}" \
            --arg primary_cost_usd "${PRIMARY_COST_USD:-}" --arg fallback_cost_usd "${FALLBACK_COST_USD:-}" \
            --arg action_conclusion "${ACTION_CONCLUSION:-}" \
            --argjson budget_usd "${BUDGET_USD:-0}" \
            --argjson dependency_major "${DEPENDENCY_MAJOR:-false}" \
            --argjson verdict_blocking "$verdict_blocking" \
            --argjson findings_count "$findings_count" \
            --argjson exec "$exec_summary" \
            '{
              schema_version: 1,
              verjson_project: "verjson",
              repository: $repository,
              workflow_name: $workflow_name,
              job_name: "ai-review",
              event_name: $event_name,
              lane: $lane,
              review_type: "ai",
              lane_reason: (if $lane_reason == "" then null else $lane_reason end),
              model_selected: (if $model_selected == "" then null else $model_selected end),
              provider: (if $provider == "" then null else $provider end),
              pricing_version: (if $pricing_version == "" then null else $pricing_version end),
              input_token_bound: (if $input_token_bound == "" then null else ($input_token_bound | tonumber) end),
              max_output_tokens: (if $max_output_tokens == "" then null else ($max_output_tokens | tonumber) end),
              reported_input_tokens: (if $reported_input_tokens == "" then null else ($reported_input_tokens | tonumber) end),
              reported_output_tokens: (if $reported_output_tokens == "" then null else ($reported_output_tokens | tonumber) end),
              reported_cost_usd: (if $reported_cost_usd == "" then null else ($reported_cost_usd | tonumber) end),
              cascade_cost_usd: ((if $primary_cost_usd == "" then 0 else ($primary_cost_usd | tonumber) end)
                + (if $fallback_cost_usd == "" then 0 else ($fallback_cost_usd | tonumber) end)),
              budget_usd: $budget_usd,
              dependency_major: $dependency_major,
              verdict_blocking: $verdict_blocking,
              findings_count: $findings_count,
              action_conclusion: (if $action_conclusion == "" then null else $action_conclusion end),
              execution_file_present: ($exec.execution_file_present // false),
              execution_file_parse_ok: ($exec.execution_file_parse_ok // false),
              total_cost_usd: ($exec.total_cost_usd // null),
              total_turns: ($exec.num_turns // null)
            }' > .telemetry/ai-review.json

      # NOTE: OTLP emit temporarily removed. `uses: Verjson/verjson-observability`
      # resolves on the gce runners but NOT on gha-meta-1 (used for this repo's
      # own PRs + workflow_dispatch), and `uses:` resolution at job-setup is not
      # guarded by continue-on-error, so it failed the whole ai-review job on
      # meta. The payload is still built above (dormant). Re-add the emit step
      # once the meta runner can resolve the private action AND the OTLP
      # endpoint is provisioned (see docs/ci-telemetry.md, ADR 0004).


  complete-authorization:
    environment: ${{ inputs.ai_review_environment }}
    needs: [preflight, gate, app-key-policy]
    if: ${{ always() && inputs.authorization_check_id != '' && (github.event_name != 'workflow_dispatch' || inputs.ai_review_environment == 'ai-review-app') }}
    outputs:
      ai_authorized: ${{ steps.complete.outputs.ai_authorized }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_FASTLANE || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: read
    env:
      AUTHORIZATION_CHECK_ID: ${{ inputs.authorization_check_id }}
      ARM_RUN_ID: ${{ inputs.arm_run_id }}
      ARM_RUN_ATTEMPT: ${{ inputs.arm_run_attempt }}
      EXPECTED_APP_ID: ${{ vars.AI_REVIEW_APP_ID }}
      APP_CLIENT_ID: ${{ vars.AI_REVIEW_CLIENT_ID }}
      EXPECTED_APP_SLUG: ${{ vars.AI_REVIEW_APP_SLUG }}
      # Completion retains the immutable dispatch identity even if preflight
      # failed or was skipped before producing any outputs.
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXPECTED_AUTHORIZED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXPECTED_REVIEWED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      PREFLIGHT_STATUS: ${{ needs.preflight.result }}
      PREFLIGHT_LANE: ${{ needs.preflight.outputs.lane }}
      GATE_STATUS: ${{ needs.gate.result }}
      REVIEW_AUTHORITY: ${{ needs.preflight.outputs.authority }}
      REVIEW_OUTCOME: ${{ needs.gate.outputs.review_outcome || 'skipped' }}
      PR_NUMBER: ${{ inputs.pr_number }}
      TARGET_REPO: ${{ github.repository }}
      REVIEW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Validate authorization App client ID
        run: |
          [[ "$APP_CLIENT_ID" =~ ^Iv[A-Za-z0-9.]{8,126}$ ]] || {
            echo "::error::AI_REVIEW_CLIENT_ID is unavailable or malformed"; exit 1;
          }

      - name: Resolve executing trusted workflow revision
        id: trusted-revision
        env:
          TRUSTED_REVIEW_SHA: ${{ needs.preflight.outputs.trusted_review_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TRUSTED_REVIEW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::validated canonical workflow revision is unavailable or malformed"
            exit 1
          fi
          echo "sha=$TRUSTED_REVIEW_SHA" >>"$GITHUB_OUTPUT"

      - name: Check out immutable arm verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ steps.trusted-revision.outputs.sha }}
          path: .gate-trust
          sparse-checkout: |
            scripts/ci-gate/verify-arm-receipt.sh
            scripts/ci-gate/review-policy-envelope.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Mint dedicated authorization App token
        id: app-token
        if: ${{ needs.app-key-policy.result == 'success' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.AI_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Complete exact head authorization
        id: complete
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          MINTED_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          REVERIFY_ACTOR_PERMISSION: 'false'
        run: |
          set -euo pipefail
          [[ "$AUTHORIZATION_CHECK_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          check_file="$RUNNER_TEMP/authorization-check-before-completion.json"
          GH_TOKEN="$ACTIONS_TOKEN" gh api \
            "repos/$TARGET_REPO/check-runs/$AUTHORIZATION_CHECK_ID" >"$check_file"
          external_prefix="ai-review:v1:$TARGET_REPO:$PR_NUMBER:$EXPECTED_HEAD_SHA:"
          # Actions-owned checks store their own page as details_url (#1648).
          expected_details_url="$GITHUB_SERVER_URL/$TARGET_REPO/runs/$AUTHORIZATION_CHECK_ID"
          jq -e --arg head "$EXPECTED_HEAD_SHA" --arg prefix "$external_prefix" \
            --arg details_url "$expected_details_url" --argjson id "$AUTHORIZATION_CHECK_ID" \
            '.id == $id and .name == "AI review authorization" and .head_sha == $head and
             .app.id == 15368 and .app.slug == "github-actions" and
             .status == "in_progress" and .conclusion == null and
             (.external_id | startswith($prefix)) and .details_url == $details_url' \
            "$check_file" >/dev/null || {
              echo "::error::authorization check is not an in-progress receipt-bound check for this exact head"; exit 1;
            }
          [ "$MINTED_APP_SLUG" = "$EXPECTED_APP_SLUG" ] || {
            echo "::error::minted App slug does not match the authorization App"
            exit 1
          }
          [[ "$INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::authorization App installation identity is unavailable"
            exit 1
          }
          app_api() {
            local phase="$1"
            local output="$2"
            shift 2
            local diagnostics="$RUNNER_TEMP/${phase}.stderr"
            if ! GH_DEBUG=api GH_TOKEN="$APP_TOKEN" gh api "$@" >"$output" 2>"$diagnostics"; then
              echo "::error title=${phase} failed::Dedicated App mutation failed; installation=${INSTALLATION_ID} app=${MINTED_APP_SLUG}" >&2
              sed -E 's/(authorization: (token|bearer) )[A-Za-z0-9._-]+/\1***/Ig' "$diagnostics" >&2
              return 1
            fi
          }
          receipt_ok=true
          # A failed/skipped preflight has not crossed the provider boundary.
          # Retain its single-use receipt for the guarded same-run recovery.
          # Successful non-merging gates consume here; ai-merge consumes only
          # after the terminal merge continuation succeeds.
          if [ "$GATE_STATUS" = success ] && [ "${REVIEW_AUTHORITY:-}" != ai-merge ]; then
            export ARM_RECEIPT_ARTIFACT_ID_FILE="$RUNNER_TEMP/arm-receipt-artifact-id"
          fi
          GH_TOKEN="$ACTIONS_TOKEN" bash .gate-trust/scripts/ci-gate/verify-arm-receipt.sh || receipt_ok=false
          conclusion=failure
          title='Merge policy evaluation failed'
          summary='The trusted workflow did not complete for this exact head.'
          ai_authorized=false
          current_head=""
          if [ "$receipt_ok" = true ]; then
            current_head="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER" --jq '.head.sha // ""')" || {
              echo "::error::workflow token REST head lookup failed"
              receipt_ok=false
            }
          else
            echo "::error::arm receipt verification failed for this exact head"
            title='Arm receipt verification failed'
            summary='The arm receipt could not be verified for this exact head; no approval was requested.'
          fi
          if [ "$receipt_ok" = true ] && [ "$GATE_STATUS" != success ]; then
            case "$PREFLIGHT_STATUS:${PREFLIGHT_LANE:-none}:$GATE_STATUS" in
              failure:*:skipped)
                title='AI review preflight failed before provider execution'
                summary="Preflight failed for exact head $EXPECTED_AUTHORIZED_HEAD_SHA and the review gate was skipped. No provider reservation, submission, or review occurred; the immutable receipt remains available only for receipt-bound zero-provider recovery."
                ;;
              skipped:*:skipped|success:held:skipped)
                title='AI review preflight held before provider execution'
                summary="Preflight was held or skipped for exact head $EXPECTED_AUTHORIZED_HEAD_SHA and the review gate was skipped. No provider reservation, submission, or review occurred; the immutable receipt remains available only for receipt-bound zero-provider recovery."
                ;;
              *:*:failure|*:*:cancelled)
                title='AI review gate did not complete after reaching the provider boundary'
                summary="The review gate failed or was cancelled for exact head $EXPECTED_AUTHORIZED_HEAD_SHA after reaching or ambiguously approaching the provider boundary. No authorization was granted, and the retained receipt is ineligible for zero-provider recovery."
                ;;
              *)
                title='AI review stopped before authorization'
                summary="Preflight status ${PREFLIGHT_STATUS:-unknown}, lane ${PREFLIGHT_LANE:-none}, gate status ${GATE_STATUS:-unknown}. No authorization was granted for exact head $EXPECTED_AUTHORIZED_HEAD_SHA."
                ;;
            esac
          fi
          if [ "$receipt_ok" = true ] && [ "$GATE_STATUS" = success ] &&
             [ "$current_head" = "$EXPECTED_AUTHORIZED_HEAD_SHA" ] &&
             [ "$EXPECTED_REVIEWED_HEAD_SHA" = "$EXPECTED_AUTHORIZED_HEAD_SHA" ]; then
            conclusion=neutral
            case "$REVIEW_OUTCOME" in
              blocking)
                title='AI advisory blocking; human path ready'
                summary='AI reported blocking findings. The verdict is advisory under ADR 0090; GitHub branch protection remains authoritative and an authorized human may still approve.'
                ;;
              inconclusive)
                title='AI review inconclusive; human path ready'
                summary='AI did not produce a reusable verdict. The result is advisory under ADR 0090; an authorized human may still approve after reviewing the available evidence.'
                ;;
              approved)
                title='AI advisory non-blocking; human path ready'
                summary='AI returned a non-blocking verdict, but no App approval has been persisted. GitHub branch protection remains authoritative for human approval.'
                ;;
              skipped)
                title='AI review skipped; human path ready'
                summary='AI review was not required or requested. Deterministic policy completed and GitHub branch protection remains authoritative for human approval.'
                ;;
              superseded)
                title='AI review superseded; human path ready'
                summary='The reviewed head was superseded before publication. This result grants no AI authority; GitHub branch protection remains authoritative for the current head.'
                ;;
              *)
                title='AI review unavailable; human path ready'
                summary='AI did not authorize this exact head. Deterministic policy completed and GitHub branch protection remains authoritative for human approval.'
                ;;
            esac
            if [ "$REVIEW_OUTCOME" = approved ] && { [ "$REVIEW_AUTHORITY" = ai-approve ] || [ "$REVIEW_AUTHORITY" = ai-merge ]; }; then
              approval_body="AI review authorization approved this exact reviewed head.

          <!-- ai-review-authorization:${AUTHORIZATION_CHECK_ID} -->
          <!-- ai-review-head:${EXPECTED_AUTHORIZED_HEAD_SHA} -->
          <!-- ai-review-run:${REVIEW_RUN_ID:-0} -->"
              approval_file="$RUNNER_TEMP/app-approval.json"
              persisted_file="$RUNNER_TEMP/persisted-approval.json"
              if app_api app-approval "$approval_file" --method POST "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews" \
                -f event=APPROVE -f commit_id="$EXPECTED_AUTHORIZED_HEAD_SHA" \
                -f body="$approval_body" &&
                 approval_id="$(jq -er \
                   --arg head "$EXPECTED_AUTHORIZED_HEAD_SHA" \
                   --arg login "${EXPECTED_APP_SLUG}[bot]" \
                   --arg check "$AUTHORIZATION_CHECK_ID" '
                     select(.state == "APPROVED" and .commit_id == $head and
                       .user.login == $login and
                       (.body | contains("ai-review-authorization:" + $check)))
                     | .id | select(type == "number")
                   ' "$approval_file")" &&
                 app_api persisted-approval "$persisted_file" "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews/$approval_id" &&
                 jq -e --arg head "$EXPECTED_AUTHORIZED_HEAD_SHA" \
                   --arg login "${EXPECTED_APP_SLUG}[bot]" \
                   --arg check "$AUTHORIZATION_CHECK_ID" '
                     .id == ($id | tonumber) and .state == "APPROVED" and
                     .commit_id == $head and .user.login == $login and
                     (.body | contains("ai-review-authorization:" + $check))
                   ' --arg id "$approval_id" "$persisted_file" >/dev/null; then
                ai_authorized=true
                conclusion=success
                title='AI approval persisted for exact head'
                summary="The required AI review approved this exact head. Ordinary required CI and branch protection remain authoritative.

          <!-- ai-review-authorized:v1:${AUTHORIZATION_CHECK_ID}:${EXPECTED_AUTHORIZED_HEAD_SHA}:${REVIEW_AUTHORITY} -->"
              else
                title='AI approval unavailable; human path ready'
                summary='No exact-head App approval was persisted and verified. Deterministic policy is green and a human approval may still authorize merge.'
              fi
            fi
          fi
          GH_TOKEN="$ACTIONS_TOKEN" gh api --method PATCH "repos/$TARGET_REPO/check-runs/$AUTHORIZATION_CHECK_ID" \
            -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=$title" -f "output[summary]=$summary"
          echo "ai_authorized=$ai_authorized" >> "$GITHUB_OUTPUT"

          # ARM_RECEIPT_ARTIFACT_ID_FILE is populated only when a successful
          # non-ai-merge gate made this job the receipt's terminal consumer.
          # Pre-provider failures deliberately leave it absent for guarded
          # recovery, while ai-merge consumes after terminal merge. Deletion
          # remains best-effort storage cleanup after that terminal boundary.
          if [ -s "$RUNNER_TEMP/arm-receipt-artifact-id" ]; then
            receipt_artifact_id="$(<"$RUNNER_TEMP/arm-receipt-artifact-id")"
            if [[ "$receipt_artifact_id" =~ ^[1-9][0-9]*$ ]]; then
              if GH_TOKEN="$ACTIONS_TOKEN" gh api --method DELETE "repos/$TARGET_REPO/actions/artifacts/$receipt_artifact_id" \
                  >/dev/null 2>"$RUNNER_TEMP/arm-artifact-delete.stderr"; then
                echo "Consumed arm receipt artifact $receipt_artifact_id."
              else
                echo "::warning::failed to delete consumed arm receipt artifact $receipt_artifact_id (non-fatal; its own retention window still bounds it)"
                sed -E 's/(authorization: (token|bearer) )[A-Za-z0-9._-]+/\1***/Ig' "$RUNNER_TEMP/arm-artifact-delete.stderr" >&2
              fi
            fi
          fi

          [ "$conclusion" != failure ] || exit 1

      - name: Fail authorization if completion did not run
        if: ${{ always() && inputs.authorization_check_id != '' && steps.complete.outcome != 'success' }}
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          AUTHORIZATION_CHECK_ID: ${{ inputs.authorization_check_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          ARM_RUN_ID: ${{ inputs.arm_run_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_REPO: ${{ github.repository }}
          APP_KEY_POLICY_RESULT: ${{ needs.app-key-policy.result }}
          AI_REVIEW_ENVIRONMENT: ${{ inputs.ai_review_environment }}
        run: |
          set -euo pipefail
          [[ "$AUTHORIZATION_CHECK_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          check_file="$RUNNER_TEMP/authorization-check-finalizer.json"
          GH_TOKEN="$ACTIONS_TOKEN" gh api \
            "repos/$TARGET_REPO/check-runs/$AUTHORIZATION_CHECK_ID" >"$check_file"
          # Actions-owned checks store their own page as details_url (#1648).
          expected_details_url="$GITHUB_SERVER_URL/$TARGET_REPO/runs/$AUTHORIZATION_CHECK_ID"
          jq -e --arg repo "$TARGET_REPO" --arg pr "$PR_NUMBER" --arg head "$EXPECTED_HEAD_SHA" \
            --arg run "$ARM_RUN_ID" --arg attempt "$ARM_RUN_ATTEMPT" \
            --arg details_url "$expected_details_url" --argjson id "$AUTHORIZATION_CHECK_ID" '
            (.external_id | split(":")) as $parts |
            .id == $id and .name == "AI review authorization" and .head_sha == $head and
            .app.id == 15368 and .app.slug == "github-actions" and
            .details_url == $details_url and ($parts | length) == 8 and
            $parts[0] == "ai-review" and $parts[1] == "v1" and
            $parts[2] == $repo and $parts[3] == $pr and
            $parts[4] == $head and
            $parts[5] == $run and $parts[6] == $attempt and
            ($parts[7] | test("^[0-9a-f]{64}$"))
          ' "$check_file" >/dev/null || {
            echo "::error::refusing to modify a check outside this exact arm run"; exit 1;
          }
          if [ "$(jq -r '.status' "$check_file")" = completed ]; then
            exit 0
          fi
          if [ "$APP_KEY_POLICY_RESULT" = success ]; then
            summary='Authorization completion failed before the check could be finalized.'
          else
            summary="$(jq -nr --arg environment "$AI_REVIEW_ENVIRONMENT" '"AI_REVIEW_APP_PRIVATE_KEY validation or review environment admission failed for \($environment); no App token was minted."')"
          fi
          GH_TOKEN="$ACTIONS_TOKEN" gh api --method PATCH \
            "repos/$TARGET_REPO/check-runs/$AUTHORIZATION_CHECK_ID" \
            -f status=completed -f conclusion=failure \
            -f 'output[title]=AI review authorization failed before completion' \
            -f "output[summary]=$summary"

  dispatch-merge:
    needs: [preflight, gate, complete-authorization]
    if: needs.complete-authorization.result == 'success' && needs.complete-authorization.outputs.ai_authorized == 'true' && needs.preflight.outputs.authority == 'ai-merge'
    runs-on: ${{ inputs.runner_labels && fromJSON(inputs.runner_labels) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || needs.preflight.outputs.target_private == 'false' && fromJSON(vars.CI_RUNNER_FASTLANE || '["ubuntu-24.04"]') || fromJSON(vars.CI_LANE_PRIVILEGED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      AUTHORIZATION_CHECK_ID: ${{ inputs.authorization_check_id }}
      ARM_RUN_ID: ${{ inputs.arm_run_id }}
      ARM_RUN_ATTEMPT: ${{ inputs.arm_run_attempt }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      REVIEW_POLICY: ${{ inputs.review_policy }}
      PR_NUMBER: ${{ inputs.pr_number }}
      TARGET_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch trusted terminal promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$AUTHORIZATION_CHECK_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          default_branch="$(gh api "repos/$TARGET_REPO" --jq '.default_branch // ""')"
          [[ "$default_branch" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          gh workflow run ai-privileged-merge.yml --repo "$TARGET_REPO" --ref "$default_branch" \
            -f pr_number="$PR_NUMBER" \
            -f expected_head_sha="$EXPECTED_HEAD_SHA" \
            -f authorization_check_id="$AUTHORIZATION_CHECK_ID" \
            -f arm_run_id="$ARM_RUN_ID" \
            -f arm_run_attempt="$ARM_RUN_ATTEMPT" \
            -f review_policy="$REVIEW_POLICY" \
            -f source_run_id="$GITHUB_RUN_ID"
