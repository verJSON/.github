name: release proposal

on:
  workflow_call:
    inputs:
      contract_ref:
        description: Immutable Verjson/.github commit containing this workflow and engine
        required: true
        type: string
      fragments:
        description: Newline-separated NEXT fragment filenames; empty selects the component stream
        required: false
        type: string
        default: ''
      component:
        description: Optional component stream; empty selects only unscoped fragments
        required: false
        type: string
        default: ''
      prefix:
        description: Release tag prefix used by next-version
        required: false
        type: string
        default: v
      runner:
        description: Optional JSON runner labels; Verjson defaults by visibility, external callers use ubuntu-24.04.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || github.event_name == 'merge_group' || github.event_name == 'pull_request_target') && github.event.repository.private != true && format('public-rejected-{0}-{1}-{2}', github.repository, github.run_id, github.run_attempt) || format('release-propose-{0}', github.repository) }}
  cancel-in-progress: false

jobs:
  reject-public-pull-request-caller:
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || github.event_name == 'merge_group' || github.event_name == 'pull_request_target') && github.event.repository.private != true }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Reject public pull request callers
        run: |
          echo "::error::This reusable workflow does not accept public pull request callers"
          exit 1
  release-propose:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && github.event_name != 'pull_request_review_comment' && github.event_name != 'merge_group' && github.event_name != 'pull_request_target' || github.event.repository.private == true) }}
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.CI_RUNNER_OVERFLOW || vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.CI_RUNNER_OVERFLOW || vars.CI_LANE_UNTRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Admit release proposal on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
          CONTRACT_REF: ${{ inputs.contract_ref }}
        run: |
          if [[ ! "$CONTRACT_REF" =~ ^[0123456789abcdef]{40}$ ]]; then
            echo "::error::contract_ref must be an immutable 40-character commit"
            exit 1
          fi
          if [ "$DISPATCH_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::release proposals run only from $DEFAULT_BRANCH, not '$DISPATCH_REF'"
            exit 1
          fi
      - name: Check out the proposed release tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # actions/checkout follows a symlink at its path and empties the target;
      # refuse one before it reaches runner state (ADR 0236).
      - name: Refuse a symlink at the .changelog-contract checkout path
        run: |
          if [ -L .changelog-contract ]; then echo "::error::.changelog-contract is a symlink; actions/checkout would empty its target"; exit 1; fi
      - name: Check out the canonical contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ inputs.contract_ref }}
          path: .changelog-contract
          persist-credentials: false
      - name: Derive the exact version and released preview
        id: release
        env:
          COMPONENT: ${{ inputs.component }}
          FRAGMENTS: ${{ inputs.fragments }}
          PREFIX: ${{ inputs.prefix }}
        run: |
          selection_args=(selection-digest --repo-root "$GITHUB_WORKSPACE" --prefix "$PREFIX")
          version_args=(next-version --repo-root "$GITHUB_WORKSPACE" --prefix "$PREFIX")
          preview_args=(render-next --repo-root "$GITHUB_WORKSPACE" --as-released)
          if [ -n "$COMPONENT" ]; then
            selection_args+=(--component "$COMPONENT")
            version_args+=(--component "$COMPONENT")
            preview_args+=(--component "$COMPONENT")
          fi
          while IFS= read -r fragment; do
            [ -z "$fragment" ] || {
              selection_args+=(--fragment "$fragment")
              version_args+=(--fragment "$fragment")
              preview_args+=(--fragment "$fragment")
            }
          done <<<"$FRAGMENTS"
          exec 3>>"$GITHUB_OUTPUT"
          selector_digest="$(python3 -I .changelog-contract/scripts/changelog.py "${selection_args[@]}")"
          if [ -z "$selector_digest" ]; then
            echo "selected=false" >&3
            echo "No unreleased fragments are selected; there is no release to propose."
            exit 0
          fi
          version="$(python3 -I .changelog-contract/scripts/changelog.py "${version_args[@]}")"
          python3 -I .changelog-contract/scripts/changelog.py "${preview_args[@]}" \
            >"$RUNNER_TEMP/release-preview.md"
          echo "selected=true" >&3
          printf 'selector-digest=%s\n' "$selector_digest" >&3
          printf 'version=%s\n' "$version" >&3
      - name: Update the release proposal
        if: steps.release.outputs.selected == 'true'
        env:
          COMPONENT: ${{ inputs.component }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FRAGMENTS: ${{ inputs.fragments }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PREFIX: ${{ inputs.prefix }}
          SELECTOR_DIGEST: ${{ steps.release.outputs.selector-digest }}
        run: |
          python3 -I .changelog-contract/scripts/release-propose.py \
            --mode propose \
            --repository "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --branch "$DEFAULT_BRANCH" \
            --head-sha "$GITHUB_SHA" \
            --version "$VERSION" \
            --prefix "$PREFIX" \
            --selector-digest "$SELECTOR_DIGEST" \
            --fragments "$FRAGMENTS" \
            --component "$COMPONENT" \
            --preview-file "$RUNNER_TEMP/release-preview.md"
