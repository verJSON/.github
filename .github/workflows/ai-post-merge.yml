name: AI post-merge follow-ups
on:
  pull_request_target:
    types: [closed]
permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: read
concurrency:
  group: ai-post-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.event.pull_request.merged == true
    runs-on: ${{ fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: .ai-post-merge-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    timeout-minutes: 5
    env:
      TARGET_REPO: ${{ github.repository }}
      AI_REVIEW_DISPATCH_WORKFLOW: ${{ github.repository == 'Verjson/.github' && 'ai-review-merge-dispatch.yml' || 'ai-review-merge.yml' }}
      AI_REVIEW_LEGACY_DISPATCH_WORKFLOW: ${{ github.repository == 'Verjson/.github' && 'ai-review-merge.yml' || '' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_APP_ID: ${{ vars.AI_REVIEW_APP_ID }}
      EXPECTED_APP_SLUG: ${{ vars.AI_REVIEW_APP_SLUG }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted reconciler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # github.sha is the base branch commit this workflow file was read
          # from, so the reconciler's bytes are the ones the ADR 0235 review
          # digest binds. pull_request.base.sha is the base as of the PR's
          # last update and can be older than that reviewed tree.
          ref: ${{ github.sha }}
          path: .ai-post-merge-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          sparse-checkout: scripts/ci-gate/post-merge-reconcile.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate exact-head review evidence
        id: evidence
        run: |
          set -euo pipefail
          [[ "$MERGED_HEAD_SHA" =~ ^[0123456789abcdef]{40}$ ]]
          [[ "$EXPECTED_APP_ID" =~ ^[123456789][0123456789]{0,14}$ ]]
          [[ "$EXPECTED_APP_SLUG" =~ ^[ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-]+$ ]]
          authorization="$(gh api "repos/$TARGET_REPO/commits/$MERGED_HEAD_SHA/check-runs" \
            --jq "[.check_runs[] | select(.name == \"AI review authorization\" and .head_sha == \"$MERGED_HEAD_SHA\" and .app.id == 15368 and .app.slug == \"github-actions\")] | sort_by(.id) | last // {}")"
          check_id="$(jq -r '.id // ""' <<<"$authorization")"
          if [ -z "$check_id" ] && jq -e 'type == "object" and length == 0' <<<"$authorization" >/dev/null; then
            echo 'eligible=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$check_id" =~ ^[123456789][0123456789]*$ ]]
          authorization_markers="$(jq -r '
            (.output.summary // "") | strings | split("\n")[]
            | select(startswith("<!-- ai-review-authorized:v1:"))
          ' <<<"$authorization")"
          if [ -z "$authorization_markers" ]; then
            echo 'eligible=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e --arg head "$MERGED_HEAD_SHA" '
            .name == "AI review authorization" and .head_sha == $head
            and .status == "completed" and .conclusion == "success"
            and .app.id == 15368 and .app.slug == "github-actions"
          ' <<<"$authorization" >/dev/null
          ai_approve_marker="<!-- ai-review-authorized:v1:${check_id}:${MERGED_HEAD_SHA}:ai-approve -->"
          ai_merge_marker="<!-- ai-review-authorized:v1:${check_id}:${MERGED_HEAD_SHA}:ai-merge -->"
          legacy_marker="<!-- ai-review-authorized:v1:${check_id}:${MERGED_HEAD_SHA} -->"
          legacy_authorization=false
          if [ "$authorization_markers" = "$ai_approve_marker" ]; then
            echo 'eligible=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$authorization_markers" = "$legacy_marker" ]; then
            legacy_authorization=true
          elif [ "$authorization_markers" != "$ai_merge_marker" ]; then
            echo '::error::AI authorization marker is malformed, stale, or forged'
            exit 1
          fi
          reviews="$(gh api --paginate "repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews?per_page=100" | jq -s '.')"
          evidence="$(jq -cer --arg head "$MERGED_HEAD_SHA" --arg login "${EXPECTED_APP_SLUG}[bot]" '
            [ .[][] | select(.state == "APPROVED" and .commit_id == $head and .user.login == $login)
              | .body as $body
              | {check_id: ($body | capture("ai-review-authorization:(?<v>[1-9][0-9]*)").v | tonumber),
                 run_id: ($body | capture("ai-review-run:(?<v>[1-9][0-9]*)").v | tonumber)} ]
            | if length == 1 then .[0] else error("expected one exact-head approval") end' <<<"$reviews")"
          approval_check_id="$(jq -r .check_id <<<"$evidence")"
          [ "$approval_check_id" = "$check_id" ] || {
            echo '::error::exact-head approval is bound to another authorization check'
            exit 1
          }
          run_id="$(jq -r .run_id <<<"$evidence")"
          run="$(gh api "repos/$TARGET_REPO/actions/runs/$run_id")"
          jq -e --arg repo "$TARGET_REPO" --arg default_branch "$DEFAULT_BRANCH" \
          --arg workflow_path ".github/workflows/$AI_REVIEW_DISPATCH_WORKFLOW" \
          --arg legacy_workflow_path "$AI_REVIEW_LEGACY_DISPATCH_WORKFLOW" '
            (.repository.full_name | ascii_downcase) == ($repo | ascii_downcase) and .head_branch == $default_branch and .event == "workflow_dispatch"
            and .status == "completed" and .conclusion == "success"
          and (.path == $workflow_path or ($legacy_workflow_path != "" and .path == ".github/workflows/" + $legacy_workflow_path))' <<<"$run" >/dev/null
          if [ "$legacy_authorization" = true ]; then
            dispatch_merge="$(gh api "repos/$TARGET_REPO/actions/runs/$run_id/jobs?per_page=100" | jq -cer '
              [.jobs[] | select(.name == "dispatch-merge")]
              | if length == 1 then .[0] else error("expected one dispatch-merge job") end
            ')"
            dispatch_status="$(jq -r '.status // ""' <<<"$dispatch_merge")"
            dispatch_conclusion="$(jq -r '.conclusion // ""' <<<"$dispatch_merge")"
            if [ "$dispatch_status" = completed ] && [ "$dispatch_conclusion" = skipped ]; then
              echo 'eligible=false' >>"$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$dispatch_status" = completed ] && [ "$dispatch_conclusion" = success ] || {
              echo '::error::legacy AI authorization lacks a successful ai-merge dispatch'
              exit 1
            }
          fi
          artifacts="$(gh api "repos/$TARGET_REPO/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_url="$(jq -er --arg name "merge-attestation-$run_id" '
            [.artifacts[] | select(.name == $name and .expired == false)]
            | if length == 1 then .[0].archive_download_url else error("ambiguous evidence") end' <<<"$artifacts")"
          evidence_dir="$RUNNER_TEMP/post-merge-evidence"
          mkdir -m 700 "$evidence_dir"
          gh api "$artifact_url" >"$evidence_dir/evidence.zip"
          unzip -p "$evidence_dir/evidence.zip" attestation.json >"$evidence_dir/attestation.json"
          jq -e --arg repo "$TARGET_REPO" --arg head "$MERGED_HEAD_SHA" \
            --argjson pr "$PR_NUMBER" --argjson run "$run_id" '
            type == "object" and keys == ["followups","head_sha","pr_number","repository","run_id","version"]
            and .version == 1 and .repository == $repo and .pr_number == $pr
            and .head_sha == $head and .run_id == $run
            and (.followups | type == "array" and length <= 50)
            and all(.followups[]; type == "object" and keys == ["location","note"]
              and (.location | type == "string" and test("^.+:[1-9][0-9]*$"))
              and (.note | type == "string" and test("\\S") and length <= 2000))' \
            "$evidence_dir/attestation.json" >/dev/null
          echo "path=$evidence_dir/attestation.json" >>"$GITHUB_OUTPUT"
          echo 'eligible=true' >>"$GITHUB_OUTPUT"
      - name: File follow-ups and clean merged branch
        if: steps.evidence.outputs.eligible == 'true'
        env:
          ATTESTATION_FILE: ${{ steps.evidence.outputs.path }}
        run: bash scripts/ci-gate/post-merge-reconcile.sh
      - name: Remove the isolated post-merge checkout
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf ".ai-post-merge-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
