name: actions-ci

# Runs the shell tests for the composite actions in this repo. Keeps the
# persistent-runner credential logic (verjson-cli-cloud#59) regression-covered
# and makes the "Evidence" for those actions reproducible in CI rather than
# narrated.

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      # doc-tag-pins.test.sh checks every tracked file, so this covers every
      # workflow surface that can carry a pin example (#287).
      - '.github/workflows/**'
      - 'Makefile'
      - 'renovate.json'
      - 'scripts/**'
      # shellcheck-tracked.sh scans every tracked shell script, including
      # scripts outside the conventional scripts/ and action directories.
      - '**/*.sh'
      - 'docs/**'
      - 'NEXT/**'
      # Repository-wide scanners read every tracked Markdown file. Omitting a
      # scanned surface would defer its failure to an unrelated PR (#305).
      - '**/*.md'
      # Redundant while every released entry is Markdown, but deliberately
      # covers future non-Markdown files read by doc-tag-pins.
      - 'CHANGELOG/**'
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      # Keep push coverage identical to pull_request coverage; trigger-scope
      # verifies both sets and every repository-wide scanner input.
      - '.github/workflows/**'
      - 'Makefile'
      - 'renovate.json'
      - 'scripts/**'
      - '**/*.sh'
      - 'docs/**'
      - 'NEXT/**'
      - '**/*.md'
      - 'CHANGELOG/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  change-scope:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_FASTLANE || vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          path: .actions-ci-source-${{ github.run_id }}-${{ github.run_attempt }}-change-scope
      - name: Classify changed paths
        id: scope
        working-directory: .actions-ci-source-${{ github.run_id }}-${{ github.run_attempt }}-change-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/.actions-ci-source-${{ github.run_id }}-${{ github.run_attempt }}-change-scope"
          files="$(mktemp)"
          # The checkout holds the job token. Remove it on every exit, including
          # the fail-closed paths, so a persistent runner does not keep it (#675).
          trap 'rm -rf "$source_root" "$files"' EXIT
          if [ "$EVENT_NAME" != pull_request ] && [ "$EVENT_NAME" != push ]; then
            echo "heavy=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "heavy=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" >"$files"
          bash scripts/actions-ci-change-scope.sh <"$files" >>"$GITHUB_OUTPUT"

  shell-test-groups:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    # Thirty minutes still bounds one cell, including runner variance and cleanup.
    # changelog-release is four cells so the caller-contract shards overlap
    # platform and merge-gate; max-parallel matches that width (ADR 0224).
    runs-on: ${{ fromJSON(vars.CI_RUNNER_FASTLANE || vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group:
          [
            platform,
            merge-gate,
            changelog-release-1,
            changelog-release-2,
            changelog-release-3,
            changelog-release-4,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Bounded history is enough because pin tests fetch required commits
          # explicitly; tags remain necessary for documented-tag validation.
          fetch-depth: 1
          fetch-tags: true
          # Co-located persistent runners can share GITHUB_WORKSPACE. Give
          # every matrix job its own checkout so another checkout's cleanup
          # cannot remove files while this job snapshots its source (#675).
          path: .actions-ci-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
      - name: Provision actions CI Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install actions CI Python dependencies
        working-directory: .actions-ci-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            --quiet \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement scripts/actions-ci-python.requirements.txt
      - name: Clear the runner changelog cache override
        run: echo "VERJSON_CHANGELOG_TOOL_CACHE=" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.group }} shell contracts without hiding sibling failures
        env:
          RUNNER_LABELS: ''
        run: |
          source_root="$GITHUB_WORKSPACE/.actions-ci-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}"
          group_root="$(mktemp -d "$RUNNER_TEMP/actions-ci-${{ matrix.group }}.XXXXXX")"
          trap 'rm -rf "$source_root" "$group_root"' EXIT
          cp -a "$source_root/." "$group_root/"
          rm -rf "$source_root"
          cd "$group_root"
          bash scripts/actions-ci-group.sh "${{ matrix.group }}"

  docs-contracts:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_FASTLANE || vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          fetch-tags: true
          path: .actions-ci-source-${{ github.run_id }}-${{ github.run_attempt }}-docs
      - name: Provision actions CI Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install actions CI Python dependencies
        working-directory: .actions-ci-source-${{ github.run_id }}-${{ github.run_attempt }}-docs
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            --quiet \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement scripts/actions-ci-python.requirements.txt
      - name: Clear the runner changelog cache override
        run: echo "VERJSON_CHANGELOG_TOOL_CACHE=" >> "$GITHUB_ENV"
      - name: Run documentation shell contracts
        env:
          RUNNER_LABELS: ''
        run: |
          source_root="$GITHUB_WORKSPACE/.actions-ci-source-${{ github.run_id }}-${{ github.run_attempt }}-docs"
          group_root="$(mktemp -d "$RUNNER_TEMP/actions-ci-docs.XXXXXX")"
          trap 'rm -rf "$source_root" "$group_root"' EXIT
          cp -a "$source_root/." "$group_root/"
          rm -rf "$source_root"
          cd "$group_root"
          bash scripts/actions-ci-group.sh docs

  hosted-compatibility-tests:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    # The compatibility consumer is intentionally isolated with bubblewrap.
    # Persistent fleet images are not required to carry that host dependency;
    # keep this security contract on the explicit hosted Ubuntu image instead.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Provision actions CI Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install actions CI Python dependencies
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            --quiet \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement scripts/actions-ci-python.requirements.txt
      - name: Provision trusted compatibility sandbox
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
          AZURE_CREDENTIALS: ''
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS:-}" != "Linux" ]; then
            echo '::error::trusted compatibility sandbox requires a Linux GitHub-hosted runner' >&2
            exit 1
          fi
          sandbox_acquirer_source() {
            /usr/bin/cat <<'PY'
          import errno
          import hashlib
          import os
          import posixpath
          import pwd
          import re
          import shutil
          import signal
          import stat
          import subprocess
          import sys

          ACQUISITION_PHASES = (
              "package-acquisition-key",
              "package-acquisition-apt-update",
              "package-acquisition-plan",
              "package-acquisition-install",
              "package-acquisition-status",
              "package-acquisition-metadata",
              "package-acquisition-download",
              "package-acquisition-archive",
              "package-acquisition-member",
              "package-acquisition-staging",
          )
          ACQUISITION_DIAGNOSTICS = {
              phase: (
                  "::error::trusted compatibility sandbox filesystem boundary unsafe "
                  f"phase={phase}\n"
              ).encode("ascii")
              for phase in ACQUISITION_PHASES
          }
          UNKNOWN_DIAGNOSTIC = (
              b"::error::trusted compatibility sandbox filesystem boundary unsafe "
              b"phase=unknown\n"
          )
          CURRENT_PHASE = ACQUISITION_PHASES[0]
          SESSION_ROOT = "/var/lib/verjson-compatibility-apt"
          STAGE_ROOT = "/run/verjson-compatibility-sandbox"
          PROFILE_PATH = f"{STAGE_ROOT}/bwrap-userns-restrict"
          PACKAGE_MEMBER = "usr/share/apparmor/extra-profiles/bwrap-userns-restrict"
          SAFE_KEY = "/etc/apt/trusted.gpg.d/ubuntu-keyring-2018-archive.gpg"
          SAFE_ENV = {
              "PATH": "/usr/sbin:/usr/bin:/sbin:/bin",
              "HOME": "/nonexistent",
              "DEBIAN_FRONTEND": "noninteractive",
              "LC_ALL": "C",
              "APT_CONFIG": "/dev/null",
          }
          OWNED_ROOTS = {}


          class AcquisitionError(RuntimeError):
              pass


          def record_owned_root(path):
              metadata = os.lstat(path)
              validate_directory(path)
              OWNED_ROOTS[path] = (metadata.st_dev, metadata.st_ino)


          def cleanup_owned_root(path):
              identity = OWNED_ROOTS.get(path)
              if identity is None:
                  return
              try:
                  metadata = os.lstat(path)
              except FileNotFoundError:
                  OWNED_ROOTS.pop(path, None)
                  return
              if (
                  not stat.S_ISDIR(metadata.st_mode)
                  or metadata.st_uid != 0
                  or metadata.st_gid != 0
                  or metadata.st_mode & 0o022
                  or (metadata.st_dev, metadata.st_ino) != identity
              ):
                  raise AcquisitionError
              shutil.rmtree(path)
              try:
                  os.lstat(path)
              except FileNotFoundError:
                  OWNED_ROOTS.pop(path, None)
              else:
                  raise AcquisitionError


          def interrupted(_signum, _frame):
              raise AcquisitionError


          def require_absent(path):
              try:
                  os.lstat(path)
              except FileNotFoundError:
                  return
              raise AcquisitionError


          def capability_present(descriptor):
              try:
                  os.getxattr(descriptor, "security.capability")
              except OSError as error:
                  absent = {errno.ENODATA}
                  if hasattr(errno, "ENOATTR"):
                      absent.add(errno.ENOATTR)
                  if error.errno in absent:
                      return False
                  raise AcquisitionError from None
              return True


          def validate_directory(path, *, uid=0, gid=0, mask=0o022):
              metadata = os.lstat(path)
              if (
                  not stat.S_ISDIR(metadata.st_mode)
                  or metadata.st_uid != uid
                  or metadata.st_gid != gid
                  or metadata.st_mode & mask
                  or metadata.st_mode & (stat.S_ISUID | stat.S_ISGID)
              ):
                  raise AcquisitionError
              return metadata


          def open_regular(path, *, executable, maximum):
              flags = os.O_RDONLY | os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags)
              try:
                  before = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(before.st_mode)
                      or before.st_uid != 0
                      or before.st_gid != 0
                      or before.st_nlink != 1
                      or before.st_mode & 0o022
                      or before.st_mode & (stat.S_ISUID | stat.S_ISGID)
                      or executable != bool(before.st_mode & 0o111)
                      or capability_present(descriptor)
                      or before.st_size <= 0
                      or before.st_size > maximum
                  ):
                      raise AcquisitionError
                  content = bytearray()
                  while len(content) <= maximum:
                      chunk = os.read(descriptor, min(1024 * 1024, maximum + 1 - len(content)))
                      if not chunk:
                          break
                      content.extend(chunk)
                  after = os.fstat(descriptor)
                  identity = (
                      before.st_dev,
                      before.st_ino,
                      before.st_mode,
                      before.st_uid,
                      before.st_gid,
                      before.st_nlink,
                      before.st_size,
                      before.st_mtime_ns,
                      before.st_ctime_ns,
                  )
                  if identity != (
                      after.st_dev,
                      after.st_ino,
                      after.st_mode,
                      after.st_uid,
                      after.st_gid,
                      after.st_nlink,
                      after.st_size,
                      after.st_mtime_ns,
                      after.st_ctime_ns,
                  ) or len(content) != before.st_size:
                      raise AcquisitionError
                  return bytes(content), identity
              finally:
                  os.close(descriptor)


          def validate_regular_path(path, *, executable, maximum, allow_empty=False):
              flags = os.O_RDONLY | os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags)
              try:
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != 0
                      or metadata.st_gid != 0
                      or metadata.st_nlink != 1
                      or metadata.st_mode & 0o022
                      or metadata.st_mode & (stat.S_ISUID | stat.S_ISGID)
                      or executable != bool(metadata.st_mode & 0o111)
                      or capability_present(descriptor)
                      or (not allow_empty and metadata.st_size <= 0)
                      or metadata.st_size > maximum
                  ):
                      raise AcquisitionError
                  return (
                      metadata.st_dev, metadata.st_ino, metadata.st_mode,
                      metadata.st_uid, metadata.st_gid, metadata.st_nlink,
                      metadata.st_size, metadata.st_mtime_ns, metadata.st_ctime_ns,
                  )
              finally:
                  os.close(descriptor)


          def run(args, *, capture=False, timeout=180):
              return subprocess.run(
                  tuple(args),
                  check=False,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE if capture else subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  cwd="/",
                  env=SAFE_ENV,
                  timeout=timeout,
                  close_fds=True,
                  start_new_session=True,
              )


          def exact_output(args, maximum=65536):
              result = run(args, capture=True)
              if result.returncode != 0 or len(result.stdout) > maximum:
                  raise AcquisitionError
              return result.stdout


          def write_root_file(path, content, mode):
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags, mode)
              try:
                  view = memoryview(content)
                  while view:
                      written = os.write(descriptor, view)
                      if written <= 0:
                          raise AcquisitionError
                      view = view[written:]
                  os.fsync(descriptor)
                  os.fchown(descriptor, 0, 0)
                  os.fchmod(descriptor, mode)
                  metadata = os.fstat(descriptor)
                  if (
                      metadata.st_uid != 0
                      or metadata.st_gid != 0
                      or metadata.st_nlink != 1
                      or metadata.st_mode & 0o022
                      or metadata.st_mode & (stat.S_ISUID | stat.S_ISGID)
                      or capability_present(descriptor)
                  ):
                      raise AcquisitionError
              finally:
                  os.close(descriptor)


          def apt_options(cache_root, lists_root, source_parts):
              return (
                  "-o", f"Dir::Etc::sourcelist=/dev/null",
                  "-o", f"Dir::Etc::sourceparts={source_parts}",
                  "-o", "Dir::Etc::main=/dev/null",
                  "-o", f"Dir::Etc::parts={SESSION_ROOT}/empty-config",
                  "-o", f"Dir::Etc::trusted=/dev/null",
                  "-o", f"Dir::Etc::trustedparts={SESSION_ROOT}/empty-trusted",
                  "-o", "Dir::Etc::netrc=/dev/null",
                  "-o", f"Dir::Etc::netrcparts={SESSION_ROOT}/empty-auth",
                  "-o", "Dir::Etc::preferences=/dev/null",
                  "-o", f"Dir::Etc::preferencesparts={SESSION_ROOT}/empty-preferences",
                  "-o", f"Dir::State::lists={lists_root}",
                  "-o", "Dir::State::status=/var/lib/dpkg/status",
                  "-o", f"Dir::Cache={cache_root}",
                  "-o", f"Dir::Cache::archives={cache_root}/archives",
                  "-o", "APT::Architecture=amd64",
                  "-o", "APT::Get::AllowUnauthenticated=false",
                  "-o", "Acquire::AllowInsecureRepositories=false",
                  "-o", "Acquire::AllowDowngradeToInsecureRepositories=false",
                  "-o", "Acquire::AllowWeakRepositories=false",
                  "-o", "Acquire::Check-Valid-Until=true",
                  "-o", "Acquire::Check-Date=true",
                  "-o", "Acquire::https::Verify-Peer=true",
                  "-o", "Acquire::https::Verify-Host=true",
              )


          def create_apt_partial(path, apt_uid):
              os.mkdir(path, 0o700)
              os.chown(path, apt_uid, 0)
              validate_directory(path, uid=apt_uid, gid=0, mask=0o077)


          def validate_profile(profile_bytes):
              profile = profile_bytes.decode("utf-8", "strict")
              lines = profile.splitlines()
              if "abi <abi/4.0>," not in {line.strip() for line in lines}:
                  raise AcquisitionError
              if re.search(r"flags=\([^)]*\bunconfined\b", profile) is not None:
                  raise AcquisitionError

              def block(pattern):
                  starts = [
                      index for index, line in enumerate(lines)
                      if re.fullmatch(pattern, line.strip())
                  ]
                  if len(starts) != 1:
                      raise AcquisitionError
                  for end in range(starts[0] + 1, len(lines)):
                      if lines[end].strip() == "}":
                          return [
                              rule for line in lines[starts[0] + 1:end]
                              if (rule := line.split("#", 1)[0].strip())
                          ]
                  raise AcquisitionError

              parent = block(r"profile bwrap /usr/bin/bwrap flags=\([^)]*\) \{")
              child = block(r"profile unpriv_bwrap flags=\([^)]*\) \{")
              if "allow px /** -> bwrap//&unpriv_bwrap," not in parent:
                  raise AcquisitionError
              if "allow pix /** -> &unpriv_bwrap," not in child:
                  raise AcquisitionError
              capabilities = [
                  rule for rule in child
                  if re.search(r"(?:^|\s)capability(?:\s|,|$)", rule)
              ]
              if capabilities != ["audit deny capability,"]:
                  raise AcquisitionError


          def parse_packages(list_paths, apt_helper, package, version):
              matches = []
              for path in list_paths:
                  process = subprocess.Popen(
                      (apt_helper, "cat-file", path),
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      cwd="/",
                      env=SAFE_ENV,
                      close_fds=True,
                      start_new_session=True,
                  )
                  fields = {}
                  total = 0
                  try:
                      for line in process.stdout:
                          total += len(line)
                          if total > 512 * 1024 * 1024 or len(line) > 65536:
                              raise AcquisitionError
                          if line in (b"\n", b"\r\n"):
                              if (
                                  fields.get(b"Package") == package.encode()
                                  and fields.get(b"Version") == version.encode()
                                  and fields.get(b"Architecture") == b"all"
                              ):
                                  required = (b"Size", b"SHA256", b"Filename")
                                  if any(name not in fields for name in required):
                                      raise AcquisitionError
                                  matches.append(tuple(fields[name] for name in required))
                              fields = {}
                              continue
                          if line[:1] in (b" ", b"\t"):
                              continue
                          name, separator, value = line.rstrip(b"\r\n").partition(b": ")
                          if separator and name in (
                              b"Package", b"Version", b"Architecture",
                              b"Size", b"SHA256", b"Filename",
                          ):
                              if name in fields:
                                  raise AcquisitionError
                              fields[name] = value
                  except BaseException:
                      process.kill()
                      process.wait(timeout=10)
                      raise
                  finally:
                      process.stdout.close()
                  if process.wait(timeout=60) != 0:
                      raise AcquisitionError
              if not matches or len(set(matches)) != 1:
                  raise AcquisitionError
              size_raw, digest_raw, filename_raw = matches[0]
              if (
                  re.fullmatch(rb"[1-9][0-9]{0,8}", size_raw) is None
                  or re.fullmatch(rb"[0-9a-f]{64}", digest_raw) is None
                  or not filename_raw.startswith(b"pool/")
                  or b".." in filename_raw.split(b"/")
              ):
                  raise AcquisitionError
              size = int(size_raw)
              if size > 32 * 1024 * 1024:
                  raise AcquisitionError
              try:
                  filename = filename_raw.decode("ascii", "strict")
              except UnicodeDecodeError:
                  raise AcquisitionError from None
              if (
                  filename.startswith("/")
                  or "\\" in filename
                  or "%" in filename
                  or "//" in filename
                  or posixpath.normpath(filename) != filename
                  or re.fullmatch(
                      r"pool/(?:[A-Za-z0-9][A-Za-z0-9+.-]*/)+"
                      r"[A-Za-z0-9][A-Za-z0-9+._~-]*_all\.deb",
                      filename,
                  ) is None
              ):
                  raise AcquisitionError
              archive_name = posixpath.basename(filename)
              return size, digest_raw.decode("ascii"), filename, archive_name


          def tar_command(archive_path, arguments, *, maximum):
              producer = subprocess.Popen(
                  ("/usr/bin/dpkg-deb", "--fsys-tarfile", archive_path),
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  cwd="/",
                  env=SAFE_ENV,
                  close_fds=True,
                  start_new_session=True,
              )
              try:
                  consumer = subprocess.run(
                      ("/usr/bin/tar", *arguments, "--file=-"),
                      check=False,
                      stdin=producer.stdout,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      cwd="/",
                      env=SAFE_ENV,
                      timeout=60,
                      close_fds=True,
                      start_new_session=True,
                  )
              except BaseException:
                  producer.kill()
                  producer.wait(timeout=10)
                  raise
              finally:
                  producer.stdout.close()
              producer_status = producer.wait(timeout=60)
              if (
                  producer_status != 0
                  or consumer.returncode != 0
                  or len(consumer.stdout) > maximum
              ):
                  raise AcquisitionError
              return consumer.stdout


          def validate_install_plan(plan):
              try:
                  plan_lines = plan.decode("utf-8", "strict").splitlines()
              except UnicodeDecodeError:
                  raise AcquisitionError from None
              if (
