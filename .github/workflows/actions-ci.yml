                  if re.search(r"(?:^|\s)capability(?:\s|,|$)", line)
              ]
              if capability_rules != ["audit deny capability,"]:
                  raise VerificationError("child capability denial missing")


          def checked_directory(path):
              try:
                  metadata = os.lstat(path)
              except OSError:
                  raise VerificationError("required directory unavailable") from None
              validate_directory(metadata)
              return fingerprint(metadata)


          def reject_walk_error(_error):
              raise VerificationError("unsafe tunables traversal")


          def verify_include_tree(include_root, phase):
              receipts = []
              try:
                  for root, directories, files in os.walk(
                      include_root,
                      topdown=True,
                      onerror=reject_walk_error,
                      followlinks=False,
                  ):
                      directories.sort()
                      files.sort()
                      root_metadata = os.lstat(root)
                      validate_directory(root_metadata)
                      receipts.append((root, fingerprint(root_metadata)))
                      for name in directories:
                          path = os.path.join(root, name)
                          metadata = os.lstat(path)
                          validate_directory(metadata)
                          receipts.append((path, fingerprint(metadata)))
                      for name in files:
                          path = os.path.join(root, name)
                          content, metadata_fingerprint = read_verified_file(
                              path,
                              executable=False,
                          )
                          receipts.append((
                              path,
                              metadata_fingerprint,
                              hashlib.sha256(content).hexdigest(),
                          ))
              except (OSError, VerificationError):
                  raise VerificationError(phase) from None
              return receipts


          def verify_system(profile_path, *, bind_parser=False):
              receipts = []
              try:
                  for directory in (
                      "/",
                      "/usr",
                      "/usr/bin",
                      "/usr/sbin",
                      "/run",
                      "/run/verjson-compatibility-sandbox",
                      "/etc",
                      "/etc/apparmor.d",
                      "/etc/apparmor.d/local",
                      "/etc/apparmor.d/abi",
                      "/etc/apparmor.d/tunables",
                  ):
                      receipts.append((directory, checked_directory(directory)))
              except (OSError, VerificationError):
                  raise VerificationError("ancestor-directories") from None

              try:
                  sbin_metadata = os.lstat("/sbin")
                  sbin_target = os.readlink("/sbin")
                  if (
                      not stat.S_ISLNK(sbin_metadata.st_mode)
                      or sbin_metadata.st_uid != 0
                      or sbin_metadata.st_gid != 0
                      or sbin_target not in ("usr/sbin", "/usr/sbin")
                  ):
                      raise VerificationError("unsafe usrmerge parser path")
                  receipts.append(("/sbin", fingerprint(sbin_metadata), sbin_target))
              except (OSError, VerificationError):
                  raise VerificationError("usrmerge-parser-link") from None

              try:
                  for override in (
                      "/etc/apparmor.d/local/bwrap-userns-restrict",
                      "/etc/apparmor.d/local/unpriv_bwrap",
                  ):
                      try:
                          os.lstat(override)
                      except FileNotFoundError:
                          receipts.append((override, "absent"))
                      except OSError:
                          raise VerificationError("unsafe local override state") from None
                      else:
                          raise VerificationError("local override forbidden")
              except (OSError, VerificationError):
                  raise VerificationError("local-overrides") from None

              receipts.extend(verify_include_tree("/etc/apparmor.d/abi", "abi-tree"))
              receipts.extend(verify_include_tree("/etc/apparmor.d/tunables", "tunables-tree"))

              try:
                  bwrap, bwrap_fingerprint = read_verified_file(
                      "/usr/bin/bwrap",
                      executable=True,
                  )
              except (OSError, VerificationError):
                  raise VerificationError("bwrap-binary") from None
              try:
                  parser_descriptor, parser, parser_fingerprint = open_verified_file(
                      "/sbin/apparmor_parser",
                      executable=True,
                  )
              except (OSError, VerificationError):
                  raise VerificationError("parser-binary") from None
              try:
                  profile_descriptor, profile_bytes, profile_fingerprint = open_verified_file(
                      profile_path,
                      executable=False,
                  )
              except (OSError, VerificationError):
                  raise VerificationError("package-profile") from None
              try:
                  profile = profile_bytes.decode("utf-8")
                  validate_profile_text(profile)
              except (UnicodeError, VerificationError):
                  raise VerificationError("profile-semantics") from None
              try:
                  receipts.extend((
                      ("/usr/bin/bwrap", bwrap_fingerprint, hashlib.sha256(bwrap).hexdigest()),
                      ("/sbin/apparmor_parser", parser_fingerprint, hashlib.sha256(parser).hexdigest()),
                      (profile_path, profile_fingerprint, hashlib.sha256(profile_bytes).hexdigest()),
                  ))
                  receipt = hashlib.sha256(repr(receipts).encode("utf-8")).hexdigest()
              except (OSError, VerificationError):
                  raise VerificationError("receipt-recomputation") from None
              if bind_parser:
                  return receipt, parser_descriptor, profile_descriptor
              os.close(parser_descriptor)
              os.close(profile_descriptor)
              return receipt


          mode = sys.argv[1] if len(sys.argv) == 3 else ""
          if mode not in ("verify", "load") \
                  or sys.argv[2] != "/run/verjson-compatibility-sandbox/bwrap-userns-restrict":
              raise SystemExit("::error::trusted compatibility sandbox verifier invocation is unsafe")


          def run_verifier():
              if mode == "verify":
                  receipt = verify_system(sys.argv[2])
                  path = "/usr/bin/bwrap"
                  try:
                      version = subprocess.run(
                          [path, "--version"],
                          check=False,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.DEVNULL,
                          text=True,
                          timeout=5,
                          env={"PATH": "/usr/sbin:/usr/bin:/sbin:/bin"},
                      )
                  except (OSError, subprocess.SubprocessError):
                      raise VerificationError("bwrap-binary") from None
                  match = re.fullmatch(r"bubblewrap (\d+)\.(\d+)\.(\d+)\n?", version.stdout)
                  if version.returncode != 0 or match is None:
                      raise VerificationError("bwrap-binary")
                  if tuple(map(int, match.groups())) < (0, 9, 0):
                      raise VerificationError("bwrap-binary")
                  print(receipt)
                  return

              expected_receipt = os.environ.get("EXPECTED_SANDBOX_RECEIPT", "")
              if re.fullmatch(r"[0-9a-f]{64}", expected_receipt) is None:
                  raise VerificationError("receipt-recomputation")
              receipt, parser_descriptor, profile_descriptor = verify_system(
                  sys.argv[2],
                  bind_parser=True,
              )
              if receipt != expected_receipt or os.execve not in os.supports_fd:
                  raise VerificationError("receipt-recomputation")
              try:
                  os.set_inheritable(parser_descriptor, True)
                  os.set_inheritable(profile_descriptor, True)
                  os.execve(
                      parser_descriptor,
                      (
                          "apparmor_parser",
                          "--replace",
                          f"/proc/self/fd/{profile_descriptor}",
                      ),
                      {"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "HOME": "/nonexistent"},
                  )
              except OSError:
                  raise VerificationError("profile-load") from None


          try:
              run_verifier()
          except BaseException as error:
              if mode == "load":
                  raise SystemExit(boundary_status(error)) from None
              raise SystemExit(boundary_diagnostic(error)) from None
          PY
          }
          emit_verifier_diagnostic() {
            case "$1" in
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=ancestor-directories'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=usrmerge-parser-link'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=local-overrides'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=abi-tree'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=tunables-tree'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=bwrap-binary'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=parser-binary'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=package-profile'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=profile-semantics'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=receipt-recomputation'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=profile-load'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=unknown'|\
              '::error::trusted compatibility sandbox filesystem boundary unsafe phase=package-profile-cleanup')
                printf '%s\n' "$1" >&2
                ;;
              *)
                echo '::error::trusted compatibility sandbox filesystem boundary unsafe phase=unknown' >&2
                ;;
            esac
          }
          sandbox_supervisor_source() {
            /usr/bin/cat <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          import sys

          phases = (
              "ancestor-directories",
              "usrmerge-parser-link",
              "local-overrides",
              "abi-tree",
              "tunables-tree",
              "bwrap-binary",
              "parser-binary",
              "package-profile",
              "profile-semantics",
              "receipt-recomputation",
              "profile-load",
              "unknown",
              "package-profile-cleanup",
          )
          diagnostics = {
              70 + index: (
                  "::error::trusted compatibility sandbox filesystem boundary unsafe "
                  f"phase={phase}\n"
              ).encode("ascii")
              for index, phase in enumerate(phases)
          }
          diagnostic_status = {value: status for status, value in diagnostics.items()}
          unknown = diagnostics[81]

          try:
              profile_path, expected_digest = sys.argv[1:]
              if (
                  sys.version_info < (3, 9)
                  or os.geteuid() != 0
                  or profile_path
                  != "/run/verjson-compatibility-sandbox/bwrap-userns-restrict"
                  or re.fullmatch(r"[0-9a-f]{64}", expected_digest) is None
              ):
                  raise ValueError
              verifier_source = sys.stdin.buffer.read(1048577)
              if (
                  len(verifier_source) > 1048576
                  or hashlib.sha256(verifier_source).hexdigest() != expected_digest
              ):
                  raise ValueError
              verifier_text = verifier_source.decode("utf-8", "strict")
              completed = subprocess.run(
                  (
                      "/usr/bin/python3",
                      "-I",
                      "-c",
                      verifier_text,
                      "verify",
                      profile_path,
                  ),
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  env={
                      "PATH": "/usr/sbin:/usr/bin:/sbin:/bin",
                      "HOME": "/nonexistent",
                  },
                  cwd="/",
                  timeout=60,
                  check=False,
                  close_fds=True,
                  start_new_session=True,
              )
              output = completed.stdout
              status = completed.returncode
              if status == 0 and re.fullmatch(rb"[0-9a-f]{64}\n", output):
                  sanitized = output
              elif status == 1 and output in diagnostic_status:
                  sanitized = output
                  status = diagnostic_status[output]
              else:
                  sanitized = unknown
                  status = 81
          except BaseException:
              sanitized = unknown
              status = 81

          try:
              sys.stdout.buffer.write(sanitized)
              sys.stdout.buffer.flush()
          except BaseException:
              raise SystemExit(81)
          raise SystemExit(status)
          PY
          }
          verify_sandbox_files() (
            supervisor_source=''
            supervisor_output=''
            supervisor_status=0
            supervisor_source="$(sandbox_supervisor_source)" || {
              emit_verifier_diagnostic ''
              return 1
            }
            supervisor_output="$(
              { sandbox_verifier_source 2>&1 |
                /usr/bin/sudo --non-interactive /usr/bin/env -i \
                  PATH=/usr/sbin:/usr/bin:/sbin:/bin \
                HOME=/nonexistent \
                /usr/bin/python3 -I -c "$supervisor_source" \
                "$profile_path" \
                '1b44cb275c09e93c472c178cac0bd2173268d7daee6646c48ca606f2d8a40549'; } \
                2>/dev/null
            )" || supervisor_status=$?
            case "$supervisor_status" in
              0)
                if [[ "$supervisor_output" =~ ^[0-9a-f]{64}$ ]]; then
                  printf '%s\n' "$supervisor_output"
                  return 0
                fi
                ;;
              70) supervisor_phase='ancestor-directories' ;;
              71) supervisor_phase='usrmerge-parser-link' ;;
              72) supervisor_phase='local-overrides' ;;
              73) supervisor_phase='abi-tree' ;;
              74) supervisor_phase='tunables-tree' ;;
              75) supervisor_phase='bwrap-binary' ;;
              76) supervisor_phase='parser-binary' ;;
              77) supervisor_phase='package-profile' ;;
              78) supervisor_phase='profile-semantics' ;;
              79) supervisor_phase='receipt-recomputation' ;;
              80) supervisor_phase='profile-load' ;;
              81) supervisor_phase='unknown' ;;
              82) supervisor_phase='package-profile-cleanup' ;;
              *) supervisor_phase='unknown' ;;
            esac
            if [ "$supervisor_status" -ge 70 ] 2>/dev/null \
              && [ "$supervisor_status" -le 82 ] 2>/dev/null \
              && [ "$supervisor_output" = "::error::trusted compatibility sandbox filesystem boundary unsafe phase=$supervisor_phase" ]; then
              emit_verifier_diagnostic "$supervisor_output"
            else
              emit_verifier_diagnostic ''
            fi
            return 1
          )
          initial_sandbox_receipt="$(verify_sandbox_files)" || exit 1

          probe_bubblewrap() {
            /usr/bin/env -i \
              PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              HOME=/nonexistent \
              /usr/bin/bwrap \
              --unshare-user \
              --unshare-pid \
              --unshare-ipc \
              --unshare-uts \
              --unshare-cgroup-try \
              --disable-userns \
              --die-with-parent \
              --new-session \
              --cap-drop ALL \
              --ro-bind / / \
              --dev /dev \
              --proc /proc \
              --tmpfs /dev/shm \
              -- /usr/bin/true >/dev/null 2>&1
          }
          if ! probe_bubblewrap; then
            current_sandbox_receipt="$(verify_sandbox_files)" || exit 1
            if [ "$current_sandbox_receipt" != "$initial_sandbox_receipt" ]; then
              echo "::error::trusted compatibility sandbox filesystem boundary unsafe phase=receipt-recomputation" >&2
              exit 1
            fi
            loader_status=0
            sandbox_verifier_source | /usr/bin/sudo --non-interactive /usr/bin/env -i \
              PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              HOME=/nonexistent \
              EXPECTED_SANDBOX_RECEIPT="$initial_sandbox_receipt" \
              /usr/bin/python3 -I - load "$profile_path" >/dev/null 2>&1 || loader_status=$?
            if [ "$loader_status" -ne 0 ]; then
              case "$loader_status" in
                70) loader_phase='ancestor-directories' ;;
                71) loader_phase='usrmerge-parser-link' ;;
                72) loader_phase='local-overrides' ;;
                73) loader_phase='abi-tree' ;;
                74) loader_phase='tunables-tree' ;;
                75) loader_phase='bwrap-binary' ;;
                76) loader_phase='parser-binary' ;;
                77) loader_phase='package-profile' ;;
                78) loader_phase='profile-semantics' ;;
                79) loader_phase='receipt-recomputation' ;;
                1|80) loader_phase='profile-load' ;;
                81) loader_phase='unknown' ;;
                82) loader_phase='package-profile-cleanup' ;;
                *) loader_phase='unknown' ;;
              esac
              echo "::error::trusted compatibility sandbox filesystem boundary unsafe phase=$loader_phase"
              exit 1
            fi
          fi
          if ! probe_bubblewrap; then
            echo "::error::trusted unprivileged bubblewrap namespace probe failed"
            exit 1
          fi

      - name: Run namespace-bound compatibility contracts
        env:
          RUNNER_LABELS: ''
        run: |
          bash scripts/ci-gate/node-ci-secretless-compatibility.test.sh
          scripts/ci-gate/node-ci-secretless-compatibility-absent.test.py
          python3 scripts/ci-gate/node-ci-required-identity.test.py
          VERJSON_TEST_REAL_BWRAP=1 python3 scripts/ci-gate/node-ci-secretless-rebuild-env.test.py
          bash scripts/ci-gate/node-ci-secretless-consumer.test.sh
          bash scripts/ci-gate/node-ci-secretless-nested-manifests.test.sh
          python3 scripts/container_release_reconcile.test.py

  # scripts/gen-adr-index.sh --check (run above, in the changelog-release
  # group) only ever sees this PR's own tree, so it cannot catch two open PRs
  # independently allocating the same docs/decisions/NNNN-<slug> number --
  # git merges the two differently-named directories without a conflict and
  # the collision lands on main silently (Verjson/.github#983). This reads
  # live GitHub state instead, so it only runs where that state exists: a
  # pull request.
  adr-number-collision:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_FASTLANE || vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          # Same isolated-path rationale as shell-test-groups above (#675).
          path: .adr-number-collision-source-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check this PR's ADR numbers against main and other open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ".adr-number-collision-source-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 scripts/ci-gate/adr-number-collision.py \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}"

  # Required-check compatibility boundary. `shell-tests` is the context named
  # by the repository ruleset (ADR 0058), so it remains unmatrixed and reports
  # the aggregate result after every group reaches a terminal state.
  shell-tests:
    needs: [change-scope, shell-test-groups, docs-contracts, hosted-compatibility-tests, adr-number-collision]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_FASTLANE || vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 2
    steps:
      - name: Preserve the required shell-tests context
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          HEAVY: ${{ needs.change-scope.outputs.heavy }}
          GROUP_RESULT: ${{ needs.shell-test-groups.result }}
          DOCS_RESULT: ${{ needs.docs-contracts.result }}
          COMPATIBILITY_RESULT: ${{ needs.hosted-compatibility-tests.result }}
          COLLISION_RESULT: ${{ needs.adr-number-collision.result }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::changed-path classification failed"
            exit 1
          fi
          if [ "$DOCS_RESULT" != "success" ]; then
            echo "::error::documentation shell contracts failed"
            exit 1
          fi
          if [ "$HEAVY" = true ]; then
            if [ "$GROUP_RESULT" != "success" ]; then
              echo "::error::one or more shell-test groups failed"
              exit 1
            fi
          elif [ "$HEAVY" = false ]; then
            if [ "$GROUP_RESULT" != "skipped" ]; then
              echo "::error::documentation diff still ran the heavy shell-test groups"
              exit 1
            fi
          else
            echo "::error::changed-path classification did not report heavy=true or heavy=false"
            exit 1
          fi
          if [ "$HEAVY" = true ]; then
            if [ "$COMPATIBILITY_RESULT" != "success" ]; then
              echo "::error::hosted compatibility contracts failed"
              exit 1
            fi
          elif [ "$COMPATIBILITY_RESULT" != "skipped" ]; then
            echo "::error::documentation diff still ran hosted compatibility contracts"
            exit 1
          fi
          # adr-number-collision only runs on pull_request (needs live PR
          # state), so 'skipped' -- e.g. on a push to main -- is not a failure.
          if [ "$COLLISION_RESULT" != "success" ] && [ "$COLLISION_RESULT" != "skipped" ]; then
            echo "::error::ADR number collision check failed"
            exit 1
          fi
