name: immutable container release promotion

on:
  workflow_call:
    inputs:
      release_environment:
        description: Main-only environment containing the release App private key
        required: true
        type: string
      version: {required: true, type: string}
      candidate-manifest: {required: true, type: string}
      config-path: {required: true, type: string}
      contract-ref: {required: true, type: string}
      release_app_client_id: {required: true, type: string}
      # Opt-in, generator-declared JSON array of reviewed repository-relative paths
      # the pinned reconciliation hook may rewrite (ADR 0158). Empty disables the
      # hook entirely. This is never a workflow_dispatch input: the generated caller
      # bakes the reviewed list in, so no dispatcher can widen it at release time.
      reconcile-allowlist: {required: false, type: string, default: ''}

permissions:
  actions: read
  contents: read

concurrency:
  # Package retention is destructive. Serialize releases for this repository so
  # two version-keyed runs cannot validate and delete the same package concurrently.
  group: container-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  app-key-policy:
    uses: ./.github/workflows/app-key-environment.yml
    permissions:
      actions: read
      contents: read
    with:
      role: release
      environment: ${{ inputs.release_environment }}

  promote:
    environment: ${{ inputs.release_environment }}
    needs: app-key-policy
    if: ${{ needs.app-key-policy.result == 'success' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main') }}
    runs-on: ubuntu-24.04
    env:
      GIT_NO_REPLACE_OBJECTS: "1"
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    outputs:
      retention-targets: ${{ steps.release-output.outputs.retention-targets }}
    steps:
      - name: Bind the immutable changelog contract to this workflow
        env:
          CONTRACT_REF: ${{ inputs.contract-ref }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          [[ "$CONTRACT_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::contract-ref must be a 40-character lowercase commit SHA"
            exit 1
          }
          workflow_ref="$(jq -er '.workflow_ref | select(type == "string" and length > 0)' <<<"$JOB_CONTEXT")" || {
            echo "::error::the called reusable workflow identity is unavailable or malformed"
            exit 1
          }
          expected="Verjson/.github/.github/workflows/container-release.yml@$CONTRACT_REF"
          [ "$workflow_ref" = "$expected" ] || {
            echo "::error::contract-ref does not match the loaded canonical container-release workflow"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Check out the immutable provenance and changelog contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ inputs.contract-ref }}
          path: .container-release-contract
          persist-credentials: false
          sparse-checkout: |
            scripts/changelog.py
            scripts/container_release_reconcile.py
            scripts/container_cosign_provenance.py
            scripts/container_candidate_retry.py
          sparse-checkout-cone-mode: false
      - name: Prepare the release reconciliation sandbox
        if: ${{ inputs.reconcile-allowlist != '' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes apparmor apparmor-profiles bubblewrap

          verify_package_floor() {
            local package_name="$1"
            local package_floor="$2"
            local package_record package_status package_version
            package_record="$(dpkg-query -W -f='${db:Status-Abbrev} ${Version}\n' "$package_name")"
            read -r package_status package_version <<<"$package_record"
            if [ "$package_status" != "ii" ] \
              || ! dpkg --compare-versions "$package_version" ge "$package_floor"; then
              echo "::error::release reconciliation sandbox package is below its verified floor: $package_name"
              exit 1
            fi
          }
          verify_package_floor bubblewrap '0.9.0-1build1'
          verify_package_floor apparmor '4.0.1really4.0.1-0ubuntu0.24.04.3'
          verify_package_floor apparmor-profiles '4.0.1really4.0.1-0ubuntu0.24.04.3'

          profile='/usr/share/apparmor/extra-profiles/bwrap-userns-restrict'
          parser='/usr/sbin/apparmor_parser'
          [ "$(dpkg-query -S /usr/bin/bwrap)" = 'bubblewrap: /usr/bin/bwrap' ]
          [ "$(dpkg-query -S "$parser")" = "apparmor: $parser" ]
          [ "$(dpkg-query -S "$profile")" = "apparmor-profiles: $profile" ]
          [ -f "$profile" ] && [ ! -L "$profile" ]
          sudo "$parser" --replace "$profile"

          /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent /usr/bin/bwrap \
            --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts \
            --die-with-parent --new-session --disable-userns --cap-drop ALL \
            --ro-bind /usr /usr --ro-bind-try /bin /bin \
            --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 \
            --ro-bind-try /etc /etc --proc /proc --dev /dev \
            --tmpfs /run --tmpfs /tmp --dir /workspace \
            --bind "$GITHUB_WORKSPACE" /workspace --chdir /workspace \
            --clearenv --setenv PATH /usr/bin:/bin -- /usr/bin/true
      - uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Fetch candidate by immutable artifact identity
        id: candidate
        env:
          CANDIDATE_IDENTITY: ${{ inputs.candidate-manifest }}
          CONFIG_PATH: ${{ inputs.config-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_IDENTITY" =~ ^([0-9]+)@(sha256:[0-9a-f]{64})$ ]] || { echo "::error::candidate identity must be artifact-id@sha256 digest"; exit 1; }
          artifact_id="${BASH_REMATCH[1]}"; expected_digest="${BASH_REMATCH[2]}"
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
          [ "$(jq -r .expired <<<"$metadata")" = false ]
          [ "$(jq -r .digest <<<"$metadata")" = "$expected_digest" ]
          [[ "$(jq -r .name <<<"$metadata")" == container-candidate-* ]]
          [ "$(jq -r .workflow_run.repository_id <<<"$metadata")" = "$GITHUB_REPOSITORY_ID" ]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > candidate.zip
          [ "sha256:$(sha256sum candidate.zip | cut -d' ' -f1)" = "$expected_digest" ]
          python3 scripts/container_artifact_extract.py candidate.zip candidate.json candidate-manifest.sigstore.json
          mv candidate.zip candidate-manifest.zip
          run_id="$(jq -r .source.runId candidate.json)"; source_sha="$(jq -r .source.commit candidate.json)"
          [ "$(jq -r .workflow_run.id <<<"$metadata")" = "$run_id" ]
          [ "$(jq -r .workflow_run.head_branch <<<"$metadata")" = main ]
          [ "$(jq -r .workflow_run.head_sha <<<"$metadata")" = "$source_sha" ]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          printf '%s\n' "$run" > candidate-run.json
          [ "$(jq -r .conclusion <<<"$run")" = success ]
          [ "$(jq -r .event <<<"$run")" = push ]
          git show "$source_sha:$CONFIG_PATH" > candidate-config.json
          expected_signer="$(jq -er '[.images[].provenance.builderIdentity] | unique | if length == 1 then .[0] else error("candidate contract pin is not coherent") end' candidate-config.json)"
          signer="$(jq -r .source.workflow candidate.json)"
          [ "$signer" = "$expected_signer" ] || { echo "::error::candidate signer differs from source-commit reviewed contract pin"; exit 1; }
          cosign verify-blob candidate.json \
            --bundle candidate-manifest.sigstore.json \
            --certificate-identity "https://github.com/$signer" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$source_sha"
          gar_destination="$(jq -ce '[.registryDestinations[]? | select(.provider == "gar")] | if length == 1 then .[0] else error("candidate has no reviewed GAR destination") end' candidate-config.json)"
          provider="$(jq -er '.workloadIdentityProvider | select(test("^projects/[0-9]+/locations/global/workloadIdentityPools/[A-Za-z0-9_-]+/providers/[A-Za-z0-9_-]+$"))' <<<"$gar_destination")"
          service_account="$(jq -er '.serviceAccount | select(test("^[a-z0-9][a-z0-9-]*@[a-z0-9-]+[.]iam[.]gserviceaccount[.]com$"))' <<<"$gar_destination")"
          namespace="$(jq -er '.namespace | select(test("^[a-z0-9-]+-docker[.]pkg[.]dev/[a-z0-9-]+/[a-z0-9._/-]+$"))' <<<"$gar_destination")"
          printf 'workload_identity_provider=%s\nservice_account=%s\nregistry_host=%s\n' \
            "$provider" "$service_account" "${namespace%%/*}" >>"$GITHUB_OUTPUT"
      - id: gar-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ steps.candidate.outputs.workload_identity_provider }}
          service_account: ${{ steps.candidate.outputs.service_account }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.candidate.outputs.registry_host }}
          username: oauth2accesstoken
          password: ${{ steps.gar-auth.outputs.access_token }}
      - name: Fail-closed preflight and immutable plan
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_MANIFEST: ${{ inputs.candidate-manifest }}
          CONFIG_PATH: ${{ inputs.config-path }}
          CONTRACT_REF: ${{ inputs.contract-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CONTRACT_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CANDIDATE_MANIFEST" =~ ^([0-9]+)@(sha256:[0-9a-f]{64})$ ]] || exit 1
          candidate_artifact_digest="${BASH_REMATCH[2]}"
          [[ "$CONFIG_PATH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*\.json$ && "/$CONFIG_PATH/" != *"/../"* ]] || { echo "::error::config path must be repository relative"; exit 1; }
          release_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          previous=null
          while read -r tag; do
            [ "$tag" != "v$VERSION" ] || continue
            if git cat-file -e "$tag:RELEASES/containers/$tag.json" 2>/dev/null; then
              git show "$tag:RELEASES/containers/$tag.json" > previous-manifest.json
              previous="$(jq -n --arg version "${tag#v}" --arg digest "sha256:$(sha256sum previous-manifest.json | cut -d' ' -f1)" '{releaseVersion:$version,manifestDigest:$digest}')"
              break
            fi
          done < <(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            git show "v$VERSION:RELEASES/containers/v$VERSION.json" > existing-release.json
            context="$(jq -c '{release,timestamps,previousRelease}' existing-release.json)"
          else
            context="$(jq -n --arg contract "$CONTRACT_REF" --arg candidateTime "$(jq -r .created_at candidate-run.json)" \
              --arg releaseTime "$(jq -r .created_at <<<"$release_run")" --argjson run "$GITHUB_RUN_ID" \
              --argjson attempt "$GITHUB_RUN_ATTEMPT" --argjson previous "$previous" \
              --arg sourceCommit "$GITHUB_SHA" \
              '{release:{workflow:{path:".github/workflows/container-release.yml",contractCommit:$contract},sourceCommit:$sourceCommit,runId:$run,runAttempt:$attempt},timestamps:{candidatePublishedAt:$candidateTime,releasedAt:$releaseTime},previousRelease:$previous}')"
          fi
          jq -n --arg digest "$candidate_artifact_digest" --argjson context "$context" \
            '{candidateManifestDigest:$digest,aliases:{},provenance:{},sbom:{}} + $context' > state.json
          while IFS=$'\t' read -r repository; do
            alias="$repository:$VERSION"; error_file="$(mktemp)"
            if observed="$(docker buildx imagetools inspect "$alias" --format '{{json .Manifest.Digest}}' 2>"$error_file" | tr -d '"')"; then
              jq --arg alias "$alias" --arg digest "$observed" '.aliases[$alias]=$digest' state.json > state.next
              mv state.next state.json
            elif ! grep -Eqi 'manifest unknown|not found' "$error_file"; then
              cat "$error_file" >&2; echo "::error::could not prove stable alias state"; exit 1
            fi
          done < <(jq -r '.images | sort_by(.variant)[] | .repository' candidate-config.json)
          mkdir receipts
          python3 scripts/container_attestation_verify.py --candidate candidate.json \
            --config candidate-config.json --state state.json --receipts receipts \
            --expected-repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --expected-source-ref refs/heads/main \
            --expected-source-commit "$(jq -er .head_sha candidate-run.json)" \
            --contract-ref "$CONTRACT_REF" \
            --cosign-helper ".container-release-contract/scripts/container_cosign_provenance.py"
          python3 scripts/container_release_promotion.py --candidate candidate.json \
            --config candidate-config.json --state state.json --version "$VERSION" --output release-manifest.json
          release_path="RELEASES/containers/v$VERSION.json"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            git show "v$VERSION:$release_path" > committed-manifest.json
            cmp -s committed-manifest.json release-manifest.json || { echo "::error::existing tag records a divergent release manifest"; exit 1; }
            git show "v$VERSION:CHANGELOG/v$VERSION.md" >/dev/null
            echo resumed > git-state
          else
            [ ! -e "$release_path" ] && [ ! -e "CHANGELOG/v$VERSION.md" ]
            echo new > git-state
          fi
          if gh release view "v$VERSION" --json body >/dev/null 2>&1; then
            [ "$(cat git-state)" = resumed ] || { echo "::error::GitHub Release exists without exact Git release state"; exit 1; }
            tmp="$(mktemp -d)"
            gh release download "v$VERSION" --pattern release-manifest.json --dir "$tmp"
            cmp -s "$tmp/release-manifest.json" release-manifest.json || { echo "::error::existing GitHub Release manifest diverges"; exit 1; }
            gh release download "v$VERSION" --pattern candidate-manifest.zip --dir "$tmp"
            cmp -s "$tmp/candidate-manifest.zip" candidate-manifest.zip || { echo "::error::existing GitHub Release candidate evidence diverges"; exit 1; }
            gh release download "v$VERSION" --pattern release-manifest.sigstore.json --dir "$tmp"
            cmp -s "$tmp/release-manifest.sigstore.json" release-manifest.sigstore.json \
              || { echo "::error::existing GitHub Release signature diverges"; exit 1; }
            for receipt in receipts/*.json; do
              gh release download "v$VERSION" --pattern "$(basename "$receipt")" --dir "$tmp"
              cmp -s "$tmp/$(basename "$receipt")" "$receipt" || { echo "::error::existing GitHub Release receipt diverges"; exit 1; }
            done
            [ "$(gh release view "v$VERSION" --json body --jq .body)" = "$(git show "v$VERSION:CHANGELOG/v$VERSION.md")" ] || { echo "::error::existing GitHub Release notes diverge"; exit 1; }
            echo exact > github-state
          else
            echo missing > github-state
          fi
      - name: Reconcile derived release inputs before credential minting
        if: ${{ inputs.reconcile-allowlist != '' }}
        env:
          VERSION: ${{ inputs.version }}
          CONTRACT_REF: ${{ inputs.contract-ref }}
          RECONCILE_ALLOWLIST: ${{ inputs.reconcile-allowlist }}
        run: |
          set -euo pipefail
          python3 .container-release-contract/scripts/container_release_reconcile.py \
            --repo-root . --allowlist "$RECONCILE_ALLOWLIST" --version "$VERSION" \
            --manifest release-manifest.json \
            --contract-root .container-release-contract --contract-ref "$CONTRACT_REF" \
            --timeout 300 --staged-list reconciled-paths.txt
      - name: Require the release App client ID
        env:
          RELEASE_APP_CLIENT_ID: ${{ inputs.release_app_client_id }}
        run: |
          if [[ -z "$RELEASE_APP_CLIENT_ID" || "$RELEASE_APP_CLIENT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::RELEASE_APP_CLIENT_ID must be a GitHub App client ID, not an empty or numeric legacy App ID."
            exit 1
          fi
      - name: Mint exact-repository release App token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.release_app_client_id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Promote exact digests without rebuilding
        env: {VERSION: "${{ inputs.version }}"}
        run: |
          set -euo pipefail
          jq -c '.promotion.operations[]' release-manifest.json | while read -r operation; do
            alias="$(jq -r .alias <<<"$operation")"; digest="$(jq -r .digest <<<"$operation")"
            observed="$(jq -r --arg alias "$alias" '.aliases[$alias] // ""' state.json)"
            [ "$observed" = "$digest" ] || docker buildx imagetools create -t "$alias" "${alias%:*}@$digest"
            [ "$(docker buildx imagetools inspect "$alias" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$digest" ] || exit 1
          done
          jq -c '.promotion.operations[]' release-manifest.json | while read -r operation; do
            alias="$(jq -r .alias <<<"$operation")"; digest="$(jq -r .digest <<<"$operation")"
            observed="$(docker buildx imagetools inspect "$alias" --format '{{json .Manifest.Digest}}' | tr -d '"')" \
              || { echo "::error::complete stable alias set could not be reconciled"; exit 1; }
            [ "$observed" = "$digest" ] \
              || { echo "::error::complete stable alias set diverged before publication"; exit 1; }
          done
      - id: release-manifest-signature
        name: Sign immutable release manifest with Cosign
        env:
          VERSION: ${{ inputs.version }}
          CONTRACT_REF: ${{ inputs.contract-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper=".container-release-contract/scripts/container_cosign_provenance.py"
          if [ "$(cat git-state)" = resumed ]; then
            git show "v$VERSION:RELEASES/containers/v$VERSION.json.sigstore.json" \
              > release-manifest.sigstore.json
          else
            token="$RUNNER_TEMP/release-manifest-oidc-token"
            trap 'rm -f "$token"' EXIT
            python3 "$helper" request-oidc-token \
              --request-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --output "$token"
            cosign sign-blob --yes --bundle release-manifest.sigstore.json \
              --identity-token "$token" release-manifest.json
          fi
          cosign verify-blob release-manifest.json \
            --bundle release-manifest.sigstore.json \
            --certificate-identity "https://github.com/Verjson/.github/.github/workflows/container-release.yml@$CONTRACT_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - id: release-output
        name: Canonical changelog, Git tag, release and machine output
        env:
          VERSION: "${{ inputs.version }}"
          CONTRACT_REF: "${{ inputs.contract-ref }}"
          RECONCILE_ALLOWLIST: "${{ inputs.reconcile-allowlist }}"
          GH_TOKEN: "${{ steps.release-app-token.outputs.token }}"
        run: |
          set -euo pipefail
          # Rebind the pinned engine immediately before it runs with the release App
          # token: the reconciliation hook executes earlier in this job, so the only
          # safe moment to prove the engine is unmodified is here (ADR 0158).
          [ "$(git -C .container-release-contract rev-parse HEAD)" = "$CONTRACT_REF" ] \
            || { echo "::error::pinned changelog engine is not at the bound contract ref"; exit 1; }
          [ -z "$(git -C .container-release-contract status --porcelain -- scripts/changelog.py)" ] \
            || { echo "::error::pinned changelog engine was modified after checkout"; exit 1; }
          GIT_NO_REPLACE_OBJECTS=1 git -C .container-release-contract show \
            "$CONTRACT_REF:scripts/changelog.py" \
            | cmp -s .container-release-contract/scripts/changelog.py - \
            || { echo "::error::changelog engine does not match the pinned contract commit"; exit 1; }
          gh auth setup-git
          if [ "$(cat git-state)" = new ]; then
            mkdir -p RELEASES/containers
            cp release-manifest.json "RELEASES/containers/v$VERSION.json"
            cp release-manifest.sigstore.json "RELEASES/containers/v$VERSION.json.sigstore.json"
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add "RELEASES/containers/v$VERSION.json"
            git add "RELEASES/containers/v$VERSION.json.sigstore.json"
            expected="$(
              { printf '%s\n' "RELEASES/containers/v$VERSION.json" "RELEASES/containers/v$VERSION.json.sigstore.json"
                # Only a configured release has a recorded reconciliation set; an
                # unconfigured consumer that happens to track this filename must
                # not have it read back as an allowance.
                [ -n "$RECONCILE_ALLOWLIST" ] && [ -f reconciled-paths.txt ] && cat reconciled-paths.txt
                true
              } | sed '/^$/d' | LC_ALL=C sort -u
            )"
            [ "$(git diff --cached --name-only | LC_ALL=C sort -u)" = "$expected" ] \
              || { echo "::error::release commit stages paths outside the reviewed reconciliation allowlist"; exit 1; }
            # Repository hooks never run with the release App token: `.git/hooks` is
            # not tracked, so nothing here could have reviewed what it contains.
            git -c core.hooksPath=/dev/null commit -m "chore(containers): record release v$VERSION"
            python3 .container-release-contract/scripts/changelog.py release --version "v$VERSION"
            git -c core.hooksPath=/dev/null push --atomic origin HEAD:main "refs/tags/v$VERSION"
          fi
          if [ "$(cat github-state)" = missing ]; then
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "CHANGELOG/v$VERSION.md" release-manifest.json release-manifest.sigstore.json candidate-manifest.zip receipts/*.json
          fi
          jq -c '{version:.releaseVersion,manifestDigest:.candidateManifestDigest,images:[.images[]|{variant,repository,indexDigest}]}' release-manifest.json | tee release-output.json
          targets="$(jq -c --arg owner "$GITHUB_REPOSITORY_OWNER" --arg version "$VERSION" '
            [.images[].repository | capture("^ghcr.io/(?<owner>[^/]+)/(?<name>.+)$") |
              select((.owner | ascii_downcase) == ($owner | ascii_downcase)) |
              {type:"container",name:.name,releasedVersion:$version}]' release-manifest.json)"
          [ "$(jq 'length' <<<"$targets")" = "$(jq '.images | length' release-manifest.json)" ] \
            || { echo "::error::release manifest contains an image outside ghcr.io/$GITHUB_REPOSITORY_OWNER"; exit 1; }
          printf 'retention-targets=%s\n' "$targets" >>"$GITHUB_OUTPUT"

  retention:
    name: Retain three numbered image releases
    needs: promote
    if: needs.promote.result == 'success'
    continue-on-error: true
    runs-on: ${{ github.repository_owner != 'Verjson' && 'ubuntu-24.04' || fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate the immutable retention contract ref
        env:
          CONTRACT_REF: ${{ inputs.contract-ref }}
        run: '[[ "$CONTRACT_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ inputs.contract-ref }}
          path: .package-retention-contract
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Delete image versions outside canonical retention
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.promote.outputs.retention-targets }}
          # Org-wide retention window (verjson-agents#987). Defaults to the ADR
          # 0108 policy of 3 and changes nothing until a human sets this
          # variable — raising it is a storage-cost decision, not a code change.
          RETENTION_KEEP: ${{ vars.CI_PACKAGE_RETENTION_KEEP || '3' }}
        run: |
          if [[ ! "$RETENTION_KEEP" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CI_PACKAGE_RETENTION_KEEP must be a positive integer, got '$RETENTION_KEEP'."
            exit 1
          fi
          python3 .package-retention-contract/scripts/package_retention.py \
            --owner "$GITHUB_REPOSITORY_OWNER" --targets "$TARGETS" --keep "$RETENTION_KEEP" --apply
