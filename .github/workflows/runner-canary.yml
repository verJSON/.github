name: Canonical database-backed runner canary
run-name: runner-canary-${{ inputs.transaction_nonce }}

on:
  workflow_dispatch:
    inputs:
      runner_name: { required: true, type: string }
      runner_id: { required: true, type: string }
      runner_label: { required: true, type: string }
      transaction_nonce: { required: true, type: string }
      release_manifest: { required: true, type: string }
      release_variant: { required: true, type: string }
      image_digest: { required: true, type: string }

permissions:
  actions: read
  contents: read

jobs:
  canary:
    environment: runner-fleet-production
    timeout-minutes: 30
    runs-on: [self-hosted, '${{ inputs.runner_label }}']
    services:
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 # 17-alpine
        env:
          POSTGRES_PASSWORD: canary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - name: Exact runner and database/Docker/PowerShell admission
        env:
          EXPECTED_RUNNER: ${{ inputs.runner_name }}
          RUNNER_ID: ${{ inputs.runner_id }}
          TRANSACTION_NONCE: ${{ inputs.transaction_nonce }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
          RELEASE_VARIANT: ${{ inputs.release_variant }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER"
          pwsh --version >/dev/null
          docker run --rm --network host postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 pg_isready -h 127.0.0.1 -U postgres
          network="runner-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sibling="runner-canary-sibling-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          capacity="runner-canary-capacity-${TRANSACTION_NONCE}"
          capacity_id=""
          capacity_owned=0
          capacity_owner=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          [[ "$capacity_owner" =~ ^[abcdef0123456789]{32}$ ]]
          umask 077
          capacity_state=""
          capacity_cidfile=""
          build_image="runner-canary:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_signal_status=0
          record_cleanup_signal() {
            if [ "$cleanup_signal_status" -eq 0 ]; then cleanup_signal_status=$1; fi
          }
          cleanup() {
            status=$?
            trap - EXIT
            trap 'record_cleanup_signal 130' INT
            trap 'record_cleanup_signal 143' TERM
            cleanup_failed=0
            if [ -z "$capacity_id" ] && [ -f "$capacity_cidfile" ] && [ ! -L "$capacity_cidfile" ]; then
              recovered_capacity_id=$(cat "$capacity_cidfile") || cleanup_failed=1
              if [[ "$recovered_capacity_id" =~ ^[abcdef0123456789]{64}$ ]] &&
                [ "$(docker container inspect --format '{{index .Config.Labels "verjson.runner-canary-owner"}}' "$recovered_capacity_id")" = "$capacity_owner" ]; then
                capacity_id=$recovered_capacity_id
                capacity_owned=1
              else
                cleanup_failed=1
              fi
            fi
            docker rm -f "$sibling" >/dev/null 2>&1 || true
            if [ "$capacity_owned" -eq 1 ]; then
              docker rm -f "$capacity_id" >/dev/null 2>&1 || true
              if ! remaining=$(docker container ls -a --no-trunc --filter "id=${capacity_id}" --format '{{.ID}}'); then
                cleanup_failed=1
              elif [ -n "$remaining" ]; then
                cleanup_failed=1
              fi
            fi
            if [ -n "$capacity_state" ]; then
            if [ -e "$capacity_cidfile" ] || [ -L "$capacity_cidfile" ]; then
              if [ -f "$capacity_cidfile" ] && [ ! -L "$capacity_cidfile" ]; then rm -f "$capacity_cidfile" || cleanup_failed=1
              else rm -f "$capacity_cidfile" || true; cleanup_failed=1; fi
            fi
            if [ -e "$capacity_cidfile" ] || [ -L "$capacity_cidfile" ]; then cleanup_failed=1; fi
            if [ -d "$capacity_state" ] && [ ! -L "$capacity_state" ] &&
              [ "$(stat -c '%u:%a' "$capacity_state")" = "$(id -u):700" ]; then
              rmdir "$capacity_state" || cleanup_failed=1
            else
              if [ -L "$capacity_state" ]; then rm -f "$capacity_state" || true; fi
              cleanup_failed=1
            fi
            if [ -e "$capacity_state" ] || [ -L "$capacity_state" ]; then cleanup_failed=1; fi
            fi
            if ! remaining=$(docker container ls -a --filter "name=^/${sibling}$" --format '{{.Names}}'); then
              cleanup_failed=1
            elif [ -n "$remaining" ]; then cleanup_failed=1; fi
            docker network rm "$network" >/dev/null 2>&1 || true
            if ! remaining=$(docker network ls --filter "name=^${network}$" --format '{{.Name}}'); then
              cleanup_failed=1
            elif [ -n "$remaining" ]; then cleanup_failed=1; fi
            docker image rm "$build_image" >/dev/null 2>&1 || true
            if ! remaining=$(docker image ls --filter "reference=${build_image}" --format '{{.Repository}}:{{.Tag}}'); then
              cleanup_failed=1
            elif [ -n "$remaining" ]; then cleanup_failed=1; fi
            # Bash runs pending traps between commands. This boundary lets a signal queued by
            # the final proof latch before finalization disables further signal delivery.
            :
            trap '' INT TERM
            final_signal_status=$cleanup_signal_status
            final_status=0
            if [ "$final_signal_status" -ne 0 ]; then
              final_status=$final_signal_status
            elif [ "$status" -ne 0 ]; then
              final_status=$status
            elif [ "$cleanup_failed" -ne 0 ]; then
              final_status=1
            fi
            if [ "$final_status" -ne 0 ]; then
              rm -f runner-promotion-receipt.json receipt.tmp
            fi
            exit "$final_status"
          }
          interrupted() { trap '' INT TERM; exit "$1"; }
          trap cleanup EXIT
          trap 'interrupted 130' INT
          trap 'interrupted 143' TERM
          [ -d "$RUNNER_TEMP" ] && [ ! -L "$RUNNER_TEMP" ]
          [ "$(stat -c '%u' "$RUNNER_TEMP")" = "$(id -u)" ]
          capacity_state=$(mktemp -d -p "$RUNNER_TEMP" runner-canary-capacity.XXXXXXXXXX)
          capacity_cidfile="${capacity_state}/container.cid"
          [ -d "$capacity_state" ] && [ ! -L "$capacity_state" ]
          [ "$(stat -c '%u:%a' "$capacity_state")" = "$(id -u):700" ]
          [[ "$(realpath "$capacity_state")" == "$(realpath "$RUNNER_TEMP")"/* ]]
          docker network create "$network" >/dev/null
          docker run -d --name "$sibling" --network "$network" nginx@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913 >/dev/null
          docker run --rm --network "$network" curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b --fail "http://$sibling" >/dev/null
          docker build --pull -t "$build_image" - <<'DOCKERFILE'
          FROM alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
          RUN printf canary >/canary
          DOCKERFILE
          test ! -e "$capacity_cidfile" && test ! -L "$capacity_cidfile"
          trap 'record_cleanup_signal 130' INT
          trap 'record_cleanup_signal 143' TERM
          set +e
          # The single-quoted program must expand only inside the isolated probe container.
          # shellcheck disable=SC2016
          candidate_capacity_id=$(timeout --signal=KILL 30s \
            docker create --cidfile "$capacity_cidfile" --name "$capacity" \
              --label "verjson.runner-canary-owner=${capacity_owner}" --network none \
              --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 64m --cpus 0.25 \
              alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
              sh -ceu 'free_bytes=$(df -PB1 / | awk '\''NR==2 {print $4}'\''); free_inodes=$(df -Pi / | awk '\''NR==2 {print 100-$5}'\''); printf "%s %s\n" "$free_bytes" "$free_inodes"')
          create_status=$?
          set -e
          if [ -f "$capacity_cidfile" ] && [ ! -L "$capacity_cidfile" ] &&
            [ "$(stat -c '%u:%a' "$capacity_cidfile")" = "$(id -u):600" ]; then
            recovered_capacity_id=$(cat "$capacity_cidfile")
            if [[ "$recovered_capacity_id" =~ ^[abcdef0123456789]{64}$ ]] &&
              [ "$(docker container inspect --format '{{index .Config.Labels "verjson.runner-canary-owner"}}' "$recovered_capacity_id")" = "$capacity_owner" ]; then
              capacity_id=$recovered_capacity_id
              capacity_owned=1
            fi
          elif [ -e "$capacity_cidfile" ] || [ -L "$capacity_cidfile" ]; then
            create_status=1
          fi
          if [ "$capacity_owned" -eq 0 ] && [ ! -e "$capacity_cidfile" ] && [ ! -L "$capacity_cidfile" ] &&
            { [ "$create_status" -eq 124 ] || [ "$create_status" -eq 137 ] || [ "$cleanup_signal_status" -ne 0 ]; }; then
            stable_empty=0
            for _ in 1 2 3 4 5 6; do
              if ! observed_ids=$(docker container ls -a --no-trunc --filter "name=^/${capacity}$" \
                --filter "label=verjson.runner-canary-owner=${capacity_owner}" --format '{{.ID}}'); then
                create_status=1
                break
              elif [ -z "$observed_ids" ]; then
                stable_empty=$((stable_empty + 1))
                if [ "$stable_empty" -ge 3 ]; then break; fi
              elif [[ "$observed_ids" =~ ^[abcdef0123456789]{64}$ ]] &&
                [ "$(docker container inspect --format '{{index .Config.Labels "verjson.runner-canary-owner"}}' "$observed_ids")" = "$capacity_owner" ]; then
                capacity_id=$observed_ids
                capacity_owned=1
                break
              else
                create_status=1
                break
              fi
              sleep 1
            done
            if [ "$capacity_owned" -eq 0 ] && [ "$stable_empty" -lt 3 ]; then create_status=1; fi
          fi
          trap 'interrupted 130' INT
          trap 'interrupted 143' TERM
          if [ "$cleanup_signal_status" -ne 0 ]; then exit "$cleanup_signal_status"; fi
          [ "$create_status" -eq 0 ]
          [ "$capacity_owned" -eq 1 ]
          [[ "$candidate_capacity_id" =~ ^[abcdef0123456789]{64}$ ]]
          [ "$candidate_capacity_id" = "$capacity_id" ]
          capacity_stats=$(docker start --attach "$capacity_id")
          [[ "$capacity_stats" =~ ^([0123456789]{1,18})\ ([0123456789]{1,3})$ ]]
          free_bytes=${BASH_REMATCH[1]}
          free_inodes=${BASH_REMATCH[2]}
          test "$free_inodes" -le 100
          test "$free_bytes" -ge 10737418240
          test "$free_inodes" -ge 10
          job_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest" --jq '.jobs | map(select(.name == "canary")) | if length == 1 then .[0].id else error("ambiguous job") end')
          observed_at=$(date -u +%FT%TZ)
          jq -nSc \
            --arg transactionNonce "$TRANSACTION_NONCE" --argjson runnerId "$RUNNER_ID" --arg runnerName "$RUNNER_NAME" \
            --arg manifest "$RELEASE_MANIFEST" --arg variant "$RELEASE_VARIANT" --arg imageDigest "$IMAGE_DIGEST" \
            --argjson runId "$GITHUB_RUN_ID" --argjson jobId "$job_id" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg headSha "$GITHUB_SHA" --arg workflowRef "$GITHUB_REF_NAME" --arg observedAt "$observed_at" --argjson freeBytes "$free_bytes" \
            --argjson freeInodePercent "$free_inodes" \
            '{schemaVersion:2,contract:"verjson-runner-promotion/2",transactionNonce:$transactionNonce,
              runner:{id:$runnerId,name:$runnerName},release:{manifest:$manifest,variant:$variant,imageDigest:$imageDigest},
              canary:{repository:"Verjson/.github",workflow:"canonical-db-backed-runner-canary",
                runUrl:("https://github.com/Verjson/.github/actions/runs/"+($runId|tostring)),
                jobUrl:("https://github.com/Verjson/.github/actions/runs/"+($runId|tostring)+"/job/"+($jobId|tostring)),
                conclusion:"success",runId:$runId,jobId:$jobId,runAttempt:$runAttempt,event:"workflow_dispatch",
                headBranch:$workflowRef,headSha:$headSha,workflowPath:".github/workflows/runner-canary.yml",workflowSha:$headSha,
                databaseServiceReachable:true,dockerServiceReachable:true,pwshExecuted:true},
              imageBuild:{conclusion:"success",imageDigest:$imageDigest,diskBytesConsumed:0},
              postCanary:{freeBytes:$freeBytes,freeInodePercent:$freeInodePercent,observedAt:$observedAt},
              dependencies:{uploadArtifactCommit:"043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",postgresImage:"postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73",nginxImage:"nginx@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913",curlImage:"curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b",buildBaseImage:"alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce"},
              artifact:{name:"runner-promotion-receipt",contentDigest:""}}' >runner-promotion-receipt.json
          digest=$(jq -cS . runner-promotion-receipt.json | tr -d '\n' | sha256sum | awk '{print $1}')
          jq --arg digest "sha256:$digest" '.artifact.contentDigest=$digest' runner-promotion-receipt.json >receipt.tmp
          mv receipt.tmp runner-promotion-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-promotion-receipt
          path: runner-promotion-receipt.json
          if-no-files-found: error
          retention-days: 7
