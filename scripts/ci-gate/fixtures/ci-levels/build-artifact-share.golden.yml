# Generated by scripts/gen-node-ci-caller.py --levels ci-levels.json -- do not edit; its pin is the `uses:` lines.
name: CI
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  artifact-mode-gate:
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      build-artifact-role: "mode-gate"
      build-artifact-mode-plan: "[{\"id\":\"setup\",\"events\":null,\"branches\":null},{\"id\":\"build\",\"events\":null,\"branches\":null},{\"id\":\"test\",\"events\":null,\"branches\":null}]"
      secretless-pr: ${{ github.event_name == 'pull_request' }}
      secretless-trusted-ref: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

  artifact-preflight:
    needs: [artifact-mode-gate, setup]
    if: ${{ always() && !cancelled() && needs.artifact-mode-gate.result == 'success' }}
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      build-artifact-role: "preflight"
      build-artifact-mode-share-eligible: ${{ fromJSON(needs.artifact-mode-gate.outputs.build-artifact-mode-share-eligible) }}
      build-artifact-plan-json: "{\"version\":1,\"pushBranches\":[\"main\"],\"secrets\":[\"NODE_AUTH_TOKEN\"],\"levels\":[{\"id\":\"setup\",\"needs\":[],\"events\":null,\"branches\":null,\"inputs\":{}},{\"id\":\"build\",\"needs\":[{\"level\":\"setup\",\"condition\":\"success\"}],\"events\":null,\"branches\":null,\"inputs\":{}},{\"id\":\"test\",\"needs\":[{\"level\":\"setup\",\"condition\":\"success\"}],\"events\":null,\"branches\":null,\"inputs\":{}}],\"buildArtifact\":{\"producer\":\"build\",\"consumers\":[\"test\"],\"paths\":[\".next\"]}}"
      build-artifact-needs-results: "{\"setup\":{\"result\":${{ toJSON(needs.setup.result) }}}}"
      build-artifact-node-version: "24"

  artifact-producer:
    needs: [artifact-mode-gate, artifact-preflight, setup]
    if: ${{ always() && !cancelled() && needs.artifact-mode-gate.result == 'success' && needs.artifact-preflight.result == 'success' && github.run_attempt == '1' && needs.artifact-preflight.outputs.build-artifact-share-selected == 'true' && (!cancelled() && needs.setup.result == 'success') }}
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      build-artifact-role: "producer"
      secretless-pr: ${{ github.event_name == 'pull_request' }}
      secretless-trusted-ref: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      build-artifact-plan-json: ${{ needs.artifact-preflight.outputs.build-artifact-producer-plan }}
      build-artifact-authorization-plan-json: "{\"version\":1,\"pushBranches\":[\"main\"],\"secrets\":[\"NODE_AUTH_TOKEN\"],\"levels\":[{\"id\":\"setup\",\"needs\":[],\"events\":null,\"branches\":null,\"inputs\":{}},{\"id\":\"build\",\"needs\":[{\"level\":\"setup\",\"condition\":\"success\"}],\"events\":null,\"branches\":null,\"inputs\":{}},{\"id\":\"test\",\"needs\":[{\"level\":\"setup\",\"condition\":\"success\"}],\"events\":null,\"branches\":null,\"inputs\":{}}],\"buildArtifact\":{\"producer\":\"build\",\"consumers\":[\"test\"],\"paths\":[\".next\"]}}"
      build-artifact-needs-results: ${{ needs.artifact-preflight.outputs.build-artifact-needs-results }}
      build-artifact-profile: ${{ needs.artifact-preflight.outputs.build-artifact-profile }}
      build-artifact-paths: ${{ needs.artifact-preflight.outputs.build-artifact-export-paths }}
      build-artifact-runner-image: ${{ needs.artifact-preflight.outputs.build-artifact-runner-image }}
      build-artifact-package-manager-version: ${{ needs.artifact-preflight.outputs.build-artifact-package-manager-version }}
      build-artifact-level-id: "build"
      build-artifact-participant-count: 2
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  setup:
    needs: [artifact-mode-gate]
    if: ${{ always() && !cancelled() && needs.artifact-mode-gate.result == 'success' && (true) }}
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      secretless-pr: ${{ github.event_name == 'pull_request' }}
      secretless-trusted-ref: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      build-artifact-role: "level"
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  build:
    needs: [artifact-mode-gate, artifact-preflight, artifact-producer, setup]
    if: ${{ always() && !cancelled() && needs.artifact-mode-gate.result == 'success' && needs.artifact-preflight.result == 'success' && (!cancelled() && needs.setup.result == 'success') }}
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      secretless-pr: ${{ github.event_name == 'pull_request' }}
      secretless-trusted-ref: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      build-artifact-role: ${{ github.run_attempt == '1' && needs.artifact-preflight.outputs.build-artifact-share-selected == 'true' && needs.artifact-producer.result == 'success' && needs.artifact-producer.outputs.build-artifact-share-available == 'true' && 'consumer' || 'level' }}
      build-artifact-authorization-plan-json: "{\"version\":1,\"pushBranches\":[\"main\"],\"secrets\":[\"NODE_AUTH_TOKEN\"],\"levels\":[{\"id\":\"setup\",\"needs\":[],\"events\":null,\"branches\":null,\"inputs\":{}},{\"id\":\"build\",\"needs\":[{\"level\":\"setup\",\"condition\":\"success\"}],\"events\":null,\"branches\":null,\"inputs\":{}},{\"id\":\"test\",\"needs\":[{\"level\":\"setup\",\"condition\":\"success\"}],\"events\":null,\"branches\":null,\"inputs\":{}}],\"buildArtifact\":{\"producer\":\"build\",\"consumers\":[\"test\"],\"paths\":[\".next\"]}}"
      build-artifact-needs-results: ${{ needs.artifact-preflight.outputs.build-artifact-needs-results }}
      build-artifact-level-id: "build"
      build-artifact-consumer-plans: ${{ needs.artifact-preflight.outputs.build-artifact-consumer-plans }}
      build-artifact-producer-plan: ${{ needs.artifact-preflight.outputs.build-artifact-producer-plan }}
      build-artifact-paths: ${{ needs.artifact-preflight.outputs.build-artifact-export-paths }}
      build-artifact-runner-image: ${{ needs.artifact-preflight.outputs.build-artifact-runner-image }}
      build-artifact-id: ${{ needs.artifact-producer.outputs.build-artifact-id }}
      build-artifact-digest: ${{ needs.artifact-producer.outputs.build-artifact-digest }}
      build-artifact-profile: ${{ needs.artifact-preflight.outputs.build-artifact-profile }}
      build-artifact-package-manager-version: ${{ needs.artifact-preflight.outputs.build-artifact-package-manager-version }}
      build-artifact-participant-count: 2
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  test:
    needs: [artifact-mode-gate, artifact-preflight, artifact-producer, setup]
    if: ${{ always() && !cancelled() && needs.artifact-mode-gate.result == 'success' && needs.artifact-preflight.result == 'success' && (!cancelled() && needs.setup.result == 'success') }}
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      secretless-pr: ${{ github.event_name == 'pull_request' }}
      secretless-trusted-ref: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      build-artifact-role: ${{ github.run_attempt == '1' && needs.artifact-preflight.outputs.build-artifact-share-selected == 'true' && needs.artifact-producer.result == 'success' && needs.artifact-producer.outputs.build-artifact-share-available == 'true' && 'consumer' || 'level' }}
      build-artifact-authorization-plan-json: "{\"version\":1,\"pushBranches\":[\"main\"],\"secrets\":[\"NODE_AUTH_TOKEN\"],\"levels\":[{\"id\":\"setup\",\"needs\":[],\"events\":null,\"branches\":null,\"inputs\":{}},{\"id\":\"build\",\"needs\":[{\"level\":\"setup\",\"condition\":\"success\"}],\"events\":null,\"branches\":null,\"inputs\":{}},{\"id\":\"test\",\"needs\":[{\"level\":\"setup\",\"condition\":\"success\"}],\"events\":null,\"branches\":null,\"inputs\":{}}],\"buildArtifact\":{\"producer\":\"build\",\"consumers\":[\"test\"],\"paths\":[\".next\"]}}"
      build-artifact-needs-results: ${{ needs.artifact-preflight.outputs.build-artifact-needs-results }}
      build-artifact-level-id: "test"
      build-artifact-consumer-plans: ${{ needs.artifact-preflight.outputs.build-artifact-consumer-plans }}
      build-artifact-producer-plan: ${{ needs.artifact-preflight.outputs.build-artifact-producer-plan }}
      build-artifact-paths: ${{ needs.artifact-preflight.outputs.build-artifact-export-paths }}
      build-artifact-runner-image: ${{ needs.artifact-preflight.outputs.build-artifact-runner-image }}
      build-artifact-id: ${{ needs.artifact-producer.outputs.build-artifact-id }}
      build-artifact-digest: ${{ needs.artifact-producer.outputs.build-artifact-digest }}
      build-artifact-profile: ${{ needs.artifact-preflight.outputs.build-artifact-profile }}
      build-artifact-package-manager-version: ${{ needs.artifact-preflight.outputs.build-artifact-package-manager-version }}
      build-artifact-participant-count: 2
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  test-levels:
    if: ${{ always() }}
    needs: [setup, build, test, artifact-mode-gate, artifact-preflight, artifact-producer]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every expected level to succeed
        env:
          LEVEL_COUNT: 3
          LEVEL_0: setup
          RESULT_0: ${{ needs.setup.result }}
          EXPECTED_0: ${{ true }}
          LEVEL_1: build
          RESULT_1: ${{ needs.build.result }}
          EXPECTED_1: ${{ true }}
          LEVEL_2: test
          RESULT_2: ${{ needs.test.result }}
          EXPECTED_2: ${{ true }}
        run: |
          set -euo pipefail
          failed=0
          for ((i = 0; i < LEVEL_COUNT; i++)); do
            id_name="LEVEL_${i}"
            result_name="RESULT_${i}"
            expected_name="EXPECTED_${i}"
            id="${!id_name}"
            result="${!result_name:-}"
            expected="${!expected_name:-}"
            case "${expected}:${result}" in
              true:success | false:skipped) ;;
              *)
                printf '::error::level %s: expected=%s result=%s\n' "${id}" "${expected}" "${result}"
                failed=1
                ;;
            esac
          done
          exit "${failed}"
      - name: Verify build artifact receipts
        uses: Verjson/.github/.github/actions/node-ci-build-artifact-aggregate@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        with:
          share-selected: ${{ github.run_attempt == '1' && needs.artifact-preflight.outputs.build-artifact-share-selected == 'true' && needs.artifact-producer.result == 'success' && needs.artifact-producer.outputs.build-artifact-share-available == 'true' }}
          policy-selected: ${{ github.run_attempt == '1' && needs.artifact-preflight.outputs.build-artifact-share-selected == 'true' }}
          mode-gate-result: ${{ needs.artifact-mode-gate.result }}
          preflight-result: ${{ needs.artifact-preflight.result }}
          producer-result: ${{ needs.artifact-producer.result }}
          upload-result: ${{ needs.artifact-producer.outputs.build-artifact-upload-result }}
          artifact-id: ${{ needs.artifact-producer.outputs.build-artifact-id }}
          artifact-digest: ${{ needs.artifact-producer.outputs.build-artifact-digest }}
          expected-lanes: ${{ needs.artifact-preflight.outputs.build-artifact-aggregate-lanes }}
          needs-json: >-
            {"build":{"result":${{ toJSON(needs.build.result) }},"outputs":{"build-artifact-receipt":${{ toJSON(needs.build.outputs.build-artifact-receipt) }},"build-artifact-receipt-id":${{ toJSON(needs.build.outputs.build-artifact-receipt-id) }},"build-artifact-receipt-digest":${{ toJSON(needs.build.outputs.build-artifact-receipt-digest) }},"build-artifact-command-digest":${{ toJSON(needs.build.outputs.build-artifact-command-digest) }}}},"test":{"result":${{ toJSON(needs.test.result) }},"outputs":{"build-artifact-receipt":${{ toJSON(needs.test.outputs.build-artifact-receipt) }},"build-artifact-receipt-id":${{ toJSON(needs.test.outputs.build-artifact-receipt-id) }},"build-artifact-receipt-digest":${{ toJSON(needs.test.outputs.build-artifact-receipt-digest) }},"build-artifact-command-digest":${{ toJSON(needs.test.outputs.build-artifact-command-digest) }}}}}
          expected-profile: ${{ needs.artifact-preflight.outputs.build-artifact-profile }}
          attempt: ${{ github.run_attempt }}
          reusable-workflow-sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          producer-plan: ${{ needs.artifact-preflight.outputs.build-artifact-producer-plan }}
          export-paths: ${{ needs.artifact-preflight.outputs.build-artifact-export-paths }}
          runner-image: ${{ needs.artifact-preflight.outputs.build-artifact-runner-image }}
          node-version: "24"
          package-manager: "npm"
          package-manager-version: ${{ needs.artifact-preflight.outputs.build-artifact-package-manager-version }}
