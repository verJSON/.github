name: CI
on:
  pull_request:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      ci-level-id: "lint"
      ci-level-fail-fast: true
      secretless-pr: true
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  unit:
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      ci-level-id: "unit"
      ci-level-fail-fast: true
      node-version: "22"
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  integration:
    needs: [unit]
    if: ${{ !cancelled() && needs.unit.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      ci-level-id: "integration"
      ci-level-fail-fast: true
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  diagnostics:
    needs: [unit]
    if: ${{ !cancelled() && (needs.unit.result == 'success' || needs.unit.result == 'failure') && (github.event_name == 'pull_request') }}
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      ci-level-id: "diagnostics"
      ci-level-fail-fast: true
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  release-gate:
    needs: [integration]
    if: ${{ !cancelled() && needs.integration.result == 'success' && ((github.event_name == 'push') && ((github.base_ref || github.ref_name) == 'main')) }}
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      ci-level-id: "release-gate"
      ci-level-fail-fast: true
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  test-levels:
    if: ${{ always() }}
    needs: [lint, unit, integration, diagnostics, release-gate]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every expected level to succeed
        env:
          LEVEL_COUNT: 5
          LEVEL_0: lint
          RESULT_0: ${{ needs.lint.result }}
          EXPECTED_0: ${{ github.event_name == 'pull_request' }}
          LEVEL_1: unit
          RESULT_1: ${{ needs.unit.result }}
          EXPECTED_1: ${{ true }}
          LEVEL_2: integration
          RESULT_2: ${{ needs.integration.result }}
          EXPECTED_2: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
          LEVEL_3: diagnostics
          RESULT_3: ${{ needs.diagnostics.result }}
          EXPECTED_3: ${{ github.event_name == 'pull_request' }}
          LEVEL_4: release-gate
          RESULT_4: ${{ needs.release-gate.result }}
          EXPECTED_4: ${{ (github.event_name == 'push') && ((github.base_ref || github.ref_name) == 'main') }}
        run: |
          set -euo pipefail
          failed=0
          for ((i = 0; i < LEVEL_COUNT; i++)); do
            id_name="LEVEL_${i}"
            result_name="RESULT_${i}"
            expected_name="EXPECTED_${i}"
            id="${!id_name}"
            result="${!result_name:-}"
            expected="${!expected_name:-}"
            case "${expected}:${result}" in
              true:success | false:skipped) ;;
              *)
                printf '::error::level %s: expected=%s result=%s\n' "${id}" "${expected}" "${result}"
                failed=1
                ;;
            esac
          done
          exit "${failed}"
