        \            or (not allow_empty and metadata.st_size <= 0)\n            or metadata.st_size > maximum\n        ):\n            raise AcquisitionError\n        return (\n            metadata.st_dev, metadata.st_ino, metadata.st_mode,\n            metadata.st_uid, metadata.st_gid, metadata.st_nlink,\n            metadata.st_size, metadata.st_mtime_ns, metadata.st_ctime_ns,\n        )\n    finally:\n        os.close(descriptor)\n\n\ndef run(args, *, capture=False, timeout=180):\n    return subprocess.run(\n        tuple(args),\n        check=False,\n        stdin=subprocess.DEVNULL,\n        stdout=subprocess.PIPE if capture else subprocess.DEVNULL,\n        stderr=subprocess.DEVNULL,\n        cwd=\"/\",\n        env=SAFE_ENV,\n        timeout=timeout,\n        close_fds=True,\n        start_new_session=True,\n    )\n\n\ndef exact_output(args, maximum=65536):\n    result = run(args, capture=True)\n    if result.returncode != 0 or len(result.stdout) > maximum:\n        raise AcquisitionError\n\
        \    return result.stdout\n\n\ndef write_root_file(path, content, mode):\n    flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC\n    if hasattr(os, \"O_NOFOLLOW\"):\n        flags |= os.O_NOFOLLOW\n    descriptor = os.open(path, flags, mode)\n    try:\n        view = memoryview(content)\n        while view:\n            written = os.write(descriptor, view)\n            if written <= 0:\n                raise AcquisitionError\n            view = view[written:]\n        os.fsync(descriptor)\n        os.fchown(descriptor, 0, 0)\n        os.fchmod(descriptor, mode)\n        metadata = os.fstat(descriptor)\n        if (\n            metadata.st_uid != 0\n            or metadata.st_gid != 0\n            or metadata.st_nlink != 1\n            or metadata.st_mode & 0o022\n            or metadata.st_mode & (stat.S_ISUID | stat.S_ISGID)\n            or capability_present(descriptor)\n        ):\n            raise AcquisitionError\n    finally:\n        os.close(descriptor)\n\n\n\
        def apt_options(cache_root, lists_root, source_parts):\n    return (\n        \"-o\", f\"Dir::Etc::sourcelist=/dev/null\",\n        \"-o\", f\"Dir::Etc::sourceparts={source_parts}\",\n        \"-o\", \"Dir::Etc::main=/dev/null\",\n        \"-o\", f\"Dir::Etc::parts={SESSION_ROOT}/empty-config\",\n        \"-o\", f\"Dir::Etc::trusted=/dev/null\",\n        \"-o\", f\"Dir::Etc::trustedparts={SESSION_ROOT}/empty-trusted\",\n        \"-o\", \"Dir::Etc::netrc=/dev/null\",\n        \"-o\", f\"Dir::Etc::netrcparts={SESSION_ROOT}/empty-auth\",\n        \"-o\", \"Dir::Etc::preferences=/dev/null\",\n        \"-o\", f\"Dir::Etc::preferencesparts={SESSION_ROOT}/empty-preferences\",\n        \"-o\", f\"Dir::State::lists={lists_root}\",\n        \"-o\", \"Dir::State::status=/var/lib/dpkg/status\",\n        \"-o\", f\"Dir::Cache={cache_root}\",\n        \"-o\", f\"Dir::Cache::archives={cache_root}/archives\",\n        \"-o\", \"APT::Architecture=amd64\",\n        \"-o\", \"APT::Get::AllowUnauthenticated=false\"\
        ,\n        \"-o\", \"Acquire::AllowInsecureRepositories=false\",\n        \"-o\", \"Acquire::AllowDowngradeToInsecureRepositories=false\",\n        \"-o\", \"Acquire::AllowWeakRepositories=false\",\n        \"-o\", \"Acquire::Check-Valid-Until=true\",\n        \"-o\", \"Acquire::Check-Date=true\",\n        \"-o\", \"Acquire::https::Verify-Peer=true\",\n        \"-o\", \"Acquire::https::Verify-Host=true\",\n    )\n\n\ndef create_apt_partial(path, apt_uid):\n    os.mkdir(path, 0o700)\n    os.chown(path, apt_uid, 0)\n    validate_directory(path, uid=apt_uid, gid=0, mask=0o077)\n\n\ndef validate_profile(profile_bytes):\n    profile = profile_bytes.decode(\"utf-8\", \"strict\")\n    lines = profile.splitlines()\n    if \"abi <abi/4.0>,\" not in {line.strip() for line in lines}:\n        raise AcquisitionError\n    if re.search(r\"flags=\\([^)]*\\bunconfined\\b\", profile) is not None:\n        raise AcquisitionError\n\n    def block(pattern):\n        starts = [\n            index for\
