        versions\": versions,\n    }), encoding=\"utf-8\")\nnpmrc_lines = [f\"{scope}:registry=http://127.0.0.1:{port}/\\n\" for scope in sorted(scopes)]\nPath(os.environ[\"MOCK_REGISTRY_NPMRC\"]).write_text(\"\".join(npmrc_lines), encoding=\"utf-8\")\nfor start, end, replacement in reversed(replacements):\n    lock_text = lock_text[:start] + replacement + lock_text[end:]\nlock_path.write_text(lock_text, encoding=\"utf-8\")\nPY\n  PNPM_CONFIG_IGNORE_PNPMFILE=true NPM_CONFIG_USERCONFIG=\"$MOCK_REGISTRY_NPMRC\" corepack pnpm install --frozen-lockfile --ignore-scripts --prefer-offline \\\n    --store-dir \"$PNPM_STORE_DIR\"\nfi\n"
    - name: Stage verified public npm blobs for cross-run reuse
      if: needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && inputs.cache && inputs.package-manager == 'npm' && hashFiles(inputs.cache-dependency-path) != '' && steps.restore-secretless-public-cache.outputs.cache-hit != 'true'
      env:
        PERSISTED_PUBLIC_CACHE_DIR: ${{ runner.temp }}/secretless-public-npm-${{ hashFiles(inputs.cache-dependency-path) }}
        RUNTIME_CACHE_DIR: ${{ runner.temp }}/secretless-runtime-cache-${{ github.run_id }}-${{ github.run_attempt }}
      run: "set -euo pipefail\n[ ! -e \"$PERSISTED_PUBLIC_CACHE_DIR\" ] && [ ! -L \"$PERSISTED_PUBLIC_CACHE_DIR\" ] || {\n  echo \"::error::persistent public cache destination was not empty after a cache miss\"\n  exit 1\n}\nmkdir -p \"$PERSISTED_PUBLIC_CACHE_DIR\"\ncp -a \"$RUNTIME_CACHE_DIR/_cacache\" \"$PERSISTED_PUBLIC_CACHE_DIR/\"\n"
    - id: save-secretless-public-cache
