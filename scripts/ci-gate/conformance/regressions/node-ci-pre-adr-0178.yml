      with:
        path: ${{ runner.temp }}/secretless-public-npm-${{ hashFiles(inputs.cache-dependency-path) }}
        key: secretless-public-npm-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}
    - name: Prepare job-scoped Playwright browser cache
      id: prepare-playwright-browser-cache
