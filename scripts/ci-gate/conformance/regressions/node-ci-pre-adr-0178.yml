        token: ${{ (inputs.secretless-pr || inputs.secretless-trusted-ref) && github.token || secrets.submodules-token || github.token }}
        persist-credentials: ${{ !(inputs.secretless-pr || inputs.secretless-trusted-ref) }}
    - name: Prepare job-scoped changelog tool cache
      if: needs.eligibility.outputs.should-run != 'false'
