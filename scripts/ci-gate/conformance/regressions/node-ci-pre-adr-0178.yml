    - name: Bound Playwright browser cache before save
      id: bound-playwright-browser-cache
      if: needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && inputs.browser-cache && hashFiles(inputs.cache-dependency-path) != '' && steps.restore-playwright-browser-cache.outputs.cache-hit != 'true'
      env:
        BROWSER_CACHE_DIR: ${{ runner.temp }}/verjson-playwright-browsers-${{ github.run_id }}-${{ github.run_attempt }}
        MAX_BROWSER_CACHE_FILES: '10000'
        MAX_BROWSER_CACHE_BYTES: '1073741824'
      run: "set -euo pipefail\n[ -d \"$BROWSER_CACHE_DIR\" ] && [ ! -L \"$BROWSER_CACHE_DIR\" ] || {\n  echo \"BROWSER_CACHE_PATH\" >&2\n  exit 1\n}\nunsafe_entry=\"$(find \"$BROWSER_CACHE_DIR\" -xdev \\! -type f \\! -type d -print -quit)\"\n[ -z \"$unsafe_entry\" ] || {\n  echo \"BROWSER_CACHE_SYMLINK:$unsafe_entry\" >&2\n  exit 1\n}\nfile_count=\"$(find \"$BROWSER_CACHE_DIR\" -xdev -type f -printf '.' | wc -c)\"\n[ \"$file_count\" -le \"$MAX_BROWSER_CACHE_FILES\" ] || {\n  echo \"BROWSER_CACHE_FILE_BOUND:$file_count\" >&2\n  exit 1\n}\nbyte_count=\"$(find \"$BROWSER_CACHE_DIR\" -xdev -type f -printf '%s\\n' | awk '{ total += $1 } END { print total + 0 }')\"\n[ \"$byte_count\" -le \"$MAX_BROWSER_CACHE_BYTES\" ] || {\n  echo \"BROWSER_CACHE_BYTE_BOUND:$byte_count\" >&2\n  exit 1\n}\nif [ \"$file_count\" -eq 0 ]; then\n  echo \"::notice::Playwright browser cache is empty; skipping cache save\"\n  printf 'should-save=false\\n' >> \"$GITHUB_OUTPUT\"\nelse\n  printf 'should-save=true\\n' >>\
        \ \"$GITHUB_OUTPUT\"\nfi\n"
    - id: save-playwright-browser-cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && inputs.browser-cache && hashFiles(inputs.cache-dependency-path) != '' && steps.restore-playwright-browser-cache.outputs.cache-hit != 'true' && steps.bound-playwright-browser-cache.outputs.should-save == 'true'
      with:
        path: ${{ runner.temp }}/verjson-playwright-browsers-${{ github.run_id }}-${{ github.run_attempt }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.cache-dependency-path) }}
    - name: Remove job-scoped Playwright browser cache
      if: always() && needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && inputs.browser-cache && steps.prepare-playwright-browser-cache.outputs.owned == 'true'
      env:
        BROWSER_CACHE_DIR: ${{ runner.temp }}/verjson-playwright-browsers-${{ github.run_id }}-${{ github.run_attempt }}
      run: rm -rf -- "$BROWSER_CACHE_DIR"
    - name: Remove job-scoped secretless runtime cache
      if: always() && needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref)
      env:
        RUNTIME_CACHE_DIR: ${{ runner.temp }}/secretless-runtime-cache-${{ github.run_id }}-${{ github.run_attempt }}
        COMPATIBILITY_ARTIFACT_DIR: ${{ runner.temp }}/secretless-compatibility-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
        PERSISTED_PUBLIC_CACHE_DIR: ${{ runner.temp }}/secretless-public-npm-${{ hashFiles(inputs.cache-dependency-path) }}
      run: rm -rf "$RUNTIME_CACHE_DIR" "$COMPATIBILITY_ARTIFACT_DIR" "$PERSISTED_PUBLIC_CACHE_DIR"
    - name: Remove restored secretless auxiliary content
      if: always() && needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && needs.acquire-secretless-dependencies.outputs.auxiliary-content-path != ''
      env:
        AUXILIARY_CONTENT_PATH: ${{ needs.acquire-secretless-dependencies.outputs.auxiliary-content-path }}
      run: 'auxiliary_target="$GITHUB_WORKSPACE/$AUXILIARY_CONTENT_PATH"

        [ ! -e "$auxiliary_target" ] || find "$auxiliary_target" -depth -delete

        '
    - name: Bound npm cache upload
      if: always() && needs.eligibility.outputs.should-run != 'false' && inputs.cache && !(inputs.secretless-pr || inputs.secretless-trusted-ref)
      env:
        CACHE_MAX_MB: ${{ inputs.cache-max-mb }}
      run: "set -euo pipefail\ncache_dir=\"$RUNNER_TEMP/verjson-npm-cache\"\nmkdir -p \"$cache_dir\"\nsize_kb=\"$(du -sk \"$cache_dir\" | cut -f1)\"\nsize_mb=\"$(( (size_kb + 1023) / 1024 ))\"\n{\n  echo \"### npm cache\"\n  echo \"- scoped path: \\`$cache_dir\\`\"\n  echo \"- size: ${size_mb} MB\"\n  echo \"- upload limit: ${CACHE_MAX_MB} MB\"\n} >> \"$GITHUB_STEP_SUMMARY\"\nif [ \"$size_kb\" -gt \"$(( CACHE_MAX_MB * 1024 ))\" ]; then\n  echo \"::warning::npm cache is ${size_mb} MB; clearing it instead of uploading more than ${CACHE_MAX_MB} MB\"\n  find \"$cache_dir\" -mindepth 1 -delete\nfi\n"
    - name: Stop cache service
      if: always() && needs.eligibility.outputs.should-run != 'false' && inputs.cache-image != ''
      env:
        CONTAINER_ID: ${{ steps.cache-service.outputs.container-id }}
      run: "[ -n \"$CONTAINER_ID\" ] || exit 0\nif ! rm_out=\"$(docker rm -f \"$CONTAINER_ID\" 2>&1)\"; then\n  grep -Fq 'No such container' <<< \"$rm_out\" || {\n    echo \"$rm_out\" >&2\n    exit 1\n  }\nfi\n"
    - name: Stop database service
      if: always() && needs.eligibility.outputs.should-run != 'false' && inputs.db-image != ''
      env:
        CONTAINER_ID: ${{ steps.db-service.outputs.container-id }}
      run: "[ -n \"$CONTAINER_ID\" ] || exit 0\n# A removal failure is not swallowed: with an OS-assigned port a leaked\n# container no longer announces itself by breaking the next job's bind,\n# so the only signal is this one. An already-gone container is fine.\nif ! rm_out=\"$(docker rm -f \"$CONTAINER_ID\" 2>&1)\"; then\n  case \"$rm_out\" in\n    *\"No such container\"*)\n      echo \"database container $CONTAINER_ID was already gone\" ;;\n    *)\n      echo \"failed to remove database container $CONTAINER_ID:\" \\\n           \"$rm_out \u2014 it may be leaking on this runner\" >&2\n      exit 1 ;;\n  esac\nfi\n"
