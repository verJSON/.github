        TRANSFER_DIR: ${{ github.workspace }}/.verjson-secretless-transfer-${{ github.run_id }}
      run: "[ ! -e \"$TRANSFER_DIR\" ] && [ ! -L \"$TRANSFER_DIR\" ] || {\n  echo \"::error::reserved secretless transfer path exists before restore\"\n  exit 1\n}\n"
