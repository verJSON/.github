      if: needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref) && needs.acquire-secretless-dependencies.result != 'success'
      env:
        ACQUISITION_RESULT: ${{ needs.acquire-secretless-dependencies.result }}
      run: 'echo "::error::secretless dependency acquisition did not succeed (result=${ACQUISITION_RESULT}); eligibility likely did not complete. Re-run the workflow." >&2

