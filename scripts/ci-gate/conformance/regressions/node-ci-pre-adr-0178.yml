      shell: bash
      run: "set -euo pipefail\nif [ \"${RUNNER_OS:-}\" != \"Linux\" ]; then\n  echo '::error::trusted compatibility sandbox requires a Linux GitHub-hosted runner' >&2\n  exit 1\nfi\nsandbox_acquirer_source() {\n  /usr/bin/cat <<'PY'\nimport errno\nimport hashlib\nimport os\nimport posixpath\nimport pwd\nimport re\nimport shutil\nimport signal\nimport stat\nimport subprocess\nimport sys\n\nACQUISITION_PHASES = (\n    \"package-acquisition-key\",\n    \"package-acquisition-apt-update\",\n    \"package-acquisition-plan\",\n    \"package-acquisition-install\",\n    \"package-acquisition-status\",\n    \"package-acquisition-metadata\",\n    \"package-acquisition-download\",\n    \"package-acquisition-archive\",\n    \"package-acquisition-member\",\n    \"package-acquisition-staging\",\n)\nACQUISITION_DIAGNOSTICS = {\n    phase: (\n        \"::error::trusted compatibility sandbox filesystem boundary unsafe \"\n        f\"phase={phase}\\n\"\n    ).encode(\"ascii\")\n    for phase in ACQUISITION_PHASES\n\
        }\nUNKNOWN_DIAGNOSTIC = (\n    b\"::error::trusted compatibility sandbox filesystem boundary unsafe \"\n    b\"phase=unknown\\n\"\n)\nCURRENT_PHASE = ACQUISITION_PHASES[0]\nSESSION_ROOT = \"/var/lib/verjson-compatibility-apt\"\nSTAGE_ROOT = \"/run/verjson-compatibility-sandbox\"\nPROFILE_PATH = f\"{STAGE_ROOT}/bwrap-userns-restrict\"\nPACKAGE_MEMBER = \"usr/share/apparmor/extra-profiles/bwrap-userns-restrict\"\nSAFE_KEY = \"/etc/apt/trusted.gpg.d/ubuntu-keyring-2018-archive.gpg\"\nSAFE_ENV = {\n    \"PATH\": \"/usr/sbin:/usr/bin:/sbin:/bin\",\n    \"HOME\": \"/nonexistent\",\n    \"DEBIAN_FRONTEND\": \"noninteractive\",\n    \"LC_ALL\": \"C\",\n    \"APT_CONFIG\": \"/dev/null\",\n}\nOWNED_ROOTS = {}\n\n\nclass AcquisitionError(RuntimeError):\n    pass\n\n\ndef record_owned_root(path):\n    metadata = os.lstat(path)\n    validate_directory(path)\n    OWNED_ROOTS[path] = (metadata.st_dev, metadata.st_ino)\n\n\ndef cleanup_owned_root(path):\n    identity = OWNED_ROOTS.get(path)\n  \
        \  if identity is None:\n        return\n    try:\n        metadata = os.lstat(path)\n    except FileNotFoundError:\n        OWNED_ROOTS.pop(path, None)\n        return\n    if (\n        not stat.S_ISDIR(metadata.st_mode)\n        or metadata.st_uid != 0\n        or metadata.st_gid != 0\n        or metadata.st_mode & 0o022\n        or (metadata.st_dev, metadata.st_ino) != identity\n    ):\n        raise AcquisitionError\n    shutil.rmtree(path)\n    try:\n        os.lstat(path)\n    except FileNotFoundError:\n        OWNED_ROOTS.pop(path, None)\n    else:\n        raise AcquisitionError\n\n\ndef interrupted(_signum, _frame):\n    raise AcquisitionError\n\n\ndef require_absent(path):\n    try:\n        os.lstat(path)\n    except FileNotFoundError:\n        return\n    raise AcquisitionError\n\n\ndef capability_present(descriptor):\n    try:\n        os.getxattr(descriptor, \"security.capability\")\n    except OSError as error:\n        absent = {errno.ENODATA}\n        if hasattr(errno,\
