        \ whatever else listens on the host. The\n  # value is still exported byte-identical \u2014 no rewrite, no failed job,\n  # the caller may well mean an external database \u2014 but the step says\n  # which key looks like it meant THIS one and never named it. This is\n  # the only place a scheme is looked at, and it only prints advice.\n  # shellcheck disable=SC2016 # Match the caller's literal placeholder.\n  case \"$raw_value\" in\n    *'${DB_PORT}'*) ;;\n    *)\n    case \"$value\" in\n      *postgres://*|*postgresql://*)\n        echo \"note: db-env $key carries no \\${DB_PORT} placeholder, so it is\" \\\n             \"not configured with the selected database port and may NOT point\" \\\n             \"at the database this step started ($DB_HOST:$DB_PORT).\" >&2 ;;\n    esac\n    ;;\n  esac\n  printf '%s=%s\\n' \"$key\" \"$value\" >> \"$GITHUB_ENV\"\ndone\n# Written last so these win the last-wins $GITHUB_ENV merge outright.\necho \"DB_HOST=$DB_HOST\" >> \"$GITHUB_ENV\"\necho\
        \ \"DB_PORT=$DB_PORT\" >> \"$GITHUB_ENV\"\n"
    - name: Start cache service
      id: cache-service
      if: needs.eligibility.outputs.should-run != 'false' && inputs.cache-image != ''
      env:
        CACHE_IMAGE: ${{ inputs.cache-image }}
        CACHE_ENV: ${{ inputs.cache-env }}
        CACHE_HEALTH_CMD: ${{ inputs.cache-health-cmd }}
        DB_SERVICE_ENABLED: ${{ inputs.db-image != '' }}
      run: "set -euo pipefail\n# Mirrors the workflow_call `default:` above so the extracted run:\n# block behaves identically when exercised directly (test harness).\nCACHE_HEALTH_CMD=\"${CACHE_HEALTH_CMD:-redis-cli ping}\"\nDB_SERVICE_ENABLED=\"${DB_SERVICE_ENABLED:-false}\"\ncontainer_scope=\"${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB:-}-${RUNNER_NAME:-}-${RUNNER_WORKSPACE:-}\"\nCONTAINER_NAME=\"ci-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(\n  printf '%s' \"$container_scope\" | sha256sum | cut -c1-12)\"\ndocker_env=()\ncache_env_lines=()\nif [[ \"$CACHE_ENV\" == *$'\\r'* ]]; then\n  echo \"cache-env: carriage returns are not permitted\" >&2\n  exit 1\nfi\nwhile IFS= read -r line; do\n  case \"${line#\"${line%%[![:space:]]*}\"}\" in\n    ''|'#'*) continue ;;\n  esac\n  case \"$line\" in\n    *=*) ;;\n    *) echo \"cache-env: '$line' is not a KEY=VALUE pair\" >&2; exit 1 ;;\n  esac\n  key=\"${line%%=*}\"\n  if [[ ! \"$key\" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then\n    echo \"\
        cache-env: '$key' is not a valid environment variable name\" >&2\n    exit 1\n  fi\n  key_upper=\"${key^^}\"\n  case \"$key_upper\" in\n    DB_HOST|DB_PORT)\n      if [ \"$DB_SERVICE_ENABLED\" = true ]; then\n        echo \"cache-env: '$key' is reserved while the database service is enabled\" >&2\n        exit 1\n      fi ;;\n    BASH_ENV|BASH_XTRACEFD|ENV|PS4|SHELLOPTS|BASHOPTS|PATH|\\\n    NODE_OPTIONS|NODE_PATH|NODE_EXTRA_CA_CERTS|\\\n    PYTHONPATH|PYTHONHOME|PYTHONSTARTUP|PYTHONUSERBASE|\\\n    PERL5OPT|PERL5LIB|RUBYOPT|RUBYLIB|JAVA_TOOL_OPTIONS|\\\n    JDK_JAVA_OPTIONS|_JAVA_OPTIONS|LD_*|DYLD_*|GITHUB_*|RUNNER_*|\\\n    ACTIONS_*|GH_*|\\\n    GIT_ASKPASS|SSH_ASKPASS|GIT_CONFIG_*|GIT_SSL_CAINFO|\\\n    GIT_SSL_CAPATH|NPM_CONFIG_*|\\\n    HTTP_PROXY|HTTPS_PROXY|ALL_PROXY|NO_PROXY|http_proxy|https_proxy|\\\n    all_proxy|no_proxy|SSL_CERT_FILE|SSL_CERT_DIR|CURL_CA_BUNDLE|\\\n    REQUESTS_CA_BUNDLE|GCONV_PATH)\n      echo \"cache-env: '$key' cannot override runner execution or\
        \ workflow state\" >&2\n      exit 1 ;;\n  esac\n  cache_env_lines+=(\"$line\")\n  docker_env+=(-e \"$line\")\ndone <<< \"$CACHE_ENV\"\nsweep_cutoff=$(( $(date +%s) - 6 * 60 * 60 ))\nif ! stale_listing=\"$(docker ps -a --filter label=verjson-ci-cache=1 \\\n    --format '{{.ID}} {{.CreatedAt}}' 2>&1)\"; then\n  echo \"warning: could not list CI cache containers to sweep: $stale_listing\" >&2\n  stale_listing=\"\"\nfi\nwhile read -r stale_id stale_date stale_time stale_zone _; do\n  [ -n \"$stale_id\" ] || continue\n  stale_epoch=\"$(date -d \"$stale_date $stale_time $stale_zone\" +%s 2>/dev/null || true)\"\n  case \"$stale_epoch\" in\n    ''|*[!0-9]*)\n      echo \"warning: not sweeping $stale_id: unreadable creation time\" >&2\n      continue ;;\n  esac\n  [ \"$stale_epoch\" -lt \"$sweep_cutoff\" ] || continue\n  docker rm -f \"$stale_id\" >/dev/null 2>&1 \\\n    || echo \"warning: could not remove leaked cache container $stale_id\" >&2\ndone <<< \"$stale_listing\"\nrun_rc=0\nCONTAINER_ID=\"\
        $(docker run -d --name \"$CONTAINER_NAME\" \\\n  --label verjson-ci-cache=1 -p 127.0.0.1::6379 \\\n  ${docker_env[@]+\"${docker_env[@]}\"} \"$CACHE_IMAGE\")\" || run_rc=$?\n[ -z \"$CONTAINER_ID\" ] || echo \"container-id=$CONTAINER_ID\" >> \"$GITHUB_OUTPUT\"\n[ \"$run_rc\" -eq 0 ] || exit \"$run_rc\"\nport_map=\"$(docker port \"$CONTAINER_ID\" 6379/tcp)\"\nCACHE_PORT=\"${port_map%%$'\\n'*}\"\nCACHE_PORT=\"${CACHE_PORT##*:}\"\ncase \"$CACHE_PORT\" in\n  ''|*[!0-9]*)\n    echo \"could not read the mapped cache port from '$port_map'\" >&2\n    docker logs \"$CONTAINER_ID\" >&2 || true\n    exit 1 ;;\nesac\necho \"port=$CACHE_PORT\" >> \"$GITHUB_OUTPUT\"\nfor line in ${cache_env_lines[@]+\"${cache_env_lines[@]}\"}; do\n  key=\"${line%%=*}\"\n  value=\"${line#*=}\"\n  if [ \"$key\" = CACHE_PORT ]; then\n    echo \"cache-env CACHE_PORT: ignored; the workflow exports Docker's mapped port\" >&2\n    continue\n  fi\n  value=\"${value//\\$\\{CACHE_PORT\\}/$CACHE_PORT}\"\n  printf '%s=%s\\\
        n' \"$key\" \"$value\" >> \"$GITHUB_ENV\"\ndone\necho \"CACHE_PORT=$CACHE_PORT\" >> \"$GITHUB_ENV\"\nready=false\n# CACHE_HEALTH_CMD is read into an array (whitespace-split) rather\n# than expanded unquoted: unquoted expansion also undergoes\n# pathname/glob expansion, so a command containing `*`/`?`/`[...]`\n# that happened to match a file in the runner's working directory\n# would silently gain extra argv the caller never wrote. Either way\n# the tokens reach `docker exec` as literal argv, never through a\n# shell or `eval`, so they cannot escape to the runner regardless of\n# content (#986).\nIFS=' ' read -r -ra CACHE_HEALTH_CMD_ARGV <<< \"$CACHE_HEALTH_CMD\"\nfor _attempt in {1..30}; do\n  # The default `redis-cli ping` keeps today's exact check byte-for-byte\n  # (exit status AND a literal PONG reply \u2014 some failure paths still\n  # exit 0 while printing an error, which is why the default alone\n  # isn't just an exit-code check). A caller-supplied cache-health-cmd\n  #\
        \ is treated like any other engine's health command: success is\n  # exit code 0.\n  if [ \"$CACHE_HEALTH_CMD\" = \"redis-cli ping\" ]; then\n    if docker exec \"$CONTAINER_ID\" redis-cli ping 2>/dev/null | grep -qx PONG; then\n      ready=true\n      break\n    fi\n  else\n    if docker exec \"$CONTAINER_ID\" \"${CACHE_HEALTH_CMD_ARGV[@]}\" >/dev/null 2>&1; then\n      ready=true\n      break\n    fi\n  fi\n  sleep 1\ndone\nif [ \"$ready\" != true ]; then\n  docker logs \"$CONTAINER_ID\" >&2 || true\n  echo \"cache image '$CACHE_IMAGE' failed health check '$CACHE_HEALTH_CMD' after 30 attempts\" >&2\n  exit 1\nfi\n"
