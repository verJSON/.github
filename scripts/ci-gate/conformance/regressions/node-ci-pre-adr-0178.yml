    - name: Start database service
      id: db-service
      if: needs.eligibility.outputs.should-run != 'false' && inputs.db-image != ''
      env:
        DB_IMAGE: ${{ inputs.db-image }}
        DB_HOST_MODE: ${{ inputs.db-host }}
        DB_ENV: ${{ inputs.db-env }}
        DB_CONTAINER_PORT: ${{ inputs.db-port }}
        DB_HEALTH_CMD: ${{ inputs.db-health-cmd }}
      run: "set -euo pipefail\nDB_HOST_MODE=\"${DB_HOST_MODE:-auto}\"\n# Defaults mirror the workflow_call `default:` above so the extracted\n# run: block behaves identically when exercised directly (test harness).\nDB_CONTAINER_PORT=\"${DB_CONTAINER_PORT:-5432}\"\nDB_HEALTH_CMD=\"${DB_HEALTH_CMD:-pg_isready}\"\n# Name the container per JOB, not per run: run_id/run_attempt are shared\n# by every job of a run, so a name built from them alone collides as soon\n# as two DB-backed jobs are in flight on one persistent self-hosted host\n# (#116). Two concurrent jobs are normally served by two distinct runner\n# processes \u2014 a runner executes one job at a time \u2014 so RUNNER_NAME /\n# RUNNER_WORKSPACE separate them even when the run and job ids match\n# (including two legs of a caller's matrix, which reach this reusable as\n# separate jobs). Nothing load-bearing rides on that premise: the name is\n# for humans reading `docker ps`, while every operation below uses the\n# container ID. If the\
        \ premise ever fails, `docker run --name` refuses the\n# second job \u2014 which fails loudly and, having no ID, cannot tear down the\n# first job's live container. (`sha256sum` is GNU coreutils: fine for the\n# Linux self-hosted pool this workflow targets.)\ncontainer_scope=\"${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB:-}-${RUNNER_NAME:-}-${RUNNER_WORKSPACE:-}\"\nCONTAINER_NAME=\"ci-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(\n  printf '%s' \"$container_scope\" | sha256sum | cut -c1-12)\"\ndocker_env=()\ndb_env_lines=()\nif [[ \"$DB_ENV\" == *$'\\r'* ]]; then\n  echo \"db-env: carriage returns are not permitted\" >&2\n  exit 1\nfi\nwhile IFS= read -r line; do\n  # `db-env` is dotenv-shaped, so blank lines and `#` comments are a\n  # natural thing to write in the caller's block scalar. Skip them at\n  # any indentation; every surviving line must be KEY=VALUE, which is\n  # enforced where the lines are exported below.\n  case \"${line#\"${line%%[![:space:]]*}\"}\" in\n\
        \    ''|'#'*) continue ;;\n  esac\n  case \"$line\" in\n    *=*) ;;\n    *)\n      echo \"db-env: '$line' is not a KEY=VALUE pair. Every db-env line\" \\\n           \"must be KEY=VALUE; blank lines and #-comments are ignored.\" >&2\n      exit 1 ;;\n  esac\n  key=\"${line%%=*}\"\n  if [[ ! \"$key\" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then\n    echo \"db-env: '$key' is not a valid environment variable name\" >&2\n    exit 1\n  fi\n  key_upper=\"${key^^}\"\n  case \"$key_upper\" in\n    BASH_ENV|BASH_XTRACEFD|ENV|PS4|SHELLOPTS|BASHOPTS|PATH|\\\n    NODE_OPTIONS|NODE_PATH|NODE_EXTRA_CA_CERTS|\\\n    PYTHONPATH|PYTHONHOME|PYTHONSTARTUP|PYTHONUSERBASE|\\\n    PERL5OPT|PERL5LIB|RUBYOPT|RUBYLIB|JAVA_TOOL_OPTIONS|\\\n    JDK_JAVA_OPTIONS|_JAVA_OPTIONS|LD_*|DYLD_*|GITHUB_*|RUNNER_*|\\\n    ACTIONS_*|GH_*|\\\n    GIT_ASKPASS|SSH_ASKPASS|GIT_CONFIG_*|GIT_SSL_CAINFO|\\\n    GIT_SSL_CAPATH|NPM_CONFIG_*|\\\n    HTTP_PROXY|HTTPS_PROXY|ALL_PROXY|NO_PROXY|http_proxy|https_proxy|\\\n    all_proxy|no_proxy|SSL_CERT_FILE|SSL_CERT_DIR|CURL_CA_BUNDLE|\\\
        \n    REQUESTS_CA_BUNDLE|GCONV_PATH)\n      echo \"db-env: '$key' cannot override runner execution or workflow state\" >&2\n      exit 1 ;;\n  esac\n  db_env_lines+=(\"$line\")\n  case \"$line\" in\n    POSTGRES_*) docker_env+=(-e \"$line\") ;;\n  esac\ndone <<< \"$DB_ENV\"\n# Sweep leaked containers from earlier jobs. While the bind was a fixed\n# 5432 a leak announced itself by breaking the next job's start; an\n# OS-assigned port makes a leak invisible, so it would pile up on a\n# persistent self-hosted host. The `verjson-ci` label scopes the sweep to\n# containers this workflow started; the age bound is computed HERE\n# because docker offers no usable one: `until` is a prune-only filter\n# (`docker ps --filter until=\u2026` is a hard \"invalid filter\" error, not an\n# empty list), and `docker container prune` reaps only STOPPED\n# containers while a leaked one is typically still running.\n#\n# Only containers older than 6h are reaped. A job cannot outlive\n# GitHub caps `timeout-minutes`\
        \ at 360 even when a caller supplies a\n# larger value, and this container is created after the job starts, so\n# a labelled container older than 6h cannot belong to a job that is\n# still running \u2014 while anything younger may be a concurrent job's live\n# database, which this must never remove (#116).\n# Best-effort, but never silent: a listing or a removal that fails warns\n# instead of quietly sweeping nothing.\nsweep_cutoff=$(( $(date +%s) - 6 * 60 * 60 ))\nif ! stale_listing=\"$(docker ps -a --filter label=verjson-ci=1 \\\n    --format '{{.ID}} {{.CreatedAt}}' 2>&1)\"; then\n  echo \"warning: could not list CI database containers to sweep:\" \\\n       \"$stale_listing\" >&2\n  stale_listing=\"\"\nfi\n# `{{.CreatedAt}}` is `YYYY-MM-DD HH:MM:SS \xB1ZZZZ TZ`; the first three\n# fields are what `date -d` needs (the trailing zone NAME is ambiguous).\nwhile read -r stale_id stale_date stale_time stale_zone _; do\n  [ -n \"$stale_id\" ] || continue\n  stale_epoch=\"$(date -d \"\
        $stale_date $stale_time $stale_zone\" +%s 2>/dev/null || true)\"\n  case \"$stale_epoch\" in\n    ''|*[!0-9]*)\n      echo \"warning: not sweeping $stale_id: cannot read its creation\" \\\n           \"time from '$stale_date $stale_time $stale_zone'\" >&2\n      continue ;;\n  esac\n  [ \"$stale_epoch\" -lt \"$sweep_cutoff\" ] || continue\n  echo \"removing leaked CI database container $stale_id\" \\\n       \"(created $stale_date $stale_time)\"\n  docker rm -f \"$stale_id\" >/dev/null 2>&1 \\\n    || echo \"warning: could not remove leaked container $stale_id\" >&2\ndone <<< \"$stale_listing\"\n# Loopback-only, OS-assigned host port: a fixed 5432:5432 bind is taken\n# by the first DB-backed job on the host, so the second one could not\n# start (#116). Binding 127.0.0.1 also keeps the caller's DB image off\n# the pool network (ADR 0021).\n#\n# The ID docker assigns is the handle for everything that follows: it is\n# unique by construction, so no operation here (and no teardown) can\
        \ ever\n# reach another job's container. Published as the step output before the\n# first thing that can fail, so `if: always()` teardown removes exactly\n# this container; a `docker run` that fails without printing an ID leaves\n# nothing to remove, and the label sweep above catches any such orphan.\nrun_rc=0\nCONTAINER_ID=\"$(docker run -d --name \"$CONTAINER_NAME\" \\\n  --label verjson-ci=1 -p \"127.0.0.1::${DB_CONTAINER_PORT}\" \\\n  ${docker_env[@]+\"${docker_env[@]}\"} \"$DB_IMAGE\")\" || run_rc=$?\n[ -z \"$CONTAINER_ID\" ] || echo \"container-id=$CONTAINER_ID\" >> \"$GITHUB_OUTPUT\"\nif [ \"$run_rc\" -ne 0 ]; then\n  echo \"failed to start the database container (name $CONTAINER_NAME)\" >&2\n  exit \"$run_rc\"\nfi\n# The host port is only known once the daemon has assigned it, so read\n# it back \u2014 it is what the caller's `${DB_PORT}` placeholder becomes\n# below, and without it their DATABASE_URL points at a port nothing is\n# listening on. Captured whole, then split\
        \ in-shell: `docker port` prints one line per\n# mapping, and piping it into `head` would leave docker writing to a\n# closed pipe \u2014 a SIGPIPE that `pipefail` turns into a failed step. The\n# port is taken from after the LAST colon, so a HOST:PORT of any shape\n# parses.\nport_map=\"$(docker port \"$CONTAINER_ID\" \"${DB_CONTAINER_PORT}/tcp\")\"\nDB_PORT=\"${port_map%%$'\\n'*}\"\nDB_PORT=\"${DB_PORT##*:}\"\ncase \"$DB_PORT\" in\n  ''|*[!0-9]*)\n    # An image that exits immediately dies here, before the health loop\n    # below can dump anything \u2014 so dump the container's logs on this\n    # branch too, or the operator sees only \"could not read the port\".\n    echo \"could not read the mapped host port from '$port_map'\" >&2\n    docker logs \"$CONTAINER_ID\" >&2 || true\n    exit 1 ;;\nesac\nMAPPED_DB_PORT=\"$DB_PORT\"\n# DB_HEALTH_CMD is caller-supplied data (default: pg_isready, this\n# workflow's existing check \u2014 byte-identical for every caller that\n# does not\
        \ set db-health-cmd). Read into an array (whitespace-split,\n# same as unquoted word-splitting) rather than expanded unquoted:\n# unquoted expansion also undergoes pathname/glob expansion, so a\n# command containing `*`/`?`/`[...]` that happened to match a file in\n# the runner's working directory would silently gain extra argv the\n# caller never wrote. An array built by `read` performs no such\n# expansion. Either way the tokens reach `docker exec` as literal\n# argv, never through a shell or `eval`, so they cannot escape to the\n# runner regardless of content (#986).\nIFS=' ' read -r -ra DB_HEALTH_CMD_ARGV <<< \"$DB_HEALTH_CMD\"\nfor attempt in $(seq 1 30); do\n  if docker exec \"$CONTAINER_ID\" \"${DB_HEALTH_CMD_ARGV[@]}\" >/dev/null 2>&1; then\n    echo \"database is ready\"\n    break\n  fi\n  if [ \"$attempt\" -eq 30 ]; then\n    echo \"database image '$DB_IMAGE' failed health check '$DB_HEALTH_CMD' after 30 attempts\" >&2\n    docker logs \"$CONTAINER_ID\" >&2 || true\n \
        \   exit 1\n  fi\n  sleep 2\ndone\nprobe_database_endpoint() {\n  # shellcheck disable=SC2016 # Positional parameters expand in the child bash.\n  timeout 2 bash -c 'exec 3<>\"/dev/tcp/$1/$2\"' _ \"$1\" \"$2\" 2>/dev/null\n}\ncontainer_endpoint() {\n  local candidate octet octet1 octet2 octet3 octet4 extra\n  candidate=\"$(docker inspect --format \\\n    '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \\\n    \"$CONTAINER_ID\")\"\n  case \"$candidate\" in\n    ''|*[!0-9.]*)\n      echo \"could not read a valid database container bridge IPv4 from '$candidate'\" >&2\n      exit 1 ;;\n  esac\n  IFS=. read -r octet1 octet2 octet3 octet4 extra <<< \"$candidate\"\n  for octet in \"$octet1\" \"$octet2\" \"$octet3\" \"$octet4\"; do\n    case \"$octet\" in\n      ''|*[!0-9]*|0[0-9]*)\n        echo \"could not read a valid database container bridge IPv4 from '$candidate'\" >&2\n        exit 1 ;;\n    esac\n    [ \"$octet\" -le 255 ] || {\n      echo \"could not read a valid database\
        \ container bridge IPv4 from '$candidate'\" >&2\n      exit 1\n    }\n  done\n  [ -z \"$extra\" ] || {\n    echo \"could not read a valid database container bridge IPv4 from '$candidate'\" >&2\n    exit 1\n  }\n  DB_HOST=\"$candidate\"\n  DB_PORT=\"$DB_CONTAINER_PORT\"\n}\ncase \"$DB_HOST_MODE\" in\n  auto)\n    DB_HOST=127.0.0.1\n    DB_PORT=\"$MAPPED_DB_PORT\"\n    if ! probe_database_endpoint \"$DB_HOST\" \"$DB_PORT\"; then\n      container_endpoint\n    fi ;;\n  loopback)\n    DB_HOST=127.0.0.1\n    DB_PORT=\"$MAPPED_DB_PORT\" ;;\n  container) container_endpoint ;;\n  *)\n    echo \"db-host: '$DB_HOST_MODE' is invalid; use auto, loopback, or container\" >&2\n    exit 1 ;;\nesac\nif ! probe_database_endpoint \"$DB_HOST\" \"$DB_PORT\"; then\n  echo \"database endpoint $DB_HOST:$DB_PORT is not reachable from the runner\" >&2\n  exit 1\nfi\necho \"host=$DB_HOST\" >> \"$GITHUB_OUTPUT\"\necho \"port=$DB_PORT\" >> \"$GITHUB_OUTPUT\"\n# The caller marks the endpoint with literal `${DB_HOST}`\
        \ and\n# `${DB_PORT}` placeholders \u2014 braces required. Those exact token\n# replacements ARE the contract \u2014 there is\n# no scheme detection, no host parsing and no guessing which colon is a\n# port, so the step can neither splice a port into a value it misreads\n# (an earlier URL rewrite turned `API_URL=https://internal.svc/v1` into\n# `https://internal.svc:49187/v1`) nor reject one whose shape it fails\n# to recognise (`--port=3000` used to fail the whole job).\nfor line in ${db_env_lines[@]+\"${db_env_lines[@]}\"}; do\n  key=\"${line%%=*}\"\n  value=\"${line#*=}\"\n  # $GITHUB_ENV is last-wins and the db-env lines are appended after the\n  # step's own exports, so a caller's DB_PORT line would silently replace\n  # the real mapped port for every later step. Drop it, loudly.\n  if [ \"$key\" = \"DB_PORT\" ] || [ \"$key\" = \"DB_HOST\" ]; then\n    echo \"db-env $key: ignored \u2014 $key is set by this step to the\" \\\n         \"selected reachable database endpoint\" >&2\n\
        \    continue\n  fi\n  # A hardcoded 5432 is REJECTED, never quietly rewritten. The port is\n  # OS-assigned now, so a literal 5432 aims the caller's suite at\n  # whatever else listens on the host's 5432 \u2014 on a persistent\n  # self-hosted runner that can be a real database a migration would\n  # truncate \u2014 and deciding which 5432 \"meant the database\" is exactly\n  # the guessing this placeholder contract exists to remove. Checked on\n  # what the CALLER wrote, before substitution.\n  #\n  # Matched only in port position: `:5432` at end or before a\n  # non-alphanumeric (so `:54321` and `:5432a` are untouched), a libpq\n  # `port=5432` as a whole keyword and not followed by another digit,\n  # and a bare 5432 as the value of a *_PORT key.\n  #\n  # The `port=` keyword needs a boundary on BOTH sides. The trailing\n  # one keeps `--port=54321` and `--report=1` untouched; the leading\n  # one (value start, or a non-alphanumeric before it) keeps values\n  # where \"port\"\
        \ is merely spelled inside a longer word \u2014 `--report=`,\n  # `--export=` \u2014 from being read as a port. A dash IS a boundary, so\n  # `--port=5432` and `--inspect-port=5432` are still rejected:\n  # treating `-` as part of the word would also have to accept\n  # `?port=5432`, a real libpq port in a postgres URI query string,\n  # and silently aiming the suite at another database is the failure\n  # this rejection exists to prevent.\n  hardcoded=\"\"\n  case \"$value\" in\n    *:5432|*:5432[!0-9A-Za-z]*) hardcoded=\"a literal :5432 port\" ;;\n    *[!0-9A-Za-z]port=5432|port=5432|*[!0-9A-Za-z]port=5432[!0-9]*|port=5432[!0-9]*)\n      hardcoded=\"a literal port=5432\" ;;\n  esac\n  case \"$key\" in\n    PGPORT|PORT|*_PORT)\n      if [ \"$value\" = \"5432\" ]; then hardcoded=\"the literal port 5432\"; fi ;;\n  esac\n  if [ -n \"$hardcoded\" ]; then\n    echo \"db-env $key: '$value' hardcodes $hardcoded. This step publishes\" \\\n         \"the database on an OS-assigned host\
        \ port so two DB-backed jobs\" \\\n         \"can share a runner, so 5432 is someone else's database. Write\" \\\n         \"\\${DB_PORT} where the port belongs (e.g.\" \\\n         \"DATABASE_URL=postgres://app:pw@127.0.0.1:\\${DB_PORT}/app) and it\" \\\n         \"is substituted with the real port.\" >&2\n    exit 1\n  fi\n  # `${DB_PORT}` is the only placeholder spelling. A brace-less\n  # `$DB_PORT` is REJECTED, not substituted: it has no closing\n  # boundary, so `$DB_PORTX` would quietly become `49187X` while\n  # `${DB_PORT}X` is exact. One spelling that cannot be got subtly\n  # wrong is worth more than a second convenience spelling that can.\n  # Checked before substitution \u2014 `${DB_PORT}` does not contain the\n  # literal `$DB_PORT` (the brace sits between), so only the\n  # brace-less form reaches here.\n  # `$DB_PORT` and `$DB_HOST` are intentionally literal in these patterns.\n  # shellcheck disable=SC2016\n  case \"$value\" in\n    *'$DB_PORT'*)\n      echo \"db-env\
