      with:
        path: ${{ runner.temp }}/secretless-public-npm-${{ hashFiles(inputs.cache-dependency-path) }}
        key: secretless-public-npm-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}
    - name: Download pinned secretless dependency transfer implementation
      if: needs.eligibility.outputs.should-run != 'false' && (inputs.secretless-pr || inputs.secretless-trusted-ref)
      env:
        JOB_WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
