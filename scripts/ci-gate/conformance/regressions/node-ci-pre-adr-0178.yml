        BROWSER_CACHE_DIR: ${{ runner.temp }}/verjson-playwright-browsers-${{ github.run_id }}-${{ github.run_attempt }}
      run: "set -euo pipefail\n[ ! -e \"$BROWSER_CACHE_DIR\" ] && [ ! -L \"$BROWSER_CACHE_DIR\" ] || {\n  echo \"BROWSER_CACHE_DESTINATION_OCCUPIED\" >&2\n  exit 1\n}\ninstall -d -m 0700 \"$BROWSER_CACHE_DIR\"\nprintf 'PLAYWRIGHT_BROWSERS_PATH=%s\\n' \"$BROWSER_CACHE_DIR\" >> \"$GITHUB_ENV\"\nprintf 'owned=true\\n' >> \"$GITHUB_OUTPUT\"\n"
    - id: restore-playwright-browser-cache
