        \ & 0o022\n            or before.st_mode & (stat.S_ISUID | stat.S_ISGID)\n            or executable != bool(before.st_mode & 0o111)\n            or capability_present(descriptor)\n            or before.st_size <= 0\n            or before.st_size > maximum\n        ):\n            raise AcquisitionError\n        content = bytearray()\n        while len(content) <= maximum:\n            chunk = os.read(descriptor, min(1024 * 1024, maximum + 1 - len(content)))\n            if not chunk:\n                break\n            content.extend(chunk)\n        after = os.fstat(descriptor)\n        identity = (\n            before.st_dev,\n            before.st_ino,\n            before.st_mode,\n            before.st_uid,\n            before.st_gid,\n            before.st_nlink,\n            before.st_size,\n            before.st_mtime_ns,\n            before.st_ctime_ns,\n        )\n        if identity != (\n            after.st_dev,\n            after.st_ino,\n            after.st_mode,\n\
