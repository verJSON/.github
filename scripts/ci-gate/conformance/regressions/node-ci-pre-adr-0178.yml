        utf-8\")) > 1024 * 1024:\n        raise SystemExit(\"compatibility registry response exceeds the 1 MiB bound\")\n    try:\n        return json.loads(result.stdout)\n    except json.JSONDecodeError as error:\n        raise SystemExit(f\"registry returned invalid JSON during {purpose}: {error}\")\n\nentries_path = Path(os.environ[\"PRIVATE_CACHE_ENTRIES\"])\nif not entries_path.is_file() or entries_path.is_symlink():\n    raise SystemExit(\"compatibility resolution requires the validated private cache entry file\")\nknown_downloads = {}\nfor line in entries_path.read_text(encoding=\"utf-8\").splitlines():\n    resolved, digest_hex = line.split(\"\\t\")\n    known_downloads[resolved] = digest_hex\n\nlanes = []\nversion_pattern = re.compile(\n    r\"(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\"\n    r\"(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?\"\n)\n\ndef parse_core(value):\n    match = re.fullmatch(\n        r\"((?:0|[1-9][0-9]*))\\\
        .((?:0|[1-9][0-9]*))\\.((?:0|[1-9][0-9]*))\",\n        value,\n    )\n    return tuple(int(part) for part in match.groups()) if match else None\n\ndef satisfies_bounded_range(version, range_value):\n    selected = parse_core(version)\n    if selected is None:\n        return False\n    exact = parse_core(range_value)\n    if exact is not None:\n        return selected == exact\n    prefix = range_value[:1]\n    base = parse_core(range_value[1:])\n    if prefix in (\"^\", \"~\") and base is not None:\n        if prefix == \"~\":\n            upper = (base[0], base[1] + 1, 0)\n        elif base[0] > 0:\n            upper = (base[0] + 1, 0, 0)\n        elif base[1] > 0:\n            upper = (0, base[1] + 1, 0)\n        else:\n            upper = (0, 0, base[2] + 1)\n        return base <= selected < upper\n    interval = re.fullmatch(\n        r\">=((?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*))\"\n        r\" <((?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*))\"\
        ,\n        range_value,\n    )\n    return bool(interval and parse_core(interval.group(1)) <= selected\n                < parse_core(interval.group(2)))\n\nfor index, range_value in enumerate(request[\"ranges\"]):\n    versions = npm_json(\n        [\"view\", package, \"versions\", \"--json\"],\n        range_value,\n        \"range resolution\",\n    )\n    if isinstance(versions, str):\n        versions = [versions]\n    if (not isinstance(versions, list) or not versions\n            or any(not isinstance(version, str) for version in versions)):\n        raise SystemExit(f\"compatibility range has no readable version: {range_value}\")\n    candidates = [\n        version\n        for version in versions\n        if version_pattern.fullmatch(version) and satisfies_bounded_range(version, range_value)\n    ]\n    if not candidates:\n        raise SystemExit(f\"compatibility range returned no released version: {range_value}\")\n    version = max(candidates, key=parse_core)\n    if\
        \ version_pattern.fullmatch(version) is None:\n        raise SystemExit(\"registry resolved an invalid package version\")\n    if not satisfies_bounded_range(version, range_value):\n        raise SystemExit(\"registry resolved a version outside the declared bounded range\")\n    metadata = npm_json(\n        [\"view\", \"--json\", f\"{package}@{version}\", \"name\", \"version\",\n         \"dist.integrity\", \"dist.tarball\"],\n        range_value,\n        \"exact-version provenance\",\n    )\n    if not isinstance(metadata, dict) or set(metadata) != {\n            \"name\", \"version\", \"dist.integrity\", \"dist.tarball\"}:\n        raise SystemExit(\"registry returned incomplete exact-version provenance\")\n    if metadata[\"name\"] != package or metadata[\"version\"] != version:\n        raise SystemExit(\"registry exact-version provenance changed package identity\")\n    integrity = metadata[\"dist.integrity\"]\n    tarball = metadata[\"dist.tarball\"]\n    if not isinstance(integrity,\
        \ str) or re.fullmatch(\n            r\"sha512-[A-Za-z0-9+/]{86}==\", integrity) is None:\n        raise SystemExit(\"registry exact-version provenance has invalid sha512 integrity\")\n    try:\n        digest = base64.b64decode(integrity.removeprefix(\"sha512-\"), validate=True)\n    except ValueError:\n        raise SystemExit(\"registry exact-version provenance has invalid sha512 integrity\")\n    if len(digest) != 64:\n        raise SystemExit(\"registry exact-version provenance has invalid sha512 integrity\")\n    if not isinstance(tarball, str):\n        raise SystemExit(\"registry exact-version provenance has an invalid GitHub Packages URL\")\n    parsed = urlparse(tarball)\n    path = unquote(parsed.path)\n    parts = path.split(\"/\")\n    expected_name = f\"{parts[2]}/{parts[3]}\" if len(parts) == 6 else \"\"\n    if (parsed.scheme != \"https\"\n            or parsed.netloc != \"npm.pkg.github.com\" or parsed.query or parsed.fragment\n            or tarball != f\"https://npm.pkg.github.com{path}\"\
        \ or \"\\\\\" in path\n            or len(parts) != 6 or parts[1] != \"download\"\n            or any(part in (\"\", \".\", \"..\") for part in parts[1:])\n            or not expected_name.isascii() or not package.isascii()\n  or expected_name.lower() != package.lower() or parts[4] != version):\n        raise SystemExit(\"registry exact-version provenance has an invalid GitHub Packages URL\")\n    digest_hex = digest.hex()\n    prior_digest = known_downloads.setdefault(tarball, digest_hex)\n    if prior_digest != digest_hex:\n        raise SystemExit(\"one compatibility tarball URL has conflicting integrity provenance\")\n    lanes.append({\n        \"index\": index,\n        \"package\": package,\n        \"range\": range_value,\n        \"script\": request[\"script\"],\n        \"version\": version,\n        \"integrity\": integrity,\n        \"tarball\": tarball,\n        \"sha512\": digest_hex,\n    })\n\nwith entries_path.open(\"a\", encoding=\"utf-8\") as stream:\n    existing\
        \ = set(entries_path.read_text(encoding=\"utf-8\").splitlines())\n    for lane in lanes:\n        entry = f\"{lane['tarball']}\\t{lane['sha512']}\"\n        if entry not in existing:\n            stream.write(entry + \"\\n\")\n            existing.add(entry)\nprovenance = Path(os.environ[\"COMPATIBILITY_PROVENANCE\"])\nprovenance.parent.mkdir(parents=True, exist_ok=False)\nprovenance.write_text(\n    json.dumps({\"schemaVersion\": 1, \"request\": request, \"lanes\": lanes},\n               sort_keys=True, separators=(\",\", \":\")) + \"\\n\",\n    encoding=\"utf-8\",\n)\nPY\n"
    - name: Resolve immutable auxiliary source
      id: resolve-auxiliary-source
      if: inputs.secretless-auxiliary-source != ''
      env:
        AUXILIARY_SOURCE: ${{ inputs.secretless-auxiliary-source }}
        TRUSTED_AUXILIARY_POLICY: ${{ vars.CI_SECRETLESS_AUXILIARY_POLICY }}
      run: "python3 - <<'PY'\nimport json\nimport os\nimport re\nimport sys\nfrom pathlib import Path, PurePosixPath\n\ntry:\n    source = json.loads(os.environ[\"AUXILIARY_SOURCE\"])\nexcept json.JSONDecodeError as error:\n    sys.exit(f\"secretless-auxiliary-source must be valid JSON: {error}\")\nrequired = {\"repository\", \"pinFile\", \"checkoutPath\", \"sparsePath\"}\nif not isinstance(source, dict) or set(source) != required:\n    sys.exit(\"secretless-auxiliary-source requires exactly repository, pinFile, checkoutPath, and sparsePath\")\ntry:\n    policy = json.loads(os.environ[\"TRUSTED_AUXILIARY_POLICY\"])\nexcept json.JSONDecodeError as error:\n    sys.exit(f\"CI_SECRETLESS_AUXILIARY_POLICY must be valid JSON: {error}\")\nif not isinstance(policy, dict) or set(policy) != required or source != policy:\n    sys.exit(\"secretless-auxiliary-source must exactly match trusted repository policy\")\nif not isinstance(source[\"repository\"], str) or re.fullmatch(\n        r\"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\"\
        , source[\"repository\"]) is None:\n    sys.exit(\"auxiliary repository must be an exact owner/name\")\nrepository_parts = source[\"repository\"].split(\"/\")\nif any(part in (\".\", \"..\") or part.lower() == \".git\" for part in repository_parts):\n    sys.exit(\"auxiliary repository contains a reserved component\")\n\ndef relative_path(name, value):\n    if not isinstance(value, str) or \"\\\\\" in value:\n        sys.exit(f\"auxiliary {name} must be a POSIX relative path\")\n    path = PurePosixPath(value)\n    if (path.is_absolute() or not path.parts or str(path) != value\n            or any(part in (\"\", \".\", \"..\") for part in path.parts)):\n        sys.exit(f\"auxiliary {name} must stay within its checkout\")\n    if any(part.lower() == \".git\" for part in path.parts):\n        sys.exit(f\"auxiliary {name} cannot contain .git\")\n    if any(re.fullmatch(r\"[A-Za-z0-9._-]+\", part) is None for part in path.parts):\n        sys.exit(f\"auxiliary {name} contains an unsupported\
        \ path component\")\n    return path\n\npin_file = relative_path(\"pinFile\", source[\"pinFile\"])\ncheckout_path = relative_path(\"checkoutPath\", source[\"checkoutPath\"])\nsparse_path = relative_path(\"sparsePath\", source[\"sparsePath\"])\nif len(checkout_path.parts) != 1 or not checkout_path.name.startswith(\".\") \\\n        or checkout_path.name in (\".\", \"..\", \".git\"):\n    sys.exit(\"auxiliary checkoutPath must be one isolated hidden top-level directory\")\nif any(any(character in part for character in \"*?[]\") for part in sparse_path.parts):\n    sys.exit(\"auxiliary sparsePath must be an exact path without glob syntax\")\n\nroot = Path.cwd().resolve()\npin_path = root.joinpath(*pin_file.parts)\nresolved_pin = pin_path.resolve()\ncandidate = root\nhas_symlink = False\nfor part in pin_file.parts:\n    candidate /= part\n    has_symlink = has_symlink or candidate.is_symlink()\nif root not in resolved_pin.parents or has_symlink or not resolved_pin.is_file():\n    sys.exit(\"\
        auxiliary pinFile must be a regular file within the checked-out repository\")\ncheckout_target = root / checkout_path.name\nif checkout_target.exists() or checkout_target.is_symlink():\n    sys.exit(\"auxiliary checkoutPath already exists in the consumer repository\")\ntry:\n    pin = json.loads(resolved_pin.read_text(encoding=\"utf-8\"))\nexcept (OSError, json.JSONDecodeError) as error:\n    sys.exit(f\"could not read auxiliary pinFile: {error}\")\nif not isinstance(pin, dict) or pin.get(\"repository\") != source[\"repository\"]:\n    sys.exit(\"auxiliary pinFile repository does not match the approved repository\")\ncommit = pin.get(\"commit\")\nif not isinstance(commit, str) or re.fullmatch(r\"[0-9a-f]{40}\", commit) is None:\n    sys.exit(\"auxiliary pinFile commit must be a full lowercase 40-hex SHA\")\n\ncontent_path = str(checkout_path / sparse_path)\noutput = Path(os.environ[\"GITHUB_OUTPUT\"])\nwith output.open(\"a\", encoding=\"utf-8\") as stream:\n    stream.write(f\"repository={source['repository']}\\\
        n\")\n    stream.write(f\"commit={commit}\\n\")\n    stream.write(f\"checkout-path={checkout_path}\\n\")\n    stream.write(f\"sparse-path={sparse_path}\\n\")\n    stream.write(f\"content-path={content_path}\\n\")\nPY\n"
    - name: Acquire immutable auxiliary source
      if: inputs.secretless-auxiliary-source != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ steps.resolve-auxiliary-source.outputs.repository }}
        ref: ${{ steps.resolve-auxiliary-source.outputs.commit }}
        token: ${{ secrets.NODE_AUTH_TOKEN }}
        path: ${{ steps.resolve-auxiliary-source.outputs.checkout-path }}
        sparse-checkout: ${{ steps.resolve-auxiliary-source.outputs.sparse-path }}
        persist-credentials: false
    - name: Populate verified private dependency cache
      id: populate-private-cache
      env:
        APPROVED_INTERNAL_SCOPES: ${{ inputs.approved-internal-scopes }}
        NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/secretless-empty-global.npmrc
        NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/secretless-acquisition.npmrc
        PRIVATE_CACHE_ENTRIES: ${{ runner.temp }}/secretless-private-entries-${{ github.run_id }}-${{ github.run_attempt }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUN_ID: ${{ github.run_id }}
      run: "set -euo pipefail\numask 077\n[ -f \"$PRIVATE_CACHE_ENTRIES\" ] && [ ! -L \"$PRIVATE_CACHE_ENTRIES\" ] || {\n  echo \"::error::secretless mode requires a validated private package entry file\"\n  exit 1\n}\nNPM_CONFIG_CACHE=\"$(mktemp -d \"$RUNNER_TEMP/secretless-private-npm-cache-${RUN_ID}-${RUN_ATTEMPT}-XXXXXX\")\" || {\n  echo \"::error::could not allocate a fresh secretless private cache directory\"\n  exit 1\n}\nexport NPM_CONFIG_CACHE\ncleanup_failed_cache() {\n  status=$?\n  if [ \"$status\" -ne 0 ]; then\n    rm -rf -- \"$NPM_CONFIG_CACHE\"\n  fi\n}\ntrap cleanup_failed_cache EXIT\nprintf 'cache-dir=%s\\n' \"$NPM_CONFIG_CACHE\" >> \"$GITHUB_OUTPUT\"\n: > \"$NPM_CONFIG_GLOBALCONFIG\"\nmkdir -p \"$NPM_CONFIG_CACHE/_cacache/content-v2\"\nif [ -s \"$PRIVATE_CACHE_ENTRIES\" ]; then\n  {\n    printf '%s\\n' 'registry=https://registry.npmjs.org/'\n    while IFS= read -r scope; do\n      scope=\"${scope#\"${scope%%[![:space:]]*}\"}\"\n      scope=\"${scope%\"${scope##*[![:space:]]}\"\
        }\"\n      [ -z \"$scope\" ] || printf '%s:registry=https://npm.pkg.github.com/\\n' \"$scope\"\n    done <<< \"$APPROVED_INTERNAL_SCOPES\"\n    # npm expands this placeholder only when requesting the scoped host.\n    # shellcheck disable=SC2016\n    printf '%s\\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}'\n  } > \"$NPM_CONFIG_USERCONFIG\"\n  while IFS=$'\\t' read -r resolved digest_hex extra; do\n    [ -z \"$extra\" ] && [[ \"$resolved\" == https://npm.pkg.github.com/* ]] \\\n      && [[ \"$digest_hex\" =~ ^[0-9a-f]{128}$ ]] || {\n        echo \"::error::invalid validated private cache entry\"\n        exit 1\n      }\n    npm_diagnostic=\"$NPM_CONFIG_CACHE/npm-cache-add.stderr\"\n    if npm cache add \"$resolved\" --cache \"$NPM_CONFIG_CACHE\" --no-audit --no-fund 2> \"$npm_diagnostic\"; then\n      rm -f \"$npm_diagnostic\"\n    else\n      npm_status=$?\n      echo \"::error::fresh private-package acquisition failed (npm exit $npm_status). Possible causes include\
        \ package authorization, caller packages: read permission when mapping github.token, network or registry availability, and lockfile integrity. npm stderr follows.\"\n      while IFS= read -r diagnostic_line; do\n        diagnostic_line=\"${diagnostic_line//$NODE_AUTH_TOKEN/[REDACTED]}\"\n        diagnostic_line=\"${diagnostic_line//$'\\r'/}\"\n        printf 'npm: %s\\n' \"$diagnostic_line\"\n      done < <(tail -c 8192 \"$npm_diagnostic\" | tail -n 20)\n      rm -f \"$npm_diagnostic\"\n      exit 1\n    fi\n  done < \"$PRIVATE_CACHE_ENTRIES\"\n  npm cache verify --cache \"$NPM_CONFIG_CACHE\"\nelse\n  : > \"$NPM_CONFIG_USERCONFIG\"\nfi\ndeclare -A expected_content=()\nwhile IFS=$'\\t' read -r _ digest_hex; do\n  content_path=\"$NPM_CONFIG_CACHE/_cacache/content-v2/sha512/${digest_hex:0:2}/${digest_hex:2:2}/${digest_hex:4}\"\n  [ -f \"$content_path\" ] && [ ! -L \"$content_path\" ] \\\n    && [ \"$(sha512sum \"$content_path\" | cut -d' ' -f1)\" = \"$digest_hex\" ] || {\n      echo\
        \ \"::error::npm did not populate the exact locked private package content\"\n      exit 1\n  }\n  expected_content[\"$content_path\"]=1\ndone < \"$PRIVATE_CACHE_ENTRIES\"\nactual_content_count=0\nwhile IFS= read -r -d '' content_path; do\n  [ -n \"${expected_content[$content_path]:-}\" ] || {\n    echo \"::error::npm populated content outside the exact locked private package set\"\n    exit 1\n  }\n  actual_content_count=$((actual_content_count + 1))\ndone < <(find \"$NPM_CONFIG_CACHE/_cacache/content-v2\" -type f -print0)\n[ \"$actual_content_count\" -eq \"${#expected_content[@]}\" ] || {\n  echo \"::error::npm private content set does not match the validated lock\"\n  exit 1\n}\nif grep -R -a -qF -- \"$NODE_AUTH_TOKEN\" \"$NPM_CONFIG_CACHE/_cacache/content-v2\"; then\n  echo \"::error::the npm cache contains the acquisition credential\"\n  exit 1\nfi\nrm -rf \"$NPM_CONFIG_CACHE/_cacache/index-v5\" \"$NPM_CONFIG_CACHE/_cacache/tmp\"\n[ ! -e \"$NPM_CONFIG_CACHE/_cacache/index-v5\"\
        \ ] || {\n  echo \"::error::private cache index containing signed redirect URLs was not removed\"\n  exit 1\n}\n"
    - name: Package bounded credential-free npm cache
      id: package-secretless-transfer
      env:
        AUXILIARY_COMMIT: ${{ steps.resolve-auxiliary-source.outputs.commit }}
        AUXILIARY_CONTENT_PATH: ${{ steps.resolve-auxiliary-source.outputs.content-path }}
        AUXILIARY_REPOSITORY: ${{ steps.resolve-auxiliary-source.outputs.repository }}
        CACHE_DIR: ${{ steps.populate-private-cache.outputs.cache-dir }}
        COMPATIBILITY_ROOT: ${{ runner.temp }}/secretless-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
        COMPATIBILITY_RANGES: ${{ inputs.secretless-compatibility-ranges }}
        NESTED_MANIFESTS: ${{ inputs.secretless-nested-manifests }}
        MAX_PAYLOAD_BYTES: '83886080'
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUN_ID: ${{ github.run_id }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        TRANSFER_DIR: ${{ github.workspace }}/.verjson-secretless-transfer-${{ github.run_id }}
      run: "set -euo pipefail\nPACKAGE_MANAGER=\"${PACKAGE_MANAGER:-npm}\"\nCOMPATIBILITY_RANGES=\"${COMPATIBILITY_RANGES:-}\"\nCOMPATIBILITY_ROOT=\"${COMPATIBILITY_ROOT:-}\"\nNESTED_MANIFESTS=\"${NESTED_MANIFESTS:-}\"\n[ -d \"$CACHE_DIR/_cacache/content-v2\" ] || {\n  echo \"::error::npm produced no private content-addressed package blobs for transfer\"\n  exit 1\n}\nrm -rf node_modules\n[ ! -e \"$TRANSFER_DIR\" ] && [ ! -L \"$TRANSFER_DIR\" ] || {\n  echo \"::error::reserved secretless transfer path exists before packaging\"\n  exit 1\n}\nmkdir -p \"$TRANSFER_DIR\"\ntar_inputs=(-C \"$CACHE_DIR\" _cacache/content-v2)\ncompatibility_provenance_sha256=''\nif [ -n \"$COMPATIBILITY_RANGES\" ]; then\n  provenance=\"$COMPATIBILITY_ROOT/_compatibility/provenance.json\"\n  [ -f \"$provenance\" ] && [ ! -L \"$provenance\" ] \\\n    && [ \"$(find \"$COMPATIBILITY_ROOT\" -type f -print)\" = \"$provenance\" ] \\\n    && [ -z \"$(find \"$COMPATIBILITY_ROOT\" \\! -type f \\! -type d -print -quit)\" ]\
        \ || {\n    echo \"::error::compatibility provenance is missing or contains an unbounded entry\"\n    exit 1\n  }\n  compatibility_provenance_sha256=\"$(sha256sum \"$provenance\" | cut -d' ' -f1)\"\n  tar_inputs+=(-C \"$COMPATIBILITY_ROOT\" _compatibility)\nfi\nif [ -n \"$AUXILIARY_CONTENT_PATH\" ]; then\n  [ -e \"$AUXILIARY_CONTENT_PATH\" ] || {\n    echo \"::error::approved auxiliary sparse path was not acquired\"\n    exit 1\n  }\n  unsafe_entry=\"$(find \"$AUXILIARY_CONTENT_PATH\" \\! -type f \\! -type d -print -quit)\"\n  [ -z \"$unsafe_entry\" ] || {\n    echo \"::error::auxiliary transfer rejects non-file entry: $unsafe_entry\"\n    exit 1\n  }\n  tar_inputs+=(-C \"$GITHUB_WORKSPACE\" \"$AUXILIARY_CONTENT_PATH\")\nfi\ntar -cf \"$TRANSFER_DIR/npm-private-cache.tar\" \"${tar_inputs[@]}\"\npayload_bytes=\"$(stat -c %s \"$TRANSFER_DIR/npm-private-cache.tar\")\"\nif [ \"$payload_bytes\" -gt \"$MAX_PAYLOAD_BYTES\" ]; then\n  echo \"::error::secretless cache payload is ${payload_bytes}\
        \ bytes; the 80 MiB payload budget is ${MAX_PAYLOAD_BYTES} bytes\"\n  exit 1\nfi\npayload_sha256=\"$(sha256sum \"$TRANSFER_DIR/npm-private-cache.tar\" | cut -d' ' -f1)\"\nencryption_key=\"$(openssl rand -hex 32)\"\n[[ \"$encryption_key\" =~ ^[0-9a-f]{64}$ ]] || {\n  echo \"::error::could not generate a secretless transfer key\"\n  exit 1\n}\nTRANSFER_KEY=\"$encryption_key\" python3 \"$RUNNER_TEMP/container_dependency_transfer.py\" encrypt \\\n  --source \"$TRANSFER_DIR/npm-private-cache.tar\" \\\n  --destination \"$TRANSFER_DIR/npm-private-cache.tar.enc\"\nrm -f \"$TRANSFER_DIR/npm-private-cache.tar\"\nprintf 'encryption-key=%s\\n' \"$encryption_key\" >> \"$GITHUB_OUTPUT\"\ncase \"$PACKAGE_MANAGER\" in\n  npm) lock_file=package-lock.json ;;\n  pnpm) lock_file=pnpm-lock.yaml ;;\n  *) echo \"::error::package-manager accepts only npm or pnpm\"; exit 1 ;;\nesac\nlock_sha256=\"$(sha256sum \"$lock_file\" | cut -d' ' -f1)\"\nnested_manifests_sha256=''\nif [ -n \"$NESTED_MANIFESTS\" ]; then\n\
        \  nested_binding=\"$(mktemp)\"\n  python3 - > \"$nested_binding\" <<'PY'\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\n\nbinding = \"\".join(\n    \"{}\\t{}\\n\".format(\n        nested[\"path\"],\n        hashlib.sha256(\n            (Path(nested[\"path\"]) / \"package-lock.json\").read_bytes()\n        ).hexdigest(),\n    )\n    for nested in json.loads(os.environ[\"NESTED_MANIFESTS\"])\n)\nprint(hashlib.sha256(binding.encode(\"utf-8\")).hexdigest())\nPY\n  nested_manifests_sha256=\"$(cat \"$nested_binding\")\"\n  rm -f \"$nested_binding\"\nfi\nprintf '%s\\n' \\\n  \"run_id=$RUN_ID\" \\\n  \"run_attempt=$RUN_ATTEMPT\" \\\n  \"package_manager=$PACKAGE_MANAGER\" \\\n  \"lock_sha256=$lock_sha256\" \\\n  \"nested_manifests_sha256=$nested_manifests_sha256\" \\\n  \"auxiliary_repository=$AUXILIARY_REPOSITORY\" \\\n  \"auxiliary_commit=$AUXILIARY_COMMIT\" \\\n  \"auxiliary_content_path=$AUXILIARY_CONTENT_PATH\" \\\n  \"compatibility_provenance_sha256=$compatibility_provenance_sha256\"\
        \ \\\n  \"payload_sha256=$payload_sha256\" \\\n  \"payload_bytes=$payload_bytes\" \\\n  > \"$TRANSFER_DIR/manifest\"\nprintf 'compatibility-provenance-sha256=%s\\npayload-bytes=%s\\npayload-sha256=%s\\n' \\\n  \"$compatibility_provenance_sha256\" \"$payload_bytes\" \"$payload_sha256\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Create unguessable run-bound transfer cache key
      id: create-secretless-cache-key
      env:
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUN_ID: ${{ github.run_id }}
      run: "set -euo pipefail\n[[ \"$RUN_ID\" =~ ^[1-9][0-9]*$ && \"$RUN_ATTEMPT\" =~ ^[1-9][0-9]*$ ]] || {\n  echo \"::error::invalid secretless cache run identity\"\n  exit 1\n}\nnonce=\"$(openssl rand -hex 32)\"\n[[ \"$nonce\" =~ ^[0-9a-f]{64}$ ]] || {\n  echo \"::error::could not generate secretless cache nonce\"\n  exit 1\n}\ncache_key=\"secretless-npm-transfer-${RUN_ID}-${RUN_ATTEMPT}-${nonce}\"\nprintf 'cache-key=%s\\n' \"$cache_key\" >> \"$GITHUB_OUTPUT\"\n"
    - id: save-secretless-transfer
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .verjson-secretless-transfer-${{ github.run_id }}
        key: ${{ steps.create-secretless-cache-key.outputs.cache-key }}
    - name: Remove local acquisition and transfer state
      if: always()
      env:
        AUXILIARY_CHECKOUT_PATH: ${{ steps.resolve-auxiliary-source.outputs.checkout-path }}
        CACHE_DIR: ${{ steps.populate-private-cache.outputs.cache-dir }}
        COMPATIBILITY_ROOT: ${{ runner.temp }}/secretless-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
        PRIVATE_CACHE_ENTRIES: ${{ runner.temp }}/secretless-private-entries-${{ github.run_id }}-${{ github.run_attempt }}
        TRANSFER_DIR: ${{ github.workspace }}/.verjson-secretless-transfer-${{ github.run_id }}
      run: "rm -rf node_modules \"$CACHE_DIR\" \"$COMPATIBILITY_ROOT\" \"$TRANSFER_DIR\"\nrm -f \"$RUNNER_TEMP/container_dependency_transfer.py\"\n[ -z \"$AUXILIARY_CHECKOUT_PATH\" ] || find \"$AUXILIARY_CHECKOUT_PATH\" -depth -delete\nrm -f \"$RUNNER_TEMP/secretless-acquisition.npmrc\" \"$RUNNER_TEMP/secretless-empty-global.npmrc\" \\\n  \"$RUNNER_TEMP/secretless-empty-package.npmrc\"\nrm -f \"$PRIVATE_CACHE_ENTRIES\"\n"
  build-test:
    needs:
    - eligibility
    - acquire-secretless-dependencies
    if: always()
