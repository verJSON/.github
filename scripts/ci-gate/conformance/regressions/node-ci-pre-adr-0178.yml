        echo "VERJSON_CHANGELOG_TOOL_CACHE=$cache_root" >> "$GITHUB_ENV"

        '
    - name: Prepare job-scoped npm cache
      if: needs.eligibility.outputs.should-run != 'false' && inputs.cache && !(inputs.secretless-pr || inputs.secretless-trusted-ref)
